// 影子：一团涂黑的乱线，一双眼睛。看见你的时候边和眼睛是红的

// ---------- 光 ----------
// 光没有形状：灯泡周围最亮，往外慢慢暗下去（lightAt）。由亮到暗按排线深浅图（toneTex）画：先出现一个方向的排线，再加交叉的，排线之间也一起慢慢暗下去，最后整片黑。
// 墙挡光，光出不了屋子。地板不带软边：照到哪一格就亮到那一格的边，看地板就知道哪几格算数；只是离灯远的格子暗一些。
const seen = (c, r) => { const x0 = BULB.x / S, y0 = BULB.y / S, x1 = c + 0.5, y1 = r + 0.5; for (let i = 1; i < 24; i++) { const t = i / 24, sx = Math.floor(x0 + (x1 - x0) * t), sy = Math.floor(y0 + (y1 - y0) * t); if ((sx !== c || sy !== r) && T(sx, sy) === '#') return false; } return true; };
function buildMask(L, dpr, on) {
  const [cv, x] = mk(dpr); if (!on) return cv;
  x.save(); x.translate(-L.cam.x, -L.cam.y); x.fillStyle = '#fff';
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) if (air(c, r) && seen(c, r)) x.fillRect(c * S - 0.5, r * S - 0.5, S + 1, S + 1 + (air(c, r + 1) ? 0 : FLOORH));
  x.restore();
  const md = x.getImageData(0, 0, cv.width, cv.height), d = md.data, td = toneTex(dpr).getContext('2d').getImageData(0, 0, cv.width, cv.height).data, wv = 0.05;
  for (let j = 0, k = 3; j < cv.height; j++) for (let i = 0; i < cv.width; i++, k += 4) {
    if (!d[k]) continue;
    const D = 1 - lightAt(i / dpr + L.cam.x, j / dpr + L.cam.y), lev = td[k - 3] / 255;
    d[k] = d[k] * (1 - sm((D - 0.3) / 0.66)) * (0.42 + 0.58 * (1 - sm((D - lev + wv) / (2 * wv))));
  }
  x.putImageData(md, 0, 0);
  x.save(); x.translate(-L.cam.x, -L.cam.y);   // 地板：照到的格子整格亮、没照到的整格暗（边是硬的），亮多少跟着离灯多远
  for (const { r, c0: a0, c1 } of runs((c, r) => T(c, r) === '#' && air(c, r - 1))) for (let c = a0; c <= c1; c++) { x.clearRect(c * S, r * S, S, FLOORH + FRONTH + 1); if (litCell(c, r - 1)) { x.globalAlpha = 0.5 + 0.5 * lightAt((c + 0.5) * S, r * S); x.fillStyle = '#fff'; x.fillRect(c * S, r * S, S, FLOORH + FRONTH + 1); x.globalAlpha = 1; } }
  x.restore();
  return cv;
}
// 灯下的人和家具也跟着光暗下去：离灯越远越暗、越偏冷（和墙上是同一个快慢）
function inLight(g, L, dpr, fn) {
  const [c, x] = mk(dpr); x.translate(-L.cam.x, -L.cam.y); fn(x);
  const gr = x.createRadialGradient(BULB.x, BULB.y, LIGHT_R0, BULB.x, BULB.y, LIGHT_R1);
  for (let i = 0; i <= 8; i++) { const t = i / 8; gr.addColorStop(t, rgba(L.dark.wall, 0.72 * Math.pow(t, 1.6))); }
  x.globalCompositeOperation = 'source-atop'; x.fillStyle = gr; x.fillRect(L.cam.x - 10, L.cam.y - 10, W + 20, H + 20);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(c, 0, 0); g.restore();
}

// ---------- 一张画 ----------
// st：{ lamp: 灯开没开, px, py: 主角在哪一格, mx: 影子在哪一列 }
function render(key, st, dpr = 1) {
  buildTex();
  const L = LOOKS[key], [out, g] = mk(dpr), blit = (ctx, cv) => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(cv, 0, 0); ctx.restore(); };
  const world = ctx => ctx.translate(-L.cam.x, -L.cam.y);
  g.pen = { ...L.pen, col: L.dark.ink }; paintPage(g, L);
  g.save(); world(g);
  if (L.ext === 'night') paintTree(g, L);
  const [dk, d] = mk(dpr); world(d); d.pen = { ...L.pen, col: L.dark.ink }; paintShell(d, L); paintRoom(d, L, L.dark, false);
  const [lt, l] = mk(dpr); world(l); l.pen = { ...L.pen, col: L.lit.ink }; paintRoom(l, L, L.lit, true);
  // 亮的那一层：离灯越远越暗一点，整体偏一点暖
  const sh = l.createRadialGradient(BULB.x, BULB.y, LIGHT_R0, BULB.x, BULB.y, LIGHT_R1);
  sh.addColorStop(0, '#fffaf0'); sh.addColorStop(0.5, '#e2d3b8'); sh.addColorStop(1, '#a8957a');
  const inside = new Path2D(); for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) { if (air(c, r)) inside.rect(c * S - 0.5, r * S - 0.5, S + 1, S + 1); else if (air(c, r - 1)) inside.rect(c * S - 0.5, r * S, S + 1, FLOORH + FRONTH + 1); }
  l.save(); l.clip(inside); l.globalCompositeOperation = 'multiply'; l.fillStyle = sh; l.fillRect(0, 0, LW * S, LH * S); l.restore();
  const mask = buildMask(L, dpr, st.lamp), mx = mask.getContext('2d');
  mx.globalCompositeOperation = 'source-in'; blit(mx, lt);
  g.restore(); blit(g, dk); blit(g, mask);
  paintGround(g, L);
  g.save(); world(g);
  drawLever(g, L, st);
  const mon = { x: st.mx, y: 2, face: -1, sees: !st.lamp || !litCell(st.mx, 2) };
  if (st.lamp && litCell(mon.x, mon.y)) inLight(g, L, dpr, x => drawWardrobe(x, L, mon)); else drawLurker(g, L, mon);
  if (st.lamp && litCell(st.px, st.py)) inLight(g, L, dpr, x => drawPlayer(x, L, st)); else drawPlayer(g, L, st);
  drawLamp(g, L, st); drawLight(g, L, st);
  g.save(); g.globalCompositeOperation = 'lighter'; glow(g, 11.5 * S, 2.55 * S, S * 1.25, L.dark.moon, 0.16); g.restore();   // 出口那一圈冷光
  g.restore();
  // 纸的颗粒，四周压暗
  texture(g, TEX.fine, 0.9 * L.grain, 'overlay'); texture(g, TEX.mott, 0.5 * L.grain, 'overlay');
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.78); vg.addColorStop(0, 'rgba(2,3,8,0)'); vg.addColorStop(1, 'rgba(2,3,8,0.42)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // 界面上的字（没有重新设计，只是照原样放着）
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = rgba(L.dark.moon, 0.5); g.font = `11px ${FONT}`; g.fillText('第 1 关', 44, 44);
  g.fillStyle = rgba(L.dark.moon, 0.95); g.font = `600 22px ${FONT}`; g.fillText('灯', 44, 70);
  g.textAlign = 'center'; g.fillStyle = rgba(L.dark.moon, 0.82); g.font = `13px ${FONT}`; g.fillText('影子怕光：被灯照到就变成家具。站到拉杆上按 E（拉）开灯。家具可以踩上去翻过去。', W / 2, H - 56);
  g.fillStyle = rgba(L.dark.moon, 0.36); g.font = `11px ${FONT}`; g.fillText('← → 走    ↑ ↓ 爬梯子    E 拉    空格 等一步    Z 退一步    R 重来', W / 2, H - 28);
  return out;
}

// ---------- 页面 ----------
const q = new URLSearchParams(location.search);
const state = lit => ({ lamp: !!lit, px: lit ? 2 : 1, py: 2, mx: lit ? 8 : 9, face: 1 });
if (q.get('one')) {
  const lit = q.get('lit') === '1', st = state(lit), dpr = +(q.get('dpr') || 1);
  if (q.has('px')) st.px = +q.get('px'); if (q.has('py')) st.py = +q.get('py'); if (q.has('mx')) st.mx = +q.get('mx'); if (q.has('face')) st.face = +q.get('face');
  document.body.className = 'one';
  const cv = render(q.get('one'), st, dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px'; document.body.appendChild(cv);
} else {
  const dpr = Math.min(2, window.devicePixelRatio || 1), add = (tag, text, parent = document.body) => { const e = document.createElement(tag); if (text) e.textContent = text; parent.appendChild(e); return e; };
  add('h1', '《灯下》第一关 · 两种手绘的画法');
  add('p', '都是用代码画的，和游戏里是同一关、同一个位置。左边灯没开，右边拉了拉杆。只是画面，不能玩。');
  for (const key of ['a', 'b']) {
    const L = LOOKS[key]; add('h2', `${L.tag} · ${L.title}`);
    const row = add('div'); row.className = 'row';
    for (const lit of [0, 1]) { const f = add('figure', '', row); f.appendChild(render(key, state(lit), dpr)); add('figcaption', lit ? '拉了拉杆：灯照到的地方才是暖的、有细节，影子在光里是一只衣柜' : '灯还没开：屋里只有冷的轮廓，影子在暗处睁着眼', f); }
  }
}
</script>
