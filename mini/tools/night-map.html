<!-- 二十一关连成一张图的示意（design/night-levels.md）。只是安排，不是游戏里的画法。

<svg id="m" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W = 5540, H = 1900;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('m');
svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
function el(tag, a = {}, parent = svg) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; }
const layer = name => el('g', { id: name });
const pts = p => p.map(q => q.join(',')).join(' ');
function txt(x, y, s, a = {}, parent = svg) { const t = el('text', { x, y, ...a }, parent); t.textContent = s; return t; }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// 颜色
const C = {
  skyTop: '#090c16', skyLow: '#1a2136', star: '#cfd6f0',
  far: '#121829', hill: '#151b29', earth: '#13110f', earthLine: '#2a241d', earthEdge: '#4b5372',
  hole: '#07080c', holeLine: '#5d668c',
  fill: '#1c2337', line: '#8a94bb', inner: '#414a6b', win: '#0e121e', warm: '#ffcf7a',
  sea: '#0e1628', seaDeep: '#070a12', wave: '#26324f', ink: '#020307', inkLine: '#2a2f42',
  route: '#ffc45e', badge: '#ffc45e', name: '#f1f3fb', sub: '#a0a9c8', faint: '#ffffff',
};

// ---------- defs ----------
const defs = el('defs');
const sky = el('linearGradient', { id: 'sky', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el('stop', { offset: 0, 'stop-color': C.skyTop }, sky); el('stop', { offset: 1, 'stop-color': C.skyLow }, sky);
const sea = el('linearGradient', { id: 'sea', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
el('stop', { offset: 0, 'stop-color': C.sea }, sea); el('stop', { offset: 1, 'stop-color': C.seaDeep }, sea);
const hatch = el('pattern', { id: 'hatch', width: 14, height: 14, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(35)' }, defs);
el('rect', { width: 14, height: 14, fill: C.earth }, hatch); el('line', { x1: 0, y1: 0, x2: 0, y2: 14, stroke: C.earthLine, 'stroke-width': 1.2 }, hatch);
const glow = el('radialGradient', { id: 'glow' }, defs);
el('stop', { offset: 0, 'stop-color': '#ffd98f', 'stop-opacity': 0.55 }, glow); el('stop', { offset: 1, 'stop-color': '#ffd98f', 'stop-opacity': 0 }, glow);
const blue = el('radialGradient', { id: 'blue' }, defs);
el('stop', { offset: 0, 'stop-color': '#7fe6ff', 'stop-opacity': 0.6 }, blue); el('stop', { offset: 1, 'stop-color': '#7fe6ff', 'stop-opacity': 0 }, blue);
const moonG = el('radialGradient', { id: 'moon' }, defs);
el('stop', { offset: 0.55, 'stop-color': '#dfe6ff', 'stop-opacity': 0.16 }, moonG); el('stop', { offset: 1, 'stop-color': '#dfe6ff', 'stop-opacity': 0 }, moonG);

// ---------- 天、星星、月亮 ----------
el('rect', { width: W, height: H, fill: 'url(#sky)' });
const stars = layer('stars');
for (let i = 0; i < 260; i++) {
  const x = rnd() * W, y = rnd() * 760;
  el('circle', { cx: x, cy: y, r: rnd() < 0.12 ? 1.8 : 1, fill: C.star, opacity: 0.25 + rnd() * 0.5 }, stars);
}
el('circle', { cx: 1240, cy: 215, r: 120, fill: 'url(#moon)' });
el('circle', { cx: 1240, cy: 215, r: 38, fill: '#d9e0f6', opacity: 0.85 });
el('circle', { cx: 1252, cy: 207, r: 34, fill: C.skyTop, opacity: 0.5 });

// ---------- 远处的镇子（只是剪影）----------
const far = layer('far');
for (let x = 1040; x < 3950;) {
  const w = 40 + rnd() * 70, h = 90 + rnd() * 150;
  el('rect', { x, y: 980 - h, width: w, height: h, fill: C.far }, far);
  if (rnd() < 0.35) el('rect', { x: x + w * 0.3, y: 980 - h - 18, width: 8, height: 18, fill: C.far }, far);
  x += w - 6;
}

// ---------- 海 ----------
const SEA_X = 4480, SEA_Y = 1042;
el('rect', { x: SEA_X, y: SEA_Y, width: W - SEA_X, height: H - SEA_Y, fill: 'url(#sea)' });
const waves = layer('waves');
for (let i = 0; i < 70; i++) {
  const x = SEA_X + 20 + rnd() * (W - SEA_X - 40), y = SEA_Y + 14 + rnd() * 260;
  el('path', { d: `M${x} ${y} q 10 -5 20 0 t 20 0`, stroke: C.wave, 'stroke-width': 1.5, fill: 'none', opacity: 0.8 }, waves);
}
el('line', { x1: SEA_X, y1: SEA_Y, x2: W, y2: SEA_Y, stroke: '#3a4870', 'stroke-width': 2 });

// ---------- 地：山坡、街、地底下、海底 ----------
const ground = [[0, 560], [760, 560], [790, 560], [790, 640], [860, 640], [860, 760], [960, 760], [960, 880], [1000, 880], [1000, 980],
  [3960, 980], [3960, 1000], [SEA_X, 1000], [SEA_X, 1120], [4700, 1240], [5000, 1330], [W, 1420], [W, H], [0, H]];
el('polygon', { points: pts(ground), fill: 'url(#hatch)', stroke: C.earthEdge, 'stroke-width': 2.5 });
// 山坡上面那一层颜色浅一点
el('polygon', { points: pts([[0, 560], [760, 560], [790, 560], [790, 640], [860, 640], [860, 760], [960, 760], [960, 880], [1000, 880], [1000, 980], [0, 980]]), fill: C.hill, opacity: 0.7 });
el('polyline', { points: pts(ground.slice(0, 13)), fill: 'none', stroke: C.earthEdge, 'stroke-width': 2.5 });

// ---------- 画房子用的几样 ----------
const B = layer('buildings');
function box(x, y, w, h, a = {}, p = B) { return el('rect', { x, y, width: w, height: h, fill: C.fill, stroke: C.line, 'stroke-width': 2, ...a }, p); }
function ln(x1, y1, x2, y2, a = {}, p = B) { return el('line', { x1, y1, x2, y2, stroke: C.inner, 'stroke-width': 1.6, ...a }, p); }

function pl(p, a = {}, parent = B) { return el('polyline', { points: pts(p), fill: 'none', stroke: C.inner, 'stroke-width': 1.6, ...a }, parent); }
function wins(x0, y0, cols, rows, dx, dy, w = 9, h = 12, lit = []) {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const on = lit.some(([a, b]) => a === c && b === r);
    el('rect', { x: x0 + c * dx, y: y0 + r * dy, width: w, height: h, fill: on ? C.warm : C.win, opacity: on ? 0.8 : 1 }, B);
  }
}
function lampPost(x, y, h = 40, lit = false) { ln(x, y, x, y - h, { stroke: C.line, 'stroke-width': 2 }); el('circle', { cx: x, cy: y - h - 3, r: 4, fill: lit ? C.warm : C.win, stroke: C.line, 'stroke-width': 1.2 }, B); }
function hole(d) { return el('path', { d, fill: C.hole, stroke: C.holeLine, 'stroke-width': 2 }, B); }

// 1 家：两层加地下室，前门在右墙

box(150, 268, 20, 40);
ln(100, 445, 420, 445); ln(230, 330, 230, 445); ln(330, 330, 330, 560); ln(215, 445, 215, 560);
pl([[340, 445], [372, 445], [412, 556]], { stroke: C.line });                      // 门厅的楼梯
hole('M100 560 H330 V680 H100 Z'); ln(130, 560, 130, 680, { stroke: C.holeLine });  // 地下室，地窖口的梯子
el('rect', { x: 140, y: 360, width: 28, height: 38, fill: '#24304d', stroke: C.line, 'stroke-width': 1.5 }, B);   // 卧室的窗（看得见灯塔）
el('rect', { x: 414, y: 500, width: 10, height: 56, fill: '#3a3020', stroke: C.line, 'stroke-width': 1.5 }, B);   // 前门
// 2 院子：门廊、狗窝、车库、晾衣绳、工具棚、稻草人、院门
poly([[424, 486], [470, 486], [470, 492], [424, 492]]); ln(468, 492, 468, 560, { stroke: C.line });
el('circle', { cx: 446, cy: 497, r: 4, fill: C.win, stroke: C.line }, B);                                         // 感应灯
poly([[482, 560], [482, 538], [494, 528], [506, 538], [506, 560]]);                                                // 狗窝
box(520, 492, 90, 68); el('path', { d: 'M532 552 v-14 l14 -10 h30 l12 10 h10 v14 Z', fill: '#262d44', stroke: C.line, 'stroke-width': 1.5 }, B);  // 车库和车
ln(622, 500, 622, 560, { stroke: C.line }); ln(676, 500, 676, 560, { stroke: C.line }); ln(622, 504, 676, 504, { stroke: C.line });
for (const x of [628, 645, 660]) el('rect', { x, y: 505, width: 12, height: 30, fill: '#cfd3e2', opacity: 0.55 }, B);   // 床单
box(688, 512, 40, 48); poly([[684, 514], [708, 498], [732, 514]]);                                                     // 工具棚
ln(742, 560, 742, 520, { stroke: C.line }); ln(732, 530, 752, 530, { stroke: C.line }); el('circle', { cx: 742, cy: 515, r: 5, fill: C.fill, stroke: C.line }, B);  // 稻草人
pl([[752, 560], [752, 538], [760, 538], [760, 560]], { stroke: C.line });
// 3 巷子：一段段往下的台阶，邻居家，煤气灯，晾衣绳，拱门

for (const [x, y] of [[788, 560], [858, 640], [958, 760], [998, 880]]) lampPost(x - 10, y, 34);
ln(852, 612, 880, 700, { stroke: C.line, 'stroke-width': 1 });
for (const t of [0.3, 0.6]) el('rect', { x: 852 + 28 * t - 4, y: 612 + 88 * t, width: 8, height: 16, fill: '#cfd3e2', opacity: 0.5 }, B);

wins(1050, 860, 3, 3, 20, 34); wins(1120, 880, 3, 2, 22, 34); wins(1200, 866, 3, 3, 20, 34); wins(1270, 882, 3, 2, 22, 34);
el('path', { d: 'M1196 852 h14 m-7 0 v-12', stroke: '#c98a4a', 'stroke-width': 2, fill: 'none', opacity: 0.6 }, B);   // 咖啡杯招牌
el('rect', { x: 1150, y: 934, width: 100, height: 40, rx: 8, fill: '#232b42', stroke: C.line, 'stroke-width': 2 }, B);
wins(1158, 942, 6, 1, 15, 0, 10, 12); el('circle', { cx: 1170, cy: 976, r: 6, fill: C.hole, stroke: C.line }, B); el('circle', { cx: 1232, cy: 976, r: 6, fill: C.hole, stroke: C.line }, B);
el('rect', { x: 1046, y: 952, width: 22, height: 26, fill: '#2a2018', stroke: C.line, 'stroke-width': 1.5 }, B);  // 栗子车
for (const x of [1100, 1290]) lampPost(x, 980, 70);
ln(1352, 980, 1352, 920, { stroke: C.line, 'stroke-width': 2 }); el('rect', { x: 1346, y: 900, width: 12, height: 22, fill: C.win, stroke: C.line }, B);
// 5 公寓楼：六层，楼梯间，卡在三楼的电梯
box(1366, 500, 130, 480); for (let y = 580; y < 980; y += 80) ln(1366, y, 1496, y);
for (let f = 0; f < 6; f++) { const y = 980 - f * 80; pl([[1376, y], [1430, y - 40], [1376, y - 80]], { stroke: '#56608a' }); }
box(1452, 500, 28, 480, { fill: C.win }); el('rect', { x: 1455, y: 828, width: 22, height: 44, fill: '#5a4a28', opacity: 0.9 }, B);   // 电梯
box(1458, 478, 26, 22);
// 6 屋顶：斜屋顶和天窗、屋脊上的鸽子笼、空隙上的木板、矮屋顶和无线电塔
box(1508, 548, 82, 432); poly([[1504, 550], [1548, 506], [1594, 550]]); el('rect', { x: 1556, y: 520, width: 14, height: 8, fill: '#3c3424', stroke: C.line }, B);   // 天窗
box(1594, 520, 64, 460); poly([[1590, 522], [1626, 470], [1662, 522]]); el('rect', { x: 1614, y: 452, width: 24, height: 18, fill: '#2a2f45', stroke: C.line, 'stroke-width': 1.5 }, B);   // 鸽子笼
el('rect', { x: 1600, y: 486, width: 12, height: 26, fill: C.fill, stroke: C.line, 'stroke-width': 1.5 }, B);   // 烟囱

ln(1768, 598, 1768, 420, { stroke: C.line, 'stroke-width': 2 }); for (const y of [450, 490, 530, 570]) ln(1756, y, 1780, y, { stroke: C.line });
el('circle', { cx: 1768, cy: 416, r: 5, fill: '#b04a3a' }, B);                                                     // 一闪一闪的红灯

pl([[1990, 670], [1880, 820]], { stroke: '#6a7398', 'stroke-width': 3 }); pl([[1990, 820], [1880, 980]], { stroke: '#6a7398', 'stroke-width': 3 });
ln(1820, 600, 1832, 600, { stroke: C.line }); ln(1822, 600, 1822, 520, { stroke: C.line });                      // 消防梯
el('path', { d: 'M1876 492 a 34 30 0 0 1 68 0 Z', fill: '#2b2235', stroke: '#9a6a8a', 'stroke-width': 2 }, B); ln(1910, 492, 1910, 520, { stroke: '#9a6a8a', 'stroke-width': 2 });  // 霓虹伞
el('circle', { cx: 1925, cy: 594, r: 12, fill: 'none', stroke: '#6a7398', 'stroke-width': 1.5 }, B);              // 水晶吊灯

wins(2102, 800, 6, 2, 24, 100, 12, 30);
el('path', { d: 'M2250 980 V778 Q2290 742 2330 778 V980 Z', fill: C.fill, stroke: C.line, 'stroke-width': 2 }, B);   // 体育馆
el('ellipse', { cx: 2052, cy: 972, rx: 30, ry: 7, fill: 'none', stroke: C.line, 'stroke-width': 1.5 }, B);           // 跑道

ln(2452, 900, 2452, 980, { stroke: '#c7cde0', 'stroke-width': 2 });
el('rect', { x: 2470, y: 940, width: 70, height: 34, rx: 5, fill: '#3a2426', stroke: C.line, 'stroke-width': 1.5 }, B); el('circle', { cx: 2492, cy: 936, r: 5, fill: C.win, stroke: C.line }, B);
wins(2394, 836, 6, 1, 26, 0, 12, 26);

el('rect', { x: 2628, y: 928, width: 24, height: 4, fill: C.hole }, B);                                            // 活门

hole('M2632 980 h18 v80 h-18 Z'); hole('M2922 980 h20 v80 h-20 Z');                                              // 掉下来的洞、井道
