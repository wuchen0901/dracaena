<title>夜里的房子</title>
<style>
html,body{margin:0;height:100%;background:#06080e;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

<body>
<canvas id="c"></canvas>

<!-- 规则：“东西在哪儿、点了什么会怎样、哪个影子敢过去”都在这一段，不碰页面。mini/tools/check.mjs 直接拿这一段去搜：解得开、没有死路 -->
<script id="core">
// 一栋夜里的房子：楼上卧室 → 浴室 → 楼梯 → 门厅（楼下停电）→ 客厅 → 厨房 → 地下室（来电）→ 回到门厅出门。
// （2026-11-18 起，“影子”是灌了墨的空衣服，“蜡烛”candle 是一罐萤火虫，lit 是烤暖了；衣服会追人在页面里，不在规则里）
// 规则只管“东西在哪儿、灯开没开、哪个影子敢过去”；孩子走到哪儿不算在里面：隔着影子的地方走不到，别的都走得到。
const ITEMS = ['slipper', 'log', 'fuse', 'candle', 'bulb', 'crank', 'key'];
const START = {
  plug: 0, slipper: 'bed',                                  // 卧室：床头灯的插头插没插上；拖鞋在床边 / 身上 / 卡在浴室门底下（door）
  hamper: 0, bath: 0,                                       // 浴室：脏衣篓推到灯绳底下没有；灯开没开
  log: 'basket', damper: 0, side: 0, fuse: 'side',          // 客厅：柴在筐里 / 身上 / 壁炉里（fire）；风门开没开；抽屉开没开；保险丝在抽屉里 / 身上 / 保险丝盒里（box）
  chair: 0, fridge: 0, candle: 'shelf', lit: 0, hatch: 0,   // 厨房：椅子顶没顶住冰箱门；冰箱门开没开；蜡烛在架子上 / 身上 / 放在保险丝盒旁边（box）；点着没有；地窖口开没开
  drawer: 0, bulb: 'drawer', clock: 0, crank: 'clock', lamp: 0, key: 'stand', door: 0, out: 0,   // 门厅：和一屏的门厅一样
};
const has = (s, it) => s[it] === 'inv';
const power = s => s.fuse === 'box';                        // 楼下来电了
const fireOn = s => s.log === 'fire' && s.damper === 1;     // 壁炉的火稳住了（有柴、风门开着）
const hallLit = s => s.bulb === 'lamp' && power(s);         // 门厅的吊灯亮着
const candleLight = s => s.lit === 1 && s.candle === 'inv'; // 手里举着点着的蜡烛
// 影子：照到了才敢过去。地窖口也算一道：底下一点光都没有，不举着蜡烛（或者没来电）不敢下去
const GATES = {
  gown: s => s.plug === 1,                                  // 卧室门边：睡袍
  towel: s => s.bath === 1,                                 // 浴室：浴巾
  laundry: s => s.bath === 1 && s.slipper === 'door',       // 楼梯口：一堆脏衣服（浴室的光从卡住的门里漏出来）
  stand: s => hallLit(s) && s.lamp === 1,                   // 门厅：衣帽架（吊灯亮着、升上去了）
  chair: s => fireOn(s) || candleLight(s) || power(s),     // 客厅：扶手椅上的毯子（火稳住了；手里的蜡烛、来电以后的灯也照得到它）
  sack: s => (s.chair === 1 && s.fridge === 1) || candleLight(s) || power(s),   // 厨房：桌子底下的一袋土豆（冰箱门被椅子顶着开着）
  cellar: s => s.hatch === 1 && (candleLight(s) || power(s)),
  boiler: s => candleLight(s) || power(s),                  // 地下室：锅炉
};
// 房子分成几块，块和块之间隔着一道“门”（GATES 里的一个）。[这一块, 那一块, 隔着什么]，两个方向都一样
const LINKS = [['bed', 'bath', 'gown'], ['bath', 'landing', 'towel'], ['landing', 'hall', 'laundry'], ['hall', 'exit', 'stand'], ['hall', 'parlour', null],
  ['parlour', 'back', 'chair'], ['back', 'pantry', 'sack'], ['pantry', 'cellar', 'cellar'], ['cellar', 'fusebox', 'boiler']];
function reach(s) {
  const r = new Set(['bed']); let grew = true;
  while (grew) { grew = false; for (const [a, b, g] of LINKS) if ((!g || GATES[g](s)) && r.has(a) !== r.has(b)) { r.add(a); r.add(b); grew = true; } }
  return r;
}
// 能点的东西在哪一块
const SPOT_ZONE = {
  plug: 'bed', slipper: 'bed', bedlamp: 'bed',
  hamper: 'bath', cord: 'bath', bathdoor: 'landing',
  hdrawer: 'hall', hbulb: 'hall', hclock: 'hall', hcrank: 'hall', hlamp: 'hall', winch: 'hall', stand: 'exit', door: 'exit',
  basket: 'parlour', fire: 'parlour', damper: 'parlour',
  side: 'back', fuse: 'back', chair: 'back', fridge: 'back',
  shelf: 'pantry', hatch: 'pantry',
  fusebox: 'fusebox',
};
const SPOTS = Object.keys(SPOT_ZONE);
// 点一下 spot（手里拿着 held，没拿是 null）。成了返回 { s, ev }，不成返回 { fail }：
//   far 走不到（隔着影子），no 这样用不行，look 只是看看，其余的 fail 是告诉玩家差什么
function act(s, spot, held, R = reach(s)) {
  const n = { ...s }, ok = (...ev) => ({ s: n, ev }), no = fail => ({ fail });
  if (s.out) return no('done');
  if (held && !has(s, held)) return no('no');
  if (!R.has(SPOT_ZONE[spot])) return no('far');
  switch (spot) {
    // 卧室
    case 'plug': if (held) return no('no'); if (s.plug) return no('look'); n.plug = 1; return ok('plugIn');
    case 'bedlamp': if (held) return no('no'); return no(s.plug ? 'look' : 'unplugged');
    case 'slipper': if (held || s.slipper !== 'bed') return no('no'); n.slipper = 'inv'; return ok('take:slipper');
    // 浴室
    case 'hamper': if (held) return no('no'); n.hamper = 1 - s.hamper; return ok(n.hamper ? 'pushIn' : 'pushOut');
    case 'cord': if (held) return no('no'); if (!s.hamper) return no('tooHigh'); n.bath = 1 - s.bath; return ok('pull', n.bath ? 'bathOn' : 'bathOff');
    case 'bathdoor':
      if (held === 'slipper') { n.slipper = 'door'; return ok('wedge'); }
      if (held) return no('no');
      if (s.slipper === 'door') { n.slipper = 'inv'; return ok('take:slipper', 'unwedge'); }
      return no('swingsShut');
    // 门厅
    case 'hdrawer': if (held) return no('no'); n.drawer = 1 - s.drawer; return ok(n.drawer ? 'drawerOpen' : 'drawerShut');
    case 'hbulb': if (held || !s.drawer || s.bulb !== 'drawer') return no('no'); n.bulb = 'inv'; return ok('take:bulb');
    case 'hclock': if (held) return no('no'); n.clock = 1 - s.clock; return ok(n.clock ? 'clockOpen' : 'clockShut');
    case 'hcrank': if (held || !s.clock || s.crank !== 'clock') return no('no'); n.crank = 'inv'; return ok('take:crank');
    case 'hlamp':
      if (held === 'bulb') { if (s.lamp) return no('high'); n.bulb = 'lamp'; return ok(power(s) ? 'bulbIn' : 'bulbInDark'); }
      if (held) return no('no');
      return no(s.bulb !== 'lamp' ? 'nobulb' : power(s) ? 'look' : 'nopower');
    case 'winch':
      if (held === 'crank') { n.crank = 'winch'; n.lamp = 1 - s.lamp; return ok('crankOn', n.lamp ? 'raise' : 'lower'); }
      if (held) return no('no');
      if (s.crank !== 'winch') return no('nocrank');
      n.lamp = 1 - s.lamp; return ok(n.lamp ? 'raise' : 'lower');
    case 'stand': if (held) return no('no'); if (s.key !== 'stand') return no('look'); n.key = 'inv'; return ok('take:key');
    case 'door':
      if (held === 'key') { n.key = 'used'; n.door = 1; n.out = 1; return ok('unlock', 'exit'); }
      if (held) return no('no');
      return no('locked');
    // 客厅
    case 'basket': if (held || s.log !== 'basket') return no('no'); n.log = 'inv'; return ok('take:log');
    case 'fire':
      if (held === 'log') { n.log = 'fire'; return ok('logIn'); }
      if (held === 'candle') { if (!fireOn(s)) return no('weakFire'); if (s.lit) return no('look'); n.lit = 1; return ok('lightCandle'); }
      if (held) return no('no');
      return no(s.log !== 'fire' ? 'needLog' : s.damper ? 'look' : 'smoky');
    case 'damper': if (held) return no('no'); n.damper = 1 - s.damper; return ok(n.damper ? 'damperOpen' : 'damperShut');
    case 'side': if (held) return no('no'); n.side = 1 - s.side; return ok(n.side ? 'sideOpen' : 'sideShut');
    case 'fuse': if (held || !s.side || s.fuse !== 'side') return no('no'); n.fuse = 'inv'; return ok('take:fuse');
    // 厨房
    case 'chair': if (held) return no('no'); n.chair = 1 - s.chair; if (!n.chair) n.fridge = 0; return ok(n.chair ? 'chairIn' : 'chairOut');
    case 'fridge': if (held) return no('no'); if (!s.chair) return no('fridgeShuts'); n.fridge = 1 - s.fridge; return ok(n.fridge ? 'fridgeOpen' : 'fridgeShut');
    case 'shelf': if (held || s.candle !== 'shelf') return no('no'); n.candle = 'inv'; return ok('take:candle');
    case 'hatch': if (held) return no('no'); n.hatch = 1 - s.hatch; return ok(n.hatch ? 'hatchOpen' : 'hatchShut');
    // 地下室：换保险丝要两只手，蜡烛先放在旁边的架子上
    case 'fusebox':
      if (held === 'fuse') { n.fuse = 'box'; if (s.candle === 'inv') n.candle = 'box'; return ok('fuseIn', 'powerOn'); }
      if (held) return no('no');
      return no(power(s) ? 'look' : 'blown');
  }
  return no('no');
}
const KEYS = Object.keys(START);
const skey = s => KEYS.map(k => s[k]).join(',');
function moves(s) {
  const out = [], R = reach(s), hand = [null, ...ITEMS.filter(it => has(s, it))];
  for (const spot of SPOTS) { if (!R.has(SPOT_ZONE[spot])) continue; for (const held of hand) { const r = act(s, spot, held, R); if (r.s) out.push({ spot, held, s: r.s }); } }
  return out;
}
// 从 from 开始一层一层往外搜：最短的点法、搜到几个局面；full 的时候搜完整个局面、再数几个死路（从它出发再也走不出去）
function solve(from = START, allow = () => true, full = false) {
  const k0 = skey(from), prev = new Map([[k0, null]]), all = new Map([[k0, from]]), q = [from];
  let goal = null;
  for (let h = 0; h < q.length; h++) {
    const s = q[h];
    if (s.out) { if (!goal) goal = skey(s); if (!full) break; continue; }
    for (const m of moves(s)) {
      if (!allow(m)) continue;
      const k = skey(m.s); if (prev.has(k)) continue;
      prev.set(k, [skey(s), m]); all.set(k, m.s); q.push(m.s);
    }
  }
  const path = [];
  for (let k = goal; k && prev.get(k); k = prev.get(k)[0]) path.unshift({ spot: prev.get(k)[1].spot, held: prev.get(k)[1].held });
  if (!full) return { path: goal ? path : null, states: all.size, dead: -1 };
  const canWin = new Set(); let grew = true;
  for (const [k, s] of all) if (s.out) canWin.add(k);
  const succ = new Map(); for (const [k, s] of all) succ.set(k, s.out ? [] : moves(s).filter(allow).map(m => skey(m.s)));
  while (grew) { grew = false; for (const [k] of all) { if (canWin.has(k)) continue; if (succ.get(k).some(x => canWin.has(x))) { canWin.add(k); grew = true; } } }
  return { path: goal ? path : null, states: all.size, dead: all.size - canWin.size };
}
</script>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const qs = new URLSearchParams(location.search);

// ---------- 色表 ----------
// 界面、光晕、粒子用的几个颜色（和《灯下》是同一套）
const C = {
  night: [7, 10, 21], dusk: [27, 38, 70], moon: [203, 218, 255], mass: [6, 8, 14], room: [17, 23, 41], ink: [2, 3, 8],
  lamp: [255, 196, 122], hot: [255, 244, 222], paper: [164, 92, 72], panel: [58, 84, 80], wood: [150, 100, 60], cream: [234, 226, 206],
  brass: [216, 170, 94], skin: [236, 196, 166], cloth: [62, 70, 94], rug: [140, 46, 44],
  amber: [240, 170, 72], teal: [86, 196, 180], danger: [255, 84, 78],
};
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, t) => mix(c, C.mass, t);   // 压暗
const tint = (c, t) => mix(c, C.hot, t);     // 提亮

// 画面：和《灯下》2026-11-18 定下来的画法一样（mini/tools/looks.html 的 LOOK）：铅笔线，每样东西留一点自己的颜色、都压得很灰。
//   · 线是一笔笔画的：左右慢慢晃，粗细不匀，两头收细，每一笔两道叠着；方框是四笔，四个角不对齐、线头出头。排线多。
//   · 颜色压得很灰，不正好贴着线，边上积一点深的；整张画上盖一层纸的颗粒。
//   · 暗处冷、只有轮廓和排线；灯照到的地方暖、有颜色和细节。灯光没有形状：由亮到暗是排线一层层加密，没有边。
// 两套颜色的名字一一对应，颜色照 looks.html；那边没有的东西（座钟、大衣、窗帘……）照着它的调子配
const LIT = {
  ink: '#2a2420', hi: '#fff3d6',
  wall: '#a9a08c', stripe: '#958b76', motif: '#7d5847', frieze: '#9b917c', cornice: '#857a66', rail2: '#6e5a44',
  panel: '#6c7060', rail: '#858a76', skirt: '#474a3e',
  floor: '#806a50', front: '#54432f',
  frame: '#8f7c52', trim: '#5c4a38', canvas: '#c9c0a7', door: '#6b5340', doorIn: '#58432f',
  wood: '#5f4332', woodHi: '#876a4f', woodLo: '#45301f', woodIn: '#2a1d14',
  brass: '#b99c5e', iron: '#4f4a43', wire: '#3a2c22', box: '#4d3d2e',
  rug: '#73443c', rugLine: '#c2b08e', mat: '#4f3a30',
  dial: '#d9cfb6', drape: '#5e3c34', drapeHi: '#7d5246', radiator: '#a39a86',
  vase: '#55606a', flower: '#8e4a40', twig: '#4a3828',
  coat: '#5b6c62', coatLo: '#43514a', hat: '#3d2c22', scarf: '#b08a4a',
  sky: '#8296c0', hill: '#6d7a5a', sea: '#6f8290', shade: '#7b6236',
  cloth: '#4b5263',
};
const DARK = {
  ink: '#03040a', hi: '#b4c0e4', moon: '#cdd9f6', mass: '#090b11',
  wall: '#141a2a', stripe: '#0f141f', motif: '#141a2a', frieze: '#121827', cornice: '#0e121c', rail2: '#1a2233',
  panel: '#10141e', rail: '#1a2233', skirt: '#0a0d15',
  floor: '#1a2233', front: '#0b0e16',
  frame: '#283249', trim: '#1c2334', canvas: '#171d2d', door: '#1a2131', doorIn: '#131927',
  wood: '#161b29', woodHi: '#222a3d', woodLo: '#0e121c', woodIn: '#06080d',
  brass: '#58617d', iron: '#3a4560', wire: '#222a3c', box: '#2d3854',
  rug: '#12151f', rugLine: '#232b3f', mat: '#0e111a',
  dial: '#6d7896', drape: '#0f1320', drapeHi: '#3a4767', radiator: '#2a3349',
  vase: '#232b3f', flower: '#2b3550', twig: '#151a27',
  coat: '#232b3f', coatLo: '#171d2b', hat: '#121624', scarf: '#2f3a55',
  sky: '#2a3657', hill: '#1a2233', sea: '#1a2233', shade: '#33313a',
  cloth: '#272e41',
};
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, gg, bb] = hexRGB(h); return `rgba(${r},${gg},${bb},${a})`; };
const hexMix = (a, b, t) => { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };

// ---------- 手：铅笔线、排线、不匀的颜色（照 mini/tools/looks.html）----------
// 单位都是世界单位（孩子大约 150 高）。每个画布上挂着 pen（笔：粗细、晃多少、浓淡、颜色）、seedN（下一笔用哪个种子）和 base（纸纹对齐用的变换）。
// 会动的东西每一帧都重画：每一样开头都把 seedN 设成固定的数，同一笔每一帧用同一个种子，线就不会跳
const PEN = { w: 1.9, amp: 1.55, a: 0.66, double: 1 };   // 铅笔：软、抖、淡，每一笔两道叠着
const HD = 1.5;                                          // 排线的密度：阴影里的排线比钢笔那一版密一倍半
function rnd(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const nzCache = new Map();
function nz(seed) {   // 一维的平滑噪声
  let v = nzCache.get(seed);
  if (!v) { const r = rnd(seed * 7919 + 13); v = new Float32Array(256); for (let i = 0; i < 256; i++) v[i] = r(); nzCache.set(seed, v); }
  return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return v[i & 255] * (1 - u) + v[(i + 1) & 255] * u; };
}
const seg = (x0, y0, x1, y1) => [[x0, y0], [x1, y1]];
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function arcPts(cx, cy, rx, ry, a0, a1, n = 20) { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
function quadPts(p0, p1, p2, n = 14) { const p = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; p.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]); } return p; }
function cubPts(p0, p1, p2, p3, n = 12) { const p = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; p.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]); } return p; }
function roundPts(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); const q = Math.PI / 2; return [...arcPts(x + r, y + r, r, r, Math.PI, Math.PI + q, 5), ...arcPts(x + w - r, y + r, r, r, -q, 0, 5), ...arcPts(x + w - r, y + h - r, r, r, 0, q, 5), ...arcPts(x + r, y + h - r, r, r, q, Math.PI, 5)]; }
// 穿过这些点的圆滑曲线（点的第三个数是 1 就是尖角），和《灯下》画主角用的是同一种曲线
function curvePts(pts, closed = true, n = 5) {
  const N = pts.length, at = i => closed ? pts[(i + N) % N] : pts[clamp(i, 0, N - 1)], out = [];

cv.addEventListener('pointerdown', e => {
  audio();
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = e.pointerType === 'mouse';
  for (let i = ui.length - 1; i >= 0; i--) { const u = ui[i]; if (Math.hypot(e.clientX - u.x, e.clientY - u.y) <= u.r) { u.fn(); return; } }
  if (won) return;
  const si = slotAt(e.clientX, e.clientY);
  if (si >= 0) { const it = bag[si]; held = it && !flying(it) && held !== it ? it : null; if (held) snd.pick(); return; }   // 物品栏：点一下拿在手里，再点一下放回去
  if (!DRAG) return tapWorld(camX + e.clientX / Z, camY + e.clientY / Z);
  if (stick.id !== null) return;   // 第二根手指不管
  Object.assign(stick, { id: e.pointerId, on: true, drag: false, ax: e.clientX, ay: e.clientY, px: e.clientX, py: e.clientY, x0: e.clientX, y0: e.clientY });
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
// 拖着走：按下去没怎么动就松开，是点了一下（点东西）；拖出 12 像素就是拖着走
function stickEnd(e, cancel) {
  if (stick.id !== e.pointerId) return;
  const tapped = !stick.drag && !cancel;
  stick.id = null; stick.on = false; stick.drag = false;
  if (tapped && !won) tapWorld(camX + e.clientX / Z, camY + e.clientY / Z);
}
cv.addEventListener('pointerup', e => stickEnd(e, false));
cv.addEventListener('pointercancel', e => stickEnd(e, true));
cv.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = e.pointerType === 'mouse';
  if (stick.id === e.pointerId) {
    stick.px = e.clientX; stick.py = e.clientY;
    if (!stick.drag && Math.hypot(stick.px - stick.x0, stick.py - stick.y0) > 12) { stick.drag = true; drags++; }
    if (stick.drag) { const dx = stick.px - stick.ax, dy = stick.py - stick.ay, L = Math.hypot(dx, dy); if (L > STICK_R) { stick.ax = stick.px - dx / L * STICK_R; stick.ay = stick.py - dy / L * STICK_R; } }   // 拖远了，圈跟着手指走：往回拖马上就掉头
  }
  if (!mouse.on) return;
  const over = ui.some(u => Math.hypot(e.clientX - u.x, e.clientY - u.y) <= u.r) || (!won && (bag[slotAt(e.clientX, e.clientY)] || spotAt(camX + e.clientX / Z, camY + e.clientY / Z)));
  cv.style.cursor = over ? 'pointer' : 'default';
});
addEventListener('keydown', e => {
  audio();
  const k = e.key.toLowerCase();
  if (k === 'r') restart();
  else if (k === 'm') toggleMute();
  else if (k === 'h' || k === '?') hint();
  else if (k === 'escape') held = null;
  else if (DRAG && MOVE_KEYS[k]) { keys.add(MOVE_KEYS[k]); e.preventDefault(); }
});
const MOVE_KEYS = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down' };
addEventListener('keyup', e => { const m = MOVE_KEYS[e.key.toLowerCase()]; if (m) keys.delete(m); });
addEventListener('blur', () => { keys.clear(); stick.id = null; stick.on = false; stick.drag = false; });

// ---------- 开始 ----------
layout(); restart();
let last = performance.now() / 1000, paused = qs.has('paused');
function frame() {
  const now = performance.now() / 1000, dt = clamp(now - last, 0, 0.05); last = now;
  if (!paused) { tick(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 像点了一下那样用某个地方（id 是 spots() 里的名字，item 是手里拿的东西）。给自动试玩和检查用
function tap(id, item) {
  if (won || busy()) return false;
  const sp = spots().find(s => s.id === id); if (!sp) return false;
  if (tStart < 0) tStart = V.T;
  taps++; held = null; use(sp, item || null); return true;
}
// 地址后面加 ?auto=1：照最短的解法自己玩一遍
if (qs.has('auto')) setInterval(() => { if (won || kid.mode !== 'idle' || fly.length) return; const r = solve(S); if (r.path && r.path.length) tap(r.path[0].spot, r.path[0].held); }, 600);
window.__house = {
  get S() { return S; }, get V() { return V; }, get kid() { return kid; }, get stick() { return stick; }, get bag() { return bag; }, get won() { return won; }, get held() { return held; }, get taps() { return taps; }, get bubble() { return bubble; },
  get cam() { return [camX, camY, VWW, VHH]; }, get paintQ() { return paintQ.length; }, get mon() { return V.mon; }, get catches() { return V.catches; },
  set paused(v) { paused = !!v; }, get paused() { return paused; },
  tick, render, tap, restart, hint, solve, spots, coverage, busy, tapWorld, walkTo, spotAt,
  run(sec, fps = 30) { for (let i = 0; i < Math.round(sec * fps); i++) tick(1 / fps); render(); },
  // 一直跑到孩子停下来（最多 sec 秒）
  settle(sec = 30, fps = 30) { let i = 0; for (; i < sec * fps; i++) { tick(1 / fps); if (kid.mode === 'idle' && !fly.length) break; } render(); return i / fps; },
  paintAll() { while (paintQ.length) paintIdle(); },
  // 直接摆到某个局面（给截图用）：改规则里的状态，画面上的东西一步到位
  set(patchS) {
    S = { ...S, ...patchS }; bag = ITEMS.filter(it => S[it] === 'inv');
    Object.assign(V, { drawer: S.drawer, clock: S.clock, door: S.door, lampH: S.lamp, side: S.side, damperT: S.damper, hatch: S.hatch, hamperT: S.hamper, chairT: S.chair, fridge: S.fridge, bdoor: S.slipper === 'door' ? 1 : 0, fireLv: fireLevel(), smoke: S.log === 'fire' && !S.damper ? 1 : 0 });
    for (const k in V.lt0) V.lt0[k] = -10;
    V.li.bedlamp = S.plug ? 1 : 0; V.li.bath = S.bath ? 1 : 0; V.li.hall = hallLit(S) ? 1 : 0; V.li.power = power(S) ? 1 : 0; V.candleI = S.lit && (S.candle === 'inv' || S.candle === 'box') ? 1 : 0;
    tick(0.001); LT = activeLights(); for (const k of FEAR_KEYS) { const m = V.mon[k]; m.x = GARB[k].home; const [hx, hy] = garbHead(k); m.want = m.rise = coverage(hx, hy, LT) > 0.55 ? 0 : 1; V.fig[k] = 1 - m.rise; m.hunt = m.reach = 0; } V.grace = V.T + 1;
    render();
  },
  // 把孩子放到某处（给截图用）
  put(x, y, face = 1) { kid.x = x; kid.y = y; kid.face = face; kid.mode = 'idle'; kid.path = []; const q = nearestOnPaths(x, y); enterKind({ kind: EDGES[q.e].kind, y }); [camFX, camFY] = camTarget(); render(); },
};
