<!-- 规则和关卡：不碰页面，mini/tools/check.mjs 也直接拿这一段去跑求解器 -->
<script id="core">
// 地图字符（侧面剖开的房子，一格一格的）
//   #  墙 / 地板      .  空的      H  梯子      E  出口
//   1 2  拉杆（拉一下，同一组的灯开 / 关）
//   L  一直亮着的灯   A a  第一组的灯（大写开着，小写关着）   B b  第二组
//   _  踏板（上面有东西压着，所有铁门就开）   G  铁门   g  地板上的铁盖子（下面接梯子）
//   P  玩家
//   x  扑影：和你在同一层、中间没墙时，一步一步朝你过来。被照到变成衣柜
//   m  学影：你左右走一步，它也朝同一边走一步。被照到变成椅子
//   w W  游影：一直来回走（w 先往右，W 先往左），碰到墙掉头。被照到变成座钟
// 灯照亮它下面左右各两格、往下三格（墙挡光）。影子站在亮处就变成家具，不动；回到暗处又醒过来。
// 家具挡路，但可以踩上去。被醒着的影子碰到就输。
const LEVELS = [
  { name: '灯', tip: '影子怕光：被灯照到就变成家具。站到拉杆上按 E（拉）开灯。家具可以踩上去翻过去。', map: [
    '############',
    '#.....a....#',
    '#P1......x.E',
    '############',
  ]},
  { name: '时机', tip: '踏板被压住，铁门才开。什么东西压都行。空格是原地等一步。', map: [
    '################',
    '#.........a....#',
    'E.GG.1P..._...x#',
    '################',
  ]},
  { name: '学舌', tip: '它学你走路：你往哪边走，它也往哪边走。它被墙挡住时，你们就错开了。爬梯子它不学。', map: [
    '##############',
    '#.m..._.#..E.#',
    '##########g###',
    '#.........H..#',
    '#P........H..#',
    '##############',
  ]},
  { name: '叫醒', tip: '关了灯，家具会醒过来。', map: [
    '#################',
    '#..A.......b....#',
    '#.x....1.P._.2GGE',
    '#################',
  ]},
  { name: '台阶', tip: '出口在高处，够不着。', map: [
    '################',
    '#......1.P.....#',
    '#########H######',
    '######...H.a..E#',
    '######..mH...###',
    '################',
  ]},
];

const LIGHT_W = 2, LIGHT_D = 3;

function parseLevel(def) {
  const map = def.map, h = map.length, w = Math.max(...map.map(r => r.length));
  const tiles = [], lamps = [], mons = [], plates = [];
  let px = 0, py = 0, bits = 0;
  for (let r = 0; r < h; r++) {
    const row = [];
    for (let c = 0; c < w; c++) {
      const ch = map[r][c] || '#';
      let t = '.';
      if ('#HGgE12_'.includes(ch)) t = ch;
      else if (ch === 'L') lamps.push({ c, r, grp: 0 });
      else if (ch === 'A' || ch === 'a') { lamps.push({ c, r, grp: 1 }); if (ch === 'A') bits |= 1; }
      else if (ch === 'B' || ch === 'b') { lamps.push({ c, r, grp: 2 }); if (ch === 'B') bits |= 2; }
      else if (ch === 'P') { px = c; py = r; }
      else if (ch === 'x' || ch === 'm') mons.push({ t: ch, x: c, y: r, d: 0 });
      else if (ch === 'w' || ch === 'W') mons.push({ t: 'w', x: c, y: r, d: ch === 'w' ? 1 : -1 });
      if (t === '_') plates.push({ c, r });
      row.push(t);
    }
    tiles.push(row);
  }
  const lv = { w, h, tiles, lamps, plates, name: def.name, tip: def.tip, start: { px, py, lamps: bits, mons } };
  for (const l of lamps) l.cells = lampCells(lv, l);
  return lv;
}

const T = (lv, c, r) => (c < 0 || r < 0 || c >= lv.w || r >= lv.h ? '#' : lv.tiles[r][c]);
const K = (x, y) => x + ',' + y;

// 一盏灯照得到哪些格子：下面左右各两格、往下三格，墙挡光
function lampCells(lv, l) {
  const out = [];
  for (let dr = 0; dr <= LIGHT_D; dr++) for (let dc = -LIGHT_W; dc <= LIGHT_W; dc++) {
    const c = l.c + dc, r = l.r + dr;
    if (T(lv, c, r) === '#') continue;
    const x0 = l.c + 0.5, y0 = l.r + 0.3, x1 = c + 0.5, y1 = r + 0.5;
    let clear = true;
    for (let i = 1; i < 24 && clear; i++) {
      const t = i / 24, sx = Math.floor(x0 + (x1 - x0) * t), sy = Math.floor(y0 + (y1 - y0) * t);
      if ((sx !== c || sy !== r) && T(lv, sx, sy) === '#') clear = false;
    }
    if (clear) out.push(K(c, r));
  }
  return out;
}
const lampOn = (l, s) => l.grp === 0 || ((s.lamps >> (l.grp - 1)) & 1) === 1;
function litSet(lv, s) {
  const set = new Set();
  for (const l of lv.lamps) if (lampOn(l, s)) for (const k of l.cells) set.add(k);
  return set;
}
const gatesOpen = (lv, s) => lv.plates.some(p => (s.px === p.c && s.py === p.r) || s.mons.some(m => m.x === p.c && m.y === p.r));
function blocked(lv, c, r, open) { const t = T(lv, c, r); return t === '#' || ((t === 'G' || t === 'g') && !open); }
function supported(lv, s, lit, c, r, open, self) {
  const t = T(lv, c, r);
  if (t === 'H' || t === 'g') return true;
  const b = T(lv, c, r + 1);
  if (b === '#' || b === 'H' || b === 'g' || (b === 'G' && !open)) return true;
  return s.mons.some(m => m !== self && m.x === c && m.y === r + 1 && lit.has(K(m.x, m.y)));
}
function clearRow(lv, a, b, y, open) {
  const d = Math.sign(b - a);
  for (let x = a + d; x !== b; x += d) if (blocked(lv, x, y, open)) return false;
  return true;
}
// 扑影这一步会不会朝你过来（画面上用来把它的眼睛画红）
function lurkerSees(lv, s, m, lit) {
  return m.t === 'x' && !lit.has(K(m.x, m.y)) && m.y === s.py && m.x !== s.px && clearRow(lv, m.x, s.px, m.y, gatesOpen(lv, s));
}

// 走一个回合。act：L R 左右，U D 上下梯子，E 拉拉杆，W 原地等。走不了返回 null
function step(lv, s, act) {
  const n = { px: s.px, py: s.py, lamps: s.lamps, mons: s.mons.map(m => ({ t: m.t, x: m.x, y: m.y, d: m.d })) };
  const ev = [];
  let lit = litSet(lv, n), open = gatesOpen(lv, n), pdx = 0;
  const activeAt = (x, y) => n.mons.find(m => m.x === x && m.y === y && !lit.has(K(x, y)));
  const furnAt = (x, y) => n.mons.find(m => m.x === x && m.y === y && lit.has(K(x, y)));
  const dead = why => ({ s: n, dead: true, why, ev });

  if (act === 'L' || act === 'R') {
    const dx = act === 'L' ? -1 : 1, tx = n.px + dx;
    if (blocked(lv, tx, n.py, open)) return null;
    if (furnAt(tx, n.py)) { // 踩到家具上去
      if (blocked(lv, tx, n.py - 1, open) || blocked(lv, n.px, n.py - 1, open) || n.mons.some(m => m.x === tx && m.y === n.py - 1)) return null;
      n.px = tx; n.py--; ev.push('climb');
    } else {
      n.px = tx; ev.push('step');
      if (activeAt(n.px, n.py)) return dead('walk');
    }
    pdx = dx;
  } else if (act === 'U' || act === 'D') {
    const dy = act === 'U' ? -1 : 1;
    const t = T(lv, n.px, act === 'U' ? n.py : n.py + 1);
    if (t !== 'H' && t !== 'g') return null;
    if (blocked(lv, n.px, n.py + dy, open)) return null;
    n.py += dy; ev.push('ladder');
    if (activeAt(n.px, n.py)) return dead('walk');
  } else if (act === 'E') {
    const t = T(lv, n.px, n.py);
    if (t !== '1' && t !== '2') return null;
    n.lamps ^= t === '1' ? 1 : 2; ev.push('lever');
    lit = litSet(lv, n);
  } else if (act !== 'W') return null;

  // 脚下没东西就掉下去（站着的家具醒了也会掉）
  open = gatesOpen(lv, n);
  let fell = 0;
  while (!supported(lv, n, lit, n.px, n.py, open, null)) {
    n.py++; fell++;
    if (n.py >= lv.h || activeAt(n.px, n.py)) return dead('fall');
  }
  if (fell) ev.push('fall');

  // 影子走一步（亮处的不动）
  for (const m of n.mons) {
    if (lit.has(K(m.x, m.y))) continue;
    open = gatesOpen(lv, n);
    let tx = m.x;
    if (m.t === 'x') { if (m.y === n.py && m.x !== n.px && clearRow(lv, m.x, n.px, m.y, open)) tx = m.x + Math.sign(n.px - m.x); }
    else if (m.t === 'm') tx = m.x + pdx;
    else if (m.t === 'w') tx = m.x + m.d;
    if (tx === m.x) continue;
    const ok = !blocked(lv, tx, m.y, open) && !n.mons.some(o => o !== m && o.x === tx && o.y === m.y) && supported(lv, n, lit, tx, m.y, open, m);
    if (!ok) { if (m.t === 'w') m.d = -m.d; continue; }
    m.x = tx;
    if (m.x === n.px && m.y === n.py) return dead('caught');
  }
  if (activeAt(n.px, n.py)) return dead('caught');
  return { s: n, dead: false, win: T(lv, n.px, n.py) === 'E', ev };
}

const skey = s => s.px + ',' + s.py + ',' + s.lamps + '|' + s.mons.map(m => m.x + ',' + m.y + ',' + m.d).join(';');
// 从 from 开始一步一步往外搜，找最短的走法
function solve(lv, from, limit = 300000, acts = 'LRUDEW') {
  const start = from || lv.start, sk = skey(start);
  const prev = new Map([[sk, null]]), q = [start];
  for (let head = 0; head < q.length && prev.size < limit; head++) {
    const s = q[head], k0 = skey(s);
    for (const a of acts) {
      const r = step(lv, s, a);
      if (!r || r.dead) continue;
      const k = skey(r.s);
      if (prev.has(k)) continue;
      prev.set(k, [k0, a]);
      if (r.win) {
        const path = [];
        for (let cur = k; prev.get(cur); cur = prev.get(cur)[0]) path.unshift(prev.get(cur)[1]);
        return { path, states: prev.size };
      }
      q.push(r.s);
    }
  }
  return { path: null, states: prev.size };
}
</script>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ---------- 色表 ----------
// 界面、开关灯时扬起的灰这些还用下面这几个颜色（数组，css() 加透明度）。房子、人、影子、家具用“画法”那一段的颜色（十六进制）。
const C = {
  night: [7, 10, 21], dusk: [27, 38, 70], moon: [203, 218, 255], mass: [6, 8, 14], room: [17, 23, 41], ink: [2, 3, 8],
  lamp: [255, 196, 122], hot: [255, 244, 222], amber: [240, 170, 72], teal: [86, 196, 180], danger: [255, 84, 78],
};
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

// ---------- 画法 ----------
// 2026-11-18 定下来的（先在 tools/looks.html 里试的）：铅笔线 —— 软、抖、两道叠着，排线多；每样东西留一点自己的颜色，都压得很灰；房子外面是夜景。
// 暗的一层和亮的一层是同一张画（线的走法一样）：暗的那层冷、只有轮廓，亮的那层暖、有细节。
// 灯光没有形状：灯泡周围最亮，往外慢慢暗下去；由亮到暗不是一道光滑的渐变，是排线一层层加密。
// 天、树、地面、房子在换关、改窗口大小时各画一次；人、影子、家具、拉杆、灯这些会变的东西每一帧画（画在各自的小画布上，没变就不重画）。
const LIT = {
  ink: '#2a2420', wall: '#a9a08c', stripe: '#958b76', motif: '#7d5847', cornice: '#857a66', panel: '#6c7060', rail: '#858a76', skirt: '#474a3e',
  floor: '#806a50', front: '#54432f', frame: '#8f7c52', canvas: '#c9c0a7', wood: '#5f4332', woodHi: '#876a4f', woodLo: '#3f2c20', brass: '#b99c5e', rug: '#73443c', rugLine: '#c2b08e',
  stone: '#8e8773', wire: '#3a2c22', box: '#4d3d2e', shaft: '#3a3026', ladder: '#7a5f43', rung: '#5f4734', iron: '#5d5a55', shade: '#7b6236', dial: '#d9cfb6',
  sky: '#8296c0', hill: '#6d7a5a', sea: '#6f8290', flower: '#8e4a40', hi: '#fff3d6',
};
const DARK = {
  ink: '#03040a', hi: '#b4c0e4', sky0: '#090d1a', sky1: '#2a3657', mass: '#090b11', roof: '#0b0e17', ground: '#05070b',
  wall: '#141a2a', stripe: '#0f141f', cornice: '#0e121c', panel: '#10141e', rail: '#1a2233', skirt: '#0a0d15', floor: '#1a2233', front: '#0b0e16',
  frame: '#283249', canvas: '#171d2d', rug: '#12151f', rugLine: '#232b3f', stone: '#2c3753', wire: '#222a3c', box: '#2d3854', shaft: '#07090f',
  ladder: '#3a4562', rung: '#2a3349', iron: '#4a5674', shade: '#33313a', moon: '#cdd9f6',
  glass0: '#4c5f8e', glass1: '#2c3a5c', out0: '#46598a', out1: '#bccaee', far: '#5a6ea0', path: '#cdd9f6',
};
const GRPH = { 0: '#c9c3b2', 1: '#e0a94c', 2: '#5fb6a8' };   // 灯罩和拉杆上的球：一直亮着的、第一组、第二组
const PEN = { w: 1.4, amp: 1.2, a: 0.66, double: 1 };      // 铅笔：粗细、抖多少、浓淡、两道叠着
let PS = 1;                                                // 线的粗细跟着格子大小走：一格 96 像素的时候是 1
const pen = (col, o = {}) => ({ w: PEN.w * PS, amp: PEN.amp * PS, a: PEN.a, double: PEN.double, col, ...o });

// ---------- 铅笔 ----------
// 一笔一笔的线、排线、不匀的颜色、纸的颗粒。都是定的（同一个种子画出来一样），不会每一帧乱跳。
function rnd(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const vnCache = new Map();
function vnoise(seed) {   // 一维的平滑噪声，给线晃用
  let v = vnCache.get(seed);
  if (!v) { const r = rnd(seed * 7919 + 13); v = new Float32Array(256); for (let i = 0; i < 256; i++) v[i] = r(); vnCache.set(seed, v); }
  return x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return v[i & 255] * (1 - u) + v[(i + 1) & 255] * u; };
}
const sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, g2, b] = hexRGB(h); return `rgba(${r},${g2},${b},${a})`; };
const hexMix = (a, b, t) => { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => clamp(Math.round(v + (B[i] - v) * t), 0, 255).toString(16).padStart(2, '0')).join(''); };
// 暗处的颜色：按原来的深浅换成偏冷的浅色（浅的东西在暗处也最亮）
const coldOf = h => { const [r, g2, b] = hexRGB(h); return hexMix('#2b3450', '#c3cce2', 0.3 + 0.62 * (0.299 * r + 0.587 * g2 + 0.114 * b) / 255); };
const seg = (x0, y0, x1, y1) => [[x0, y0], [x1, y1]];
const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function arcPts(cx, cy, rx, ry, a0, a1, n = 20) { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return p; }
function quadPts(p0, p1, p2, n = 14) { const p = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; p.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]); } return p; }
function roundPts(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); const q = Math.PI / 2; return [...arcPts(x + r, y + r, r, r, Math.PI, Math.PI + q, 5), ...arcPts(x + w - r, y + r, r, r, -q, 0, 5), ...arcPts(x + w - r, y + h - r, r, r, 0, q, 5), ...arcPts(x + r, y + h - r, r, r, q, Math.PI, 5)]; }
function resample(pts, step) {
  const out = []; let s = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.round(d / step));
    for (let j = 0; j < n; j++) { const t = j / n; out.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, s + d * t]); }
    s += d;
  }
  const l = pts[pts.length - 1]; out.push([l[0], l[1], s]); return out;
}
function bbox(pts, pad = 4) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const [x, y] of pts) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } return [x0 - pad, y0 - pad, x1 - x0 + pad * 2, y1 - y0 + pad * 2]; }
// 一笔：沿着 pts 走，左右慢慢地晃，粗细跟着变，两头收细。画出来是一条窄窄的面，不是等宽的线
function ink(ctx, pts, o = {}) {
  const seed = o.seed ?? ++ctx.seedN; if (o.skip) return;
  const P = ctx.pen, ga = ctx.globalAlpha, one = (sd, wk, ak) => {
    const w0 = (o.w ?? 1) * P.w * wk, amp = (o.amp ?? 1) * P.amp, R = resample(pts, 3 * PS), n = R.length; if (n < 2) return;
    const Ln = R[n - 1][2], N1 = vnoise(sd), N2 = vnoise(sd + 101), N3 = vnoise(sd + 211), tl = (o.taper ?? 9) * PS, env = Math.min(1, Ln / (36 * PS)), lf = [], rt = [];
    for (let i = 0; i < n; i++) {
      const a = R[Math.max(0, i - 1)], b = R[Math.min(n - 1, i + 1)], p = R[i];
      let tx = b[0] - a[0], ty = b[1] - a[1]; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
      const s = p[2] / PS, off = amp * env * ((N1(s / 52 + 3) - 0.5) * 2.2 + (N2(s / 12) - 0.5) * 0.5);
      const e = Math.min(p[2], Ln - p[2]), tp = tl ? 0.3 + 0.7 * sm(e / tl) : 1, w = w0 * (0.7 + 0.6 * N3(s / 34 + 7)) * tp * (o.prof ? o.prof(p[2] / Ln) : 1);
      const cx = p[0] - ty * off, cy = p[1] + tx * off;

function pendulum(now, k) {   // 钟摆慢慢地摆（画在座钟的坐标里）

  g.strokeStyle = '#7d6a45'; g.lineWidth = Math.max(1, k * 0.9); g.lineCap = 'round'; g.beginPath(); g.moveTo(0, y0 + 28 * k); g.lineTo(sw, y0 + 46 * k); g.stroke();
  g.fillStyle = LIT.brass; g.beginPath(); g.arc(sw, y0 + 46 * k, 2.6 * k, 0, 7); g.fill();
  g.strokeStyle = LIT.ink; g.lineWidth = Math.max(0.8, 0.7 * PS); g.stroke();
}

// ---------- 界面 ----------
function button(x, y, r, label, fn, opts = {}) {
  g.beginPath(); g.arc(x, y, r, 0, 7);
  g.fillStyle = css(opts.hi ? C.lamp : C.moon, opts.hi ? 0.16 : 0.07); g.fill();
  g.strokeStyle = css(opts.hi ? C.lamp : C.moon, opts.hi ? 0.6 : 0.26); g.lineWidth = 1.2; g.stroke();
  g.save(); g.strokeStyle = g.fillStyle = css(C.moon, 0.9); g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round';
  if (typeof label === 'function') label(x, y);
  else { g.font = `${opts.size || 16}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, x, y + 1); }
  g.restore();
  ui.push({ x, y, r: r + 4, fn });
}
const arrow = d => (x, y) => {
  const a = { L: Math.PI, R: 0, U: -Math.PI / 2, D: Math.PI / 2 }[d];
  g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(-6, -9); g.lineTo(5, 0); g.lineTo(-6, 9); g.lineWidth = 3; g.stroke(); g.restore();
};

function drawUI(now) {
  const small = W < 600 || H < 500, L = 16, R = W - 16;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = css(C.moon, 0.5); g.font = `${small ? 12 : 15}px ${FONT}`;
  g.fillText(`第 ${li + 1} 关`, L, small ? 24 : 40);
  g.fillStyle = css(C.moon, 0.94); g.font = `${small ? 20 : 28}px ${FONT}`;
  g.fillText(lv.name, L, small ? 50 : 74);

  const by = small ? 32 : 50;
  button(R - 20, by, 19, (x, y) => {
    g.lineWidth = 1.6; g.beginPath(); g.moveTo(x - 8, y - 3); g.lineTo(x - 4, y - 3); g.lineTo(x + 1, y - 8); g.lineTo(x + 1, y + 8); g.lineTo(x - 4, y + 3); g.lineTo(x - 8, y + 3); g.closePath(); g.stroke();
    if (muted) { g.beginPath(); g.moveTo(x + 5, y - 4); g.lineTo(x + 11, y + 4); g.moveTo(x + 11, y - 4); g.lineTo(x + 5, y + 4); g.stroke(); }
    else { g.beginPath(); g.arc(x + 2, y, 5, -0.9, 0.9); g.stroke(); g.beginPath(); g.arc(x + 2, y, 9, -0.9, 0.9); g.stroke(); }
  }, () => { muted = !muted; store.set('lamplight.mute', muted); });
  button(R - 66, by, 19, (x, y) => { g.beginPath(); g.arc(x, y, 8, -1.2, 4.3); g.stroke(); g.beginPath(); g.moveTo(x + 2, y - 11); g.lineTo(x + 4, y - 7); g.lineTo(x - 0.5, y - 5); g.stroke(); }, restart);
  button(R - 112, by, 19, (x, y) => { g.beginPath(); g.arc(x + 1, y + 1, 8, Math.PI * 1.1, Math.PI * 2.4); g.stroke(); g.beginPath(); g.moveTo(x - 9, y - 6); g.lineTo(x - 7, y + 1); g.lineTo(x - 1, y - 2); g.stroke(); }, undo, { hi: status === 'dead' });

  // 关卡点
  const mx = maxUnlocked(), dx0 = W / 2 - (LEVELS.length - 1) * 12;
  if (!small || W > 420) for (let i = 0; i < LEVELS.length; i++) {
    const x = dx0 + i * 24, open = i <= mx, done = progress.cleared.includes(i), c = i === li;
    g.beginPath(); g.arc(x, by, c ? 5.5 : 4, 0, 7);
    g.fillStyle = c ? css(C.lamp, 0.95) : css(C.moon, done ? 0.6 : open ? 0.24 : 0.08);
    g.fill();
    if (open && !c) ui.push({ x, y: by, r: 12, fn: () => load(i) });
  }

  // 下面那一条：平时是提示，被抓住 / 过关以后换成结果和按钮（不压在房子上）
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (status === 'play') {
    const tipY = H - BOT + (TOUCH ? 22 : 30);
    g.fillStyle = css(C.moon, Math.min(0.72, (now - tipShown) * 1.4)); g.font = `${small ? 13 : 15}px ${FONT}`;
    const lines = wrapText(lv.tip, W / 2, tipY, Math.min(W - 40, 720), small ? 18 : 21);
    if (!TOUCH && li < 2 && lines === 1 && W >= 520) {
      g.fillStyle = css(C.moon, 0.38); g.font = `13px ${FONT}`;
      g.fillText('← → 走　↑ ↓ 爬梯子　E 拉　空格 等一步　Z 退一步　R 重来', W / 2, H - 22);
    }
  } else {
    const a = clamp((now - statusT - (status === 'win' ? 0.5 : 0.35)) * 2.5, 0, 1), dead = status === 'dead', lastLv = li === LEVELS.length - 1;
    if (dead) { g.fillStyle = css(C.ink, 0.42 * a); g.fillRect(0, 0, W, H - BOT); }
    const msg = dead ? '被抓住了' : lastLv ? '五关都走出来了' : '走出去了';
    g.font = `${small ? 22 : 26}px ${FONT}`; g.fillStyle = css(dead ? mix(C.moon, C.danger, 0.4) : C.moon, a);
    const tw = g.measureText(msg).width, pw = dead ? 272 : 170, stack = W < tw + pw + 80, cy = H - BOT / 2 - (TOUCH ? 10 : 0);
    const tx = stack ? W / 2 : W / 2 - (pw + 28) / 2, px = stack ? W / 2 : W / 2 + (tw + 28) / 2, py = stack ? cy + 26 : cy;
    g.fillText(msg, tx, stack ? cy - 30 : cy);
    if (a >= 1) {
      if (dead) { pill(px - 71, py, 130, '退一步', undo); pill(px + 71, py, 130, '重来', restart); }
      else pill(px, py, 170, lastLv ? '从头再玩' : '下一关  →', nextLevel);
    }
  }

  // 触屏按钮
  if (TOUCH && status === 'play') {
    const r = Math.min(30, W / 13), y2 = H - r - 18, y1 = y2 - r * 2.3;
    button(r + 18, y2, r, arrow('L'), () => act('L'));
    button(r * 3.4 + 18, y2, r, arrow('R'), () => act('R'));
    button(W - r - 18, y1, r, arrow('U'), () => act('U'));
    button(W - r - 18, y2, r, arrow('D'), () => act('D'));
    const onLever = '12'.includes(T(lv, cur.px, cur.py));
    button(W - r * 3.4 - 18, y2, r, '拉', () => act('E'), { hi: onLever, size: 17 });
    button(W - r * 3.4 - 18, y1, r * 0.85, '等', () => act('W'), { size: 15 });
  }
}
function pill(x, y, w, label, fn) {
  rr(x - w / 2, y - 21, w, 42, 21); g.fillStyle = css(C.moon, 0.1); g.fill();
  g.strokeStyle = css(C.moon, 0.5); g.lineWidth = 1.3; g.stroke();
  g.fillStyle = css(C.moon, 0.96); g.font = `16px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, x, y + 1);
  ui.push({ x, y, r: w / 2, fn });
}
function wrapText(text, x, y, maxW, lh) {
  const lines = []; let line = '';
  for (const ch of text) { if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch; }
  lines.push(line);
  lines.forEach((l, i) => g.fillText(l, x, y + i * lh));
  return lines.length;
}

// ---------- 输入 ----------
cv.addEventListener('pointerdown', e => {
  audio();
  for (let i = ui.length - 1; i >= 0; i--) { const u = ui[i]; if (Math.hypot(e.clientX - u.x, e.clientY - u.y) <= u.r) { u.fn(); return; } }
});
let lastKey = 0;
addEventListener('keydown', e => {
  audio();
  const k = e.key.toLowerCase(), now = performance.now();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  if (k === 'z' || k === 'backspace') return undo();
  if (k === 'r') return restart();
  if (k === 'm') { muted = !muted; store.set('lamplight.mute', muted); return; }
  if (status === 'win' && (k === 'enter' || k === ' ' || k === 'e')) return nextLevel();
  const map = { arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R', arrowup: 'U', w: 'U', arrowdown: 'D', s: 'D', e: 'E', f: 'E', enter: 'E', ' ': 'W', '.': 'W' };
  if (!map[k]) return;
  if (e.repeat && now - lastKey < 150) return;
  lastKey = now;
  act(map[k]);
});

const qs = new URLSearchParams(location.search);
load(qs.has('level') ? +qs.get('level') - 1 : clamp(+progress.at || 0, 0, maxUnlocked()));
requestAnimationFrame(frame);
window.__lamp = { step, solve, parseLevel, LEVELS, act, load, get cur() { return cur; }, get lv() { return lv; }, get status() { return status; }, get geo() { return { S, camX, camY, x: pView.x, y: pView.y, FEET }; } };
</script>
