<script id="core">
// 地图字符（侧面剖开的房子，一格一格的）
//   #  墙 / 地板      .  空的      H  梯子      E  出口
//   1 2  拉杆（拉一下，同一组的灯开 / 关）
//   L  一直亮着的灯   A a  第一组的灯（大写开着，小写关着）   B b  第二组
//   _  踏板（上面有东西压着，所有铁门就开）   G  铁门   g  地板上的铁盖子（下面接梯子）
//   P  玩家
//   x  扑影：和你在同一层、中间没墙时，一步一步朝你过来。被照到变成衣柜
//   m  学影：你左右走一步，它也朝同一边走一步。被照到变成椅子
//   w W  游影：一直来回走（w 先往右，W 先往左），碰到墙掉头。被照到变成座钟
// 灯照亮它下面左右各两格、往下三格（墙挡光）。影子站在亮处就变成家具，不动；回到暗处又醒过来。
// 家具挡路，但可以踩上去。被醒着的影子碰到就输。
const LEVELS = [
  { name: '灯', tip: '影子怕光：被灯照到就变成家具。站到拉杆上按 E（拉）开灯。家具可以踩上去翻过去。', map: [
    '############',
    '#.....a....#',
    '#P1......x.E',
    '############',
  ]},
  { name: '时机', tip: '踏板被压住，铁门才开。什么东西压都行。空格是原地等一步。', map: [
    '################',
    '#.........a....#',
    'E.GG.1P..._...x#',
    '################',
  ]},
  { name: '学舌', tip: '它学你走路：你往哪边走，它也往哪边走。它被墙挡住时，你们就错开了。爬梯子它不学。', map: [
    '##############',
    '#.m..._.#..E.#',
    '##########g###',
    '#.........H..#',
    '#P........H..#',
    '##############',
  ]},
  { name: '叫醒', tip: '关了灯，家具会醒过来。', map: [
    '#################',
    '#..A.......b....#',
    '#.x....1.P._.2GGE',
    '#################',
  ]},
  { name: '台阶', tip: '出口在高处，够不着。', map: [
    '################',
    '#......1.P.....#',
    '#########H######',
    '######...H.a..E#',
    '######..mH...###',
    '################',
  ]},
];

const LIGHT_W = 2, LIGHT_D = 3;

function parseLevel(def) {
  const map = def.map, h = map.length, w = Math.max(...map.map(r => r.length));
  const tiles = [], lamps = [], mons = [], plates = [];
  let px = 0, py = 0, bits = 0;
  for (let r = 0; r < h; r++) {
    const row = [];
    for (let c = 0; c < w; c++) {
      const ch = map[r][c] || '#';
      let t = '.';
      if ('#HGgE12_'.includes(ch)) t = ch;
      else if (ch === 'L') lamps.push({ c, r, grp: 0 });
      else if (ch === 'A' || ch === 'a') { lamps.push({ c, r, grp: 1 }); if (ch === 'A') bits |= 1; }
      else if (ch === 'B' || ch === 'b') { lamps.push({ c, r, grp: 2 }); if (ch === 'B') bits |= 2; }
      else if (ch === 'P') { px = c; py = r; }
      else if (ch === 'x' || ch === 'm') mons.push({ t: ch, x: c, y: r, d: 0 });
      else if (ch === 'w' || ch === 'W') mons.push({ t: 'w', x: c, y: r, d: ch === 'w' ? 1 : -1 });
      if (t === '_') plates.push({ c, r });
      row.push(t);
    }
    tiles.push(row);
  }
  const lv = { w, h, tiles, lamps, plates, name: def.name, tip: def.tip, start: { px, py, lamps: bits, mons } };
  for (const l of lamps) l.cells = lampCells(lv, l);
  return lv;
}

const T = (lv, c, r) => (c < 0 || r < 0 || c >= lv.w || r >= lv.h ? '#' : lv.tiles[r][c]);
const K = (x, y) => x + ',' + y;

// 一盏灯照得到哪些格子：下面左右各两格、往下三格，墙挡光
function lampCells(lv, l) {
  const out = [];
  for (let dr = 0; dr <= LIGHT_D; dr++) for (let dc = -LIGHT_W; dc <= LIGHT_W; dc++) {
    const c = l.c + dc, r = l.r + dr;
    if (T(lv, c, r) === '#') continue;
    const x0 = l.c + 0.5, y0 = l.r + 0.3, x1 = c + 0.5, y1 = r + 0.5;
    let clear = true;
    for (let i = 1; i < 24 && clear; i++) {
      const t = i / 24, sx = Math.floor(x0 + (x1 - x0) * t), sy = Math.floor(y0 + (y1 - y0) * t);
      if ((sx !== c || sy !== r) && T(lv, sx, sy) === '#') clear = false;
    }
    if (clear) out.push(K(c, r));
  }
  return out;
}
const lampOn = (l, s) => l.grp === 0 || ((s.lamps >> (l.grp - 1)) & 1) === 1;
function litSet(lv, s) {
  const set = new Set();
  for (const l of lv.lamps) if (lampOn(l, s)) for (const k of l.cells) set.add(k);
  return set;
}
const gatesOpen = (lv, s) => lv.plates.some(p => (s.px === p.c && s.py === p.r) || s.mons.some(m => m.x === p.c && m.y === p.r));
function blocked(lv, c, r, open) { const t = T(lv, c, r); return t === '#' || ((t === 'G' || t === 'g') && !open); }
function supported(lv, s, lit, c, r, open, self) {
  const t = T(lv, c, r);
  if (t === 'H' || t === 'g') return true;
  const b = T(lv, c, r + 1);
  if (b === '#' || b === 'H' || b === 'g' || (b === 'G' && !open)) return true;
  return s.mons.some(m => m !== self && m.x === c && m.y === r + 1 && lit.has(K(m.x, m.y)));
}
function clearRow(lv, a, b, y, open) {
  const d = Math.sign(b - a);
  for (let x = a + d; x !== b; x += d) if (blocked(lv, x, y, open)) return false;
  return true;
}
// 扑影这一步会不会朝你过来（画面上用来把它的眼睛画红）
function lurkerSees(lv, s, m, lit) {
  return m.t === 'x' && !lit.has(K(m.x, m.y)) && m.y === s.py && m.x !== s.px && clearRow(lv, m.x, s.px, m.y, gatesOpen(lv, s));
}

// 走一个回合。act：L R 左右，U D 上下梯子，E 拉拉杆，W 原地等。走不了返回 null
function step(lv, s, act) {
  const n = { px: s.px, py: s.py, lamps: s.lamps, mons: s.mons.map(m => ({ t: m.t, x: m.x, y: m.y, d: m.d })) };
  const ev = [];
  let lit = litSet(lv, n), open = gatesOpen(lv, n), pdx = 0;
  const activeAt = (x, y) => n.mons.find(m => m.x === x && m.y === y && !lit.has(K(x, y)));
  const furnAt = (x, y) => n.mons.find(m => m.x === x && m.y === y && lit.has(K(x, y)));
  const dead = why => ({ s: n, dead: true, why, ev });

  if (act === 'L' || act === 'R') {
    const dx = act === 'L' ? -1 : 1, tx = n.px + dx;
    if (blocked(lv, tx, n.py, open)) return null;
    if (furnAt(tx, n.py)) { // 踩到家具上去
      if (blocked(lv, tx, n.py - 1, open) || blocked(lv, n.px, n.py - 1, open) || n.mons.some(m => m.x === tx && m.y === n.py - 1)) return null;
      n.px = tx; n.py--; ev.push('climb');
    } else {
      n.px = tx; ev.push('step');
      if (activeAt(n.px, n.py)) return dead('walk');
    }
    pdx = dx;
  } else if (act === 'U' || act === 'D') {
    const dy = act === 'U' ? -1 : 1;
    const t = T(lv, n.px, act === 'U' ? n.py : n.py + 1);
    if (t !== 'H' && t !== 'g') return null;
    if (blocked(lv, n.px, n.py + dy, open)) return null;
    n.py += dy; ev.push('ladder');
    if (activeAt(n.px, n.py)) return dead('walk');
  } else if (act === 'E') {
    const t = T(lv, n.px, n.py);
    if (t !== '1' && t !== '2') return null;
    n.lamps ^= t === '1' ? 1 : 2; ev.push('lever');
    lit = litSet(lv, n);
  } else if (act !== 'W') return null;

  // 脚下没东西就掉下去（站着的家具醒了也会掉）
  open = gatesOpen(lv, n);
  let fell = 0;
  while (!supported(lv, n, lit, n.px, n.py, open, null)) {
    n.py++; fell++;
    if (n.py >= lv.h || activeAt(n.px, n.py)) return dead('fall');
  }
  if (fell) ev.push('fall');

  // 影子走一步（亮处的不动）
  for (const m of n.mons) {
    if (lit.has(K(m.x, m.y))) continue;
    open = gatesOpen(lv, n);
    let tx = m.x;
    if (m.t === 'x') { if (m.y === n.py && m.x !== n.px && clearRow(lv, m.x, n.px, m.y, open)) tx = m.x + Math.sign(n.px - m.x); }
    else if (m.t === 'm') tx = m.x + pdx;
    else if (m.t === 'w') tx = m.x + m.d;
    if (tx === m.x) continue;
    const ok = !blocked(lv, tx, m.y, open) && !n.mons.some(o => o !== m && o.x === tx && o.y === m.y) && supported(lv, n, lit, tx, m.y, open, m);
    if (!ok) { if (m.t === 'w') m.d = -m.d; continue; }
    m.x = tx;
    if (m.x === n.px && m.y === n.py) return dead('caught');
  }
  if (activeAt(n.px, n.py)) return dead('caught');
  return { s: n, dead: false, win: T(lv, n.px, n.py) === 'E', ev };
}

const skey = s => s.px + ',' + s.py + ',' + s.lamps + '|' + s.mons.map(m => m.x + ',' + m.y + ',' + m.d).join(';');
// 从 from 开始一步一步往外搜，找最短的走法
function solve(lv, from, limit = 300000, acts = 'LRUDEW') {
  const start = from || lv.start, sk = skey(start);
  const prev = new Map([[sk, null]]), q = [start];
  for (let head = 0; head < q.length && prev.size < limit; head++) {
    const s = q[head], k0 = skey(s);
    for (const a of acts) {
      const r = step(lv, s, a);
      if (!r || r.dead) continue;
      const k = skey(r.s);
      if (prev.has(k)) continue;
      prev.set(k, [k0, a]);
      if (r.win) {
        const path = [];
        for (let cur = k; prev.get(cur); cur = prev.get(cur)[0]) path.unshift(prev.get(cur)[1]);
        return { path, states: prev.size };
      }
      q.push(r.s);
    }
  }
  return { path: null, states: prev.size };
}
</script>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const WARM = [255, 196, 120];
const GRP = { 1: [255, 184, 77], 2: [95, 212, 196] };
const TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const progress = store.get('lamplight.v1', { cleared: [], at: 0 });
if (!Array.isArray(progress.cleared)) progress.cleared = [];
let muted = store.get('lamplight.mute', false);
const maxUnlocked = () => Math.min(LEVELS.length - 1, Math.max(-1, ...progress.cleared) + 2);

// ---------- 声音 ----------
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t, dur, gain, type = 'sine', f2) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(gain, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v); v.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(t, dur, gain, freq, q = 1, type = 'bandpass') {
  if (!AC || muted) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), v = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  v.gain.setValueAtTime(gain, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(v); v.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const sfx = {
  step() { if (!audio()) return; const t = AC.currentTime; noise(t, 0.07, 0.12, 500 + Math.random() * 300, 2); tone(90, t, 0.06, 0.05); },
  ladder() { if (!audio()) return; const t = AC.currentTime; tone(320, t, 0.07, 0.05, 'triangle', 260); noise(t, 0.05, 0.06, 1400, 3); },
  lever() { if (!audio()) return; const t = AC.currentTime; tone(1800, t, 0.03, 0.06, 'square', 900); tone(220, t + 0.02, 0.12, 0.08, 'sine', 120); noise(t, 0.04, 0.1, 3000, 2); },
  freeze() { if (!audio()) return; const t = AC.currentTime; tone(130, t, 0.35, 0.18, 'sine', 70); noise(t, 0.25, 0.14, 400, 1, 'lowpass'); tone(523, t + 0.02, 0.6, 0.025, 'sine'); },
  wake() { if (!audio()) return; const t = AC.currentTime; tone(240, t, 0.5, 0.05, 'sawtooth', 70); noise(t, 0.45, 0.06, 250, 4); },
  gate() { if (!audio()) return; const t = AC.currentTime; noise(t, 0.35, 0.08, 2400, 6); tone(180, t, 0.2, 0.04, 'triangle', 140); },
  caught() { if (!audio()) return; const t = AC.currentTime; [55, 58.3, 82.4].forEach(f => tone(f, t, 1.4, 0.12, 'sawtooth', f * 0.7)); noise(t, 0.9, 0.12, 180, 1, 'lowpass'); },
  win() { if (!audio()) return; const t = AC.currentTime; [392, 493.9, 587.3, 784].forEach((f, i) => { tone(f, t + i * 0.11, 1.8, 0.07, 'triangle'); tone(f / 2, t + i * 0.11, 1.8, 0.03); }); },
  undo() { if (!audio()) return; const t = AC.currentTime; tone(600, t, 0.08, 0.04, 'triangle', 380); },
  bump() { if (!audio()) return; const t = AC.currentTime; tone(110, t, 0.08, 0.06, 'sine', 80); },
};

// ---------- 游戏状态 ----------
let li = 0, lv, cur, hist, status = 'play', statusT = 0, deadWhy = '';
let pView, mView, gateView = 0, parts = [], shake = 0, tipShown = 0;

function load(i) {
  li = clamp(i, 0, LEVELS.length - 1);
  lv = parseLevel(LEVELS[li]);
  cur = { px: lv.start.px, py: lv.start.py, lamps: lv.start.lamps, mons: lv.start.mons.map(m => ({ ...m })) };
  hist = []; status = 'play'; parts = []; tipShown = performance.now() / 1000;
  const lit = litSet(lv, cur);
  pView = { x: cur.px, y: cur.py, fx: cur.px, fy: cur.py, t: 1, face: 1, walk: 0 };
  mView = cur.mons.map(m => ({ x: m.x, y: m.y, fx: m.x, fy: m.y, f: lit.has(K(m.x, m.y)) ? 1 : 0, face: m.d || -1 }));
  gateView = gatesOpen(lv, cur) ? 1 : 0;
  progress.at = li; store.set('lamplight.v1', progress);
  layout(true);
}

function act(a) {
  if (status === 'win') { if (a === 'E' || a === 'W') nextLevel(); return; }
  if (status === 'dead') return;
  const r = step(lv, cur, a);
  if (!r) { if (a === 'L' || a === 'R') { pView.face = a === 'L' ? -1 : 1; } sfx.bump(); shake = 0.12; return; }
  const before = cur, litB = litSet(lv, before), openB = gatesOpen(lv, before);
  hist.push(before);
  cur = r.s;
  // 画面：从原来的位置滑过去
  const now = performance.now() / 1000;
  pView.fx = pView.x; pView.fy = pView.y; pView.t = 0; pView.t0 = now;
  if (a === 'L') pView.face = -1; if (a === 'R') pView.face = 1;
  if (r.ev.includes('step') || r.ev.includes('climb')) pView.walk++;
  mView.forEach((v, i) => { v.fx = v.x; v.fy = v.y; const m = cur.mons[i]; if (m.x !== before.mons[i].x) v.face = Math.sign(m.x - before.mons[i].x); });
  // 声音
  if (r.ev.includes('lever')) sfx.lever();
  else if (r.ev.includes('ladder')) sfx.ladder();
  else if (r.ev.includes('step') || r.ev.includes('climb')) sfx.step();
  const litA = litSet(lv, cur);
  let froze = false, woke = false;
  cur.mons.forEach((m, i) => {
    const was = litB.has(K(before.mons[i].x, before.mons[i].y)), is = litA.has(K(m.x, m.y));
    if (!was && is) froze = true; if (was && !is) woke = true;
  });
  if (froze) setTimeout(sfx.freeze, 90);
  if (woke) setTimeout(sfx.wake, 60);
  if (gatesOpen(lv, cur) !== openB) setTimeout(sfx.gate, 80);
  if (r.dead) { status = 'dead'; statusT = now; deadWhy = r.why; setTimeout(sfx.caught, 120); shake = 0.35; }
  else if (r.win) {
    status = 'win'; statusT = now; setTimeout(sfx.win, 150);
    if (!progress.cleared.includes(li)) progress.cleared.push(li);
    store.set('lamplight.v1', progress);
  }
}
function undo() {
  if (!hist.length) return;
  cur = hist.pop(); status = 'play'; sfx.undo();
  snapViews();
}
function restart() {
  if (!hist.length) return;
  hist.push(cur);
  cur = { px: lv.start.px, py: lv.start.py, lamps: lv.start.lamps, mons: lv.start.mons.map(m => ({ ...m })) };
  status = 'play'; sfx.undo(); snapViews();
}
function snapViews() {
  const now = performance.now() / 1000;
  pView.fx = pView.x; pView.fy = pView.y; pView.t = 0; pView.t0 = now;
  mView.forEach(v => { v.fx = v.x; v.fy = v.y; });
}
function nextLevel() { load(li < LEVELS.length - 1 ? li + 1 : 0); }

// ---------- 版面 ----------
let W = 0, H = 0, DPR = 1, S = 64, TOP = 90, BOT = 100, camX = 0, camY = 0, viewW = 0, viewH = 0, ui = [];
let staticLayer = null;
function layout(snap) {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const small = W < 600 || H < 500;
  TOP = small ? 64 : 96; BOT = TOUCH ? (H > W ? 190 : 120) : (small ? 76 : 96);
  viewW = W - 24; viewH = H - TOP - BOT;
  S = Math.floor(clamp(Math.min(viewW / lv.w, viewH / lv.h), TOUCH ? 34 : 30, 76));
  // 手机竖着拿：放大一些，镜头跟着人左右走
  if (TOUCH && H > W) S = Math.floor(clamp(Math.min(viewH / lv.h, W / 7.5), 40, 64));
  buildStatic();
  if (snap) { camX = targetCam().x; camY = targetCam().y; }
}
addEventListener('resize', () => layout(true));
function targetCam() {
  const mw = lv.w * S, mh = lv.h * S;
  const x = mw <= viewW ? -(W - mw) / 2 : clamp((pView.x + 0.5) * S - W / 2, -12, mw - W + 12);
  const y = mh <= viewH ? -(TOP + (viewH - mh) / 2) : clamp((pView.y + 0.5) * S - (TOP + viewH / 2), -TOP, mh - TOP - viewH);
  return { x, y };
}

// 不会变的东西（墙、墙纸、梯子、出口的门框）画一次
function buildStatic() {
  staticLayer = document.createElement('canvas');
  staticLayer.width = Math.ceil(lv.w * S * DPR); staticLayer.height = Math.ceil(lv.h * S * DPR);
  const b = staticLayer.getContext('2d'); b.scale(DPR, DPR);
  const air = (c, r) => T(lv, c, r) !== '#';
  for (let r = 0; r < lv.h; r++) for (let c = 0; c < lv.w; c++) {

    g.translate(x, base); g.scale(1, 0.7 + 0.3 * f); g.translate(-x, -base);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(x, base - 1, 20 * k, 3.5 * k, 0, 0, 7); g.fill();
    const wood = (y0, y1) => { const gr = g.createLinearGradient(x - 20 * k, y0, x + 20 * k, y1); gr.addColorStop(0, '#8a5d3d'); gr.addColorStop(1, '#5e3c27'); return gr; };
    g.strokeStyle = '#2d1d14'; g.lineWidth = 1.5 * k;
    if (m.t === 'x') { // 衣柜
      const w = 40 * k, h = 58 * k, x0 = x - w / 2, y0 = base - h;
      rr(x0, y0 + 4 * k, w, h - 4 * k, 2 * k); g.fillStyle = wood(y0, base); g.fill(); g.stroke();
      rr(x0 - 2 * k, y0, w + 4 * k, 6 * k, 2 * k); g.fillStyle = '#6e4a31'; g.fill(); g.stroke();
      g.beginPath(); g.moveTo(x, y0 + 8 * k); g.lineTo(x, base - 4 * k); g.stroke();
      g.fillStyle = '#d8b06a'; g.beginPath(); g.arc(x - 3 * k, y0 + 30 * k, 1.6 * k, 0, 7); g.arc(x + 3 * k, y0 + 30 * k, 1.6 * k, 0, 7); g.fill();
      sleepEyes(x, y0 + 18 * k, k);
    } else if (m.t === 'm') { // 高背椅
      const y0 = base - 56 * k;
      rr(x - 11 * k, y0, 22 * k, 30 * k, 4 * k); g.fillStyle = wood(y0, base); g.fill(); g.stroke();
      rr(x - 15 * k, base - 26 * k, 30 * k, 6 * k, 2 * k); g.fillStyle = '#7a5134'; g.fill(); g.stroke();
      g.lineWidth = 3 * k; g.strokeStyle = '#4e3221';
      g.beginPath(); g.moveTo(x - 12 * k, base - 20 * k); g.lineTo(x - 13 * k, base); g.moveTo(x + 12 * k, base - 20 * k); g.lineTo(x + 13 * k, base); g.stroke();
      sleepEyes(x, y0 + 12 * k, k);
    } else { // 座钟
      const w = 22 * k, h = 60 * k, y0 = base - h;
      rr(x - w / 2, y0, w, h, 3 * k); g.fillStyle = wood(y0, base); g.fill(); g.stroke();
      g.beginPath(); g.arc(x, y0 + 12 * k, 7 * k, 0, 7); g.fillStyle = '#e8dcc0'; g.fill(); g.stroke();
      g.strokeStyle = '#2d1d14'; g.beginPath(); g.moveTo(x, y0 + 12 * k); g.lineTo(x + 3 * k, y0 + 9 * k); g.moveTo(x, y0 + 12 * k); g.lineTo(x - 2 * k, y0 + 15 * k); g.stroke();
      rr(x - 6 * k, y0 + 26 * k, 12 * k, 26 * k, 2 * k); g.fillStyle = '#2b1c13'; g.fill();
      const sw = Math.sin(now * 3) * 3 * k * 0; g.fillStyle = '#d8b06a'; g.beginPath(); g.arc(x + sw, y0 + 46 * k, 2.5 * k, 0, 7); g.fill();
      sleepEyes(x, y0 + 21 * k, k, 0.6);
    }
    g.restore();
  }
}
function sleepEyes(x, y, k, s = 1) {
  g.strokeStyle = 'rgba(30,18,10,0.55)'; g.lineWidth = 1.3 * k;
  for (const d of [-5, 5]) { g.beginPath(); g.arc(x + d * k * s, y, 2.6 * k * s, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
}

// ---------- 界面 ----------
function button(x, y, r, label, fn, opts = {}) {
  g.beginPath(); g.arc(x, y, r, 0, 7);
  g.fillStyle = opts.hi ? 'rgba(255,220,160,0.16)' : 'rgba(200,190,230,0.08)'; g.fill();
  g.strokeStyle = opts.hi ? 'rgba(255,220,160,0.6)' : 'rgba(220,210,240,0.25)'; g.lineWidth = 1.2; g.stroke();
  g.save(); g.strokeStyle = g.fillStyle = 'rgba(240,232,250,0.88)'; g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round';
  if (typeof label === 'function') label(x, y);
  else { g.font = `${opts.size || 16}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, x, y + 1); }
  g.restore();
  ui.push({ x, y, r: r + 4, fn });
}
const arrow = d => (x, y) => {
  const a = { L: Math.PI, R: 0, U: -Math.PI / 2, D: Math.PI / 2 }[d];
  g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.moveTo(-6, -9); g.lineTo(5, 0); g.lineTo(-6, 9); g.lineWidth = 3; g.stroke(); g.restore();
};

function drawUI(now) {
  const small = W < 600 || H < 500, L = 16, R = W - 16;
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = 'rgba(220,205,240,0.5)'; g.font = `${small ? 12 : 15}px ${FONT}`;
  g.fillText(`第 ${li + 1} 关`, L, small ? 24 : 40);
  g.fillStyle = 'rgba(250,240,255,0.92)'; g.font = `${small ? 20 : 28}px ${FONT}`;
  g.fillText(lv.name, L, small ? 50 : 74);

  const by = small ? 32 : 50;
  button(R - 20, by, 19, (x, y) => {
    g.lineWidth = 1.6; g.beginPath(); g.moveTo(x - 8, y - 3); g.lineTo(x - 4, y - 3); g.lineTo(x + 1, y - 8); g.lineTo(x + 1, y + 8); g.lineTo(x - 4, y + 3); g.lineTo(x - 8, y + 3); g.closePath(); g.stroke();
    if (muted) { g.beginPath(); g.moveTo(x + 5, y - 4); g.lineTo(x + 11, y + 4); g.moveTo(x + 11, y - 4); g.lineTo(x + 5, y + 4); g.stroke(); }
    else { g.beginPath(); g.arc(x + 2, y, 5, -0.9, 0.9); g.stroke(); g.beginPath(); g.arc(x + 2, y, 9, -0.9, 0.9); g.stroke(); }
  }, () => { muted = !muted; store.set('lamplight.mute', muted); });
  button(R - 66, by, 19, (x, y) => { g.beginPath(); g.arc(x, y, 8, -1.2, 4.3); g.stroke(); g.beginPath(); g.moveTo(x + 2, y - 11); g.lineTo(x + 4, y - 7); g.lineTo(x - 0.5, y - 5); g.stroke(); }, restart);
  button(R - 112, by, 19, (x, y) => { g.beginPath(); g.arc(x + 1, y + 1, 8, Math.PI * 1.1, Math.PI * 2.4); g.stroke(); g.beginPath(); g.moveTo(x - 9, y - 6); g.lineTo(x - 7, y + 1); g.lineTo(x - 1, y - 2); g.stroke(); }, undo, { hi: status === 'dead' });

  // 关卡点
  const dy = TOP - (small ? 10 : 14), mx = maxUnlocked(), dx0 = W / 2 - (LEVELS.length - 1) * 12;
  if (!small || W > 420) for (let i = 0; i < LEVELS.length; i++) {
    const x = dx0 + i * 24, open = i <= mx, done = progress.cleared.includes(i), c = i === li;
    g.beginPath(); g.arc(x, small ? 32 : 50, c ? 5.5 : 4, 0, 7);
    g.fillStyle = c ? 'rgba(255,225,170,0.95)' : done ? 'rgba(220,205,240,0.6)' : open ? 'rgba(220,205,240,0.22)' : 'rgba(220,205,240,0.07)';
    g.fill();
    if (open && !c) ui.push({ x, y: small ? 32 : 50, r: 12, fn: () => load(i) });
  }

  // 下面的提示
  const tipY = H - BOT + (TOUCH ? 22 : 30);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = `rgba(230,220,245,${Math.min(0.7, (now - tipShown) * 1.4)})`; g.font = `${small ? 13 : 15}px ${FONT}`;
  wrapText(lv.tip, W / 2, tipY, Math.min(W - 40, 720), small ? 18 : 21);
  if (!TOUCH && li < 2) {
    g.fillStyle = 'rgba(220,205,240,0.38)'; g.font = `13px ${FONT}`;
    g.fillText('← → 走　↑ ↓ 爬梯子　E 拉　空格 等一步　Z 退一步　R 重来', W / 2, H - 22);
  }

  // 触屏按钮
  if (TOUCH && status === 'play') {
    const r = Math.min(30, W / 13), y2 = H - r - 18, y1 = y2 - r * 2.3;
    button(r + 18, y2, r, arrow('L'), () => act('L'));
    button(r * 3.4 + 18, y2, r, arrow('R'), () => act('R'));
    button(W - r - 18, y1, r, arrow('U'), () => act('U'));
    button(W - r - 18, y2, r, arrow('D'), () => act('D'));
    const onLever = '12'.includes(T(lv, cur.px, cur.py));
    button(W - r * 3.4 - 18, y2, r, '拉', () => act('E'), { hi: onLever, size: 17 });
    button(W - r * 3.4 - 18, y1, r * 0.85, '等', () => act('W'), { size: 15 });
  }

  // 输了 / 过关
  if (status !== 'play') {
    const a = Math.min(1, (now - statusT - (status === 'win' ? 0.5 : 0.35)) * 2.5);
    if (a > 0) {
      g.fillStyle = status === 'dead' ? `rgba(10,0,6,${0.55 * a})` : `rgba(30,20,8,${0.35 * a})`; g.fillRect(0, 0, W, H);
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = status === 'dead' ? `rgba(255,200,200,${a})` : `rgba(255,236,200,${a})`; g.font = `${small ? 26 : 34}px ${FONT}`;
      const last = li === LEVELS.length - 1;
      g.fillText(status === 'dead' ? '被抓住了' : last ? '五关都走出来了' : '走出去了', W / 2, H / 2 - 30);
      if (a >= 1) {
        if (status === 'dead') {
          pill(W / 2 - 80, H / 2 + 30, 140, '退一步', undo);
          pill(W / 2 + 80, H / 2 + 30, 140, '重来', restart);
        } else pill(W / 2, H / 2 + 30, 170, last ? '从头再玩' : '下一关  →', nextLevel);
      }
    }
  }
}
function pill(x, y, w, label, fn) {
  rr(x - w / 2, y - 22, w, 44, 22); g.fillStyle = 'rgba(255,236,200,0.1)'; g.fill();
  g.strokeStyle = 'rgba(255,236,200,0.5)'; g.lineWidth = 1.3; g.stroke();
  g.fillStyle = 'rgba(255,244,225,0.95)'; g.font = `16px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, x, y + 1);
  ui.push({ x, y, r: w / 2, fn });
}
function wrapText(text, x, y, maxW, lh) {
  const lines = []; let line = '';
  for (const ch of text) { if (g.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; } else line += ch; }
  lines.push(line);
  lines.forEach((l, i) => g.fillText(l, x, y + i * lh));
}

// ---------- 输入 ----------
cv.addEventListener('pointerdown', e => {
  audio();
  for (let i = ui.length - 1; i >= 0; i--) { const u = ui[i]; if (Math.hypot(e.clientX - u.x, e.clientY - u.y) <= u.r) { u.fn(); return; } }
});
let lastKey = 0;
addEventListener('keydown', e => {
  audio();
  const k = e.key.toLowerCase(), now = performance.now();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  if (k === 'z' || k === 'backspace') return undo();
  if (k === 'r') return restart();
  if (k === 'm') { muted = !muted; store.set('lamplight.mute', muted); return; }
  if (status === 'win' && (k === 'enter' || k === ' ' || k === 'e')) return nextLevel();
  const map = { arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R', arrowup: 'U', w: 'U', arrowdown: 'D', s: 'D', e: 'E', f: 'E', enter: 'E', ' ': 'W', '.': 'W' };
  if (!map[k]) return;
  if (e.repeat && now - lastKey < 150) return;
  lastKey = now;
  act(map[k]);
});

const qs = new URLSearchParams(location.search);
load(qs.has('level') ? +qs.get('level') - 1 : clamp(+progress.at || 0, 0, maxUnlocked()));
requestAnimationFrame(frame);
window.__lamp = { step, solve, parseLevel, LEVELS, act, load, get cur() { return cur; }, get lv() { return lv; }, get status() { return status; } };
</script>
