<script id="core">
// 地图字符（侧面剖开的房子，一格一格的）
//   #  墙 / 地板      .  空的      H  梯子      E  出口
//   1 2  拉杆（拉一下，同一组的灯开 / 关）
//   L  一直亮着的灯   A a  第一组的灯（大写开着，小写关着）   B b  第二组
//   _  踏板（上面有东西压着，所有铁门就开）   G  铁门   g  地板上的铁盖子（下面接梯子）
//   P  玩家
//   x  扑影：和你在同一层、中间没墙时，一步一步朝你过来。被照到变成衣柜
//   m  学影：你左右走一步，它也朝同一边走一步。被照到变成椅子
//   w W  游影：一直来回走（w 先往右，W 先往左），碰到墙掉头。被照到变成座钟
// 灯照亮它下面左右各两格、往下三格（墙挡光）。影子站在亮处就变成家具，不动；回到暗处又醒过来。
// 家具挡路，但可以踩上去。被醒着的影子碰到就输。
const LEVELS = [
  { name: '灯', tip: '影子怕光：被灯照到就变成家具。站到拉杆上按 E（拉）开灯。家具可以踩上去翻过去。', map: [
    '############',
    '#.....a....#',
    '#P1......x.E',
    '############',
  ]},
  { name: '时机', tip: '踏板被压住，铁门才开。什么东西压都行。空格是原地等一步。', map: [
    '################',
    '#.........a....#',
    'E.GG.1P..._...x#',
    '################',
  ]},
  { name: '学舌', tip: '它学你走路：你往哪边走，它也往哪边走。它被墙挡住时，你们就错开了。爬梯子它不学。', map: [
    '##############',
    '#.m..._.#..E.#',
    '##########g###',
    '#.........H..#',
    '#P........H..#',
    '##############',
  ]},
  { name: '叫醒', tip: '关了灯，家具会醒过来。', map: [
    '#################',
    '#..A.......b....#',
    '#.x....1.P._.2GGE',
    '#################',
  ]},
  { name: '台阶', tip: '出口在高处，够不着。', map: [
    '################',
    '#......1.P.....#',
    '#########H######',
    '######...H.a..E#',
    '######..mH...###',
    '################',
  ]},
];

const LIGHT_W = 2, LIGHT_D = 3;

function parseLevel(def) {
  const map = def.map, h = map.length, w = Math.max(...map.map(r => r.length));
  const tiles = [], lamps = [], mons = [], plates = [];
  let px = 0, py = 0, bits = 0;
  for (let r = 0; r < h; r++) {
    const row = [];
    for (let c = 0; c < w; c++) {
      const ch = map[r][c] || '#';
      let t = '.';
      if ('#HGgE12_'.includes(ch)) t = ch;
      else if (ch === 'L') lamps.push({ c, r, grp: 0 });
      else if (ch === 'A' || ch === 'a') { lamps.push({ c, r, grp: 1 }); if (ch === 'A') bits |= 1; }
      else if (ch === 'B' || ch === 'b') { lamps.push({ c, r, grp: 2 }); if (ch === 'B') bits |= 2; }
      else if (ch === 'P') { px = c; py = r; }
      else if (ch === 'x' || ch === 'm') mons.push({ t: ch, x: c, y: r, d: 0 });
      else if (ch === 'w' || ch === 'W') mons.push({ t: 'w', x: c, y: r, d: ch === 'w' ? 1 : -1 });
      if (t === '_') plates.push({ c, r });
      row.push(t);
    }
    tiles.push(row);
  }
  const lv = { w, h, tiles, lamps, plates, name: def.name, tip: def.tip, start: { px, py, lamps: bits, mons } };
  for (const l of lamps) l.cells = lampCells(lv, l);
  return lv;
}

const T = (lv, c, r) => (c < 0 || r < 0 || c >= lv.w || r >= lv.h ? '#' : lv.tiles[r][c]);
const K = (x, y) => x + ',' + y;

// 一盏灯照得到哪些格子：下面左右各两格、往下三格，墙挡光
function lampCells(lv, l) {
  const out = [];
  for (let dr = 0; dr <= LIGHT_D; dr++) for (let dc = -LIGHT_W; dc <= LIGHT_W; dc++) {
    const c = l.c + dc, r = l.r + dr;
    if (T(lv, c, r) === '#') continue;
    const x0 = l.c + 0.5, y0 = l.r + 0.3, x1 = c + 0.5, y1 = r + 0.5;
    let clear = true;
    for (let i = 1; i < 24 && clear; i++) {
      const t = i / 24, sx = Math.floor(x0 + (x1 - x0) * t), sy = Math.floor(y0 + (y1 - y0) * t);
      if ((sx !== c || sy !== r) && T(lv, sx, sy) === '#') clear = false;
    }
    if (clear) out.push(K(c, r));
  }
  return out;
}
const lampOn = (l, s) => l.grp === 0 || ((s.lamps >> (l.grp - 1)) & 1) === 1;
function litSet(lv, s) {
  const set = new Set();
  for (const l of lv.lamps) if (lampOn(l, s)) for (const k of l.cells) set.add(k);
  return set;
}
const gatesOpen = (lv, s) => lv.plates.some(p => (s.px === p.c && s.py === p.r) || s.mons.some(m => m.x === p.c && m.y === p.r));
function blocked(lv, c, r, open) { const t = T(lv, c, r); return t === '#' || ((t === 'G' || t === 'g') && !open); }
function supported(lv, s, lit, c, r, open, self) {
  const t = T(lv, c, r);
  if (t === 'H' || t === 'g') return true;
  const b = T(lv, c, r + 1);
  if (b === '#' || b === 'H' || b === 'g' || (b === 'G' && !open)) return true;
  return s.mons.some(m => m !== self && m.x === c && m.y === r + 1 && lit.has(K(m.x, m.y)));
}
function clearRow(lv, a, b, y, open) {
  const d = Math.sign(b - a);
  for (let x = a + d; x !== b; x += d) if (blocked(lv, x, y, open)) return false;
  return true;
}
// 扑影这一步会不会朝你过来（画面上用来把它的眼睛画红）
function lurkerSees(lv, s, m, lit) {
  return m.t === 'x' && !lit.has(K(m.x, m.y)) && m.y === s.py && m.x !== s.px && clearRow(lv, m.x, s.px, m.y, gatesOpen(lv, s));
}

// 走一个回合。act：L R 左右，U D 上下梯子，E 拉拉杆，W 原地等。走不了返回 null
function step(lv, s, act) {
  const n = { px: s.px, py: s.py, lamps: s.lamps, mons: s.mons.map(m => ({ t: m.t, x: m.x, y: m.y, d: m.d })) };
  const ev = [];
  let lit = litSet(lv, n), open = gatesOpen(lv, n), pdx = 0;
  const activeAt = (x, y) => n.mons.find(m => m.x === x && m.y === y && !lit.has(K(x, y)));
  const furnAt = (x, y) => n.mons.find(m => m.x === x && m.y === y && lit.has(K(x, y)));
  const dead = why => ({ s: n, dead: true, why, ev });

  if (act === 'L' || act === 'R') {
    const dx = act === 'L' ? -1 : 1, tx = n.px + dx;
    if (blocked(lv, tx, n.py, open)) return null;
    if (furnAt(tx, n.py)) { // 踩到家具上去
      if (blocked(lv, tx, n.py - 1, open) || blocked(lv, n.px, n.py - 1, open) || n.mons.some(m => m.x === tx && m.y === n.py - 1)) return null;
      n.px = tx; n.py--; ev.push('climb');
    } else {
      n.px = tx; ev.push('step');
      if (activeAt(n.px, n.py)) return dead('walk');
    }
    pdx = dx;
  } else if (act === 'U' || act === 'D') {
    const dy = act === 'U' ? -1 : 1;
    const t = T(lv, n.px, act === 'U' ? n.py : n.py + 1);
    if (t !== 'H' && t !== 'g') return null;
    if (blocked(lv, n.px, n.py + dy, open)) return null;
    n.py += dy; ev.push('ladder');
    if (activeAt(n.px, n.py)) return dead('walk');
  } else if (act === 'E') {
    const t = T(lv, n.px, n.py);
    if (t !== '1' && t !== '2') return null;
    n.lamps ^= t === '1' ? 1 : 2; ev.push('lever');
    lit = litSet(lv, n);
  } else if (act !== 'W') return null;

  // 脚下没东西就掉下去（站着的家具醒了也会掉）
  open = gatesOpen(lv, n);
  let fell = 0;
  while (!supported(lv, n, lit, n.px, n.py, open, null)) {
    n.py++; fell++;
    if (n.py >= lv.h || activeAt(n.px, n.py)) return dead('fall');
  }
  if (fell) ev.push('fall');

  // 影子走一步（亮处的不动）
  for (const m of n.mons) {
    if (lit.has(K(m.x, m.y))) continue;
    open = gatesOpen(lv, n);
    let tx = m.x;
    if (m.t === 'x') { if (m.y === n.py && m.x !== n.px && clearRow(lv, m.x, n.px, m.y, open)) tx = m.x + Math.sign(n.px - m.x); }
    else if (m.t === 'm') tx = m.x + pdx;
    else if (m.t === 'w') tx = m.x + m.d;
    if (tx === m.x) continue;
    const ok = !blocked(lv, tx, m.y, open) && !n.mons.some(o => o !== m && o.x === tx && o.y === m.y) && supported(lv, n, lit, tx, m.y, open, m);
    if (!ok) { if (m.t === 'w') m.d = -m.d; continue; }
    m.x = tx;
    if (m.x === n.px && m.y === n.py) return dead('caught');
  }
  if (activeAt(n.px, n.py)) return dead('caught');
  return { s: n, dead: false, win: T(lv, n.px, n.py) === 'E', ev };
}

const skey = s => s.px + ',' + s.py + ',' + s.lamps + '|' + s.mons.map(m => m.x + ',' + m.y + ',' + m.d).join(';');
// 从 from 开始一步一步往外搜，找最短的走法
function solve(lv, from, limit = 300000, acts = 'LRUDEW') {
  const start = from || lv.start, sk = skey(start);
  const prev = new Map([[sk, null]]), q = [start];
  for (let head = 0; head < q.length && prev.size < limit; head++) {
    const s = q[head], k0 = skey(s);
    for (const a of acts) {
      const r = step(lv, s, a);
      if (!r || r.dead) continue;
      const k = skey(r.s);
      if (prev.has(k)) continue;
      prev.set(k, [k0, a]);
      if (r.win) {
        const path = [];
        for (let cur = k; prev.get(cur); cur = prev.get(cur)[0]) path.unshift(prev.get(cur)[1]);
        return { path, states: prev.size };
      }
      q.push(r.s);
    }
  }
  return { path: null, states: prev.size };
}
</script>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

// ---------- 色表 ----------
// 画法只有一句话：暗处只有冷色的剪影，灯照到的地方才有颜色和细节。
//   · 暖光（灯）才算数：画出来照到哪儿，规则里就照到哪儿。冷光（月光、出口）只是好看，不算“照到”。
//   · 影子是整个画面里最黑的，主角是暗处最亮的。
//   · 不描边，没有脸：东西靠深浅和形状分开。
// 画面里所有的颜色都从下面这十几个调出来（mix 调深浅，css 加透明度），不在别处另写颜色。
const C = {
  // 冷的：夜里、屋外、没照到的地方
  night: [7, 10, 21],      // 夜空顶上，最深的冷色
  dusk: [27, 38, 70],      // 夜空靠地平线的地方，暗处东西的亮边
  moon: [203, 218, 255],   // 月光、出口、界面上的字
  mass: [6, 8, 14],        // 剖开的墙体和楼板
  room: [17, 23, 41],      // 没照到的房间
  ink: [2, 3, 8],          // 影子
  // 暖的：灯下
  lamp: [255, 196, 122],   // 灯光
  hot: [255, 244, 222],    // 灯泡的芯
  paper: [164, 92, 72],    // 墙纸
  panel: [58, 84, 80],     // 护墙板
  wood: [150, 100, 60],    // 地板、家具
  cream: [234, 226, 206],  // 主角的卫衣、钟面
  brass: [216, 170, 94],   // 黄铜、画框
  skin: [236, 196, 166],   // 主角的脸和手
  cloth: [62, 70, 94],     // 主角的裤子
  rug: [140, 46, 44],      // 地毯
  // 记号
  amber: [240, 170, 72],   // 第一组的拉杆和灯罩
  teal: [86, 196, 180],    // 第二组的拉杆和灯罩
  danger: [255, 84, 78],   // 扑影看见你时的眼睛
};
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, t) => mix(c, C.mass, t);   // 压暗
const tint = (c, t) => mix(c, C.hot, t);     // 提亮
const GRP = { 0: mix(C.dusk, C.moon, 0.3), 1: C.amber, 2: C.teal };

// 一间屋子的两套颜色：没照到的（冷的，只有深浅）和照到的（暖的，有颜色）
const DARK = {
  wall: C.room, shaft: mix(C.room, C.mass, 0.6), stripe: mix(C.room, C.dusk, 0.14), motif: C.room,
  panel: mix(C.room, C.mass, 0.3), rail: mix(C.room, C.dusk, 0.5), panelLine: mix(C.room, C.mass, 0.55), skirt: mix(C.room, C.mass, 0.6), cornice: mix(C.room, C.mass, 0.5),
  floor: mix(C.room, C.dusk, 0.45), seam: mix(C.room, C.mass, 0.4), floorEdge: mix(C.dusk, C.moon, 0.18), front: mix(C.room, C.mass, 0.5),
  frame: mix(C.room, C.dusk, 0.9), canvas: mix(C.room, C.dusk, 0.3), door: mix(C.dusk, C.moon, 0.1),
  ladder: mix(C.dusk, C.moon, 0.1), rung: mix(C.room, C.dusk, 0.8), wire: mix(C.room, C.dusk, 0.6), box: mix(C.dusk, C.moon, 0.1),
  rug: mix(C.room, C.mass, 0.35), rugLine: mix(C.room, C.dusk, 0.3),
};
const LIT = {
  wall: C.paper, shaft: shade(C.paper, 0.6), stripe: shade(C.paper, 0.1), motif: tint(C.paper, 0.2),
  panel: C.panel, rail: tint(C.panel, 0.25), panelLine: shade(C.panel, 0.3), skirt: shade(C.panel, 0.45), cornice: shade(C.paper, 0.4),
  floor: C.wood, seam: shade(C.wood, 0.45), floorEdge: tint(C.wood, 0.4), front: shade(C.wood, 0.4),
  frame: shade(C.brass, 0.12), canvas: tint(C.brass, 0.5), door: shade(C.wood, 0.3),
  ladder: tint(C.wood, 0.1), rung: shade(C.wood, 0.2), wire: shade(C.wood, 0.65), box: shade(C.wood, 0.5),
  rug: shade(C.rug, 0.08), rugLine: shade(C.cream, 0.42),
};

// ---------- 每一关墙上、地上摆的东西 ----------
// 手摆的，只是好看：都贴在墙上或者铺在地上，不占路。c、r 是格子坐标（可以带小数），指的是东西的中心。
const DECOR = [
  // 1 · 门厅
  [{ t: 'window', c: 1.5, r: 1.74 }, { t: 'picture', c: 3.45, r: 1.84, w: 0.42, h: 0.5, k: 'sea' }, { t: 'picture', c: 5.15, r: 1.82, w: 0.86, h: 0.54, k: 'hills' },
    { t: 'picture', c: 7.85, r: 1.8, w: 0.46, h: 0.58, k: 'vase' }, { t: 'picture', c: 9.75, r: 1.86, w: 0.62, h: 0.42, k: 'hills' }, { t: 'rug', c0: 3.25, c1: 9.3, r: 2 }],
  // 2
  [{ t: 'window', c: 6.6, r: 1.74 }, { t: 'picture', c: 9.05, r: 1.82, w: 0.5, h: 0.6, k: 'vase' }, { t: 'picture', c: 11.95, r: 1.82, w: 0.8, h: 0.5, k: 'sea' }, { t: 'picture', c: 4.6, r: 1.84, w: 0.6, h: 0.42, k: 'hills' }],
  // 3
  [{ t: 'window', c: 3.5, r: 3.74 }, { t: 'window', c: 7.5, r: 3.74 }, { t: 'picture', c: 5.5, r: 3.84, w: 0.7, h: 0.46, k: 'hills' }, { t: 'picture', c: 11.9, r: 3.82, w: 0.44, h: 0.54, k: 'vase' }],
  // 4
  [{ t: 'picture', c: 1.95, r: 1.82, w: 0.46, h: 0.58, k: 'vase' }, { t: 'picture', c: 4.75, r: 1.82, w: 0.82, h: 0.52, k: 'sea' }, { t: 'window', c: 8.5, r: 1.74 },
    { t: 'picture', c: 10.05, r: 1.82, w: 0.8, h: 0.5, k: 'hills' }, { t: 'picture', c: 12.5, r: 1.84, w: 0.42, h: 0.5, k: 'sea' }, { t: 'rug', c0: 1.3, c1: 6.2, r: 2 }],
  // 5
  [{ t: 'window', c: 7.3, r: 3.7 }, { t: 'picture', c: 12.45, r: 3.76, w: 0.5, h: 0.4, k: 'hills' }],
];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const progress = store.get('lamplight.v1', { cleared: [], at: 0 });
if (!Array.isArray(progress.cleared)) progress.cleared = [];
let muted = store.get('lamplight.mute', false);
const maxUnlocked = () => Math.min(LEVELS.length - 1, Math.max(-1, ...progress.cleared) + 2);

// ---------- 声音 ----------
let AC = null, master = null, noiseBuf = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t, dur, gain, type = 'sine', f2) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(gain, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v); v.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(t, dur, gain, freq, q = 1, type = 'bandpass') {
  if (!AC || muted) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), v = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  v.gain.setValueAtTime(gain, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(v); v.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const sfx = {
  step() { if (!audio()) return; const t = AC.currentTime; noise(t, 0.07, 0.12, 500 + Math.random() * 300, 2); tone(90, t, 0.06, 0.05); },

  if (k === 'r') return restart();
  if (k === 'm') { muted = !muted; store.set('lamplight.mute', muted); return; }
  if (status === 'win' && (k === 'enter' || k === ' ' || k === 'e')) return nextLevel();
  const map = { arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R', arrowup: 'U', w: 'U', arrowdown: 'D', s: 'D', e: 'E', f: 'E', enter: 'E', ' ': 'W', '.': 'W' };
  if (!map[k]) return;
  if (e.repeat && now - lastKey < 150) return;
  lastKey = now;
  act(map[k]);
});

const qs = new URLSearchParams(location.search);
load(qs.has('level') ? +qs.get('level') - 1 : clamp(+progress.at || 0, 0, maxUnlocked()));
requestAnimationFrame(frame);
window.__lamp = { step, solve, parseLevel, LEVELS, act, load, get cur() { return cur; }, get lv() { return lv; }, get status() { return status; } };
</script>
