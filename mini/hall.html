<!-- 规则：这一屏里“东西在哪儿、点了什么会怎样”都在这一段，不碰页面。mini/tools/check.mjs 直接拿这一段去搜：解得开、没有死路 -->
<script id="core">
// 一屏点击解谜的试验：夜里的门厅。
// 门口站着一个影子，孩子不敢靠近；灯照到它，它就是一个衣帽架，钥匙挂在上面。
//   灯泡在抽屉里 → 装到吊灯上（灯要在低处才够得着）→ 灯亮了，可是只照得到屋子中间
//   摇把在座钟里 → 装到墙上的绞盘上 → 把灯升上去，光张开，照到门口
//   影子在光里是衣帽架 → 拿钥匙 → 开门出去
const ITEMS = ['bulb', 'crank', 'key'];
const SPOTS = ['drawer', 'bulb', 'clock', 'crank', 'lamp', 'winch', 'stand', 'door'];
// 每样东西在哪儿：bulb 抽屉里 drawer / 身上 inv / 灯上 lamp；crank 钟里 clock / inv / 绞盘上 winch；key 衣帽架上 stand / inv / 用掉了 used
// drawer、clock：0 关着 1 开着；lamp：0 低处 1 高处；door：0 锁着 1 开了；out：走出去了
const START = { drawer: 0, bulb: 'drawer', clock: 0, crank: 'clock', lamp: 0, key: 'stand', door: 0, out: 0 };
const lampOn = s => s.bulb === 'lamp';
const standLit = s => lampOn(s) && s.lamp === 1;   // 灯亮着、升在高处：光照得到门口
const has = (s, it) => s[it] === 'inv';
// 点一下 spot（手里拿着 held，没拿是 null）。成了返回 { s, ev }，不成返回 { fail }
function act(s, spot, held) {
  const n = { ...s }, ok = (...ev) => ({ s: n, ev }), no = fail => ({ fail });
  if (s.out) return no('done');
  if (held && !has(s, held)) return no('no');
  switch (spot) {
    case 'drawer': if (held) return no('no'); n.drawer = 1 - s.drawer; return ok(n.drawer ? 'drawerOpen' : 'drawerShut');
    case 'bulb': if (held || !s.drawer || s.bulb !== 'drawer') return no('no'); n.bulb = 'inv'; return ok('take:bulb');
    case 'clock': if (held) return no('no'); n.clock = 1 - s.clock; return ok(n.clock ? 'clockOpen' : 'clockShut');
    case 'crank': if (held || !s.clock || s.crank !== 'clock') return no('no'); n.crank = 'inv'; return ok('take:crank');
    case 'lamp':
      if (held === 'bulb') { if (s.lamp) return no('high'); n.bulb = 'lamp'; return ok('bulbIn'); }
      if (held) return no('no');
      return no(lampOn(s) ? 'look' : 'nobulb');
    case 'winch':
      if (held === 'crank') { n.crank = 'winch'; n.lamp = 1 - s.lamp; return ok('crankOn', n.lamp ? 'raise' : 'lower'); }
      if (held) return no('no');
      if (s.crank !== 'winch') return no('nocrank');
      n.lamp = 1 - s.lamp; return ok(n.lamp ? 'raise' : 'lower');
    case 'stand':
      if (!standLit(s)) return no('fear');
      if (held) return no('no');
      if (s.key !== 'stand') return no('look');
      n.key = 'inv'; return ok('take:key');
    case 'door':
      if (!standLit(s)) return no('fear');
      if (held === 'key') { n.key = 'used'; n.door = 1; n.out = 1; return ok('unlock', 'exit'); }
      if (held) return no('no');
      return no('locked');
  }
  return no('no');
}
const skey = s => [s.drawer, s.bulb, s.clock, s.crank, s.lamp, s.key, s.door, s.out].join(',');
// 这个局面下所有点得动的点法
function moves(s) {
  const out = [];
  for (const spot of SPOTS) for (const held of [null, ...ITEMS.filter(it => has(s, it))]) { const r = act(s, spot, held); if (r.s) out.push({ spot, held, s: r.s }); }
  return out;
}
// 从 from 开始一层一层往外搜。返回最短的点法、搜到的局面数、死路的个数（从它出发再也走不出去的局面，应该是 0）
function solve(from = START, allow = () => true) {
  const k0 = skey(from), prev = new Map([[k0, null]]), all = new Map([[k0, from]]), q = [from];
  let goal = null;
  for (let h = 0; h < q.length; h++) {
    const s = q[h];
    if (s.out) { if (!goal) goal = skey(s); continue; }
    for (const m of moves(s)) {
      if (!allow(m)) continue;
      const k = skey(m.s); if (prev.has(k)) continue;
      prev.set(k, [skey(s), m]); all.set(k, m.s); q.push(m.s);
    }
  }
  const path = [];
  for (let k = goal; k && prev.get(k); k = prev.get(k)[0]) path.unshift({ spot: prev.get(k)[1].spot, held: prev.get(k)[1].held });
  const canWin = new Set(); let grew = true;
  for (const [k, s] of all) if (s.out) canWin.add(k);
  while (grew) {
    grew = false;
    for (const [k, s] of all) { if (canWin.has(k)) continue; if (moves(s).some(m => allow(m) && canWin.has(skey(m.s)))) { canWin.add(k); grew = true; } }
  }
  return { path: goal ? path : null, states: all.size, dead: all.size - canWin.size };
}
</script>

<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
const qs = new URLSearchParams(location.search);

// ---------- 色表 ----------
// 和《灯下》是同一套（mini/lamplight.html 的 C），画法也是同一句话：暗处只有冷色的剪影，灯照到的地方才有颜色和细节。
const C = {
  night: [7, 10, 21], dusk: [27, 38, 70], moon: [203, 218, 255], mass: [6, 8, 14], room: [17, 23, 41], ink: [2, 3, 8],
  lamp: [255, 196, 122], hot: [255, 244, 222], paper: [164, 92, 72], panel: [58, 84, 80], wood: [150, 100, 60], cream: [234, 226, 206],
  brass: [216, 170, 94], skin: [236, 196, 166], cloth: [62, 70, 94], rug: [140, 46, 44],
  amber: [240, 170, 72], teal: [86, 196, 180], danger: [255, 84, 78],
};
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const shade = (c, t) => mix(c, C.mass, t);   // 压暗
const tint = (c, t) => mix(c, C.hot, t);     // 提亮

// 屋子的两套颜色：没照到的（冷的，只有深浅）和照到的（暖的，有颜色）。两套的名字一一对应
const DARK = {
  wall: C.room, stripe: mix(C.room, C.dusk, 0.14), motif: C.room, frieze: mix(C.room, C.mass, 0.22), rail2: mix(C.room, C.dusk, 0.3),
  panel: mix(C.room, C.mass, 0.3), rail: mix(C.room, C.dusk, 0.5), panelLine: mix(C.room, C.mass, 0.55), skirt: mix(C.room, C.mass, 0.6), cornice: mix(C.room, C.mass, 0.5),
  floor: mix(C.room, C.dusk, 0.45), seam: mix(C.room, C.mass, 0.4), floorEdge: mix(C.dusk, C.moon, 0.18), front: mix(C.room, C.mass, 0.5),
  frame: mix(C.room, C.dusk, 0.9), trim: mix(C.room, C.dusk, 0.9), canvas: mix(C.room, C.dusk, 0.3), door: mix(C.room, C.dusk, 0.6), doorIn: mix(C.room, C.dusk, 0.3),
  wire: mix(C.room, C.dusk, 0.75), box: mix(C.dusk, C.moon, 0.1), iron: mix(C.dusk, C.moon, 0.26), brass: mix(C.dusk, C.moon, 0.52),
  rug: mix(C.room, C.mass, 0.35), rugLine: mix(C.room, C.dusk, 0.3), mat: mix(C.room, C.mass, 0.5),
  wood: mix(C.room, C.mass, 0.55), woodHi: mix(C.room, C.dusk, 0.5), woodLo: mix(C.room, C.mass, 0.78), woodIn: mix(C.mass, C.ink, 0.5),
  dial: mix(C.dusk, C.moon, 0.4), drape: mix(C.room, C.mass, 0.6), drapeHi: mix(C.dusk, C.moon, 0.2), radiator: mix(C.room, C.dusk, 0.75),
  vase: mix(C.room, C.dusk, 0.6), flower: mix(C.dusk, C.moon, 0.12), twig: mix(C.room, C.mass, 0.6),
  coat: mix(C.room, C.dusk, 0.5), coatLo: mix(C.room, C.mass, 0.3), hat: mix(C.room, C.mass, 0.5), scarf: mix(C.dusk, C.moon, 0.2), glass: mix(C.dusk, C.moon, 0.3),
};
const LIT = {
  wall: C.paper, stripe: shade(C.paper, 0.1), motif: tint(C.paper, 0.2), frieze: shade(C.paper, 0.22), rail2: shade(C.wood, 0.35),
  panel: C.panel, rail: tint(C.panel, 0.25), panelLine: shade(C.panel, 0.3), skirt: shade(C.panel, 0.45), cornice: shade(C.paper, 0.4),
  floor: C.wood, seam: shade(C.wood, 0.45), floorEdge: tint(C.wood, 0.4), front: shade(C.wood, 0.4),
  frame: shade(C.brass, 0.12), trim: shade(C.wood, 0.52), canvas: tint(C.brass, 0.5), door: shade(C.wood, 0.28), doorIn: shade(C.wood, 0.45),
  wire: shade(C.wood, 0.6), box: shade(C.wood, 0.5), iron: shade(C.brass, 0.55), brass: C.brass,
  rug: shade(C.rug, 0.08), rugLine: shade(C.cream, 0.42), mat: shade(C.rug, 0.55),
  wood: shade(C.wood, 0.4), woodHi: tint(shade(C.wood, 0.4), 0.16), woodLo: shade(C.wood, 0.6), woodIn: shade(C.wood, 0.82),
  dial: C.cream, drape: shade(C.rug, 0.25), drapeHi: C.rug, radiator: shade(C.cream, 0.35),
  vase: mix(C.panel, C.cloth, 0.3), flower: C.rug, twig: shade(C.wood, 0.55),
  coat: mix(C.teal, C.cloth, 0.62), coatLo: shade(mix(C.teal, C.cloth, 0.62), 0.3), hat: shade(C.wood, 0.62), scarf: C.amber, glass: mix(C.dusk, C.moon, 0.3),
};
// 主角（和《灯下》、主游戏是同一个孩子）：暗处是偏冷的浅色剪影，站在月光里亮一些，走进灯下才有颜色
const KID = {
  dark: { hood: mix(C.dusk, C.moon, 0.56), hood2: mix(C.dusk, C.moon, 0.4), arm2: mix(C.dusk, C.moon, 0.3), cloth: mix(C.room, C.dusk, 0.75), cloth2: mix(C.room, C.dusk, 0.35), boot: mix(C.mass, C.room, 0.5), skin: mix(C.dusk, C.moon, 0.46), hair: mix(C.mass, C.room, 0.4) },
  moon: { hood: mix(C.dusk, C.moon, 0.84), hood2: mix(C.dusk, C.moon, 0.62), arm2: mix(C.dusk, C.moon, 0.48), cloth: mix(C.dusk, C.moon, 0.14), cloth2: mix(C.room, C.dusk, 0.85), boot: mix(C.mass, C.room, 0.95), skin: mix(C.dusk, C.moon, 0.72), hair: mix(C.mass, C.room, 0.75) },
  lit: { hood: C.cream, hood2: shade(C.cream, 0.17), arm2: shade(C.cream, 0.3), cloth: C.cloth, cloth2: shade(C.cloth, 0.25), boot: shade(C.wood, 0.72), skin: C.skin, hair: shade(C.wood, 0.8) },
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
let muted = store.get('hall.mute', false);

// ---------- 声音 ----------
let AC = null, master = null, noiseBuf = null;
function audio() {   // 只在点了、按了键以后才开
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.8; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, t, dur, gain, type = 'sine', f2) {
  const o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(gain, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(v); v.connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(t, dur, gain, freq, q = 1, type = 'bandpass') {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), v = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q;
  v.gain.setValueAtTime(gain, t); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(v); v.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const snd = {};
for (const [k, fn] of Object.entries({
  step: (t, soft) => { noise(t, 0.06, soft ? 0.05 : 0.08, 420 + Math.random() * 260, 2); tone(84, t, 0.05, 0.03); },
  pick: t => tone(660, t, 0.06, 0.035, 'triangle', 880),
  take: t => { tone(520, t, 0.08, 0.05, 'triangle', 780); tone(1040, t + 0.05, 0.14, 0.025); },
  drawer: t => { noise(t, 0.22, 0.09, 700, 1.5); tone(120, t + 0.18, 0.08, 0.07, 'sine', 80); },
  latch: t => { tone(1500, t, 0.03, 0.05, 'square', 800); noise(t + 0.03, 0.18, 0.05, 900, 3); },
  tap: t => tone(900, t, 0.05, 0.04, 'triangle', 600),
  no: t => { tone(150, t, 0.09, 0.06, 'sine', 100); tone(140, t + 0.14, 0.1, 0.05, 'sine', 90); },
  screw: t => { for (let i = 0; i < 4; i++) noise(t + i * 0.16, 0.09, 0.045, 2600 + i * 250, 8); },
  lightOn: t => { tone(1800, t, 0.03, 0.06, 'square', 900); tone(196, t + 0.05, 1.2, 0.05); tone(392, t + 0.08, 1.4, 0.03, 'triangle'); },
  ratchet: t => { tone(1300 + Math.random() * 300, t, 0.025, 0.03, 'square', 700); noise(t, 0.03, 0.035, 2400, 4); },
  fear: t => { [55, 58.3].forEach(f => tone(f, t, 0.9, 0.11, 'sawtooth', f * 0.8)); noise(t, 0.5, 0.08, 200, 1, 'lowpass'); tone(70, t + 0.3, 0.12, 0.12); tone(70, t + 0.52, 0.12, 0.09); },
  freeze: t => { tone(130, t, 0.35, 0.18, 'sine', 70); noise(t, 0.25, 0.14, 400, 1, 'lowpass'); tone(523, t + 0.02, 0.6, 0.025); },
  wake: t => { tone(240, t, 0.5, 0.05, 'sawtooth', 70); noise(t, 0.45, 0.06, 250, 4); },
  locked: t => { for (let i = 0; i < 3; i++) { noise(t + i * 0.09, 0.05, 0.09, 1800, 3); tone(210, t + i * 0.09, 0.05, 0.05, 'square', 170); } },
  unlock: t => { tone(1200, t, 0.03, 0.06, 'square', 600); tone(160, t + 0.12, 0.1, 0.1, 'sine', 90); for (let i = 0; i < 3; i++) tone(180 + i * 22, t + 0.3 + i * 0.22, 0.26, 0.035, 'sawtooth', 150 + i * 30); },
  win: t => [392, 493.9, 587.3, 784].forEach((f, i) => { tone(f, t + i * 0.11, 1.8, 0.07, 'triangle'); tone(f / 2, t + i * 0.11, 1.8, 0.03); }),
  tick: (t, i) => tone(i ? 1500 : 1900, t, 0.02, 0.01, 'square', i ? 900 : 1100),
})) snd[k] = (...a) => { if (AC && !muted) fn(AC.currentTime, ...a); };

// ---------- 这一屏的尺寸 ----------
// 画面固定是 1600 × 900 个单位，整屏缩放。孩子大约 140 个单位高
const VW = 1600, VH = 900;
const RL = 100, RR = 1500, CEIL = 92, WB = 700, FF = 784, FRONT = 18;   // 屋子里面：左墙、右墙、天花板、后墙脚、地板前沿、地板前脸的厚度
const GY = 742;                                                         // 孩子脚踩的那条线
const WIN = { x: 160, y: 170, w: 180, h: 390 };
const CLOCK = { x: 480, base: 712 };
const TABLE = { x0: 630, x1: 790, top: 616, base: 714, dx: 668, dy: 630, dw: 84, dh: 28 };   // dx…：抽屉的前脸
const WINCH = { x: 850, y: 640, r: 16 };
const LAMP = { x: 1000, top: 110, lowY: 590, highY: 225 };              // top：绳子从这儿垂下来；lowY、highY：灯泡的高度
const STAND = { x: 1180, base: 730 };
const DOOR = { x: 1387, y: 498, w: 96, h: 202, fan: 440 };              // fan：门上面那一条亮子的上沿
const FEAR_X = 1055;                                                    // 影子没被照到的时候，孩子最多走到这儿
const WALK_MIN = 150, WALK_MAX = 1462;
const PICS = [
  { x: 606, y: 318, w: 64, h: 84, k: 'vase' }, { x: 716, y: 340, w: 122, h: 82, k: 'hills' },                                    // 桌子上方：灯升起来才照到一点
  { x: 930, y: 438, w: 100, h: 74, k: 'sea' }, { x: 1084, y: 428, w: 70, h: 92, k: 'vase' }, { x: 1296, y: 404, w: 86, h: 64, k: 'hills' },   // 灯升起来才看得见画的是什么
];
const patch = (u, v) => [246 + 150 * u + 74 * v, WB + (FF - WB) * v];   // 月光落在地板上的那一块：u 从左到右，v 从后到前

// ---------- 版面 ----------
let W = 1, H = 1, DPR = 1, Z = 1, OX = 0, OY = 0, K = 1, ui = [];
let darkLayer = null, litLayer = null, litFrame = null, litMasked = null, maskImg = null, glowImg = null;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function layout() {
  W = Math.max(1, innerWidth); H = Math.max(1, innerHeight); DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  Z = Math.min(W / VW, H / VH); OX = (W - VW * Z) / 2; OY = (H - VH * Z) / 2;
  const pw = Math.max(2, Math.round(VW * Z * DPR)), ph = Math.max(2, Math.round(VH * Z * DPR));
  K = pw / VW;   // 一个画面单位是几个像素
  for (const lit of [false, true]) {
    const c = mk(pw, ph), b = c.getContext('2d'); b.scale(K, K); paintRoom(b, lit ? LIT : DARK, lit);
    if (lit) litLayer = c; else darkLayer = c;
  }
  litFrame = mk(pw, ph); litMasked = mk(pw, ph);
}
addEventListener('resize', layout);
function rr(x, y, w, h, rad, b = g) { b.beginPath(); if (b.roundRect) b.roundRect(x, y, w, h, rad); else b.rect(x, y, w, h); }

// ---------- 不会变的东西：暗的、亮的各画一张 ----------
// 两张画的是同一样东西，只是颜色不一样。亮的那一张只画屋子里面（墙和地板），别处是透明的
function paintRoom(b, P, lit) {
  const fade = (x0, y0, x1, y1, a) => { const gr = b.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, css(C.mass, a)); gr.addColorStop(1, css(C.mass, 0)); return gr; };
  if (!lit) { b.fillStyle = css(C.mass); b.fillRect(0, 0, VW, VH); }
  b.save(); b.beginPath(); b.rect(RL, CEIL, RR - RL, WB - CEIL); b.clip();
  // 墙纸：竖条，上面的小菱形照到了才看得见
  b.fillStyle = css(P.wall); b.fillRect(RL, CEIL, RR - RL, WB - CEIL);
  b.fillStyle = css(P.stripe); for (let x = RL + 12; x < RR; x += 44) b.fillRect(x, CEIL, 11, WB - CEIL);
  if (lit) {
    b.fillStyle = css(P.motif);
    for (let j = 0; j * 26 < WB - CEIL; j++) for (let x = RL + 39.5 + (j % 2) * 22; x < RR; x += 44) {
      const y = CEIL + 13 + j * 26;
      b.beginPath(); b.moveTo(x, y - 4.4); b.lineTo(x + 3, y); b.lineTo(x, y + 4.4); b.lineTo(x - 3, y); b.fill();

    const a = clamp((T - wonT - 0.5) * 2, 0, 1), cy = OY + SLOT.y * Z, sm = Z < 0.62;
    g.textBaseline = 'middle'; g.textAlign = 'right';
    g.fillStyle = css(C.moon, 0.96 * a); g.font = `${sm ? 18 : 26}px ${FONT}`; g.fillText('走出去了', W / 2 - 16, cy - (sm ? 7 : 10));
    g.fillStyle = css(C.moon, 0.5 * a); g.font = `${sm ? 11 : 13}px ${FONT}`;
    g.fillText(`点了 ${taps} 下，${Math.round(wonT - tStart)} 秒${hints ? '，看了 ' + hints + ' 次提示' : ''}`, W / 2 - 16, cy + (sm ? 12 : 16));
    if (a >= 1) pill(W / 2 + 16 + (sm ? 54 : 75), cy, sm ? 108 : 150, sm ? 34 : 42, '再来一遍', restart);
  }
  if (H > W * 1.1) { g.fillStyle = css(C.moon, 0.6); g.font = `14px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('把手机横过来，画面会大一些', W / 2, OY + VH * Z + 36); }
}

// ---------- 输入 ----------
cv.addEventListener('pointerdown', e => {
  audio();
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = e.pointerType === 'mouse';
  for (let i = ui.length - 1; i >= 0; i--) { const u = ui[i]; if (Math.hypot(e.clientX - u.x, e.clientY - u.y) <= u.r) { u.fn(); return; } }
  if (won) return;
  const vx = (e.clientX - OX) / Z, vy = (e.clientY - OY) / Z, si = slotAt(vx, vy);
  if (si >= 0) {    // 物品栏：点一下拿在手里，再点一下放回去
    const it = bag[si]; held = it && !flying(it) && held !== it ? it : null;
    if (held) snd.pick();
    return;
  }
  tapWorld(vx, vy);
});
cv.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = e.pointerType === 'mouse';
  if (!mouse.on) return;
  const vx = (e.clientX - OX) / Z, vy = (e.clientY - OY) / Z;
  const over = ui.some(u => Math.hypot(e.clientX - u.x, e.clientY - u.y) <= u.r) || (!won && (bag[slotAt(vx, vy)] || spotAt(vx, vy)));
  cv.style.cursor = over ? 'pointer' : 'default';
});
addEventListener('keydown', e => {
  audio();
  const k = e.key.toLowerCase();
  if (k === 'r') restart();
  else if (k === 'm') toggleMute();
  else if (k === 'h' || k === '?') hint();
  else if (k === 'escape') held = null;
});

// ---------- 开始 ----------
restart(); buildMask(); layout();
let last = performance.now() / 1000, paused = qs.has('paused');
function frame() {
  const now = performance.now() / 1000, dt = clamp(now - last, 0, 0.05); last = now;
  if (!paused) { tick(dt); render(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// 像点了一下那样用某个地方（id 是 spots() 里的名字，item 是手里拿的东西）。给自动试玩和检查用
function tap(id, item) {
  if (won || busy()) return false;
  const sp = spots().find(s => s.id === id); if (!sp) return false;
  if (tStart < 0) tStart = V.T;
  taps++; held = null; use(sp, item || null); return true;
}
// 地址后面加 ?auto=1：照最短的解法自己玩一遍
if (qs.has('auto')) setInterval(() => { if (won || kid.mode !== 'idle' || fly.length) return; const r = solve(S); if (r.path && r.path.length) tap(r.path[0].spot, r.path[0].held); }, 600);
window.__hall = {
  get S() { return S; }, get V() { return V; }, get kid() { return kid; }, get bag() { return bag; }, get won() { return won; }, get held() { return held; }, get taps() { return taps; }, get bubble() { return bubble; },
  set paused(v) { paused = !!v; }, get paused() { return paused; },
  tick, render, tap, restart, hint, solve, spots, coverage, canPass, busy, tapWorld,
  run(sec, fps = 60) { for (let i = 0; i < Math.round(sec * fps); i++) tick(1 / fps); render(); },
  // 直接摆到某个局面（给截图用）：改规则里的状态，画面上的东西一步到位
  set(patchS) {
    S = { ...S, ...patchS }; bag = ITEMS.filter(it => S[it] === 'inv');
    V.drawer = S.drawer; V.clock = S.clock; V.door = S.door; V.lampH = S.lamp; V.lampI = lampOn(S) ? 1 : 0; V.lampT0 = -10;
    V.figWant = standLit(S) ? 1 : 0; V.figF = V.figWant; render();
  },
};
</script>
