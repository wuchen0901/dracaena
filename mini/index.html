<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小游戏</title>
<style>
:root{--bg:#07080e;--fg:#eef0fa;--dim:rgba(220,225,245,.6);--card:rgba(255,255,255,.04);--line:rgba(220,225,245,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#141a30 0,#07080e 70%);color:var(--fg);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 16px}
main{width:100%;max-width:1080px}
h1{font-weight:400;font-size:26px;margin:0 0 6px}
p.lead{color:var(--dim);margin:0 0 28px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;transition:border-color .2s,background .2s}
a.card:hover{border-color:rgba(255,230,180,.45);background:rgba(255,255,255,.06)}
.card h2{font-weight:400;font-size:22px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.card p{color:var(--dim);margin:0;font-size:14px;line-height:1.65}
.dot{width:12px;height:12px;border-radius:50%}
.prism .dot{background:#fff0d6;box-shadow:0 0 14px 4px rgba(255,240,214,.5)}
.house .dot{background:#ffd08a;box-shadow:0 0 14px 4px rgba(255,208,138,.45)}
.tag{font-size:12px;color:var(--dim);margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>小游戏</h1>
  <p class="lead">都是解谜的试玩版，电脑、手机都能玩。</p>
  <div class="grid">
    <a class="card prism" href="prism.html">
      <h2><span class="dot"></span>棱光</h2>
      <p>转镜子、翻棱镜，把光引到晶体上。白光会被分成红绿蓝，颜色还能混。</p>
      <div class="tag">8 关 · 点一下就行</div>
    </a>
    <a class="card house" href="house.html">
      <h2><span class="dot"></span>夜里的房子</h2>
      <p>一整栋连在一起的房子，从楼上卧室一路走到前门，不换屏幕。大人都不见了，只剩灌满了墨的衣服在夜里走，走进暗处会被它们追。插上台灯、拉亮浴室的灯、把炉火喂大、拎着萤火虫下地下室换保险丝，照亮它们，它们就只是衣服。</p>
      <div class="tag">6 间屋子 · 按住拖着走</div>
    </a>
  </div>
</main>
</body>
</html>
