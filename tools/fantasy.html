<!doctype html>

<head>

<title>奇幻一点的地方：六张粗样</title>
<style>
html,body{margin:0;background:#06080e}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 六张粗样（2026-11-26）：主人说“现在的这些建筑物都太正常了，就没有一点奇幻的吗？比如特别高的塔？阴暗的地下下水道？有毒的气体之类的？下雨天雾蒙蒙的之类的？”
// 只是给主人挑方向用的画，不是游戏：画法（铅笔线、排线、纸纹）照 tools/worlds.html 抄过来，孩子和衣服是简化的。
// 看法：直接打开是六张合在一起的总览；地址后面加 ?s=1 … ?s=6 只看一张（1600×900，和游戏一屏一样大）。
const VW = 1600, VH = 900, GY = 760;
const qs = new URLSearchParams(location.search);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// 四笔画成的方框：四个角不对齐，线头出头
function box(ctx, x, y, w, h, o = {}) {

  const ext = (a, b) => { const d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / d, uy = (b[1] - a[1]) / d, e0 = r() * ov, e1 = r() * ov; return [[a[0] - ux * e0, a[1] - uy * e0], [b[0] + ux * e1, b[1] + uy * e1]]; };

}
// 排线：一片地方里一道道短的平行线，间距、长短、轻重都不匀

// ---------- 这一页自己的小工具 ----------

// 一条有粗细的折线 → 一圈轮廓点（袖子用）
function tubeish(pts, ws) {
  const P = curvePts(pts, false, 6), n = P.length, Lp = [], Rp = [];
  for (let i = 0; i < n; i++) { const a = P[Math.max(0, i - 1)], c = P[Math.min(n - 1, i + 1)]; let tx = c[0] - a[0], ty = c[1] - a[1]; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d; const u = i / (n - 1) * (ws.length - 1), k = Math.min(ws.length - 2, Math.floor(u)), w = lerp(ws[k], ws[k + 1], u - k) / 2; Lp.push([P[i][0] - ty * w, P[i][1] + tx * w]); Rp.push([P[i][0] + ty * w, P[i][1] - tx * w]); }
  return [...Lp, ...Rp.reverse()];
}
