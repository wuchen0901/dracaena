name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build game
        run: bash Last/sidescroller/build.sh
      - name: Prepare public files
        run: |
          mkdir -p _site/models
          cp Last/escape.html _site/escape.html
          cp -r Last/models/* _site/models/
          mkdir -p _site/mini
          cp mini/*.html _site/mini/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Last Light</title><meta http-equiv="refresh" content="0;url=escape.html"><a href="escape.html">Play The Last Light</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
