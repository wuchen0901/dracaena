<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第十章 · 吊绳与高台</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 第十章（吊绳与高台）沿路的画面、动作的动图、自动玩家：把横版原型装进一个看不见的窗口，摆到这一章的各处，把整幅画面抄到图上。
// 画面全部来自游戏本身的渲染。要通过本地服务器打开：http://127.0.0.1:8769/tools/rope-route.html?layout=route
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：layout —— route 一组画面排在一起（shots=1,5,9 挑几屏），每格是整幅画面缩小一半 /
//   full 一屏的整幅画面（shot=5）/ film 一段连续的画面排成一张图，拿去切成动图（clip=grab 等，见 CLIPS；n 几格、dt 每格隔几秒、w 每格多宽、cols 一行几格、zoom 放大到主角身边）/
//   check 让一个自动玩家从头走到尾（跳起来抓绳子、爬上去、翻上台阶），报出每一根绳子用了多久（结果写在图上和控制台里）；fx=0 不加暗角、颗粒和上下黑边
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'route';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0', X = 1500;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let G = null;

// ---- 摆法 ----
function stand(x, sec = 1.2, facing = 1) { G.tp(X + x); G.P.facing = facing; G.step(sec); }
// 挂在第 k 根绳子上，两手中间在挂点下面 s 米；keys 摆好以后按住哪几个键走一小会儿
function hang(k, s, o = {}) {
  const Z = G.zone(10), r = [Z.R1, Z.R2, Z.R3][k - 1];
  G.tp(r.x - 0.2); const P = G.P; P.facing = o.facing ?? 1;
  P.x = r.x - 0.14 * P.facing; P.y = r.top - s - 1.0; P.vx = 0; P.vy = 0; P.grounded = false; P.mode = 'normal';
  G.enterRope(r, s); G.hold(o.keys ?? [], o.sec ?? 1.2);
}
const SHOTS = {
  1: ['开头：雾里一级级的大台阶，台阶边上一排吊臂', () => stand(4)],
  2: ['第一根绳子：太高了，跳起来抓住', () => stand(11.2)],
  3: ['爬到一半', () => hang(1, 1.6, { keys: ['J'], sec: 0.5 })],
  4: ['第一级的台面上', () => stand(22)],
  5: ['水沟上的第二根绳子', () => stand(28.6)],
  6: ['抓着第二根绳子', () => hang(2, 2.2, { sec: 1.6 })],
  7: ['第二级：最后一根长绳子', () => stand(54)],
  8: ['爬长绳子', () => hang(3, 2.4, { keys: ['J'], sec: 0.6 })],
  9: ['最高一级', () => stand(70)],
  10: ['走到边上，往下看', () => stand(97.5)],
};
// ---- 动图用的几段：从哪里开始、按什么键、按多久 ----
const CLIPS = {
  // 在地上一直按着 →；到了起跳的时候按住跳跃键，直到开始往下落（和人玩的时候一样：跳的时候方向键不松开）
  grab: { title: '跑过去，跳起来抓住绳子', start: () => stand(9.6, 0.4), plan: (t, P) => P.mode === 'rope' ? [] : t < 0.62 ? ['R'] : (P.grounded || P.vy > 0) && t < 1.0 ? ['R', 'J'] : ['R'] },
  climb: { title: '往上爬：两手轮流往上倒', start: () => hang(1, 3.0, { sec: 0.6 }), plan: () => ['J'] },
  ledge: { title: '爬到上面，翻上台阶', start: () => hang(1, 0.9, { sec: 0.5 }), plan: t => t < 0.5 ? ['J'] : ['R'] },
  leap: { title: '助跑，从台阶边上跳过去抓住绳子', start: () => stand(26.4, 0.4), plan: (t, P) => P.mode === 'rope' ? [] : t < 0.95 ? ['R'] : (P.grounded || P.vy > 0) && t < 1.4 ? ['R', 'J'] : ['R'] },
  slide: { title: '顺着绳子往下滑，到头松手', start: () => hang(1, 0.9, { sec: 0.5 }), plan: () => ['DOWN'] },
  first: { title: '第一根：跑过去跳起来抓住，爬上去，翻上台阶', start: () => stand(9.6, 0.4), plan: (t, P) => P.mode === 'rope' ? (P.y > 3.6 - 0.9 ? ['R'] : ['J']) : t < 0.62 ? ['R'] : (P.grounded || P.vy > 0) && t < 1.0 ? ['R', 'J'] : ['R'] },
  second: { title: '第二根：助跑，跳过水沟抓住绳子，爬上第二级', start: () => stand(26.2, 0.4), plan: (t, P) => P.mode === 'rope' ? (P.y > 6.8 - 0.9 ? ['R'] : ['J']) : t < 1.0 ? ['R'] : (P.grounded || P.vy > 0) && t < 1.4 ? ['R', 'J'] : ['R'] },
  long: { title: '最后一根长绳子', start: () => stand(56.4, 0.4), plan: (t, P) => P.mode === 'rope' ? (P.y > 10.9 ? ['R'] : ['J']) : t < 0.6 ? ['R'] : (P.grounded || P.vy > 0) && t < 1.0 ? ['R', 'J'] : ['R'] },
};

// ---- 抄画面 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
function overlays(vig = 1) {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  if (q.get('grain') !== '0') { c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore(); }
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render() {
  G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH);
  const f = +(frame.contentDocument.getElementById('fade').style.opacity || 0); if (f > 0) { sctx.fillStyle = `rgba(4,6,7,${f})`; sctx.fillRect(0, 0, FW, FH); }
  if (FX) overlays(G.E.vig ?? 1);
}
function label(text, x, y, o = {}) {
  ctx.save(); ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function tag(n, text, x, y) {
  ctx.save(); ctx.font = `600 16px ${FONT}`; const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 12, w + (n ? 56 : 24), 40, 9); ctx.fill(); ctx.restore();
  if (n) label(n, x + 26, y + 42, { size: 26, weight: 600, color: '#f1f5f4' });
  label(text, x + (n ? 56 : 26), y + 38, { size: 16, weight: 600, color: '#f1f5f4' });
}
const HEAD = 104;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 46, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 70 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); if (q.get('fit')) { sheet.style.width = '100vw'; frame.style.top = '100vh'; } }   // fit=1：在小窗口里整张缩小来看

const LAYOUTS = {
  route() {
    const list = q.get('shots') ? q.get('shots').split(',') : Object.keys(SHOTS);
    const cols = 2, rows = Math.ceil(list.length / cols), cw = FW / cols, ch = cw * FH / FW;
    size(FW, HEAD + rows * ch);
    header(q.get('title') || '第十章 · 吊绳与高台 · 沿路的画面', ['游戏里原样的画面（每格是 1080p 整幅画面缩小一半）。抓着绳子的几格是让主角挂在那个高度、按着键爬了一小会儿再截的。']);
    list.forEach((k, i) => {
      SHOTS[k][1](); render();
      const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, cx, cy, cw, ch); tag(k, SHOTS[k][0], cx, cy + ch * 0.06);
    });
    ctx.fillStyle = '#0b0f11'; ctx.fillRect(cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2);
  },
  full() { size(FW, FH); SHOTS[q.get('shot') || '1'][1](); render(); ctx.drawImage(stage, 0, 0); },
  film() {
    const C = CLIPS[q.get('clip') || 'grab'], n = num('n', 60), cols = num('cols', 6), w = num('w', 640), h = Math.round(w * 9 / 16), dt = num('dt', 0.08), zoom = num('zoom', 1);
    size(cols * w, Math.ceil(n / cols) * h); C.start(); let t = 0; if (q.get('close')) G.closeUp(true);
    const fixed = q.get('fixcam') ? { x: G.P.x, y: G.P.y } : null;                       // 镜头摆在开头的地方不动（看动作用）
    const lock = q.get('cam') ? q.get('cam').split(',').map(Number) : null;               // cam=x,y,d：镜头钉在这一章的 (x, y) 前面 d 米处，不跟着主角走
    for (let i = 0; i < n; i++) {
      const sub = Math.max(1, Math.round(dt * 60)); for (let j = 0; j < sub; j++) { G.hold(C.plan(t, G.P), dt / sub); t += dt / sub; }
      if (lock) { G.camera.position.set(X + lock[0], lock[1] + lock[2] * 0.05, lock[2]); G.camera.lookAt(X + lock[0], lock[1], 0); }
      render();
      const cw = FW / zoom, chh = FH / zoom, ax = fixed ? fixed.x + num('fx0', 0.6) : G.P.x, ay = fixed ? fixed.y + num('fy0', 1.4) : G.P.y + 0.7, p = new G.THREE.Vector3(ax, ay, 0).project(G.camera);
      const cx = zoom > 1 ? clamp((p.x * 0.5 + 0.5) * FW - cw / 2, 0, FW - cw) : 0, cy = zoom > 1 ? clamp((0.5 - p.y * 0.5) * FH - chh / 2, 0, FH - chh) : 0;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, cx, cy, cw, chh, (i % cols) * w, Math.floor(i / cols) * h, w, h);
    }
  },
  // 调试：跑一段动图，把每一格里第一根绳子最下面几个点、主角、两只手的位置写在图上
  probe() {
    const C = CLIPS[q.get('clip') || 'grab'], n = num('n', 40), dt = num('dt', 0.05), Z = G.zone(10), r = Z.R1, lines = [];
    C.start(); let t = 0;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < 3; j++) { G.hold(C.plan(t, G.P), dt / 3); t += dt / 3; }
      const p = r.p, N = r.n, f = v => v.toFixed(2), P = G.P;
      lines.push(`t=${t.toFixed(2)} ${P.mode} P=(${f(P.x - X)},${f(P.y)}) rs=${P.rs ? f(P.rs) : '-'} th=${f(r.th)} held=${r.held} n=${N} seg=${f(r.seg)} tail: ` + [N - 4, N - 3, N - 2, N - 1].map(k => `${k}:(${f(p[2 * k] - X)},${f(p[2 * k + 1])})`).join(' ') + (P.hands ? ' hands: ' + P.hands.map(h => `${f(h.s)}/${f(h.t)}`).join(' ') : '') + ` pin=${Array.from(r.pin).lastIndexOf(1)}`);
    }
    size(FW, 60 + lines.length * 22); lines.forEach((s, i) => label(s, 20, 40 + i * 22, { size: 14, shadow: false }));
  },
  // 自动玩家：一直往右走；走到每一根绳子前面的起跳点就跳（按住跳跃键直到开始往下落）；抓着绳子就一直往上爬，够得着台阶就往右按
  check() {
    size(FW, 700); G.ch(10); G.step(0.5);
    const P = G.P, Z = G.zone(10), tops = new Map([[Z.R1, 3.6], [Z.R2, 6.8], [Z.R3, 11.8]]), jumpAt = [[12.3, 12.6, 0], [29.55, 29.85, 3.6], [57.6, 57.9, 6.8]];
    const res = [], log = []; let t = 0, mode = P.mode, jumping = false, t0 = 0, falls = 0;
    for (let i = 0; i < 60 * 120 && P.x < X + 98.8; i++) {
      const ks = [];
      if (P.mode === 'rope') { ks.push('J'); if (P.y > tops.get(P.rope) - 0.9) ks.push('R'); jumping = false; }
      else if (P.mode === 'normal') {
        ks.push('R'); const lx = P.x - X; if (P.grounded) jumping = false;
        if (P.grounded && jumpAt.some(([a, b, y]) => lx > a && lx < b && Math.abs(P.y - y) < 0.05)) jumping = true;
        if (jumping && (P.grounded || P.vy > 0)) ks.push('J');
      }
      G.hold(ks, 1 / 60); t += 1 / 60;
      if (P.mode !== mode) { if (P.mode === 'rope') t0 = t; if (mode === 'rope') res.push([(P.x - X).toFixed(1), (t - t0).toFixed(1)]); mode = P.mode; }
      if (G.state() === 'fade') { falls++; log.push(`掉下去了：x=${(P.x - X).toFixed(1)}`); G.step(2.5); }
    }
    header('第十章 · 自动玩家从头走到尾', [`走到 x = ${(P.x - X).toFixed(1)}（尽头 98.8），用了 ${t.toFixed(1)} 秒，掉下去 ${falls} 次。`]);
    res.forEach((r, i) => label(`第 ${i + 1} 根绳子：在绳子上 ${r[1]} 秒，翻上台阶后站在 x = ${r[0]}`, 70, 160 + i * 34, { size: 20, shadow: false }));
    log.forEach((s, i) => label(s, 70, 160 + (res.length + i + 1) * 34, { size: 20, color: '#ffb0a0', shadow: false }));
    console.log(JSON.stringify({ end: P.x - X, t, falls, res, log }));
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);
      if (hero && (modelIn || performance.now() - t0 > 90000)) { G = w.__g; G.begin(); G.paused = true; G.ch(10); G.step(0.3); done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'sidescroller.html') + '?ch=10&sheet=' + Date.now();
  });
}
(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.route)(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
