<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第七章 · 画面选项</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 第七章（管理花园）的画面选项图：同一屏游戏画面（主角站在修剪机下面），换几套整体的光和颜色，排在一起比较。
// 做法和第一章的 look-sheet.html 一样：画面来自游戏本身的渲染，主角、修剪机、门、水管都是游戏里原样的；
// 不同的是这一章要换的不只是数值 —— 远山、两排标准树、树篱、云这几层布景板按每一版的配色重新画了一遍
// （游戏里原来那几层先收起来），草地和围墙也换了颜色。游戏本身没有改，定下来以后再照着搭进 66-ch7-garden.js。
// 这里的画笔（backdrop、setInk、box、ridge、tree……）和 30-draw.js 里的同名、同用法，画的代码可以原样搬过去。
// 要通过本地服务器打开：http://127.0.0.1:8765/tools/look-sheet-ch7.html
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：layout —— grid 各版排在一起（每格是整幅画面缩小一半）/ full 一版的整幅画面（look=第几版，从 0 数）/
//   crops 每一版在主角附近的原始大小 / scout 沿路的几屏（xs=659,686,706；look=第几版）；
//   only=0,2 只排其中几版；fx=0 不加暗角、颗粒和上下黑边；x 主角站在哪里；
//   step=2 第二步：光色固定用 pick= 那一版（从 0 数），各格比的是画面里摆什么；parts=flowers,path 临时加一格组合
// 注意：选定的结果已经在 2026-11-12 搭进了游戏的第七章 —— 光色用「春天的嫩绿」，摆的是第二步的 2 花田、4 喷灌、5 前景草丛枝叶、
//   7 黄色修剪机和蓝绿门，另外加了鸟和脚下的草。generated_images/scene-ch7-01*、scene-ch7-02* 是在那之前导出的；
//   现在再用 step=1 / step=2 导出，底图已经变了，结果会和当时不一样。
//   要看游戏现在的样子，用 raw=1（原样的游戏画面，不换光色、不摆东西）：layout=full 是这一屏，layout=scout&xs=659,686 是沿路的几屏；
//   solved=1 先把这一章的机关都算作解开了（野地已经长好）；layout=check 把机关从头到尾走一遍，结果打在控制台上
//   layout=film&x=660.5&n=40 一小段连续的画面排成一张图（配 raw=1），再用 magick <图> -crop 480x270 +repage -set delay 10 -loop 0 <动图.gif> 切成动图
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'grid';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0', RAW = q.get('raw') === '1';
let G = null, H = null, BASE = null, SET = null;

// 第七章的几个位置（和 66-ch7-garden.js 开头的一致）
const X = 656, X8 = 772, ARM = X + 31, DOOR = X + 34.4, VALVE = X + 41, W0 = X + 46.5, W1 = X + 60, SENSOR = X + 56, GATE = X + 61.5;
const SHOT = { x: num('x', 685.2), settle: num('settle', 1.6) };
function setShot(x = SHOT.x) { G.tp(x); G.step(SHOT.settle); }

// ---- 小工具 ----
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const hex3 = h => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];
let _seed = 1;
function rnd() { _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// ---- 找到场景里可以调的东西 ----
function handles() {
  const h = { layers: {}, walls: [] };
  for (const o of G.scene.children) {
    if (o.isHemisphereLight) h.hemi = o;
    else if (o.isDirectionalLight) { if (o.castShadow) h.key = o; else h.rim = o; }
    else if (o.isPoints && o.material.size < 0.1) h.dust = o;
    else if (o.isMesh && o.material.isShaderMaterial && o.renderOrder === -5000) h.sky = o;
    else if (o.isMesh && o.material.vertexColors && o.material.isMeshLambertMaterial) h.ground = o;
  }
  // 第七章的布景板，按深度认：-150 远山 / -40 中景的树列 / -9 树篱和近处的标准树 / 6 前景
  const NAME = { '-150': 'far', '-40': 'mid', '-9': 'near', '6': 'fore' };
  G.zone(7).root.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material, p = o.geometry.parameters || {};
    if (m.isMeshBasicMaterial && m.map && m.userData.own && NAME[String(o.position.z)]) h.layers[NAME[String(o.position.z)]] = o;
    else if (m.isMeshLambertMaterial && o.geometry.type === 'BoxGeometry' && (p.depth === 30 || (p.depth === 4 && p.height === 3.6))) h.walls.push(o);   // 围着花园的墙
    else if (o.geometry.type === 'BoxGeometry' && p.width === 3.9 && p.height === 0.2) h.steel = m;                      // 修剪机的横臂：钢件共用的材质
    else if (o.geometry.type === 'CylinderGeometry' && p.height === 2.4 && p.radiusTop === 0.05) h.dark = m;              // 刀头的吊杆：深色铁件共用的材质
    else if (o.geometry.type === 'BoxGeometry' && p.width === 0.22 && p.depth === 2.56) { h.sheet = m; h.band = o.children[0] && o.children[0].material; }   // 维护门的门板和上面的横带
  });
  // 第六章的城市有两层一直画到花园里面（-150 远景、-44 居民楼）：重新画的几版先把它们收起来，搭进游戏时再让它们在花园入口前收尾
  // 修剪机本身（立柱、横臂、刀头的外壳）：和水管、阀门共用钢件的材质，要单独换颜色时按位置把它们挑出来
  h.gantry = []; const bb = new G.THREE.Box3();
  G.zone(7).root.traverse(o => { if (o.isMesh && o.material === h.steel) { bb.setFromObject(o); const cx = (bb.min.x + bb.max.x) / 2; if (cx > ARM - 3.8 && cx < ARM + 0.6 && bb.max.x - bb.min.x < 5) h.gantry.push(o); } });
  h.city = []; const z6 = G.zone(6).root;
  if (z6) z6.traverse(o => { if (o.isMesh && o.material.isMeshBasicMaterial && o.material.map && o.material.userData.own && (o.position.z === -150 || o.position.z === -44)) h.city.push(o); });
  return h;
}
function snapshot() {                                             // 记下原来的数值，换下一版之前先还原
  const U = H.sky.material.uniforms, S = G.scene;
  return { fog: S.fog.color.getHex(), fogD: S.fog.density, hemiS: H.hemi.color.getHex(), hemiG: H.hemi.groundColor.getHex(), hemiI: H.hemi.intensity,
    keyC: H.key.color.getHex(), keyI: H.key.intensity, keyP: H.key.position.clone(), rimC: H.rim.color.getHex(), rimI: H.rim.intensity,
    dustC: H.dust.material.color.getHex(), dustO: H.dust.material.opacity,
    sky: U.uC.value.map(v => v.clone()), sun: U.uSun.value.clone(), sunC: U.uSunC.value.clone(), cloud: U.uCloud.value, cloudC: U.uCloudC.value.clone(),
    ground: H.ground.geometry.attributes.color.array.slice(), walls: H.walls.map(w => w.material.color.getHex()),
    mats: ['steel', 'dark', 'sheet', 'band'].map(k => [H[k], H[k].color.getHex()]) };
}
function applyLook(L, parts = L.parts || []) {
  const B = BASE, S = G.scene, e = L.env || {}, v = k => e[k] ?? B[k], U = H.sky.material.uniforms;
  S.fog.color.setHex(v('fog')); S.background.setHex(v('fog')); S.fog.density = v('fogD');
  H.hemi.color.setHex(v('hemiS')); H.hemi.groundColor.setHex(v('hemiG')); H.hemi.intensity = v('hemiI');
  H.key.color.setHex(v('keyC')); H.key.intensity = v('keyI');
  if (e.keyDir) H.key.position.copy(H.key.target.position).addScaledVector(new G.THREE.Vector3(...e.keyDir).normalize(), 55); else H.key.position.copy(B.keyP);
  H.rim.color.setHex(v('rimC')); H.rim.intensity = v('rimI');
  H.dust.material.color.setHex(v('dustC')); H.dust.material.opacity = v('dustO');
  U.uC.value.forEach((c, i) => e.sky ? c.set(...hex3(e.sky[i])) : c.copy(B.sky[i]));
  if (e.sunX !== undefined) U.uSun.value.set(e.sunX, e.sunY, e.sunP, 0.44); else U.uSun.value.copy(B.sun);
  if (e.sunC !== undefined) U.uSunC.value.set(...hex3(e.sunC)); else U.uSunC.value.copy(B.sunC);
  U.uCloud.value = e.cloud ?? B.cloud; if (e.cloudC !== undefined) U.uCloudC.value.set(...hex3(e.cloudC)); else U.uCloudC.value.copy(B.cloudC);
  const col = H.ground.geometry.attributes.color; col.array.set(B.ground); if (L.pal) paintGround(L.pal); col.needsUpdate = true;
  H.walls.forEach((w, i) => w.material.color.setHex(L.pal ? L.pal.wall : B.walls[i]));
  for (const k in H.layers) H.layers[k].visible = !L.pal;        // 重新画的几版：游戏里原来那几层布景板先收起来
  for (const o of H.city) o.visible = !L.pal;
  for (const [m, hex] of B.mats) m.color.setHex(hex);
  for (const o of H.gantry) o.material = H.steel;
  if (parts.includes('machine')) {                                // 修剪机刷成黄色，门刷成蓝绿
    const y = H.steel.clone(); y.color.setHex(0xedb630); for (const o of H.gantry) o.material = y;
    H.sheet.color.setHex(0x2f8c94); H.band.color.setHex(0x256f78);
  }
  clearSet();
  if (L.pal) { SET = new G.THREE.Group(); G.scene.add(SET); paint({ ...PAL0, ...L.pal }, parts); }
}
function clearSet() {
  if (!SET) return;
  G.scene.remove(SET);
  SET.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  SET = null;
}
// 草地的颜色：直接改地面那条带子在第七章这一段的顶点颜色（两头和相邻的章节平滑接上）
function paintGround(P) {
  const C = G.THREE.Color, pos = H.ground.geometry.attributes.position.array, col = H.ground.geometry.attributes.color.array, c = new C(), o = new C();
  const keys = [[X + 2, P.lawn], [X + 44.5, P.lawn], [X + 47, P.dry], [X + 60, P.dry], [X + 64, P.meadow], [X8 - 4, P.meadow]].map(([x, h]) => [x, new C(h)]);
  const at = x => { for (let i = 1; i < keys.length; i++) if (x <= keys[i][0]) return c.lerpColors(keys[i - 1][1], keys[i][1], clamp((x - keys[i - 1][0]) / (keys[i][0] - keys[i - 1][0]), 0, 1)); return c.copy(keys[keys.length - 1][1]); };
  for (let i = 0; i < pos.length; i += 3) {
    const x = pos[i]; if (x < X - 8 || x > X8 + 2) continue;
    at(Math.max(x, X + 2)); const t = clamp((x - (X - 8)) / 10, 0, 1) * clamp((X8 + 2 - x) / 6, 0, 1);
    o.setRGB(col[i], col[i + 1], col[i + 2]).lerp(c, t); col[i] = o.r; col[i + 1] = o.g; col[i + 2] = o.b;
  }
}

// ================= 画笔：和游戏里 30-draw.js、34-props.js 的同名函数一个用法 =================
// 布景板：世界范围 [x1,x2]×[y1,y2]，深度 z；draw(g) 里以“米”为单位、y 向上。o 的各项见 30-draw.js
function backdrop(x1, x2, y1, y2, z, ppm, draw, o = {}) {
  const THREE = G.THREE, W = (x2 - x1) * ppm, Hh = (y2 - y1) * ppm, k = Math.min(1, 4096 / W, 4096 / Hh), s = ppm * k, flat = o.floor !== undefined;
  const c = frame.contentDocument.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(Hh * k);
  const g = c.getContext('2d'), place = () => flat ? g.setTransform(s, 0, 0, s, -x1 * s, -y1 * s) : g.setTransform(s, 0, 0, -s, -x1 * s, y2 * s);
  g.save(); if (o.blur) g.filter = `blur(${o.blur}px)`; place(); draw(g); g.restore(); place();
  g.globalCompositeOperation = 'destination-out';
  for (const [w, a, b] of [[o.fadeL, x1, 1], [o.fadeR, x2, -1]]) if (w) {
    const gr = g.createLinearGradient(a, 0, a + b * w, 0); gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');

  if (o.additive) mat.blending = THREE.AdditiveBlending;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x2 - x1, y2 - y1), mat);
  if (flat) { m.rotation.x = -Math.PI / 2; m.position.set((x1 + x2) / 2, o.floor, (y1 + y2) / 2); } else m.position.set((x1 + x2) / 2, (y1 + y2) / 2, z);
  m.renderOrder = o.order ?? Math.round(z * 4); SET.add(m); return m;
}
// 贴在地上的一块画（受光照、接得住影子）。draw(g) 里 x 是世界 x，y 是世界 z
function decal(x1, x2, z1, z2, y, ppm, draw, o = {}) {
  const THREE = G.THREE, c = frame.contentDocument.createElement('canvas'); c.width = Math.round((x2 - x1) * ppm); c.height = Math.round((z2 - z1) * ppm);
  const g = c.getContext('2d'); g.setTransform(ppm, 0, 0, ppm, -x1 * ppm, -z1 * ppm); g.lineCap = 'round'; draw(g);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x2 - x1, z2 - z1), new THREE.MeshLambertMaterial({ map: tex, transparent: true, depthWrite: false, opacity: o.opacity ?? 1 }));
  m.rotation.x = -Math.PI / 2; m.position.set((x1 + x2) / 2, y + 0.008, (z1 + z2) / 2); m.receiveShadow = true; m.renderOrder = o.order ?? 2; SET.add(m); return m;
}
const box = (g, x, y, w, h) => g.fillRect(x, y, w, h);
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x, y)); g.closePath(); g.fill(); }
function line(g, pts, lw) { g.lineWidth = lw; g.beginPath(); pts.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x, y)); g.stroke(); }
function disc(g, x, y, r) { g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); }
function setInk(g, col) { g.fillStyle = col; g.strokeStyle = col; g.lineCap = 'round'; g.lineJoin = 'round'; }

function tree(g, x, y, h, kind = 'round') {                       // 单色的剪影树（野地和花园外面用）：round 阔叶树 / pine 针叶树 / dead 枯树
  const w = h * 0.03 + 0.06;

    poly(g, [[x - w, y], [x + w, y], [x + w * 0.3, y + h], [x - w * 0.3, y + h]]);

// ---- 这一章新加的画法 ----
const mix = (a, b, t) => { const A = hex3(parseInt(a.slice(1), 16)), B = hex3(parseInt(b.slice(1), 16)); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t) * 255).toString(16).padStart(2, '0')).join(''); };
const LIGHT = [-0.62, 0.78];                                       // 画在板子上的东西，亮面朝哪边：左上
// 一团修剪成球的枝叶：边上一圈小叶团，里面的叶团朝光的一面浅、背光的一面深。c: { shade 背光, base 本色, light 受光 }
// 每一团都从同一个种子画起，所以每一棵标准树真的一模一样

// 标准树：一模一样的树干 + 一模一样的球
function stdTree(g, x, y, h, c, shape) {

  g.fillStyle = c.trunkD; poly(g, [[x + tw * 0.1, y], [x + tw * 0.6, y], [x + tw * 0.42, cy], [x + tw * 0.08, cy]]);

// 一朵云：一个扁的主体，上面叠几团；底下留一点偏冷的暗部。整层再虚化一下，边缘是软的
function cloud(g, x, y, w, c, cs) {
  const puffs = [[0, 0, w * 0.5, w * 0.1]];

  g.fillStyle = cs; for (const [dx, dy, rx, ry] of puffs) { g.beginPath(); g.ellipse(x + dx, y + dy - ry * 0.25, rx, ry, 0, 0, 6.2832); g.fill(); }
  g.fillStyle = c; for (const [dx, dy, rx, ry] of puffs) { g.beginPath(); g.ellipse(x + dx - rx * 0.05, y + dy + ry * 0.12, rx * 0.97, ry * 0.9, 0, 0, 6.2832); g.fill(); }
}
const rgba = (hex, a) => { const [r, gg, b] = hex3(parseInt(hex.slice(1), 16)).map(v => Math.round(v * 255)); return `rgba(${r},${gg},${b},${a})`; };
const fadeTo = (g, y0, y1, hex, a = 1) => vgrad(g, y0, y1, rgba(hex, 0), rgba(hex, a));
// 剪得笔直的树篱：正面一片细碎的叶团，越往上越亮，顶上一道受光的边
function hedge(g, x1, x2, top, c) {
  setInk(g, c.front); box(g, x1, -3, x2 - x1, top + 3);
  setInk(g, fadeTo(g, top * 0.7, -0.1, c.low)); box(g, x1, -3, x2 - x1, top * 0.7 + 3);
  const lt = mix(c.front, c.top, 0.55), dk = mix(c.front, c.low, 0.6);
  for (let i = 0, n = Math.round((x2 - x1) * 170); i < n; i++) { const x = rr(x1, x2), y = rr(0, top - 0.03), k = y / top + rr(-0.4, 0.4); g.fillStyle = k > 0.8 ? lt : k < 0.35 ? dk : c.front; disc(g, x, y, rr(0.03, 0.07)); }
  setInk(g, c.top); box(g, x1, top - 0.16, x2 - x1, 0.16);

  { name: '柔和的粉彩', note: '颜色淡而甜：薄荷绿的草木，天边带一点粉，远山发紫',
    env: { ...DAY, fog: 0xf3eef3, fogD: 0.008, hemiS: 0xfff6fb, hemiG: 0x9cc8a0, hemiI: 1.35, keyC: 0xfff0e2, keyI: 1.9, dustC: 0xffffff, dustO: 0.35,
      sky: [0x8fb8e8, 0xa9c8ee, 0xb9d2f4, 0xeedde8, 0xfdeee0, 0xcfe6c0], sunC: 0xfff6ea, cloudC: 0xffffff },
    pal: { cloud: '#ffffff', cloudS: '#f3dfe8', mt1: ['#c4c0e6', '#e8ddee'], mt2: ['#a4b6e0', '#d4d8ec'], mt3: ['#8cc4ae', '#bcdec4'],
      midG: '#9ad69a', mid: { base: '#8fd09a', shade: '#74b88e', light: '#bce8aa', trunk: '#b09a88', trunkD: '#948070' },
      near: { base: '#6fc68a', shade: '#55a880', light: '#abe89c', trunk: '#9a8270', trunkD: '#7c6858' },
      hedge: { front: '#62ba84', top: '#aae698', low: '#4fa07a' }, mast: '#8a94a4', wild: ['#6fbc8a', '#8ad09a', '#5faa8e'], shrub: '#62b47c', dryRidge: '#e0c49a', dead: '#a08874',
      lawn: 0xa2e08c, dry: 0xe8cc9c, meadow: 0xaadc8a, wall: 0xfff5ea, shadow: 'rgba(40,90,90,.22)', haze: '#fff2f4', hazeA: 0.6 } },
  { name: '开满花的树', note: '标准树换成一模一样的粉色花树，草地和天空照旧是绿和蓝',
    env: { ...DAY, fog: 0xdcecf2, fogD: 0.006, hemiS: 0xf0f6ff, hemiG: 0x86b060, hemiI: 1.15, keyC: 0xfff4e2, keyI: 2.3, dustC: 0xffe6ee, dustO: 0.5,
      sky: [0x2f78c8, 0x4a94dc, 0x62aae8, 0xa3d2f2, 0xe8f1ee, 0xb9d8a0], sunC: 0xfffbe8, cloudC: 0xffffff },
    pal: { cloud: '#ffffff', cloudS: '#d9e6f2', mt1: ['#9dc0e2', '#c4dcee'], mt2: ['#78abcf', '#a9cedd'], mt3: ['#5fa487', '#8cc292'],
      midG: '#6ab552', mid: { base: '#f0a6c0', shade: '#d884a8', light: '#fbd0dc', trunk: '#7a6650', trunkD: '#5f4f40' },
      near: { base: '#ee88ae', shade: '#cf6494', light: '#fcc4d6', trunk: '#6e553c', trunkD: '#4f3d2c' },
      hedge: { front: '#37943a', top: '#86cc52', low: '#2a7c35' }, mast: '#4a5860', wild: ['#3f8f45', '#55a34c', '#2f7d52'], shrub: '#3c8a3c', dryRidge: '#b79a5c', dead: '#6b5238',
      lawn: 0x80bd56, dry: 0xc2a05c, meadow: 0x7fbb4c, wall: 0xe6dfcb, shadow: 'rgba(8,50,30,.3)', haze: '#e6f4f6', hazeA: 0.5 } },
];
// 每一版的暗角有多重（游戏里现在是 1）：鲜艳的几版四角不压那么黑
const VIG = L => L.vig ?? (L.pal ? 0.45 : 1);

// ---- 抄画面：先在一张整幅大小的画布上备好，再缩到图上 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
// 游戏页面上盖着的那几层：暗角、颗粒、上下黑边（它们是网页元素，抄画面时抄不到，在这里照样补上）
function overlays(vig = 1) {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render(L, parts) {
  if (!RAW) applyLook(L, parts);
  G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH); if (FX) overlays(RAW ? G.E.vig ?? 1 : VIG(L));
}
function drawFull(L, dx, dy, dw, dh, parts) { render(L, parts); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, dx, dy, dw, dh); }
function drawCrop(L, dx, dy, dw, dh, cx, cy, parts) { render(L, parts); const sx = clamp(cx - dw / 2, 0, FW - dw), sy = clamp(cy - dh / 2, 0, FH - dh); ctx.drawImage(stage, sx, sy, dw, dh, dx, dy, dw, dh); }
function heroPx() { const p = new G.THREE.Vector3(G.P.x, G.P.y + 0.62, 0).project(G.camera); return [(p.x * 0.5 + 0.5) * FW, (0.5 - p.y * 0.5) * FH]; }
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
const HEAD = 96;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 44, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 67 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
function rules(cols, rows, cw, ch) { ctx.fillStyle = '#0b0f11'; for (let c = 1; c < cols; c++) ctx.fillRect(c * cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2); }
function tag(i, L, x, y) {
  ctx.save(); ctx.font = `600 17px ${FONT}`; let w = ctx.measureText(L.name).width; ctx.font = `400 12.5px ${FONT}`; w = Math.max(w, ctx.measureText(L.note).width);
  ctx.fillStyle = 'rgba(6,10,12,.5)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 44, w + 62, 54, 9); ctx.fill(); ctx.restore();       // 垫一块半透明的底：亮的画面上字也看得清
  label(`${i + 1}`, x + 26, y + 78, { size: 34, weight: 600, color: '#f1f5f4' });
  label(L.name, x + 58, y + 68, { size: 17, weight: 600, color: '#f1f5f4' });
  label(L.note, x + 58, y + 88, { size: 12.5, weight: 400, color: '#e2e9e8' });
}

// ================= 第二步：画面里摆什么 =================
const STEP = num('step', 1), PICK = LOOKS[num('pick', 1)];
const SETS = [
  { name: '只换了光色', note: '第一步的画面，什么都没加', parts: [] },
  { name: '规整的花田', note: '路的里侧一垄一垄的花，一垄一个颜色', parts: ['flowers'] },
  { name: '石板路', note: '主角走的这一条铺成浅色的石板路', parts: ['path'] },
  { name: '喷灌的水雾', note: '水都喷给了标准树这一侧；水雾里挂着一小段彩虹', parts: ['sprinklers'] },
  { name: '前景的草丛和枝叶', note: '离镜头最近的一层：下沿的草和花、左上角伸进来的叶子，略微虚焦', parts: ['fore'] },
  { name: '方块形的树', note: '标准树从圆球换成修剪出来的方块', parts: ['cubes'] },
  { name: '彩色的机器和门', note: '修剪机刷成黄色，门刷成蓝绿色，不再是一块黑', parts: ['machine'] },
  { name: '几样放在一起', note: '2 + 3 + 4 + 5 合起来的样子', parts: ['flowers', 'path', 'sprinklers', 'fore'] },
];
if (q.get('parts')) SETS.push({ name: q.get('parts'), note: '', parts: q.get('parts').split(',') });
const SRC = STEP === 2 ? SETS : LOOKS;
const CELLS = q.get('only') ? q.get('only').split(',').map(i => SRC[+i < 0 ? SRC.length + +i : +i]) : SRC;
const lookOf = c => STEP === 2 ? PICK : c, partsOf = c => STEP === 2 ? c.parts : undefined;

const LAYOUTS = {
  full() { size(FW, FH); const c = CELLS[num('look', 0)]; drawFull(lookOf(c), 0, 0, FW, FH, partsOf(c)); },
  scout() {
    const xs = (q.get('xs') || '659,668,678,686,694,706,713,722,736,746,756,768').split(',').map(Number), cols = 2, rows = Math.ceil(xs.length / cols), cw = FW / cols, ch = FH / cols, c = CELLS[num('look', 0)];
    size(FW, HEAD + rows * ch);
    header(q.get('title') || (RAW ? '第七章 · 沿路的画面' : `第七章 · 沿路的画面（${lookOf(c).name}）`), [(RAW ? '游戏里原样的画面，' : '') + '主角依次站在这几个位置（数字是世界坐标 x）。']);
    xs.forEach((x, i) => { setShot(x); const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch; drawFull(lookOf(c), cx, cy, cw, ch, partsOf(c)); label(`x = ${x}`, cx + 26, cy + 68, { size: 17, weight: 600, color: '#f1f5f4' }); });
    rules(cols, rows, cw, ch);
  },
  grid() {
    const cols = 2, rows = Math.ceil(CELLS.length / cols), cw = FW / cols, ch = FH / cols;
    size(FW, HEAD + rows * ch);
    if (STEP === 2) header('第七章 · 管理花园 · 第二步：画面里摆什么', ['同一屏游戏画面，光和颜色用「' + PICK.name + '」。每格多摆一样东西，可以挑几样合在一起。',
      '摆进去的都是粗稿，只看大的形状、位置和颜色，细节以后再做。游戏本身还没有改。']);
    else header('第七章 · 管理花园 · 第一步：整体的光和颜色', ['同一屏游戏画面（主角站在修剪机下面），每格是整幅画面缩小一半。1 是现在的样子，2 到 6 是几种鲜艳的方向。',
      '主角、修剪机、门和水管都是游戏里原样的；天空、云、远山、两排标准树、树篱和草地按每一版的配色重画了一遍，树改矮了一些，让天空露出来。游戏本身还没有改。']);
    CELLS.forEach((c, i) => { const x = (i % cols) * cw, y = HEAD + Math.floor(i / cols) * ch; drawFull(lookOf(c), x, y, cw, ch, partsOf(c)); tag(i, c, x, y); });
    rules(cols, rows, cw, ch);
  },
  crops() {
    const cols = 2, rows = Math.ceil(CELLS.length / cols), cw = FW / cols, ch = 330;
    size(FW, HEAD + rows * ch);
    header('第七章 · 管理花园 · 原始大小', ['上一张图里的各版，在主角附近按 1080p 屏幕上的原始大小各截一块（没有缩小）。']);
    const [hx, hy] = heroPx();
    CELLS.forEach((c, i) => { const x = (i % cols) * cw, y = HEAD + Math.floor(i / cols) * ch; drawCrop(lookOf(c), x, y, cw, ch, hx + 250, hy - 60, partsOf(c)); label(`${i + 1}  ${c.name}`, x + 26, y + 34, { size: 16, weight: 600, color: '#f1f5f4' }); });
    rules(cols, rows, cw, ch);
  },
};

// 一小段连续的画面排成一张图，拿去切成动图：主角从 x 出发按住 keys（默认往右走），每隔 dt 秒截一格，一共 n 格，每行 cols 格、每格宽 w
LAYOUTS.film = () => {
  const n = num('n', 36), cols = num('cols', 6), w = num('w', 480), h = Math.round(w * 9 / 16), dt = num('dt', 0.1), keys = (q.get('keys') ?? 'R').split(',').filter(Boolean);
  size(cols * w, Math.ceil(n / cols) * h);
  const zoom = num('zoom', 1), cw = FW / zoom, ch = FH / zoom;                     // zoom=2：只截主角周围的一半画面，小东西（鸟）才看得清
  for (let i = 0; i < n; i++) {
    if (keys.length) G.hold(keys, dt); else G.step(dt); render(null);
    const [hx, hy] = heroPx(), sx = clamp(hx + cw * 0.14 - cw / 2, 0, FW - cw), sy = clamp(hy - ch * 0.66, 0, FH - ch);
    ctx.drawImage(stage, sx, sy, cw, ch, (i % cols) * w, Math.floor(i / cols) * h, w, h);
  }
};
// 把这一章的机关从头到尾走一遍：推树枝 → 刀片卡住 → 藤撑开门 → 拧阀门 → 野地长好 → 闸门打开 → 走到章末
LAYOUTS.check = () => {
  size(FW, FH);
  const z = G.zone(7), S = z.S, P = G.P, log = t => console.log('[检查] ' + t), ok = (c, t) => log((c ? '✓ ' : '✗ 不对：') + t);
  const until = (cond, max, keys) => { let t = 0; while (!cond() && t < max) { if (keys) G.hold(keys, 0.25); else G.step(0.25); t += 0.25; } return t; };
  const walkTo = (tx, max = 60) => { let t = 0; while (P.x < tx && t < max) { const x0 = P.x; G.hold(['R'], 0.1); if (P.x - x0 < 0.02 && P.grounded) G.hold(['R', 'J'], 0.1); t += 0.1; } return P.x >= tx; };
  G.ch(7); G.step(0.5);
  ok(Math.abs(P.x - (X + 3)) < 0.3, '从出生点开始 x=' + P.x.toFixed(2));
  ok(walkTo(X + 20.4, 12) || P.x > X + 20.3, '走到树枝跟前 x=' + P.x.toFixed(2));
  until(() => z.branch.x >= X + 30.39, 14, ['E', 'R']); ok(z.branch.x >= X + 30.39, '树枝推到了机械臂下面 x=' + z.branch.x.toFixed(2));
  until(() => S.jam, 6); ok(S.jam, '刀片卡住了');
  until(() => z.door.open >= 1, 22); ok(z.door.open >= 1, '藤把维护门撑开了');
  ok(walkTo(VALVE - 0.2, 20), '翻过树枝、穿过门，走到阀门 x=' + P.x.toFixed(2));
  G.tap('E'); ok(S.valve === 1, '阀门拨向了野地');
  until(() => S.g >= 1, 14); ok(S.g >= 1, '野地长好了');
  until(() => z.relay.open >= 1, 6); ok(z.relay.open >= 1, '通往中继站的闸门打开了');
  ok(walkTo(X8 - 2, 40), '一路走到章末 x=' + P.x.toFixed(2));
  log('搭建这一章每一步花的毫秒数：' + JSON.stringify(z.ms));
  G.renderer.render(G.scene, G.camera); ctx.drawImage(G.renderer.domElement, 0, 0, FW, FH);
};
function start() {
  G = frame.contentWindow.__g; G.begin(); G.paused = true; G.step(0.3);
  G.ch(7); if (q.get('solved') === '1') G.zone(7).solve();
  setShot();
  if (q.get('probe')) console.log('镜头 ' + JSON.stringify(G.camera.position.toArray().map(v => +v.toFixed(3))) + ' 视角 ' + G.camera.fov + ' 主角 x ' + G.P.x.toFixed(2));
  if (!RAW && LAYOUT !== 'check') { H = handles(); BASE = snapshot(); }
  (LAYOUTS[LAYOUT] || LAYOUTS.grid)();
  window.__sheetDone = true;
}
// 主角的模型（models/hero.glb）是另外加载的：等它到了再画，不然画进去的是加载期间顶替的机器人。最多等 20 秒
const T0 = performance.now();
frame.addEventListener('load', function wait() {
  const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
  const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);
  if (hero && !modelIn && performance.now() - T0 > 20000) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
  if (hero && (modelIn || performance.now() - T0 > 20000)) { try { start(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); window.__sheetDone = true; } }
  else setTimeout(wait, 100);
});
frame.src = '../sidescroller.html?sheet=' + Date.now();
</script>
