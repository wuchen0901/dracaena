<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>空中的细节 · 画面图</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 空中的细节（尘埃、落叶、风沙、鸟、虫）的画面图：把横版原型装进一个看不见的窗口，摆到各章的位置上，再把整幅画面抄到这张图上。
// 画面全部来自游戏本身的渲染。空中的东西在 Last/sidescroller/src/70-air.js 里，每一章一组，可以整组关掉来比较。
// 要通过本地服务器打开（和原型同源才能读到它的画面）：http://127.0.0.1:8765/tools/air-sheet.html?layout=scout
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：
//   layout —— scout 几屏排在一起，每格是整幅画面缩小（shots=1a,2b 排哪几屏，cols=2 一行几格，title=图的标题）/
//             full 一屏的整幅画面（shot=1c）/
//             pair 同一屏关掉和打开空中细节各一格（shots=…）/
//             film 一小段连续的画面排成一张图，拿去切成动图（shot=3a，n=48 格，dt=0.05 每格隔几秒，w=480 每格宽，cols=8，
//                  zoom=2 只截一半大小的一块，cx / cy 这一块的中心在整幅画面的哪里（0..1），keys=R 这一段里按住哪些键，留空就是站着）/
//             perf 量一量画一帧要多久（shots=…），结果报在控制台里
//   air=0 把空中的细节整组关掉；only=birds,leaves 只留其中几样（名字见 70-air.js）；fx=0 不加暗角、颗粒和上下黑边；
//   probe=1 在控制台报出每一屏的镜头位置；t=秒 摆好以后再多等几秒
// 每一屏的名字见下面的 SHOTS。
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'scout';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let G = null;
const X = [0, 0, 104, 260, 392, 478, 542, 656, 772];                   // 各章的原点，和 20-world.js 里的一致（X[1] 是第一章）

// ---- 摆状态 ----
const put = (o, x) => { o.x = x; o.v = 0; o.x1 = x - o.w / 2; o.x2 = x + o.w / 2; };
function at(ch, x, sec = 1.2, facing = 1) { G.ch(ch); G.tp(x); G.P.facing = facing; G.step(sec); }
function walk(x0, sec, keys = ['R']) { G.tp(x0); G.step(0.3); G.hold(keys, sec); }

// ---- 每一屏：[名字, 摆法] ----
const SHOTS = {
  // 第一章 · 工厂
  '1a': ['一 · 开场的天窗光', () => at(1, 4.5)],
  '1b': ['一 · 吊灯下的推车', () => at(1, 31)],
  '1c': ['一 · 躲探照灯', () => { at(1, 67.25, 0.2); const W = G.zone(1).WATCH; W.t = Math.asin((69.9 - W.cx) / W.amp); G.step(1 / 600, 1 / 600); }],
  '1d': ['一 · 回收线和压机', () => at(1, 94)],
  // 第二章 · 林地水闸
  '2a': ['二 · 走出工厂', () => at(2, X[2] + 8)],
  '2b': ['二 · 坡顶望见巨像', () => at(2, X[2] + 40)],
  '2c': ['二 · 林子边上', () => at(2, X[2] + 80)],
  '2d': ['二 · 水闸', () => at(2, X[2] + 101.6)],
  '2e': ['二 · 水涨起来以后', () => { G.ch(2); const z = G.zone(2); z.solve(); G.tp(X[2] + 101.6); G.step(1.2); }],
  '2f': ['二 · 过了水渠的林子', () => at(2, X[2] + 128)],
  // 第三章 · 围墙与废料场
  '3a': ['三 · 围墙里的回收线', () => at(3, X[3] + 20)],
  '3b': ['三 · 墙脚', () => at(3, X[3] + 40)],
  '3c': ['三 · 残墙和追犬', () => { G.ch(3); G.tp(X[3] + 46.6); G.P.y = 2.3; G.step(0.8); }],
  '3d': ['三 · 墙外的荒地', () => at(3, X[3] + 78)],
  '3e': ['三 · 走向旧城', () => at(3, X[3] + 110)],
  // 第四章 · 配给街
  '4a': ['四 · 配给机', () => at(4, X[4] + 11)],
  '4b': ['四 · 镜头立柱', () => at(4, X[4] + 24)],
  '4c': ['四 · 封锁门后面的街', () => at(4, X[4] + 56)],
  // 第五章 · 维修巷
  '5a': ['五 · 巷口的服务站', () => at(5, X[5] + 9)],
  '5b': ['五 · 电池和滑轨', () => at(5, X[5] + 24)],
  '5c': ['五 · 巷子深处', () => at(5, X[5] + 48)],
  // 第六章 · 供水街区
  '6a': ['六 · 线圈和水泵', () => at(6, X[6] + 13)],
  '6b': ['六 · 两只监控', () => at(6, X[6] + 30)],
  '6c': ['六 · 漏水的管子', () => at(6, X[6] + 52)],
  '6d': ['六 · 幸存者', () => at(6, X[6] + 59)],
  '6e': ['六 · 城市的边缘', () => at(6, X[6] + 92)],
  // 第七章 · 管理花园
  '7a': ['七 · 花园', () => at(7, X[7] + 12)],
  '7b': ['七 · 修剪机', () => at(7, X[7] + 29.2)],
  '7c': ['七 · 野地（长好以后）', () => { G.ch(7); G.zone(7).solve(); G.tp(X[7] + 52); G.step(1.2); }],
  '7d': ['七 · 黄昏的草地', () => { G.ch(7); G.zone(7).solve(); G.tp(X[7] + 84); G.step(1.2); }],
  '7e': ['七 · 走向中枢', () => { G.ch(7); G.zone(7).solve(); G.tp(X[7] + 102); G.step(1.2); }],
  // 第八章 · 生态中枢
  '8a': ['八 · 走进中枢', () => at(8, X[8] + 13)],
  '8b': ['八 · 核心的圆灯', () => { G.ch(8); G.zone(8).retry(); G.tp(X[8] + 84.6); G.step(1.2); }],
  '8c': ['八 · 走出中枢', () => { ending(2); G.tp(X[8] + 99.4); G.step(0.8); }],
  '8d': ['八 · 坡顶的老树', () => { ending(2); G.tp(X[8] + 121); G.step(0.8); }],
  '8e': ['八 · 余晖里坐下', () => sitDown(14)],
  '8f': ['八 · 星河', () => sitDown(36)],
  // 拍动图用的起点：主角从这里往右走（配 layout=film&keys=R）
  '2s': ['二 · 坡上走过电线杆', () => at(2, X[2] + 8, 0.6)],
  '4s': ['四 · 街口的鸽子', () => at(4, X[4] + 2.5, 0.6)],
  '6s': ['六 · 长管子上的麻雀', () => { G.ch(6); G.zone(6).solve(); G.tp(X[6] + 40); G.P.facing = 1; G.step(0.6); }],   // 水泵通了电，闸门开着
  '8w': ['八 · 走到老树下', () => at(8, X[8] + 124, 0.6)],
};
function ending(c) {                                                    // 把最后一块电池推进左边（1 修复）或右边（2 旁路）的插座
  const Z = G.zone(8), SL = X[8] + 80.65, SR = X[8] + 90.4;
  G.ch(8); Z.retry(); G.tp(c === 1 ? SL + 1.2 : SR - 1.2); G.step(0.3); put(Z.batt, c === 1 ? SL : SR); G.step(0.2); G.step(6.5);
}
function sitDown(sec) { const Z = G.zone(8); ending(2); G.tp(X[8] + 125.2); G.step(0.3); for (let i = 0; i < 400 && !Z.END.sit; i++) G.hold(['R'], 0.05); G.step(sec - Z.END.t2); }
const ORDER = Object.keys(SHOTS);

// ---- 空中的细节：整组开关 ----
const airZones = () => G.ZONES.filter(z => z.air);
function setAir(on) { for (const z of airZones()) z.show(on); }
function applyOnly() { const only = q.get('only'); if (only) for (const z of airZones()) z.only(only.split(',')); }

// ---- 抄画面：先在一张整幅大小的画布上备好，再缩到图上 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
// 游戏页面上盖着的那几层：暗角、颗粒、上下黑边（它们是网页元素，抄画面时抄不到，在这里照样补上）
function overlays(vig = 1) {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render() { G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH); if (FX) overlays(G.E.vig ?? 1); }
function drawFull(dx, dy, dw, dh) { render(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, dx, dy, dw, dh); }
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function tag(n, text, x, y) {                                           // 格子左上角的编号和名字，垫一块半透明的底：亮的画面上字也看得清
  ctx.save(); ctx.font = `600 16px ${FONT}`; const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(6,10,12,.5)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 12, w + (n ? 56 : 24), 40, 9); ctx.fill(); ctx.restore();
  if (n) label(n, x + 26, y + 42, { size: 26, weight: 600, color: '#f1f5f4' });
  label(text, x + (n ? 56 : 26), y + 38, { size: 16, weight: 600, color: '#f1f5f4' });
}
const HEAD = 96;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 44, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 67 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
function rules(cols, rows, cw, ch) { ctx.fillStyle = '#0b0f11'; for (let c = 1; c < cols; c++) ctx.fillRect(c * cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2); }
function probe(name) { if (q.get('probe')) console.log(name + ' 镜头 ' + JSON.stringify(G.camera.position.toArray().map(v => +v.toFixed(2))) + ' 主角 x ' + G.P.x.toFixed(2) + ' y ' + G.P.y.toFixed(2)); }
function setShot(k) { SHOTS[k][1](); applyOnly(); if (q.get('air') === '0') setAir(false); const t = num('t', 0); if (t > 0) G.step(t); probe(k); }
const shotList = () => (q.get('shots') || ORDER.join(',')).split(',').filter(k => SHOTS[k]);

const LAYOUTS = {
  full() { const k = q.get('shot') || '1c'; size(FW, FH); setShot(k); drawFull(0, 0, FW, FH); },
  scout() {
    const list = shotList(), cols = num('cols', 2), rows = Math.ceil(list.length / cols), cw = FW / cols, ch = cw * FH / FW;
    size(FW, HEAD + rows * ch);
    header(q.get('title') || '沿路的画面', [q.get('note') || '游戏里原样的画面。每格是 1080p 整幅画面缩小以后的样子。']);
    list.forEach((k, i) => { setShot(k); const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch; drawFull(cx, cy, cw, ch); tag(q.get('nums') === '0' ? '' : `${i + 1}`, SHOTS[k][0], cx, cy + ch * 0.06); });
    rules(cols, rows, cw, ch);
  },
  // 同一屏：左边关掉空中的细节，右边打开
  pair() {
    const list = shotList(), cols = 2, rows = list.length, cw = FW / cols, ch = cw * FH / FW;
    size(FW, HEAD + rows * ch);
    header(q.get('title') || '空中的细节 · 加之前和加之后', [q.get('note') || '同一屏游戏画面：左边是原来的样子，右边加上了空中的东西。每格是 1080p 整幅画面缩小一半。']);
    list.forEach((k, i) => {
      const cy = HEAD + i * ch;
      setShot(k); setAir(false); drawFull(0, cy, cw, ch); tag('', SHOTS[k][0] + ' · 原来', 0, cy + ch * 0.06);
      setAir(true); G.step(1 / 60); drawFull(cw, cy, cw, ch); tag('', SHOTS[k][0] + ' · 加上以后', cw, cy + ch * 0.06);
    });
    rules(cols, rows, cw, ch);
  },
  // 一小段连续的画面排成一张图，拿去切成动图
  film() {
    const k = q.get('shot') || '1c', n = num('n', 48), cols = num('cols', 8), w = num('w', 480), h = Math.round(w * 9 / 16), dt = num('dt', 0.05), keys = (q.get('keys') ?? '').split(',').filter(Boolean);
    const zoom = num('zoom', 1), cw = FW / zoom, ch = FH / zoom, fx = q.get('cx'), fy = q.get('cy');
    size(cols * w, Math.ceil(n / cols) * h);
    setShot(k);
    for (let i = 0; i < n; i++) {
      if (keys.length) G.hold(keys, dt); else G.step(dt); render();
      let cx = FW / 2, cy = FH / 2;
      if (fx !== null) { cx = +fx * FW; cy = +(fy ?? 0.5) * FH; }
      else if (zoom > 1) { const p = new G.THREE.Vector3(G.P.x, G.P.y + 0.62, 0).project(G.camera); cx = (p.x * 0.5 + 0.5) * FW + cw * 0.14; cy = (0.5 - p.y * 0.5) * FH - ch * 0.16; }
      const sx = clamp(cx - cw / 2, 0, FW - cw), sy = clamp(cy - ch / 2, 0, FH - ch);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(stage, sx, sy, cw, ch, (i % cols) * w, Math.floor(i / cols) * h, w, h);
    }
  },
  // 量一量画一帧要多久：每一屏连着推进 120 帧，每帧读回一个像素，逼着显卡把这一帧真的画完
  perf() {
    size(FW, 200); const gl = G.renderer.getContext(), px = new Uint8Array(4), res = [];
    for (const k of shotList()) {
      setShot(k); for (let i = 0; i < 20; i++) G.step(1 / 60);
      const t0 = performance.now(); for (let i = 0; i < 120; i++) { G.step(1 / 60); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
      res.push(`${k} ${((performance.now() - t0) / 120).toFixed(2)}`);
    }
    console.log('画一帧（毫秒）：' + res.join('，') + `（画布 ${G.renderer.domElement.width}×${G.renderer.domElement.height}，空中细节${q.get('air') === '0' ? '关' : '开'}）`);
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);                 // 主角的模型是另外加载的：等它到了再画，最多等 20 秒
      if (hero && !modelIn && performance.now() - t0 > 20000) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
      if (hero && (modelIn || performance.now() - t0 > 20000)) { G = w.__g.old; G.begin(); G.paused = true; G.step(0.3); done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'escape.html') + '?sheet=' + Date.now();
  });
}

(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.scout)(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
