<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>夜搜 · 目标画面</title>
<style>html,body{margin:0;background:#05080c;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 夜搜（第 18 章）“地毯式搜索”的目标画面：手画的一幅概念图，不是游戏渲染。游戏里的画面照着它调。
// 导出：node Last/tools/shot.mjs "http://127.0.0.1:8771/tools/heli-concept.html" generated_images/heli-concept.png 1920 1080
// 要点：
//  1. 直升机一架比一架远，斜着排成一条线往远处退：近的大、低、清楚，远的小、高、被雾吃掉 —— 一眼看得出是在一排一排地搜
//  2. 光柱细而长，从灯头一直落到地上；空气里有一层低雾，光柱打进雾里才亮，地上的光斑是压扁的椭圆，照亮下面的草
//  3. 地上的光斑连成一条线（搜索线），从远处扫过来；离主角最近的那一架，光斑就落在候车亭前面的公路上，边缘清楚，最亮
//  4. 天不是一块平的蓝：月亮在左边云后面，云底被探照灯从下面照亮一点；山一层比一层淡
//  5. 直升机是细长的剪影（机身、尾梁、旋翼的一道模糊的线），只有航行灯和灯头是亮的
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 1920, H = 1080;
let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647, rr = (a, b) => a + (b - a) * rnd();
const HZ = 640;                                         // 地平线（野地的远端）

// ---- 天 ----
{ const gr = g.createLinearGradient(0, 0, 0, HZ);
  gr.addColorStop(0, '#04070f'); gr.addColorStop(0.45, '#0a1426'); gr.addColorStop(0.8, '#16263d'); gr.addColorStop(1, '#22344a');
  g.fillStyle = gr; g.fillRect(0, 0, W, HZ + 40); }
for (let i = 0; i < 260; i++) { const y = rr(0, HZ * 0.7); g.fillStyle = `rgba(220,230,255,${rr(0.15, 0.7) * (1 - y / HZ)})`; g.fillRect(rr(0, W), y, rr(1, 2.2), rr(1, 2.2)); }
// 月亮在左上，被一层薄云挡着
{ const mx = 330, my = 190;
  let gr = g.createRadialGradient(mx, my, 0, mx, my, 520); gr.addColorStop(0, 'rgba(190,210,240,0.35)'); gr.addColorStop(0.15, 'rgba(120,150,200,0.16)'); gr.addColorStop(1, 'rgba(40,60,100,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, HZ);
  g.fillStyle = '#e8eefa'; g.beginPath(); g.arc(mx, my, 26, 0, 7); g.fill(); }
// 云：几条长的、底下被照亮一点的云
function cloud(x, y, w, h, a, lit) {
  for (let i = 0; i < 26; i++) { const cx = x + rr(-w / 2, w / 2), cy = y + rr(-h / 2, h / 2), r = rr(h * 0.6, h * 1.4);
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, `rgba(${lit ? '70,90,120' : '30,44,66'},${a})`); gr.addColorStop(1, 'rgba(20,30,50,0)');
    g.fillStyle = gr; g.save(); g.translate(cx, cy); g.scale(2.6, 0.55); g.translate(-cx, -cy); g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); g.restore(); }
}
cloud(420, 215, 520, 40, 0.35, false); cloud(1250, 120, 700, 46, 0.22, false); cloud(1500, 330, 600, 30, 0.25, true); cloud(820, 360, 500, 26, 0.2, true);

// ---- 远处的山：一层比一层淡、一层比一层近 ----
function ridge(base, amp, f, ph, col) {
  g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 6) g.lineTo(x, base - amp * (0.6 * Math.sin(x * f + ph) + 0.3 * Math.sin(x * f * 2.7 + ph * 2) + 0.1 * Math.sin(x * f * 7 + 1)));
  g.lineTo(W, H); g.closePath(); g.fill();
}
ridge(520, 70, 0.0032, 1, '#1a2a40'); ridge(565, 45, 0.005, 3, '#15233a');
// 高压线塔：一排小剪影
g.strokeStyle = '#13203a'; g.lineWidth = 2;
for (let x = 160; x < W; x += 330) { const b = 575, h = 95; g.beginPath(); g.moveTo(x - 16, b); g.lineTo(x, b - h); g.lineTo(x + 16, b); g.moveTo(x - 18, b - h * 0.7); g.lineTo(x + 18, b - h * 0.7); g.moveTo(x - 12, b - h * 0.85); g.lineTo(x + 12, b - h * 0.85); g.stroke(); }
g.lineWidth = 1; g.strokeStyle = 'rgba(30,48,74,0.8)'; for (const dy of [70, 82]) { g.beginPath(); for (let x = 160; x < W; x += 330) { g.moveTo(x - 18, 575 - dy); g.quadraticCurveTo(x + 147, 575 - dy + 22, x + 312, 575 - dy); } g.stroke(); }
// 林子：一条暗的锯齿
{ g.fillStyle = '#0d1828'; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 4) { const t = rnd(); g.lineTo(x, 612 - (t < 0.15 ? rr(18, 46) : rr(4, 16)) - 14 * Math.sin(x * 0.006)); }
  g.lineTo(W, H); g.closePath(); g.fill(); }

// ---- 野地：从地平线往近处，越近越暗、越绿 ----
{ const gr = g.createLinearGradient(0, HZ - 30, 0, H);
  gr.addColorStop(0, '#1a2a36'); gr.addColorStop(0.25, '#142228'); gr.addColorStop(0.6, '#0e181a'); gr.addColorStop(1, '#070d0e');
  g.fillStyle = gr; g.fillRect(0, HZ - 26, W, H); }
// 一层低雾，贴着野地
{ const gr = g.createLinearGradient(0, HZ - 80, 0, HZ + 120); gr.addColorStop(0, 'rgba(70,95,125,0)'); gr.addColorStop(0.45, 'rgba(70,95,125,0.32)'); gr.addColorStop(1, 'rgba(70,95,125,0)');
  g.fillStyle = gr; g.fillRect(0, HZ - 80, W, 200); }
// 田里的几道垄，往远处收
g.strokeStyle = 'rgba(40,60,60,0.35)'; g.lineWidth = 1;
for (let i = 0; i < 14; i++) { const y = HZ + 8 + Math.pow(i / 14, 1.8) * 260; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + rr(-3, 3)); g.stroke(); }

// ---- 直升机：斜着排成一条线往远处退。d：远近（0 = 最近，1 = 最远） ----
const HELIS = [
  { x: 1180, y: 250, d: 0.0, gx: 860, gy: 905, main: true },      // 主角头顶那一架：光斑落在候车亭前面的公路上
  { x: 1560, y: 270, d: 0.32, gx: 1450, gy: 760 },
  { x: 700,  y: 300, d: 0.42, gx: 600, gy: 728 },
  { x: 1810, y: 330, d: 0.55, gx: 1700, gy: 700 },
  { x: 380,  y: 345, d: 0.62, gx: 300, gy: 690 },
  { x: 1000, y: 375, d: 0.75, gx: 980, gy: 668 },
  { x: 120,  y: 395, d: 0.86, gx: 70, gy: 660 },
  { x: 1380, y: 405, d: 0.93, gx: 1340, gy: 654 },
];
const M = HELIS[0];
const fogMix = d => 0.15 + 0.75 * d;                    // 越远越被雾吃掉

// 光柱：从灯头到地上的光斑，一个细长的梯形，靠灯头亮，往下渐暗，打进低雾的那一截再亮起来
function beam(h) {
  const sc = 1 - 0.78 * h.d, w0 = 3 * sc, w1 = (h.main ? 120 : 70) * (1 - 0.7 * h.d), a = (h.main ? 0.34 : 0.22) * (1 - 0.55 * h.d);
  const lx = h.x + 26 * sc, ly = h.y + 16 * sc;
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createLinearGradient(lx, ly, h.gx, h.gy);
  gr.addColorStop(0, `rgba(225,240,255,${a * 1.6})`); gr.addColorStop(0.25, `rgba(200,225,245,${a * 0.7})`); gr.addColorStop(0.75, `rgba(190,215,240,${a * 0.5})`); gr.addColorStop(1, `rgba(220,235,250,${a})`);
  g.fillStyle = gr; g.beginPath(); g.moveTo(lx - w0, ly); g.lineTo(lx + w0, ly); g.lineTo(h.gx + w1, h.gy); g.lineTo(h.gx - w1, h.gy); g.closePath(); g.fill();
  // 光柱中间一道更亮的芯
  const gr2 = g.createLinearGradient(lx, ly, h.gx, h.gy); gr2.addColorStop(0, `rgba(255,255,255,${a * 1.2})`); gr2.addColorStop(1, `rgba(220,235,250,${a * 0.3})`);
  g.fillStyle = gr2; g.beginPath(); g.moveTo(lx - w0 * 0.4, ly); g.lineTo(lx + w0 * 0.4, ly); g.lineTo(h.gx + w1 * 0.3, h.gy); g.lineTo(h.gx - w1 * 0.3, h.gy); g.closePath(); g.fill();
  // 地上的光斑：压扁的椭圆，中间亮、边缘清楚；外面一圈淡淡的雾光
  const rx = w1 * 1.15, ry = rx * (h.main ? 0.24 : 0.16);
  let sp = g.createRadialGradient(0, 0, 0, 0, 0, rx * 2.4); sp.addColorStop(0, `rgba(170,200,230,${a * 0.9})`); sp.addColorStop(1, 'rgba(120,150,190,0)');
  g.save(); g.translate(h.gx, h.gy); g.scale(1, ry / rx); g.fillStyle = sp; g.beginPath(); g.arc(0, 0, rx * 2.4, 0, 7); g.fill(); g.restore();
  sp = g.createRadialGradient(0, 0, 0, 0, 0, rx); sp.addColorStop(0, `rgba(235,245,255,${h.main ? 0.95 : 0.55 * (1 - 0.5 * h.d)})`); sp.addColorStop(0.75, `rgba(200,225,245,${h.main ? 0.7 : 0.35 * (1 - 0.5 * h.d)})`); sp.addColorStop(1, 'rgba(200,225,245,0)');
  g.save(); g.translate(h.gx, h.gy); g.scale(1, ry / rx); g.fillStyle = sp; g.beginPath(); g.arc(0, 0, rx, 0, 7); g.fill(); g.restore();
  g.restore();
  h.rx = rx; h.ry = ry;
}
// 直升机剪影：细长的机身、尾梁、垂尾、滑橇，一道模糊的旋翼
function heli(h) {
  const sc = 1.15 * (1 - 0.78 * h.d), f = fogMix(h.d), col = `rgb(${Math.round(3 + 12 * f)},${Math.round(5 + 17 * f)},${Math.round(8 + 24 * f)})`;
  g.save(); g.translate(h.x, h.y); g.scale(sc, sc); g.rotate(0.08);   // 机头略微压低，朝右
  g.fillStyle = col; g.strokeStyle = col;
  g.beginPath(); g.ellipse(0, 0, 46, 19, 0, 0, 7); g.fill();                                           // 机身
  g.beginPath(); g.moveTo(-30, -8); g.lineTo(-118, -6); g.lineTo(-118, 0); g.lineTo(-30, 10); g.closePath(); g.fill();   // 尾梁
  g.beginPath(); g.moveTo(-112, -4); g.lineTo(-126, -30); g.lineTo(-118, -30); g.lineTo(-104, -4); g.closePath(); g.fill();   // 垂尾
  g.fillRect(-14, -26, 30, 10);                                                                         // 发动机罩
  g.lineWidth = 3; g.beginPath(); g.moveTo(-22, 26); g.lineTo(40, 26); g.quadraticCurveTo(50, 26, 52, 20); g.stroke();   // 滑橇
  g.lineWidth = 2; g.beginPath(); g.moveTo(-8, 18); g.lineTo(-12, 26); g.moveTo(24, 18); g.lineTo(22, 26); g.stroke();
  g.beginPath(); g.moveTo(0, -26); g.lineTo(0, -32); g.stroke();
  // 座舱玻璃：一点点反光
  g.fillStyle = `rgba(90,120,150,${0.35 * (1 - f)})`; g.beginPath(); g.ellipse(26, -4, 16, 11, 0.3, 0, 7); g.fill();
  // 旋翼：一道模糊的细线（转得太快，看不清桨叶）
  g.fillStyle = `rgba(${Math.round(20 + 30 * f)},${Math.round(28 + 40 * f)},${Math.round(40 + 50 * f)},0.55)`; g.beginPath(); g.ellipse(0, -33, 112, 3.5, 0, 0, 7); g.fill();
  g.fillStyle = `rgba(${Math.round(20 + 30 * f)},${Math.round(28 + 40 * f)},${Math.round(40 + 50 * f)},0.35)`; g.beginPath(); g.ellipse(-122, -12, 3, 14, 0, 0, 7); g.fill();
  g.restore();
  // 灯：灯头、红色防撞灯、航行灯
  g.save(); g.globalCompositeOperation = 'lighter';
  const glow = (x, y, r, c, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${c},${a})`); gr.addColorStop(1, `rgba(${c},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  const lx = h.x + 26 * sc / 1.15, ly = h.y + 16 * sc / 1.15, k = 1 - 0.6 * h.d;
  glow(lx, ly, (h.main ? 90 : 46) * k, '230,242,255', h.main ? 0.75 : 0.55); glow(lx, ly, 8 * k + 2, '255,255,255', 1);
  glow(h.x - 4 * sc, h.y - 30 * sc, 16 * k + 4, '255,60,40', 0.75 * k + 0.2);
  glow(h.x - 128 * sc, h.y - 30 * sc, 10 * k + 3, '255,255,255', 0.5 * k);
  glow(h.x + 10 * sc, h.y + 4 * sc, 7 * k + 2, '60,255,120', 0.5 * k);
  g.restore();
}
// 远的先画
const order = [...HELIS].sort((a, b) => b.d - a.d);
for (const h of order) if (!h.main) beam(h);
for (const h of order) heli(h);

// 光斑照亮的地方：草尖亮起来（每个光斑里撒一些亮的草）
function litGrass(h) {
  const n = h.main ? 220 : 60;
  for (let i = 0; i < n; i++) {
    const t = rr(0, 6.283), r = Math.sqrt(rnd()), x = h.gx + Math.cos(t) * h.rx * r, y = h.gy + Math.sin(t) * h.ry * r;
    const len = (h.main ? rr(6, 18) : rr(2, 6)) * (1 - 0.6 * h.d);
    g.strokeStyle = `rgba(${170 + rr(0, 60)},${200 + rr(0, 50)},${170 + rr(0, 40)},${rr(0.3, 0.8) * (1 - r * 0.6)})`; g.lineWidth = h.main ? 1.4 : 1;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + rr(-2, 2), y - len / 2, x + rr(-5, 5) - (h.main ? 3 : 0), y - len); g.stroke();
  }
}
for (const h of HELIS) if (!h.main) litGrass(h);

// ---- 近处：公路、候车亭、主角 ----
const RY0 = 850, RY1 = 960;                              // 公路的远边、近边
g.fillStyle = '#121518'; g.fillRect(0, RY0, W, RY1 - RY0);
g.fillStyle = 'rgba(190,190,170,0.18)'; for (let x = 20; x < W; x += 150) g.fillRect(x, 905, 70, 3);
g.fillStyle = 'rgba(190,190,170,0.1)'; g.fillRect(0, RY0 + 4, W, 2); g.fillRect(0, RY1 - 6, W, 2);
// 路边的草：远边一排
for (let x = 0; x < W; x += 3) { g.strokeStyle = `rgba(20,32,30,${rr(0.6, 1)})`; g.lineWidth = 1.5; const l = rr(8, 30); g.beginPath(); g.moveTo(x, RY0 + 2); g.lineTo(x + rr(-4, 4), RY0 + 2 - l); g.stroke(); }
// 电线杆和垂下来的电线
g.fillStyle = '#0a0c0e'; for (const x of [140, 1020, 1880]) { g.fillRect(x - 5, 560, 10, 300); g.fillRect(x - 46, 574, 92, 7); }
g.strokeStyle = 'rgba(8,10,12,0.9)'; g.lineWidth = 1.6;
for (const dx of [-40, 40]) { g.beginPath(); g.moveTo(140 + dx, 577); g.quadraticCurveTo(580 + dx, 640, 1020 + dx, 577); g.quadraticCurveTo(1450 + dx, 640, 1880 + dx, 577); g.stroke(); }

beam(M);
heli(M);
// 主角头顶那一架的光：先画公路上的光斑，再画亮起来的路面纹理
g.save(); g.globalCompositeOperation = 'lighter';
{ const rx = 175, ry = 40; let sp = g.createRadialGradient(0, 0, 0, 0, 0, rx * 2.2);
  sp.addColorStop(0, 'rgba(150,180,210,0.45)'); sp.addColorStop(1, 'rgba(100,130,170,0)');
  g.save(); g.translate(M.gx, M.gy); g.scale(1, ry / rx); g.fillStyle = sp; g.beginPath(); g.arc(0, 0, rx * 2.2, 0, 7); g.fill(); g.restore();
  sp = g.createRadialGradient(0, 0, 0, 0, 0, rx); sp.addColorStop(0, 'rgba(250,252,255,0.95)'); sp.addColorStop(0.82, 'rgba(215,230,245,0.8)'); sp.addColorStop(1, 'rgba(200,220,240,0)');
  g.save(); g.translate(M.gx, M.gy); g.scale(1, ry / rx); g.fillStyle = sp; g.beginPath(); g.arc(0, 0, rx, 0, 7); g.fill(); g.restore(); }
g.restore();
// 光斑里的路面：中线、裂缝
g.fillStyle = 'rgba(40,44,46,0.5)'; for (let i = 0; i < 40; i++) { const t = rr(0, 6.28), r = Math.sqrt(rnd()); g.fillRect(M.gx + Math.cos(t) * 160 * r, M.gy + Math.sin(t) * 34 * r, rr(4, 20), rr(1, 3)); }
g.strokeStyle = 'rgba(30,34,36,0.7)'; g.lineWidth = 1.2; for (let i = 0; i < 6; i++) { let x = M.gx + rr(-130, 130), y = M.gy + rr(-25, 25); g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 4; k++) { x += rr(-10, 22); y += rr(-5, 5); g.lineTo(x, y); } g.stroke(); }
// 光斑里飞起来的灰（旋翼吹的风）
g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 160; i++) { const x = rr(M.gx - 200, M.gx + 220), y = rr(560, M.gy); const a = 0.6 * (1 - Math.abs(x - M.gx - (y - M.gy) * -0.33) / 200); if (a <= 0) continue; g.fillStyle = `rgba(230,240,255,${rr(0.1, a)})`; g.fillRect(x, y, rr(1, 2.5), rr(1, 2.5)); } g.restore();

// 候车亭：在光斑左边，黑的剪影，里面更黑；光从右边照过来，在它的右边沿上亮一道
{ const x0 = 380, x1 = 640, top = 760;
  g.fillStyle = '#07090b'; g.fillRect(x0, top, x1 - x0, 6);                     // 顶板
  g.fillStyle = '#0b0e11'; g.fillRect(x0 + 6, top + 6, x1 - x0 - 12, RY0 + 30 - top - 6);   // 后墙
  g.fillStyle = '#050607'; g.fillRect(x0 + 4, top + 6, 5, RY0 + 52 - top); g.fillRect(x1 - 9, top + 6, 5, RY0 + 52 - top);   // 柱子
  g.fillStyle = '#0f1214'; g.fillRect(x0 + 40, RY0 + 6, x1 - x0 - 80, 5);          // 长凳
  g.fillStyle = 'rgba(200,220,240,0.55)'; g.fillRect(x1 - 4, top, 3, RY0 + 52 - top); g.fillRect(x0, top - 1, x1 - x0, 1.5);
  // 主角：蹲在候车亭靠右的那一头，贴着墙，只有一道轮廓光
  const kx = 590, ky = RY0 + 44;
  g.fillStyle = '#030405';
  g.beginPath(); g.ellipse(kx, ky - 22, 10, 16, -0.4, 0, 7); g.fill();            // 弓着的身子
  g.beginPath(); g.arc(kx + 6, ky - 42, 7.5, 0, 7); g.fill();                       // 头，往右探出去看
  g.fillRect(kx - 10, ky - 10, 20, 10);                                              // 蹲着的腿
  g.strokeStyle = 'rgba(210,228,245,0.75)'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(kx + 6, ky - 42, 7.5, -1.4, 0.6); g.stroke();
  g.beginPath(); g.ellipse(kx, ky - 22, 10, 16, -0.4, -1.2, 0.2); g.stroke(); }

// 近景：最前面一排很暗的草，略虚
for (let i = 0; i < 900; i++) { const x = rr(-20, W + 20), b = H + 10, l = rr(30, 120) * (0.6 + 0.4 * Math.sin(x * 0.01) ** 2);
  g.strokeStyle = `rgba(${4 + rr(0, 6)},${8 + rr(0, 8)},${8 + rr(0, 6)},${rr(0.7, 1)})`; g.lineWidth = rr(2, 4);
  g.beginPath(); g.moveTo(x, b); g.quadraticCurveTo(x + rr(-8, 8), b - l / 2, x + rr(-20, 20), b - l); g.stroke(); }
// 光斑照到近景草尖上的一点亮
for (let i = 0; i < 120; i++) { const x = rr(M.gx - 230, M.gx + 230), l = rr(20, 70); const y = rr(RY1 - 6, RY1 + 30); const a = 0.5 * (1 - Math.abs(x - M.gx) / 230);
  g.strokeStyle = `rgba(170,205,180,${a})`; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + l * 0.6); g.quadraticCurveTo(x + rr(-4, 4), y, x + rr(-8, 8), y - l * 0.4); g.stroke(); }
litGrass(M);

// ---- 收尾：暗角、颗粒、上下黑边 ----
