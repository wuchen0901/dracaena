<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>白天的画面 · 六个办法</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 白天怎么做才好看：拿第七章（管理花园）主角站在修剪机下面的这一屏，把六个办法一条一条加上去，看各自的效果。
//   太阳放低（逆光、长影子）/ 空气透视 / 前景压暗 / 限制颜色 / 留出阴影区 / 形状做大、细节做少，最后一格六条合在一起。
// 画面来自游戏本身的渲染：主角、小猫、修剪机、门、墙、水管、脚下的草叶和鸟都是游戏里原样的（光照跟着每一格的太阳走）；
// 云、远山、两排标准树、树篱、薄雾、草坪的条纹、花田、喷灌和前景是照 66-ch7-garden.js 的画法在这里重新画的（游戏里那几块板子先收起来），
// 每一格按自己的办法画。没有打开任何办法时，画出来的是 2026-11-13 之前游戏里的样子（正午的光，这一页自己带着那时的数值）。
// 2026-11-13 用户挑了 2、4、6（太阳放低 + 前景压暗 + 留出阴影区），已经搭进了游戏的第七章；这一页各格的意思不变，
// 游戏现在的样子用 raw=1（第一格换成游戏原样的画面）或者 look-sheet-ch7.html?raw=1 看。
// 要通过本地服务器打开：http://127.0.0.1:8765/tools/daylight-sheet.html
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：layout —— grid 八格排在一起（每格是整幅画面缩小一半）/ full 一格的整幅画面（look=第几格，从 0 数）/
//   pair 第一格和最后一格，上下两幅整幅画面 / crops 主角附近按原始大小截一块（only=0,7 选哪几格）；
//   fx=0 不加暗角、颗粒和上下黑边；x 主角站在哪里；az、el 逆光时太阳在哪（从正后方往右偏多少度、离地多高，单位是度）；
//   parts=low,haze 临时加一格，打开其中几条（low 太阳放低 / haze 空气透视 / fore 前景压暗 / pal 限制颜色 / shade 阴影区 / simple 形状做大）
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'grid';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0';
let G = null, H = null, BASE = null, SET = null, THREE = null;

// 第七章的几个位置（和 66-ch7-garden.js 开头的一致）
const X = 656, X8 = 772, ENTRY = X + 1.2, ARM = X + 31, DOOR = X + 34.4, GATE = X + 61.5;
const SHOT = { x: num('x', 685.2), settle: num('settle', 1.6) };
function setShot(x = SHOT.x) { G.tp(x); G.step(SHOT.settle); }

// ---- 小工具 ----
const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const hex3 = h => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];
let _seed = 1;
function rnd() { _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();
const hexOf = c => parseInt(c.slice(1), 16);
const mix = (a, b, t) => { const A = hex3(hexOf(a)), B = hex3(hexOf(b)); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t) * 255).toString(16).padStart(2, '0')).join(''); };
const rgba = (c, a) => { const [r, g, b] = hex3(hexOf(c)).map(v => Math.round(v * 255)); return `rgba(${r},${g},${b},${a})`; };
const mapSet = (s, f) => Object.fromEntries(Object.entries(s).map(([k, v]) => [k, f(v)]));

// ================= 每一格打开哪几条办法 =================
// low 太阳放低 / haze 空气透视 / fore 前景压暗 / pal 限制颜色 / shade 留出阴影区 / simple 形状做大、细节做少
const ALL = { low: 1, haze: 1, fore: 1, pal: 1, shade: 1, simple: 1 };
const CELLS = [
  { name: q.get('raw') === '1' ? '游戏现在的样子' : '原来的样子', note: q.get('raw') === '1' ? '游戏原样的画面' : '正午的顶光：处处一样亮、一样细，颜色哪里都有', F: {} },
  { name: '太阳放低', note: '清晨的太阳低低地挂在前方偏右的树后：逆光，迎着我们的一面在阴影里，边上亮一圈；影子拉长朝镜头这边', F: { low: 1 } },
  { name: '空气透视', note: '雾加浓：越远越淡、越往天色靠，远山、后排树、前排树一层一层分开', F: { haze: 1 } },
  { name: '前景压暗', note: '离镜头最近的草、树干和枝叶压成深色剪影，在画框边上补回一圈暗', F: { fore: 1 } },
  { name: '限制颜色', note: '绿和天蓝做主色，修剪机的黄做点缀；花田只留白和淡黄，鸟也不再五颜六色', F: { pal: 1 } },
  { name: '留出阴影区', note: '主角身后的花田、草地和树篱落在树荫里，他自己站在亮处', F: { shade: 1 } },
  { name: '形状做大、细节做少', note: '后排树只剩剪影，花田变成色带，云和远山并成几大块；主角附近照旧是细的', F: { simple: 1 } },
  { name: '六条合在一起', note: '逆光的清晨 + 雾 + 深色前景 + 少几种颜色 + 身后的树荫 + 大块的树和远景', F: ALL },
];
if (q.get('parts')) CELLS.push({ name: q.get('parts'), note: '', F: Object.fromEntries(q.get('parts').split(',').map(k => [k, 1])) });
const PICK = q.get('only') ? q.get('only').split(',').map(i => CELLS[+i < 0 ? CELLS.length + +i : +i]) : CELLS;

// ================= 颜色 =================
// 游戏里现在的配色（66-ch7-garden.js 的 PAL 和 ROWS）
const PAL0 = { cloud: '#ffffff', cloudS: '#d9e6f2', mt: [['#9dc0e2', '#c4dcee'], ['#78abcf', '#a9cedd'], ['#5fa487', '#8cc292']], haze: '#e6f4f6', hazeA: 0.5,
  midG: '#6ab552', mid: { base: '#58aa4a', shade: '#3f9046', light: '#8bcb5c', trunk: '#7a6650', trunkD: '#5f4f40' },
  near: { base: '#42a23e', shade: '#2b8438', light: '#93d552', trunk: '#6e553c', trunkD: '#4f3d2c' },
  hedge: { front: '#37943a', top: '#86cc52', low: '#2a7c35' }, mast: '#4a5860',
  fore: '#1f6a2c', fore2: '#2f8236', foreBranch: '#3a2c1f', foreFlower: ['#ffffff', '#ffd84a', '#ff8fb4'],
  rows: [[-3.4, '#d93a34', '#f0625a'], [-4.5, '#f08a2c', '#f8ae58'], [-5.6, '#f6cf3a', '#fbe27a'], [-6.7, '#f2efe4', '#ffffff'], [-7.8, '#9a6fd6', '#b894e6']],
  rowLeaf: { base: '#42a23e', shade: '#2b8438' } };
// 限制颜色：绿（一个色相，只分深浅）和天蓝做主色，黄色修剪机做点缀。远山归到天色里；花田只留米白和淡黄，离路最近的一垄只有叶子（主角身后要深）
const LIM = { mt: [['#a7c4e2', '#cbdded'], ['#8eb2d4', '#b3cde0'], ['#7fa3c2', '#a9c4d8']],
  midG: '#64ad55', mid: { base: '#5aa851', shade: '#43904b', light: '#8dc865', trunk: '#76675a', trunkD: '#5c5047' },
  near: { base: '#3f9c42', shade: '#2a7f3b', light: '#8dcf58', trunk: '#6a5848', trunkD: '#4d4036' },
  hedge: { front: '#36923d', top: '#82c857', low: '#287836' }, foreFlower: ['#ffffff', '#f4e7a8'],
  rows: [[-3.4, null, null], [-4.5, '#f3f0e4', '#ffffff'], [-5.6, '#f1d75e', '#f8e793'], [-6.7, '#f3f0e4', '#ffffff'], [-7.8, '#f1d75e', '#f8e793']] };
// 逆光：画在板子上的树和树篱，迎着镜头的一面是背光的（偏冷、偏深），朝太阳的一边透出黄绿，最外面一圈金色
const BACK = { cloud: '#fff7e8', cloudS: '#d6d4dc', mt: [['#c9d0dc', '#e9e6dc'], ['#b3bfcc', '#dcdcd4'], ['#98ad9f', '#c8cdb8']], haze: '#f3ecd6', hazeA: 0.5,
  midG: '#6a937e', mid: { body: '#6f9a86', shade: '#628c7c', glow: '#c8dc96', rim: '#f8ecc0', trunk: '#5d6a62' },
  near: { body: '#2c6650', shade: '#1f4c42', glow: '#b9d070', rim: '#f8e8a8', trunk: '#2f362e' },
  hedge: { front: '#29604a', low: '#1b4538', glow: '#a9cf5c', top: '#fbe69a' }, mast: '#45524f',
  fore: '#29503a', fore2: '#30583c', foreBranch: '#2b2721', foreFlower: ['#fff3d6', '#ffd98a', '#ffb7c8'] };
function colours(F) {
  const low = !!F.low, src = low ? BACK : PAL0, C = { style: low ? 'back' : 'front' };
  Object.assign(C, JSON.parse(JSON.stringify(src)));
  C.rows = PAL0.rows; C.rowLeaf = PAL0.rowLeaf; C.cloudA = 0.95;
  if (F.pal) {
    C.rows = LIM.rows; C.foreFlower = low ? ['#fff3d6', '#ffe2a0'] : LIM.foreFlower;
    if (!low) Object.assign(C, { mt: LIM.mt, midG: LIM.midG, mid: LIM.mid, near: LIM.near, hedge: LIM.hedge });
    C.rowLeaf = { base: LIM.near.base, shade: LIM.near.shade };
  }
  if (F.fore) Object.assign(C, low ? { fore: '#15291c', fore2: '#1a3021', foreBranch: '#17150f', foreFlower: ['#3a3424'] }
    : { fore: '#173a24', fore2: '#1d4428', foreBranch: '#1d241c', foreFlower: ['#2e4a2c'] });
  C.foreRim = low ? '#ffe3a2' : null;
  if (F.haze) {                                                   // 越远越往天色（地平线的颜色）靠
    const hz = low ? BACK.haze : '#e4f2f4';
    C.mt = C.mt.map((p, i) => p.map(c => mix(c, hz, [0.6, 0.5, 0.42][i])));
    C.cloudA = 0.72; C.mid = mapSet(C.mid, c => mix(c, hz, 0.22)); C.midG = mix(C.midG, hz, 0.22); C.mast = mix(C.mast, hz, 0.25);
    C.hazeA = Math.min(0.85, C.hazeA + (low ? 0.15 : 0.3)); C.haze = hz;
  }
  return C;
}

// ================= 光：环境的数值（和游戏里 env() 的写法一样）=================
// 逆光的太阳：清晨，在画面的前方偏右，离地十几度（url 的 az、el 可以改）。
// 天上看得见的那个太阳（SUNSKY = 天空着色器里的 sunX、sunY）放在右上方，半挡在一棵树的树冠后面；它比打光的方向还低一点，长影子才不至于把整个草地都盖住
function sunDir() { const az = num('az', 16) * Math.PI / 180, el = num('el', 14) * Math.PI / 180; return [Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)]; }
const SUNSKY = [num('sx', 0.277), num('sy', 0.079)];
const SUN0 = [-0.42, 0.78, -0.28];                                   // 2026-11-13 之前第七章的太阳：左上方、略微偏后
// 2026-11-13 之前第七章花园里的光（正午）。游戏现在是清晨逆光了，没打开“太阳放低”的几格用这一套，结果才和当时一样
const NOON = { fog: 0xd6ecf2, fogD: 0.006, hemiS: 0xeaf6ff, hemiG: 0x86b060, hemiI: 1.15, keyC: 0xfff4dc, keyI: 2.3, keyDir: SUN0, rimC: 0xa9cdd8, rimI: 0.25, dustC: 0xffffff, dustO: 0.22,
  sky: [0x2f78c8, 0x4a94dc, 0x62aae8, 0xa3d2f2, 0xe2f1ee, 0xb9d8a0], sunX: -0.3, sunY: 0.36, sunP: 0.5, sunC: 0xfffbe8, cloud: 0.35, cloudC: 0xffffff };
function envFor(F) {
  const e = F.low ? {} : { ...NOON };
  if (F.low) Object.assign(e, { fog: 0xe9e6d6, fogD: 0.007, hemiS: 0xa4c2e4, hemiG: 0x4c6a42, hemiI: 0.78, keyC: 0xffe2b0, keyI: 5.0, keyDir: sunDir(), rimC: q.get('rimdir') === '0' ? 0xa9cdd8 : 0xffdcaa, rimI: num('rim', 1.6), rimDir: q.get('rimdir') === '0' ? undefined : [0.62, 0.04, -0.78],
    dustC: 0xffe8b8, dustO: 0.7, sky: [0x4f86c8, 0x6a9bd6, 0x8db5e0, 0xd4e1e0, 0xfbedcf, 0xc6c79e], sunX: SUNSKY[0], sunY: SUNSKY[1], sunP: 1.0, sunC: 0xfff5dc, cloud: 0.15, cloudC: 0xfff4e4 });
  if (F.haze) {
    e.fogD = F.low ? 0.009 : 0.013; e.fog = F.low ? 0xf1ead4 : 0xdcecf2;
    if (!F.low) e.sky = [0x4884c6, 0x68a0da, 0x84b6e4, 0xbcdaee, 0xe6f2f1, 0xc4dcb6];
  }
  if (F.simple) e.cloud = 0.1;
  return e;
}

// ---- 找到场景里可以调的东西 ----
function handles() {
  const h = { hide: [], spr: [], birds: [], wildNear: null };
  for (const o of G.scene.children) {
    if (o.isHemisphereLight) h.hemi = o;
    else if (o.isDirectionalLight) { if (o.castShadow) h.key = o; else h.rim = o; }
    else if (o.isPoints && o.material.size < 0.1) h.dust = o;
    else if (o.isMesh && o.material.isShaderMaterial && o.renderOrder === -5000) h.sky = o;
    else if (o.isMesh && o.material.vertexColors && o.material.isMeshLambertMaterial) h.ground = o;
  }
  const rowsZ = PAL0.rows.map(r => r[0]);
  G.zone(7).root.traverse(o => {
    if (o.isSprite && o.renderOrder === -33) { h.hide.push(o); return; }                          // 游戏里清晨的太阳光晕（这里自己画）
    if (!o.isMesh) return;
    const m = o.material, p = o.geometry.parameters || {}, z = o.position.z, cx = o.position.x, own = m.userData && m.userData.own && m.map;
    if (m.colorWrite === false) { h.hide.push(o); return; }                                         // 只投影子的替身和看不见的树冠（这里需要时自己加）
    if (own && m.isMeshBasicMaterial) {
      if (z === -420 || z === -149 || z === -24 || z === -30 || z === 10.4) h.hide.push(o);         // 云、远山、两排树之间的薄雾、太阳那边的暖光、前景那棵树
      else if ((z === -40 || z === -9) && cx < X + 40) h.hide.push(o);                              // 花园里的两排标准树和树篱
      else if (z === -9) h.wildNear = o;                                                            // 野地那一段的近景（画面右边只露一条边）
      else if ((z === 8.7 || z === 10.2) && cx < X + 45) h.hide.push(o);                           // 花园里的前景草丛和伸进来的枝叶
      else if (z === -5.1) h.spr.push(o);                                                           // 喷灌
    } else if (own && m.isMeshLambertMaterial) {
      if (o.renderOrder === -40) h.hide.push(o);                                                    // 草坪：割草的条纹和树影
      else if (rowsZ.includes(z) && Math.abs(p.width - 42.4) < 0.01) h.hide.push(o);               // 花田
    } else if (m.isMeshLambertMaterial && m.emissiveIntensity === 0.15 && m.emissive && m.emissive.getHex() === m.color.getHex()) h.birds.push(m);   // 鸟
  });
  h.birds = [...new Set(h.birds)];
  return h;
}
function snapshot() {                                             // 记下原来的数值，换下一格之前先还原
  const U = H.sky.material.uniforms, S = G.scene;
  return { fog: S.fog.color.getHex(), fogD: S.fog.density, hemiS: H.hemi.color.getHex(), hemiG: H.hemi.groundColor.getHex(), hemiI: H.hemi.intensity,
    keyC: H.key.color.getHex(), keyI: H.key.intensity, keyP: H.key.position.clone(), rimC: H.rim.color.getHex(), rimI: H.rim.intensity, rimP: H.rim.position.clone(),
    dustC: H.dust.material.color.getHex(), dustO: H.dust.material.opacity,
    sky: U.uC.value.map(v => v.clone()), sun: U.uSun.value.clone(), sunC: U.uSunC.value.clone(), cloud: U.uCloud.value, cloudC: U.uCloudC.value.clone(),
    birds: H.birds.map(m => [m, m.color.getHex()]), spr: H.spr.map(o => [o, o.material.color.getHex()]) };
}
// 限制颜色时鸟的颜色：蓝的、橙的换成灰白，黄的留着（和修剪机是一家）
const BIRD_LIM = { 0x4a90d9: 0x8d969a, 0x2f64a8: 0x616a6e, 0xe8683a: 0xe8e4da, 0xa8442a: 0xaaa59c, 0xf9e4c8: 0xf6f2ea };
function applyEnv(F) {
  const B = BASE, S = G.scene, e = envFor(F), v = k => e[k] ?? B[k], U = H.sky.material.uniforms;
  S.fog.color.setHex(v('fog')); S.background.setHex(v('fog')); S.fog.density = v('fogD');
  H.hemi.color.setHex(v('hemiS')); H.hemi.groundColor.setHex(v('hemiG')); H.hemi.intensity = v('hemiI');
  H.key.color.setHex(v('keyC')); H.key.intensity = v('keyI');
  if (e.keyDir) H.key.position.copy(H.key.target.position).addScaledVector(new THREE.Vector3(...e.keyDir).normalize(), 55); else H.key.position.copy(B.keyP);
  H.rim.color.setHex(v('rimC')); H.rim.intensity = v('rimI');
  // 逆光时，轮廓光也从太阳那边来，而且几乎是水平的：只照亮主角和机器朝右后方的边，不会把地上的影子冲淡
  if (e.rimDir) H.rim.position.copy(H.rim.target.position).addScaledVector(new THREE.Vector3(...e.rimDir).normalize(), 55); else H.rim.position.copy(B.rimP);
  H.dust.material.color.setHex(v('dustC')); H.dust.material.opacity = v('dustO');
  U.uC.value.forEach((c, i) => e.sky ? c.set(...hex3(e.sky[i])) : c.copy(B.sky[i]));
  if (e.sunX !== undefined) U.uSun.value.set(e.sunX, e.sunY, e.sunP, 0.44); else U.uSun.value.copy(B.sun);
  if (e.sunC !== undefined) U.uSunC.value.set(...hex3(e.sunC)); else U.uSunC.value.copy(B.sunC);
  U.uCloud.value = e.cloud ?? B.cloud; if (e.cloudC !== undefined) U.uCloudC.value.set(...hex3(e.cloudC)); else U.uCloudC.value.copy(B.cloudC);
  for (const [m, hex] of B.birds) m.color.setHex(F.pal && BIRD_LIM[hex] ? BIRD_LIM[hex] : hex), m.emissive.copy(m.color);
  if (H.wildNear) H.wildNear.material.color.setHex(F.low ? 0x8f9488 : 0xffffff);
}
function sunVec(F) { const d = F.low ? sunDir() : SUN0; return new THREE.Vector3(...d).normalize(); }

// ================= 画笔：和游戏里 30-draw.js、34-props.js 的同名函数一个用法 =================
function backdrop(x1, x2, y1, y2, z, ppm, draw, o = {}) {
  const W = (x2 - x1) * ppm, Hh = (y2 - y1) * ppm, k = Math.min(1, 4096 / W, 4096 / Hh), s = ppm * k;
  const c = frame.contentDocument.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(Hh * k);
  const g = c.getContext('2d'), place = () => g.setTransform(s, 0, 0, -s, -x1 * s, y2 * s);
  g.save(); if (o.blur) g.filter = `blur(${o.blur}px)`; place(); draw(g); g.restore(); place();

  lines.forEach((t, i) => label(t, 70, 67 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
function rules(cols, rows, cw, ch) { ctx.fillStyle = '#0b0f11'; for (let c = 1; c < cols; c++) ctx.fillRect(c * cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2); }
function tag(i, c, x, y, big = 1) {
  ctx.save(); ctx.font = `600 ${17 * big}px ${FONT}`; let w = ctx.measureText(c.name).width; ctx.font = `400 ${12.5 * big}px ${FONT}`; w = Math.max(w, ctx.measureText(c.note).width);
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 14 * big, y + 44 * big, w + 62 * big, 54 * big, 9 * big); ctx.fill(); ctx.restore();   // 垫一块半透明的底：亮的画面上字也看得清
  label(`${i + 1}`, x + 26 * big, y + 78 * big, { size: 34 * big, weight: 600, color: '#f1f5f4' });
  label(c.name, x + 58 * big, y + 68 * big, { size: 17 * big, weight: 600, color: '#f1f5f4' });
  label(c.note, x + 58 * big, y + 88 * big, { size: 12.5 * big, weight: 400, color: '#e2e9e8' });
}
CELLS[0].raw = q.get('raw') === '1';                                    // 第一格默认也是这里重画的（和游戏里只差云和草丛的随机位置，各格之间好比）；raw=1 换成游戏原样的画面

const LAYOUTS = {
  full() { size(FW, FH); drawFull(PICK[num('look', 0)], 0, 0, FW, FH); },
  grid() {
    const cols = 2, rows = Math.ceil(PICK.length / cols), cw = FW / cols, ch = FH / cols;
    size(FW, HEAD + rows * ch);
    header('白天的画面 · 六个办法（第七章 · 管理花园）', ['同一屏游戏画面，每格是整幅缩小一半。1 是原来的样子（2026-11-13 之前，正午）；2 到 7 每格只加一个办法；8 是六个合在一起。',
      '主角、修剪机、门、墙、草叶和鸟都是游戏里原样的，光跟着每一格的太阳走；树、树篱、花田、远山和前景按每一格的办法重画。游戏本身还没有改。']);
    PICK.forEach((c, i) => { const x = (i % cols) * cw, y = HEAD + Math.floor(i / cols) * ch; drawFull(c, x, y, cw, ch); tag(CELLS.indexOf(c), c, x, y); });
    rules(cols, rows, cw, ch);
  },
  pair() {
    const a0 = CELLS[num('a', 0)], a = a0, b = CELLS[num('b', CELLS.length - 1)];
    size(FW, HEAD + 2 * FH);
    header('白天的画面 · 之前和之后', [`上：${a.name}。下：${b.name}。同一个位置、同一个镜头。`]);
    drawFull(a, 0, HEAD, FW, FH); tag(CELLS.indexOf(a0), a, 0, HEAD, 1.5);
    drawFull(b, 0, HEAD + FH, FW, FH); tag(CELLS.indexOf(b), b, 0, HEAD + FH, 1.5);
    ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, HEAD + FH - 2, FW, 4);
  },
  crops() {
    const list = q.get('only') ? PICK : [CELLS[0], CELLS[CELLS.length - 1]], cols = 2, rows = Math.ceil(list.length / cols), cw = FW / cols, ch = num('ch', 600);
    size(FW, HEAD + rows * ch);
    header('白天的画面 · 原始大小', ['主角附近按 1080p 屏幕上的原始大小各截一块（没有缩小）。']);
    const [hx, hy] = heroPx();
    list.forEach((c, i) => { const x = (i % cols) * cw, y = HEAD + Math.floor(i / cols) * ch; drawCrop(c, x, y, cw, ch, hx + 140, hy - 40); label(`${CELLS.indexOf(c) + 1}  ${c.name}`, x + 26, y + 34, { size: 16, weight: 600, color: '#f1f5f4' }); });
    rules(cols, rows, cw, ch);
  },
};
function start() {
  G = frame.contentWindow.__g.old; THREE = G.THREE; G.begin(); G.paused = true; G.step(0.3);
  G.ch(7); setShot();
  H = handles(); BASE = snapshot();
  if (q.get('probe')) { const [hx, hy] = heroPx(); console.log(`镜头 ${G.camera.position.toArray().map(v => v.toFixed(2))} 主角在画面上 ${hx.toFixed(0)},${hy.toFixed(0)} 收起来的板子 ${H.hide.length} 鸟的材质 ${H.birds.length} 喷灌 ${H.spr.length}`); }
  (LAYOUTS[LAYOUT] || LAYOUTS.grid)();
  window.__sheetDone = true;
}
// 主角的模型（models/hero.glb）是另外加载的：等它到了再画，不然画进去的是加载期间顶替的机器人。最多等 20 秒
const T0 = performance.now();
frame.addEventListener('load', function wait() {
  const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
  const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);
  if (hero && !modelIn && performance.now() - T0 > 20000) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
  if (hero && (modelIn || performance.now() - T0 > 20000)) { try { start(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); window.__sheetDone = true; } }
  else setTimeout(wait, 100);
});
frame.src = '../escape.html?sheet=' + Date.now();
</script>
