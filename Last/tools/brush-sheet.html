<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>路边的植物 · 画面图</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 路边会被拨开的植物（Last/sidescroller/src/48-brush.js）的画面图：把横版原型装进一个看不见的窗口，
// 在第二章的林子里摆一丛试验用的植物，让主角从左边走过去，把一路的画面抄到这张图上。画面全部来自游戏本身的渲染。
// 要通过本地服务器打开（和原型同源才能读到它的画面）：http://127.0.0.1:8765/tools/brush-sheet.html?layout=keys
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：
//   layout —— keys 几种植物各一行，每行是走过去的几个瞬间（kinds=leaf,grass 排哪几种，at=-0.9,-0.4,… 身子离那一丛多远时各拍一格，mag=2.4 放大多少）/
//             film 一种植物走过去的一段连续画面排成一张图，拿去切成动图（kind=leaf，n=60 格，dt=0.05 每格隔几秒，w=640 每格宽，cols=6，mag=2 放大多少，keys=R,S 按住哪些键：R,S 走，R 跑）/
//             full 一格整幅画面（kind=leaf，at=0 身子走到哪里停下来拍）/
//             route 各章里真正摆好的那几丛，每一丛拍一格：主角走到手正在拨的时候（chs=2,3,7 哪几章，at=0.3，mag=1.6，cols=3，dir=L 从右边往左走过去）/
//             rfilm 章节里真正摆好的某一丛走过去的连续画面（ch=7，i=0 这一章的第几丛，从左往右数；其余和 film 一样；dir=L 往左走）
//   x=189.5 那一丛摆在哪里；z、s 摆在路的哪一边、多大（不给就用每一种自己的）；fx=0 不加暗角、颗粒和上下黑边；none=1 不摆植物（看原来的样子）
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'keys';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let G = null;

// 每一种：名字、手怎么拨、摆在路的哪一边（z 正的靠镜头）、多大
const KINDS = {
  leaf: { name: '大叶子 · 单手推开', z: 0.42, s: 1.35 },
  grass: { name: '高草 · 两手分开', z: 0.35, s: 1.0 },
  fern: { name: '蕨 · 往下按', z: -0.4, s: 1.05 },
  branch: { name: '低垂的树枝 · 托起来低头钻过去', z: -0.75, s: 1.0 },
};
const X0 = num('x', 189.5);
let PL = null;
function setup(kind) {
  const K = KINDS[kind];
  G.ch(2);
  for (const p of [...G.brush.BRUSH.list]) G.brush.drop(p);
  PL = q.get('none') === '1' ? null : G.brush.plant(kind, X0, num('z', K.z), { s: num('s', K.s) });
  G.tp(X0 - 3.2); G.P.facing = 1; G.step(0.5);
}
// 身子离那一丛还有多远（和 48-brush.js 里的 rel 一样：0 是伸直的手刚好碰到叶子）
const relNow = () => PL ? G.P.x - PL.gx[0] + 0.42 : G.P.x - X0 + 1.2;

// ---- 抄画面 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
function overlays(vig = 1) {                                            // 游戏页面上盖着的那几层（暗角、颗粒、上下黑边）是网页元素，抄不到，这里照样补上
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render() { G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH); if (FX) overlays(G.E.vig ?? 1); }
// 放大 mag 倍：截主角身边的一块（主角略偏左，前面留出那一丛的位置）
function crop(mag) {
  if (mag <= 1) return [0, 0, FW, FH];
  const cw = FW / mag, ch = FH / mag, p = new G.THREE.Vector3(G.P.x, G.P.y + 0.75, 0).project(G.camera);
  const cx = (p.x * 0.5 + 0.5) * FW + cw * 0.12 * G.P.facing, cy = (0.5 - p.y * 0.5) * FH;
  return [clamp(cx - cw / 2, 0, FW - cw), clamp(cy - ch / 2, 0, FH - ch), cw, ch];
}
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function tag(n, text, x, y) {
  ctx.save(); ctx.font = `600 16px ${FONT}`; const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 12, y + 10, w + (n ? 56 : 24), 38, 9); ctx.fill(); ctx.restore();
  if (n) label(n, x + 24, y + 38, { size: 25, weight: 600, color: '#f1f5f4' });
  label(text, x + (n ? 54 : 24), y + 35, { size: 16, weight: 600, color: '#f1f5f4' });
}
const HEAD = 96;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 44, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 67 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
// 走到 rel 到达 r 为止（一帧一帧地按住键走，植物的弹簧一路跟着算）
function walkTo(r, keys) { for (let i = 0; i < 2000 && relNow() < r; i++) G.hold(keys, 1 / 60); }

// 章节里真正摆好的那几丛：先把那一章装好，再从登记表里按 x 取出来
const CH_X = { 1: [-60, 104], 2: [104, 260], 3: [260, 392], 4: [392, 478], 5: [478, 542], 6: [542, 656], 7: [656, 772], 8: [772, 1100], 9: [1100, 1400] };
function realPlants(n) { G.ch(n); return G.brush.BRUSH.list.filter(p => p.x > CH_X[n][0] && p.x < CH_X[n][1]).sort((a, b) => a.x - b.x); }
const NAMES = { leaf: '大叶子', grass: '高草', fern: '蕨', branch: '低垂的树枝' };
function approach(Pl, left, back = 2.4) {                                // 把主角摆到这一丛的来路上，面朝它
  const d = left ? -1 : 1, gx = left ? Pl.gx[1] : Pl.gx[0];
  G.tp(gx - d * (0.42 + back)); G.P.facing = d; G.step(0.5);
  return () => (G.P.x - gx) * d + 0.42;
}

const LAYOUTS = {
  route() {
    const chs = (q.get('chs') || '2,3,7').split(',').map(Number), mag = num('mag', 1.6), at = num('at', 0.3), cols = num('cols', 3), left = q.get('dir') === 'L';
    const keys = (q.get('keys') || (left ? 'L,S' : 'R,S')).split(','), shots = [];
    for (const n of chs) realPlants(n).forEach((Pl, i) => shots.push([n, i, Pl]));
    const cw = Math.floor(FW / cols), ch = Math.round(cw * 9 / 16), rows = Math.ceil(shots.length / cols);
    size(FW, HEAD + rows * ch);
    header(q.get('title') || '路边的植物 · 摆在各章里的样子', [q.get('note') || `游戏里的画面：主角${left ? '从右往左' : '从左往右'}走过每一丛、手正在拨的时候；每格是 1080p 画面中间的一块，放大 ${mag} 倍。`]);
    shots.forEach(([n, i, Pl], k) => {
      const plants = realPlants(n), P2 = plants[i], rel = approach(P2, left);
      for (let f = 0; f < 2000 && rel() < at; f++) G.hold(keys, 1 / 60);
      render(); const [sx, sy, sw, sh] = crop(mag), cx = (k % cols) * cw, cy = HEAD + Math.floor(k / cols) * ch;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, sx, sy, sw, sh, cx, cy, cw, ch);
      tag(`${k + 1}`, `第${'一二三四五六七八九'[n - 1]}章 · ${NAMES[P2.kind]} · x ${P2.x.toFixed(1)}`, cx, cy);
    });
    ctx.fillStyle = '#0b0f11'; for (let c = 1; c < cols; c++) ctx.fillRect(c * cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2);
  },
  rfilm() {
    const n = num('ch', 7), i = num('i', 0), cnt = num('n', 60), cols = num('cols', 6), w = num('w', 640), h = Math.round(w * 9 / 16), dt = num('dt', 0.05), mag = num('mag', 2), left = q.get('dir') === 'L';
    const keys = (q.get('keys') || (left ? 'L,S' : 'R,S')).split(',');
    size(cols * w, Math.ceil(cnt / cols) * h);
    const Pl = realPlants(n)[i], rel = approach(Pl, left, 2.6);
    for (let f = 0; f < 2000 && rel() < num('from', -1.3); f++) G.hold(keys, 1 / 60);
    for (let k = 0; k < cnt; k++) {
      G.hold(keys, dt); render();
      const [sx, sy, sw, sh] = crop(mag); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(stage, sx, sy, sw, sh, (k % cols) * w, Math.floor(k / cols) * h, w, h);
    }
  },
  // 几种植物各一行：走过去的几个瞬间，放大看
  keys() {
    const kinds = (q.get('kinds') || 'leaf,grass,fern,branch').split(',').filter(k => KINDS[k]), at = (q.get('at') || '-0.9,-0.35,0.05,0.4,0.8,1.4').split(',').map(Number);
    const mag = num('mag', 2.4), cols = at.length, cw = Math.floor(FW / cols), ch = Math.round(cw * 9 / 16), keys = (q.get('keys') || 'R,S').split(',');
    size(FW, HEAD + kinds.length * ch);
    header(q.get('title') || '路边的植物 · 走过去的几个瞬间', [q.get('note') || '游戏里的画面，主角从左往右走过去；每格把主角身边那一块放大 ' + mag + ' 倍。一行一种植物，从左到右是走近、伸手、拨开、走过、叶子弹回来。']);
    kinds.forEach((k, r) => {
      setup(k);
      at.forEach((a, c) => {
        walkTo(a, keys); render();
        const [sx, sy, sw, sh] = crop(mag); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(stage, sx, sy, sw, sh, c * cw, HEAD + r * ch, cw, ch);
      });
      tag(`${r + 1}`, KINDS[k].name, 0, HEAD + r * ch);
    });
    ctx.fillStyle = '#0b0f11'; for (let c = 1; c < cols; c++) ctx.fillRect(c * cw - 1, HEAD, 2, kinds.length * ch); for (let r = 1; r < kinds.length; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2);
  },
  // 一段连续的画面排成一张图，拿去切成动图
  film() {
    const k = q.get('kind') || 'leaf', n = num('n', 60), cols = num('cols', 6), w = num('w', 640), h = Math.round(w * 9 / 16), dt = num('dt', 0.05), mag = num('mag', 2), keys = (q.get('keys') || 'R,S').split(',');
    size(cols * w, Math.ceil(n / cols) * h);
    setup(k); walkTo(num('from', -1.3), keys);
    for (let i = 0; i < n; i++) {
      G.hold(keys, dt); render();
      const [sx, sy, sw, sh] = crop(mag); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(stage, sx, sy, sw, sh, (i % cols) * w, Math.floor(i / cols) * h, w, h);
    }
  },
  // 一格整幅画面：走到 at 停下来
  full() {
    const k = q.get('kind') || 'leaf'; size(FW, FH); setup(k); walkTo(num('at', 0), (q.get('keys') || 'R,S').split(',')); G.step(num('t', 0)); render(); ctx.drawImage(stage, 0, 0);
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);                 // 主角的模型是另外加载的：等它到了再画，最多等 180 秒
      if (hero && !modelIn && performance.now() - t0 > 180000) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
      if (hero && (modelIn || performance.now() - t0 > 180000)) { G = w.__g; G.begin(); G.paused = true; G.step(0.3); done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'sidescroller.html') + '?sheet=' + Date.now() + (q.get('turn') !== null ? '&turn=' + q.get('turn') : '');   // turn=0：主角回到正侧面（和朝镜头侧过身的对比）
  });
}

(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.keys)(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
