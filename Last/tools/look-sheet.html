<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>标杆画面</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 标杆画面：同一屏游戏画面（第一章 · 躲探照灯），换几套整体的光和颜色，排在一起比较。
// 画面全部来自游戏本身的渲染，每一版只改了数值（雾、环境光、主光、探照灯、窗光的颜色和强弱），没有另画。
// 要通过本地服务器打开：http://127.0.0.1:8765/tools/look-sheet.html?layout=grid
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// step=2 换成第二步：光和颜色固定用第一步定下来的那一版，各版比的是画面里摆什么（SETS）；parts=pillars,line 可以临时加一版组合
// 注意：第一步（3 逆光）和第二步（第 8 格：柱子、行车梁、窗光、前景链条）的结果已经在 2026-11-12 搭进了游戏的第一章。
//   generated_images/scene-ch1-01*、scene-ch1-02* 是在那之前导出的；现在再用 step=1 / step=2 导出，底图已经变了，结果会和当时不一样。
//   要看游戏现在的样子，用 raw=1（原样的游戏画面）：layout=full 是这一屏，layout=scout&xs=2,14,30 是沿路的几屏；probe=1 报出镜头位置
// 网址参数：layout —— grid 各版排在一起（每格是整幅画面缩小一半）/ full 一版的整幅画面（look=第几版，从 0 数）/
//   crops 每一版在主角附近的原始大小；only=0,1,4 只排其中几版；fx=0 不加暗角、颗粒和上下黑边；
//   x 主角站在哪里；beam 探照灯照向哪里；pose 主角的姿势（stand / walk）；fore=1 把前景那层废料放回来
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'grid';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0', RAW = q.get('raw') === '1';   // raw=1：原样的游戏画面，不换光色、不摆东西、不动光晕
let G = null, H = null, BASE = null;

// ---- 这一屏：主角站在第二块矮墙的影子里，光束落在他右手边 ----
const SHOT = { x: num('x', 67.25), beam: num('beam', 69.9), pose: q.get('pose') || 'stand', settle: 1.6 };
function setShot() {
  G.ch(1);
  const W = G.zone(1).WATCH, t1 = Math.asin((SHOT.beam - W.cx) / W.amp);
  if (SHOT.pose === 'walk') {                                     // 慢慢走到位，停在后脚正迈过来的那一下
    G.tp(SHOT.x - 1.0); W.t = t1 - (SHOT.settle + 1.4) * W.w; G.step(SHOT.settle);
    G.hold(['R', 'S'], 0.9);
    for (let i = 0; i < 400; i++) { if (Math.abs(((G.hero().A.ph - 0.27) % 1 + 1.5) % 1 - 0.5) < 0.012) break; G.hold(['R', 'S'], 1 / 120, 1 / 120); }
  } else { G.tp(SHOT.x); W.t = t1 - SHOT.settle * W.w; G.step(SHOT.settle); }
  W.t = t1; G.step(1 / 600, 1 / 600);                             // 把光束摆到要的位置上
}

// ---- 找到场景里那几样可以调的东西 ----
function handles() {
  const h = { spots: [], points: [], layers: {}, cones: [], lambert: new Set() };
  for (const o of G.scene.children) {
    if (o.isHemisphereLight) h.hemi = o;
    else if (o.isDirectionalLight) { if (o.castShadow) h.key = o; else h.rim = o; }
    else if (o.isSpotLight) { if (o.castShadow) h.beam = o; else h.spots.push(o); }
    else if (o.isPointLight) h.points.push(o);
    else if (o.isPoints && o.material.size < 0.1) h.dust = o;
    else if (o.isMesh && o.material.vertexColors && o.material.isMeshLambertMaterial) h.ground = o;
  }
  // 第一章的布景板，按深度认：-32 后墙和高窗 / -30 窗光 / -16 拱廊 / -8 中景 / -3.2 立柱 / 6 前景 / -2.2 天窗的光束
  const NAME = { '-32': 'wall', '-30': 'winGlow', '-16': 'arcade', '-8': 'mid', '-3.2': 'cols', '6': 'fore', '-2.2': 'shafts' };
  const root = G.zone(1).root;
  root.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material;
    if (m.isMeshBasicMaterial && m.map && m.userData.own && NAME[String(o.position.z)]) h.layers[NAME[String(o.position.z)]] = o;
    else if (m.isMeshBasicMaterial && o.geometry.type === 'ConeGeometry') h.cones.push(o);
    else if (m.isMeshBasicMaterial && o.geometry.type === 'CircleGeometry') h.eye = o;       // 探照灯的“眼睛”
    else if (m.isMeshLambertMaterial) h.lambert.add(m);
  });
  root.traverse(o => { if (o.isSprite && o.parent === h.eye.parent) h.halo = o; });           // 眼睛外面那一大圈光晕
  return h;
}
// 光晕换一张衰减更柔和的贴图：原来那张的边缘是一条看得出来的圆
function softGlow() {
  const c = frame.contentDocument.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256);
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const r = Math.hypot(x - 127.5, y - 127.5) / 127.5, a = r >= 1 ? 0 : 0.62 * Math.pow(1 - r, 2.6) + 0.5 * Math.exp(-r * r * 46), i = (y * 256 + x) * 4;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = 255; im.data[i + 3] = Math.min(255, a * 255);
  }
  g.putImageData(im, 0, 0);
  const t = new G.THREE.CanvasTexture(c); t.colorSpace = G.THREE.SRGBColorSpace; return t;
}
const snapC = c => c.getHex();
function snapshot() {                                             // 记下原来的数值，换下一版之前先还原
  const s = { fog: snapC(G.scene.fog.color), bg: snapC(G.scene.background), fogD: G.scene.fog.density,
    hemiS: snapC(H.hemi.color), hemiG: snapC(H.hemi.groundColor), hemiI: H.hemi.intensity,
    keyC: snapC(H.key.color), keyI: H.key.intensity, rimC: snapC(H.rim.color), rimI: H.rim.intensity,
    beamC: snapC(H.beam.color), beamI: H.beam.intensity,
    dustC: snapC(H.dust.material.color), dustO: H.dust.material.opacity, ground: snapC(H.ground.material.color),
    spots: H.spots.map(l => [snapC(l.color), l.intensity]), points: H.points.map(l => [snapC(l.color), l.intensity]),
    layers: {}, cones: H.cones.map(c => [snapC(c.material.color), c.material.opacity]), lambert: [...H.lambert].map(m => [m, snapC(m.color)]),
    eyeC: snapC(H.eye.material.color), haloC: snapC(H.halo.material.color), haloO: H.halo.material.opacity, haloS: H.halo.scale.x };
  for (const k in H.layers) s.layers[k] = [snapC(H.layers[k].material.color), H.layers[k].material.opacity];
  return s;
}
function applyLook(L) {
  const B = BASE, S = G.scene, v = k => L[k] ?? B[k], C = hex => new G.THREE.Color(hex);
  S.fog.color.setHex(v('fog')); S.background.setHex(L.bg ?? L.fog ?? B.bg); S.fog.density = v('fogD');
  H.hemi.color.setHex(v('hemiS')); H.hemi.groundColor.setHex(v('hemiG')); H.hemi.intensity = v('hemiI');
  H.key.color.setHex(v('keyC')); H.key.intensity = v('keyI'); H.rim.color.setHex(v('rimC')); H.rim.intensity = v('rimI');
  H.beam.color.setHex(v('beamC')); H.beam.intensity = v('beamI');
  H.dust.material.color.setHex(v('dustC')); H.dust.material.opacity = v('dustO'); if (Array.isArray(L.ground)) H.ground.material.color.setRGB(...L.ground); else H.ground.material.color.setHex(v('ground'));   // 地面：十六进制颜色，或者直接给三个乘数
  H.spots.forEach((l, i) => { l.color.setHex(L.spotC ?? B.spots[i][0]); l.intensity = B.spots[i][1] * (L.spotK ?? 1); });
  H.points.forEach((l, i) => { l.color.setHex(B.points[i][0]); l.intensity = B.points[i][1] * (L.pointK ?? 1); });
  for (const k in H.layers) {                                     // 布景板：tint 乘在贴图上的颜色，k 再乘一个亮度，op 不透明度
    const m = H.layers[k].material, o = (L.layers || {})[k] || {};
    m.color.setHex(o.tint ?? B.layers[k][0]); if (o.k) m.color.multiplyScalar(o.k); m.opacity = o.op ?? B.layers[k][1];
    H.layers[k].visible = o.show ?? (SHOT_FIX[k] ?? true);
  }
  H.cones.forEach((c, i) => { c.material.color.setHex(L.coneC ?? L.beamC ?? B.cones[i][0]); c.material.opacity = B.cones[i][1] * (L.coneK ?? 1); });
  H.eye.material.color.setHex(L.eyeC ?? L.beamC ?? B.eyeC);
  H.halo.material.color.setHex(L.haloC ?? L.beamC ?? B.haloC); H.halo.material.opacity = B.haloO * (L.haloK ?? 1); H.halo.scale.setScalar(B.haloS * 1.45 * (L.haloS ?? 1));
  for (const [m, hex] of B.lambert) { m.color.setHex(hex); if (L.matTint) m.color.multiply(C(L.matTint)); if (L.matK) m.color.multiplyScalar(L.matK); }
}

// ---- 抄画面：先在一张整幅大小的画布上备好，再缩到图上 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
// 游戏页面上盖着的那几层：暗角、颗粒、上下黑边（它们是网页元素，抄画面时抄不到，在这里照样补上）
function overlays() {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, 'rgba(0,0,0,.3)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render(L, fx = FX) {
  if (RAW) { /* 原样的游戏画面，什么都不改 */ }
  else if (STEP === 2) { applyLook(PICK); clearSet(); SET = new G.THREE.Group(); G.scene.add(SET); for (const p of L.parts) PARTS[p](); }   // 第二步：光色不变，换布景
  else applyLook(L);
  G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH); if (fx) overlays();
}
function drawFull(L, dx, dy, dw, dh) {                            // 整幅画面，缩到 dw × dh
  render(L); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, dx, dy, dw, dh);
}
function drawCrop(L, dx, dy, dw, dh, cx, cy) {                     // 原始大小的一块，中心在整幅画面的 (cx, cy)
  render(L); const sx = Math.max(0, Math.min(FW - dw, cx - dw / 2)), sy = Math.max(0, Math.min(FH - dh, cy - dh / 2));
  ctx.drawImage(stage, sx, sy, dw, dh, dx, dy, dw, dh);
}
function heroPx() { const p = new G.THREE.Vector3(G.P.x, G.P.y + 0.62, 0).project(G.camera); return [(p.x * 0.5 + 0.5) * FW, (0.5 - p.y * 0.5) * FH]; }
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
const HEAD = 96;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 44, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 67 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }

// 这一屏里先去掉的东西（每一版都一样）：前景那层黑色的废料，在这个镜头里成了横在地面中间的一道黑带
const SHOT_FIX = q.get('fore') === '1' ? {} : { fore: false };

// ---- 各版的数值。没写的项沿用游戏现在的数值 ----
const ALL = [
  // —— 1 到 4 比的是明暗：光从哪里来，四周有多黑（颜色都是现在的冷青灰）——
  { name: '现在的样子', note: '四周都看得见一点，明暗比较平均' },
  { name: '更黑', note: '四周压到接近全黑，只剩探照灯和它照亮的那一块地',
    fog: 0x0a0f11, fogD: 0.028, hemiS: 0x6f8890, hemiG: 0x0a0d0e, hemiI: 0.22, keyI: 0.16, rimI: 0.4, beamI: 46, dustO: 0.3,
    layers: { winGlow: { op: 0.5 } }, coneK: 1.2 },
  { name: '逆光', note: '后墙和高窗亮起来，前面的东西都成了剪影',
    fog: 0x26353c, fogD: 0.026, hemiI: 0.45, keyI: 0.5, rimI: 1.1, layers: { wall: { k: 30 } } },
  { name: '灰雾', note: '整个厂房泡在灰白的雾里，颜色几乎抽掉',
    fog: 0x545b5e, fogD: 0.032, hemiS: 0xb9bfc0, hemiG: 0x2a2c2d, hemiI: 0.7, keyC: 0xdfe3e4, keyI: 0.45, rimC: 0xd0d4d5, rimI: 0.9, beamC: 0xf4f6f6, beamI: 34,
    dustC: 0xe2e6e6, dustO: 0.35, ground: 0xfff0e8, layers: { wall: { tint: 0xd8dcdc }, winGlow: { tint: 0xd9dede, op: 0.9 } }, coneC: 0xf0f3f3 },
  // —— 5 到 8 比的是颜色（明暗和“现在的样子”一样）——
  { name: '冷蓝', note: '像月光下的夜，蓝得更明确',
    fog: 0x14263f, fogD: 0.026, hemiS: 0x7fa6d8, hemiG: 0x0d1626, hemiI: 0.6, keyC: 0xb8d4ff, keyI: 0.8, rimC: 0x86b4ee, rimI: 0.75, beamC: 0xe6f0ff, dustC: 0xbcd6ff,
    ground: 0xc8d8ff, layers: { wall: { tint: 0x9fc4ff }, winGlow: { tint: 0x8fb8ff }, arcade: { tint: 0x9bb8e8 }, mid: { tint: 0x9bb8e8 } } },
  { name: '墨绿', note: '发霉的旧厂房，带一点病态的绿',
    fog: 0x1c3329, fogD: 0.026, hemiS: 0x93b89f, hemiG: 0x111a14, hemiI: 0.6, keyC: 0xd2ecd4, keyI: 0.8, rimC: 0x9fd0ae, rimI: 0.7, beamC: 0xeaf6e6, dustC: 0xcfe8d0,
    ground: 0xd0f0d8, layers: { wall: { tint: 0xa8e0b8 }, winGlow: { tint: 0x98d8a8 } } },
  { name: '锈红', note: '整个厂房都是暖的，像炉火映着烟尘',
    fog: 0x2b1810, fogD: 0.027, hemiS: 0xb07a58, hemiG: 0x160d08, hemiI: 0.5, keyC: 0xffc890, keyI: 0.55, rimC: 0xff8a40, rimI: 1.0, beamC: 0xffe8c8, dustC: 0xffc890,
    ground: [1.5, 0.82, 0.6], layers: { wall: { tint: 0xff9a50, k: 40 }, winGlow: { tint: 0xff7a30 }, arcade: { tint: 0xd8a888 }, mid: { tint: 0xd8a888 } } },
  { name: '冷暖对比', note: '厂房是冷的，只有尽头的墙和高窗映着暖光',
    fog: 0x1b2a33, fogD: 0.026, layers: { wall: { tint: 0xff6a20, k: 160 }, winGlow: { tint: 0xff8a40 } } },
];
// 试数值用：json=[{...}, {...}] 直接从网址给出几版（颜色写成 "0x1b2a33" 这样的字符串），不用改这个文件
const TRY = q.get('json') ? [].concat(JSON.parse(q.get('json'), (k, v) => typeof v === 'string' && /^0x[0-9a-f]+$/i.test(v) ? parseInt(v, 16) : v)) : null;

// ================= 第二步：画面里摆什么、前后分几层 =================
// 光和颜色固定用第一步定下来的「3 逆光」（颜色还是原来的冷青灰）。每一版往同一屏里临时摆一样东西，
// 都是粗模：方块，或者画在板子上的剪影，只为了看大的形状和位置。游戏本身没有改，定下来以后再照着搭进第一章的代码
const STEP = num('step', 1), PICK = ALL[2];
let SET = null;                                                   // 这一版临时摆进场景里的东西
function clearSet() {
  if (!SET) return;
  G.scene.remove(SET);
  SET.traverse(o => {                                             // 借来的机器人和游戏共用模型，模型不能释放；给它们另配的深色材质是自己的
    if (o.geometry && !o.userData.borrowed) o.geometry.dispose();
    if (o.material && (!o.userData.borrowed || o.userData.ownMat)) { if (o.material.map && !o.userData.borrowed) o.material.map.dispose(); o.material.dispose(); }
  });
  SET = null;
}
const INK = '#0a1012', CONC = 0x2a3336, IRON = 0x12181a;          // 远处剪影的墨色、混凝土、深色铁件：都取自游戏里现成的颜色
const lamb = hex => new G.THREE.MeshLambertMaterial({ color: hex });
function block(w, h, d, x, y, z, m, parent = SET) {               // 实心方块：x、z 是中心，y 是底面
  const o = new G.THREE.Mesh(new G.THREE.BoxGeometry(w, h, d), m); o.position.set(x, y + h / 2, z); o.castShadow = o.receiveShadow = true; parent.add(o); return o;
}
// 剪影板：和游戏里的布景板同一个做法 —— 画在画布上（单位是米，y 向上），贴到深度 z 的一块平面上
function board(x1, x2, y1, y2, z, ppm, draw, o = {}) {
  const THREE = G.THREE, c = frame.contentDocument.createElement('canvas');
  const k = Math.min(1, 4096 / ((x2 - x1) * ppm), 4096 / ((y2 - y1) * ppm)), s = ppm * k;
  c.width = Math.round((x2 - x1) * s); c.height = Math.round((y2 - y1) * s);
  const g = c.getContext('2d');
  if (o.blur) g.filter = `blur(${o.blur}px)`;
  if (o.floor) g.setTransform(s, 0, 0, s, -x1 * s, -y1 * s); else g.setTransform(s, 0, 0, -s, -x1 * s, y2 * s);
  draw(g);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, fog: o.fog !== false, opacity: o.opacity ?? 1 });
  if (o.additive) mat.blending = THREE.AdditiveBlending;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x2 - x1, y2 - y1), mat);
  if (o.floor) { m.rotation.x = -Math.PI / 2; m.position.set((x1 + x2) / 2, o.floor, (y1 + y2) / 2); }   // 平铺在地上：这时 y1、y2 是 z 的范围，画布上方是远处
  else m.position.set((x1 + x2) / 2, (y1 + y2) / 2, z);

  // 探照灯后面两侧停掉的大设备：左边一大一小两只储罐带一段走道，右边一只架在钢架上的料仓

function start() {

// 主角的模型（models/hero.glb）是另外加载的：等它到了再画，不然画进去的是加载期间顶替的机器人。最多等 20 秒
