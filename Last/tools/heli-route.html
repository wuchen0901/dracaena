<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第十一章 · 沿路的画面</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 第十一章（夜搜）沿路的画面：把横版原型装进一个看不见的窗口，让一个自动玩家把这一章从头玩到尾，玩到几个要紧的时刻就把整幅画面抄到图上。
// 画面全部来自游戏本身的渲染。要通过本地服务器打开：http://127.0.0.1:8771/tools/heli-route.html?layout=route
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：layout —— route 八个时刻排在一起（每格是整幅画面缩小一半）/ full 其中一个时刻的整幅画面（shot=6）/
//   check 自动玩家把这一章玩三遍：灯一扫过去就跑、犹豫一秒再跑、犹豫两秒再跑（delays=0,1,2,3 换成别的几种），报出每一段跑了多久、被发现几次、
//   直升机什么时候飞走（结果写在图上和控制台里）；fx=0 不加暗角、颗粒和上下黑边
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'route';
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0', X = 1800;
let G = null, H = null, COVERS = null;

// ---- 自动玩家：躲在有顶的地方（走到靠右的那一头等着），等灯从头顶扫过去、往右走远了就跑到下一处；躲进桥下以后不动，等它飞走，再一直往右走 ----
// delay：灯扫过去以后再犹豫几秒才跑
const bot = { prev: 0, pd: 0, going: false, passed: false, ok: -1, t: 0, delay: 0, log: [],
  reset(delay = 0) { Object.assign(this, { prev: H.bx, pd: 0, going: false, passed: false, ok: -1, t: 0, delay, log: [] }); },
  tick(dt = 0.1) {
    const P = G.P, ci = COVERS.findIndex(([a, b]) => P.x > a + 0.15 && P.x < b - 0.15), dir = Math.sign(H.bx - this.prev), turned = this.pd < 0 && dir > 0; this.prev = H.bx; if (dir) this.pd = dir; let keys = [];
    if (G.state() === 'play' && G.ctl()) {
      if (H.st !== 'hunt') keys = ['R'];
      else if (H.t < 8) keys = P.x < X + 30 ? ['R'] : [];                     // 直升机还在飞过来：走到候车亭前面等着
      else if (H.stage >= COVERS.length) keys = [];
      else {
        const safe = ci >= 0 || P.x < X + 31, d = H.bx - P.x;
        if (safe && !this.going) {
          if (d < -0.5 || (turned && d < 6)) this.passed = true;              // 灯从头顶扫过去了，或者就在跟前扫到头、掉头了
          if (ci >= 0 && P.x < COVERS[ci][1] - 0.9) keys = ['R'];             // 等的时候先走到这一处靠右的那一头
          if (this.passed && dir > 0 && d > 2.6) { if (this.ok < 0) this.ok = this.t; if (this.t - this.ok >= this.delay) { this.going = true; this.go = this.t; } }
        }
        if (this.going) keys = d > 2.45 || d < -2.6 || ci >= 0 ? ['R'] : [];   // 追上灯了就停一下
      }
    }
    const s0 = H.stage, c0 = H.caught, st0 = H.st; G.hold(keys, dt); this.t += dt;
    if (H.stage !== s0) this.log.push({ k: 'stage', n: H.stage, t: this.t, dash: this.t - (this.go ?? this.t) });
    if (c0 === 0 && H.caught > 0) this.log.push({ k: 'caught', x: P.x - X, t: this.t });
    if (H.st !== st0) this.log.push({ k: H.st, t: this.t });
    if (H.stage !== s0 || H.caught > 0) { this.going = false; this.passed = false; this.ok = -1; }
  },
  until(pred, max = 90) { for (let n = 0; !pred() && n < max * 10; n++) this.tick(); },
};

// ---- 八个时刻：一路玩下来，一个接一个 ----
const SHOTS = [
  ['起了雾的公路，光只在孩子周围', () => { G.hold(['R'], 2.2); G.step(0.8); }],
  ['远处飞来一架直升机，灯在野地里扫', () => bot.until(() => H.st === 'hunt' && H.t > 6.4)],
  ['躲进候车亭，灯从头顶扫过去', () => bot.until(() => H.stage === 1 && Math.abs(H.bx - G.P.x) < 0.8)],
  ['灯扫过去了，跑向集装箱', () => bot.until(() => H.stage === 1 && bot.going && G.P.x > X + 46.5)],
  ['站在没遮没挡的地方：被发现了', () => { bot.until(() => H.stage === 2 && bot.going && G.P.x > X + 65); for (let n = 0; H.caught < 0.5 && n < 400; n++) G.step(0.05); }],
  ['断桥底下，直升机压低了来回找', () => { G.step(2.6); bot.reset(); bot.until(() => H.stage === 4 && H.hid > 5.2, 150); }],
  ['找不到，掉头飞走了', () => { bot.until(() => H.st === 'leave'); for (let n = 0; H.st === 'leave' && H.t < 5.6 && n < 100; n++) G.step(0.1); }],
  ['林子里，萤火虫又出来了', () => { bot.until(() => G.P.x > X + 131); G.step(1.5); }],
];

// ---- 抄画面 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
function overlays(vig = 1) {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render() {
  G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH);
  document.body.dataset.render = JSON.stringify({ calls: G.renderer.info.render.calls, triangles: G.renderer.info.render.triangles });
  const doc = frame.contentDocument, f = +(doc.getElementById('fade').style.opacity || 0); if (f > 0) { sctx.fillStyle = `rgba(4,6,7,${f})`; sctx.fillRect(0, 0, FW, FH); }
  if (FX) overlays(G.E.vig ?? 1);
  const hint = doc.getElementById('hint');                                    // 画面下方的那一行提示也抄过来
  if (hint.style.opacity === '1' && G.state() === 'play') { sctx.save(); sctx.font = `400 20px ${FONT}`; sctx.textAlign = 'center'; sctx.fillStyle = '#dfe7e5'; sctx.shadowColor = 'rgba(0,0,0,.8)'; sctx.shadowBlur = 6; sctx.fillText(hint.textContent, FW / 2, FH * 0.89 - 6); sctx.restore(); }
}
function label(text, x, y, o = {}) {
  ctx.save(); ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function tag(n, text, x, y) {
  ctx.save(); ctx.font = `600 16px ${FONT}`; const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 12, w + 56, 40, 9); ctx.fill(); ctx.restore();
  label(n, x + 26, y + 42, { size: 26, weight: 600, color: '#f1f5f4' }); label(text, x + 56, y + 38, { size: 16, weight: 600, color: '#f1f5f4' });
}
const HEAD = 104;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 46, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 70 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
function start(delay = 0) { G.ch(11); G.step(0.3); bot.reset(delay); }

const LAYOUTS = {
  route() {
    const cols = 2, rows = Math.ceil(SHOTS.length / cols), cw = FW / cols, ch = cw * FH / FW;
    size(FW, HEAD + rows * ch);
    header('第十一章 · 夜搜 · 沿路的画面', ['游戏里原样的画面（每格是 1080p 整幅画面缩小一半），由一个自动玩家从头玩到尾，玩到这八个时刻各截一幅。',
      '直升机的探照灯沿着公路来回扫；候车亭、集装箱、铁皮棚、断桥底下四处灯照不进去。躲进断桥底下九秒，它找不到，掉头飞走。']);
    start();
    SHOTS.forEach(([name, go], i) => {
      go(); render();
      const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, cx, cy, cw, ch); tag(String(i + 1), name, cx, cy + ch * 0.06);
    });
    ctx.fillStyle = '#0b0f11'; ctx.fillRect(cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2);
  },
  full() { size(FW, FH); start(); const n = +(q.get('shot') || 6); for (let i = 0; i < n; i++) SHOTS[i][1](); render(); ctx.drawImage(stage, 0, 0); },
  check() {
    const delays = (q.get('delays') || '0,1,2').split(',').map(Number), rows = [], out = []; size(FW, 260 + delays.length * 120);
    for (const delay of delays) {
      start(delay); bot.until(() => G.P.x > X + 148 || bot.t > 300, 320);
      const L = bot.log, st = L.filter(e => e.k === 'stage'), caught = L.filter(e => e.k === 'caught'), leave = L.find(e => e.k === 'leave'), gone = L.find(e => e.k === 'gone');
      out.push({ delay, end: +(G.P.x - X).toFixed(1), t: +bot.t.toFixed(1), caught: caught.map(e => [+e.x.toFixed(1), +e.t.toFixed(1)]), stages: st.map(e => [e.n, +e.t.toFixed(1), +e.dash.toFixed(1)]), leave: leave && +leave.t.toFixed(1), gone: gone && +gone.t.toFixed(1) });
      rows.push([`灯扫过去以后${delay ? `犹豫 ${delay} 秒再` : '马上'}跑：走到 x = ${(G.P.x - X).toFixed(1)}（终点 148），用了 ${bot.t.toFixed(0)} 秒，被发现 ${caught.length} 次${caught.length ? '（在 x = ' + caught.map(e => e.x.toFixed(1)).join('、') + '）' : ''}。`,
        `　到四处的时间：${st.map(e => `第 ${e.n} 处 ${e.t.toFixed(0)} 秒（这一段跑了 ${e.dash.toFixed(1)} 秒）`).join('，')}；直升机在第 ${leave ? leave.t.toFixed(0) : '—'} 秒掉头，第 ${gone ? gone.t.toFixed(0) : '—'} 秒飞远。`]);
    }
    header('第十一章 · 自动玩家从头玩到尾', ['躲在有顶的地方，等灯从头顶扫过去、往右走远了就跑到下一处；躲进断桥底下以后不动，等直升机飞走，再一直往右走到头。']);
    rows.forEach((r, i) => { label(r[0], 70, 170 + i * 120, { size: 20, shadow: false, color: /被发现 0 次/.test(r[0]) ? '#c3cfce' : '#ffb0a0' }); label(r[1], 70, 204 + i * 120, { size: 17, shadow: false, color: '#8fa0a0' }); });
    console.log(JSON.stringify(out));
    window.__heliCheck = out;
    document.body.dataset.check = JSON.stringify(out); // --dump-dom 也能读取完整结果，不依赖调试端口
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);
      if (hero && (modelIn || performance.now() - t0 > 20000)) { G = w.__g.old; G.begin(); G.paused = true; H = G.zone(11).H; COVERS = G.zone(11).COVERS; done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'escape.html') + '?ch=18&sheet=' + Date.now();   // 游戏里的第 18 章就是旧第十一章（夜搜）
  });
}
(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.route)(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
