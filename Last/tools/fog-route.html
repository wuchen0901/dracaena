<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第七章（雾）· 沿路的画面</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 《逃出工厂》第七章“雾”（escape/68-e8-fog.js）沿路的画面：把游戏装进一个看不见的窗口，让一个自动玩家把这一章从头玩到尾，玩到几个要紧的时刻就把整幅画面抄到图上。
// 照 heli-route.html 的写法。要通过本地服务器打开：http://127.0.0.1:8783/tools/fog-route.html?layout=route
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：layout —— route 十个时刻排在一起（每格是整幅画面缩小一半）/ full 其中一个时刻的整幅画面（shot=7）/
//   check 自动玩家把这一章玩几遍（margins=2.9,2.2,1.6：灯离多近就站住），报出用了多久、被抓几次、那一场每一段在第几秒、押送的人从主角身后多近的地方过去；
//   fx=0 不加暗角、颗粒和上下黑边
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'route';
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0';
let G = null, Z = null, X = 0;

// ---- 自动玩家：一直往右走；有一盏灯照着的地方离主角不到 margin 米（或者正朝主角扫过来、不到 margin + 2 米）就站住；到了倒树、石墙跟前就跳 ----
const bot = { t: 0, margin: 2.9, log: [], ph: -1, wasC: false, minPass: 99,
  reset(margin = 2.9) { Object.assign(this, { t: 0, margin, log: [], ph: -1, wasC: false, minPass: 99 }); },
  tick(dt = 0.1) {
    const P = G.P, S = Z.S, SR = Z.SR, lockAB = S.ph >= 2 && S.ph <= 4;
    const near = SR.filter(s => s.on > 0.4 && s.mode !== 'off' && !(lockAB && (s === SR[0] || s === SR[1])));
    const danger = near.some(s => Math.abs(s.ax - P.x) < this.margin || (Math.abs(s.ax - P.x) < this.margin + 2 && Math.sign(P.x - s.ax) === Math.sign(s.p1 - s.lx)));
    const ks = [];
    if (G.state() === 'play' && G.ctl() && !danger) { ks.push('R'); if ([X + 30, X + 84].some(o => o > P.x && o - P.x < 1.0)) ks.push('J'); }
    G.hold(ks, dt); this.t += dt;
    if (Z.W.caught > 0 && !this.wasC) this.log.push({ k: 'caught', x: P.x - X, t: this.t });
    this.wasC = Z.W.caught > 0;
    if (S.ph !== this.ph) { this.log.push({ k: 'ph', n: S.ph, x: P.x - X, t: this.t }); this.ph = S.ph; }
    if (S.ph === 5) this.minPass = Math.min(this.minPass, Math.abs(S.gx - P.x));
  },
  until(pred, max = 90) { for (let n = 0; !pred() && n < max * 10; n++) this.tick(); },
};
const still = () => Math.abs(G.P.vx) < 0.05 && G.P.grounded;
const SHOTS = [
  ['出了林子，起雾了', () => { G.hold(['R'], 3.0); G.step(0.6); }],
  ['山下的雾里亮起一盏手电', () => bot.until(() => Z.SR[0].on > 0.9 && Z.SR[0].mode === 'sweep')],
  ['光照过来：站住别动，缩起身子', () => bot.until(() => still() && Z.SR[0].on > 0.9 && Math.abs(Z.SR[0].ax - G.P.x) < 0.7)],
  ['跳过横在路上的倒树', () => bot.until(() => G.P.x > X + 29.6 && !G.P.grounded)],
  ['石头后面蹲着一个人', () => { bot.until(() => Z.S.ph === 1 && G.P.x > X + 51); G.step(0.3); }],
  ['灯扫到他，他跳起来就跑；几盏灯一齐落到他身上', () => { bot.until(() => Z.S.ph >= 3); G.step(0.4); }],
  ['两个看守夹着他走过去', () => bot.until(() => Z.S.ph >= 4 && Z.S.t > 5)],
  ['押着他下山：从主角身后过去', () => bot.until(() => Z.S.ph === 5 && (Z.S.gx < G.P.x + 1.5 || Z.S.t > 14))],
  ['翻过干砌石墙', () => bot.until(() => G.P.x > X + 83.6 && !G.P.grounded, 120)],
  ['下山，雾淡下去', () => bot.until(() => G.P.x > X + 116, 120)],
];

// ---- 抄画面 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
function overlays(vig = 1) {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render() {
  G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH);
  const doc = frame.contentDocument, f = +(doc.getElementById('fade').style.opacity || 0); if (f > 0) { sctx.fillStyle = `rgba(4,6,7,${f})`; sctx.fillRect(0, 0, FW, FH); }
  if (FX) overlays(G.E.vig ?? 1);
  const hint = doc.getElementById('hint');
  if (hint.style.opacity === '1' && G.state() === 'play') { sctx.save(); sctx.font = `400 20px ${FONT}`; sctx.textAlign = 'center'; sctx.fillStyle = '#dfe7e5'; sctx.shadowColor = 'rgba(0,0,0,.8)'; sctx.shadowBlur = 6; sctx.fillText(hint.textContent, FW / 2, FH * 0.9); sctx.restore(); }
}
function label(text, x, y, o = {}) {
  ctx.save(); ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function tag(n, text, x, y) {
  ctx.save(); ctx.font = `600 16px ${FONT}`; const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 12, w + 56, 40, 9); ctx.fill(); ctx.restore();
  label(n, x + 26, y + 42, { size: 26, weight: 600, color: '#f1f5f4' }); label(text, x + 56, y + 38, { size: 16, weight: 600, color: '#f1f5f4' });
}
const HEAD = 104;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 46, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 70 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
function start(margin) { G.ch(7); G.step(0.3); bot.reset(margin); }

const LAYOUTS = {
  route() {
    const cols = 2, rows = Math.ceil(SHOTS.length / cols), cw = FW / cols, ch = cw * FH / FW;
    size(FW, HEAD + rows * ch);
    header('《逃出工厂》第七章 · 雾 · 沿路的画面', ['游戏里原样的画面（每格是 1080p 整幅画面缩小一半），由一个自动玩家从头玩到尾，玩到这十个时刻各截一幅。',
      '看守打着手电在雾里搜：光照到身上时站住不动就看不出来，在光里动就被盯上。半路上一个逃出来的人一跑，几盏灯一齐落到他身上，他被押下山去。']);
    start();
    SHOTS.forEach(([name, go], i) => {
      go(); render();
      const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, cx, cy, cw, ch); tag(String(i + 1), name, cx, cy + ch * 0.06);
      console.log(`第 ${i + 1} 幅：${name} · 主角在 x = ${(G.P.x - X).toFixed(1)}，第 ${bot.t.toFixed(1)} 秒`);
    });
    ctx.fillStyle = '#0b0f11'; ctx.fillRect(cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2);
  },
  full() { size(FW, FH); start(); const n = +(q.get('shot') || 7); for (let i = 0; i < n; i++) SHOTS[i][1](); render(); ctx.drawImage(stage, 0, 0); },
  check() {
    const margins = (q.get('margins') || '2.9,2.2,1.6').split(',').map(Number), rows = [], out = []; size(FW, 260 + margins.length * 120);
    for (const margin of margins) {
      start(margin); bot.until(() => G.STORY.ch === 8 || bot.t > 300, 320);
      const caught = bot.log.filter(e => e.k === 'caught'), phs = bot.log.filter(e => e.k === 'ph');
      const o = { margin, t: +bot.t.toFixed(1), end: +(G.P.x - X).toFixed(1), reached: G.STORY.ch === 8, caught: caught.map(e => [+e.x.toFixed(1), +e.t.toFixed(1)]), ph: phs.map(e => [e.n, +e.t.toFixed(1), +e.x.toFixed(1)]), minPass: +bot.minPass.toFixed(1) };
      out.push(o); console.log('检查 · ' + JSON.stringify(o));
      rows.push([`灯离 ${margin} 米就站住：${o.reached ? '走到了结尾' : `停在 x = ${o.end}`}，用了 ${o.t.toFixed(0)} 秒，被抓 ${caught.length} 次${caught.length ? '（在 x = ' + caught.map(e => e.x.toFixed(1)).join('、') + '）' : ''}`,
        `　那一场：${phs.map(e => `${e.n}@${e.t.toFixed(0)}s(x ${e.x.toFixed(0)})`).join(' → ')}；押送的人离主角最近 ${o.minPass} 米`]);
    }
    header('《逃出工厂》第七章 · 雾 · 自动玩家从头玩到尾', ['一直往右走；灯照着的地方离主角不到“几米”就站住（灯正朝他扫过来时多留两米）；到了倒树、石墙跟前就跳。']);
    rows.forEach((r, i) => { label(r[0], 70, 170 + i * 120, { size: 20, shadow: false, color: /被抓 0 次/.test(r[0]) ? '#c3cfce' : '#ffb0a0' }); label(r[1], 70, 204 + i * 120, { size: 17, shadow: false, color: '#8fa0a0' }); });
    document.body.dataset.check = JSON.stringify(out);
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);
      if (hero && (modelIn || performance.now() - t0 > 20000)) { G = w.__g; G.begin(); G.paused = true; Z = G.zone(7); X = G.CHAPTERS[6].x0; done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'escape.html') + '?ch=7&sheet=' + Date.now();
  });
}
(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.route)(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
