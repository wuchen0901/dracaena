<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>落地动作 · 对比图</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 从高处落地的动作（见 Last/sidescroller/src/42-character-anim.js 的 LAND / landStyle / landAt），在游戏里拍下来排在一起看。画面全部来自游戏本身的渲染。
// 要通过本地服务器打开（和原型同源才能读到它的画面）：http://127.0.0.1:8765/tools/landing-sheet.html?layout=strip
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png <宽> <高>（宽、高见控制台里报的图的大小）
// 网址参数：
//   layout —— strip 每种情况一行，按时间排成一格一格（ts=0,0.05,… 拍哪几个时刻：相对着地的那一刻，秒）/
//             film 几种情况并排成一格，连续拍 n 格（dt 每格隔几秒，从 t0 秒开始），拿去切成动图（每格 cw × ch，cols 一行几格）/
//             check 不画图，在控制台里报出自检的结果
//   rows=stand:2,run:3.3,… 拍哪几种情况：stand 站着掉下去 / run 跑着冲下去（一直按着 →），后面是落差（米）；
//        再加一段数字（run:3.3:1）就是强制用这一种落地，不让游戏自己挑
//   view=side 镜头摆到主角正侧面（d 多远，yo 对准离地多高）/ game 用游戏自己的镜头，以主角为中心裁一块（px 放大几倍）
//   chap=1&x=3 在哪一章的哪里拍（默认第一章开头：游戏一开始就是从这里的格栅掉下来）
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'strip';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
let G = null, NOMODEL = false;
const ROWS = (q.get('rows') || 'stand:1.2,stand:2,stand:3.3,run:2,run:3.3').split(',').map(r => { const [c, h, s] = r.split(':'); return { c, h: +h, s: +(s || 0) }; });
const VIEW = q.get('view') || 'side', CHAP = num('chap', 1), X0 = num('x', 3);

// ---- 一次落地：站好，抬到 h 米高松手，按固定的小步往前推；每到 want 里的一个时刻就交给 shoot 拍一格 ----
// 时刻都相对着地的那一刻：先空跑一遍量出着地要多久。row.style 记下游戏这一下挑了哪一种落地（0 是只软了一下膝盖）
const DT = 1 / 120;
function setup(row) {
  G.LAND.force = row.s; G.ch(CHAP); G.tp(X0); G.P.facing = 1; G.step(0.5);
  const P = G.P; P.y = G.groundY(P.x) + row.h; P.vy = 0; P.grounded = false; P.gy = P.y; P.land = null;
  if (row.c === 'run') { P.vx = 3.3; G.keys.add('R'); } else G.keys.delete('R');
}
function fallTime(row) { setup(row); let n = 0; while (!G.P.grounded && n < 2000) { G.step(DT, DT); n++; } G.keys.delete('R'); return n * DT; }
function run(row, want, shoot) {
  const tFall = fallTime(row); setup(row);
  let t = -tFall, i = 0; row.style = null;
  for (const w of want.slice().sort((a, b) => a - b)) {
    while (t < w - 1e-6) { G.step(DT, DT); t += DT; if (row.style === null && G.P.grounded) row.style = G.P.land?.style ?? 0; }
    shoot(i++);
  }
  G.keys.delete('R'); G.LAND.force = 0;
}
const SITU = row => `${row.c === 'run' ? '跑着冲下' : '站着掉下'} ${row.h} 米`;
const RESULT = row => row.style ? `${row.style} ${G.LAND.names[row.style]}` : '只软一下膝盖';

// ---- 抄一格：把游戏画面里主角周围的一块画到 (dx, dy, dw, dh) ----
const ground = () => G.groundY(G.P.x);
function grab(dx, dy, dw, dh) {
  const cam = G.camera, c = G.renderer.domElement, P = G.P;
  let sx, sy, sw, sh;
  if (VIEW === 'side') {
    const d = num('d', 4.6), yo = num('yo', 1.0), x = P.x + 0.15;
    cam.position.set(x, ground() + yo + d * 0.05, d); cam.lookAt(x, ground() + yo, 0);
    sh = c.height; sw = sh * dw / dh; sx = (c.width - sw) / 2; sy = 0;
  } else {
    cam.updateMatrixWorld(); const p = new G.THREE.Vector3(P.x + 0.15, ground() + 0.7, 0).project(cam), px = num('px', 2), k = c.height / 1080;
    sw = dw / px * k; sh = dh / px * k; sx = (p.x * 0.5 + 0.5) * c.width - sw / 2; sy = (0.5 - p.y * 0.5) * c.height - sh / 2;
    sx = Math.max(0, Math.min(c.width - sw, sx)); sy = Math.max(0, Math.min(c.height - sh, sy));
  }
  G.renderer.render(G.scene, cam);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(c, sx, sy, sw, sh, dx, dy, dw, dh);
}
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); console.log(`图的大小 ${w} × ${h}`); }

const LAYOUTS = {
  // 每种情况一行：从着地那一刻，到站起来
  strip() {
    const ts = (q.get('ts') || '0,0.05,0.1,0.15,0.2,0.3,0.4,0.55,0.75,0.95').split(',').map(Number);
    const cw = num('cw', 200), ch = num('ch', 280), LW = 190, HEAD = 112, TOP = 30;
    size(LW + ts.length * cw, HEAD + TOP + ROWS.length * ch);
    label(q.get('title') || '从高处落地 · 看情况挑动作', 40, 46, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
    label(q.get('note') || '游戏里实拍：每一行是一种情况，左边写着游戏自己挑的落地动作；从左往右是着地以后的连续时刻（秒，0 是脚碰到地的那一刻）。', 40, 76, { size: 14, weight: 400, color: '#8fa0a0', shadow: false });
    ts.forEach((t, j) => label(`${t > 0 ? '+' : ''}${t.toFixed(2)}`, LW + j * cw + cw / 2, HEAD + 20, { align: 'center', size: 14, color: '#9fb0b0', shadow: false }));
    ROWS.forEach((row, r) => {
      const y = HEAD + TOP + r * ch;
      run(row, ts, j => grab(LW + j * cw + 1, y + 1, cw - 2, ch - 2));
      label(SITU(row), 30, y + ch / 2 - 8, { size: 16, weight: 500, color: '#9fb0b0', shadow: false });
      label(RESULT(row), 30, y + ch / 2 + 22, { size: 21, weight: 600, color: '#f1f5f4', shadow: false });
    });
  },
  // 几种情况并排成一格，连续拍下来，拿去切成动图
  film() {
    const n = num('n', 40), dt = num('dt', 0.04), t0 = num('t0', -0.3), cols = num('cols', 4), cw = num('cw', 220), ch = num('ch', 300);
    const fw = cw * ROWS.length;
    size(cols * fw, Math.ceil(n / cols) * ch);
    const ts = Array.from({ length: n }, (_, i) => t0 + i * dt);
    ROWS.forEach((row, k) => {
      const cells = [];
      run(row, ts, i => { const x = (i % cols) * fw + k * cw, y = Math.floor(i / cols) * ch; grab(x + 1, y, cw - 2, ch); cells.push([x, y]); });
      for (const [x, y] of cells) { label(SITU(row), x + 12, y + 22, { size: 13, weight: 500, color: '#c3cfce' }); label(RESULT(row), x + 12, y + 44, { size: 15, weight: 600, color: '#eef3f1' }); }
    });
  },
  // 自检：不画图，在控制台里报出几项结果（每种情况挑到哪一种、开场从格栅掉下来、落地以后什么时候能再跳）
  check() {
    size(600, 60); const P = G.P, say = s => console.log('检查 · ' + s);
    for (const row of ROWS) { run(row, [1.6], () => {}); say(`${SITU(row)} → ${RESULT(row)}，1.6 秒后${P.land ? '还没站起来' : '已经站起来'}，往前走了 ${(P.x - X0).toFixed(2)} 米`); }
    G.ch(1); let landT = null, st = null;                               // 第一章开场：从上层断开的格栅掉下来（3.3 米），不按键
    for (let i = 0; i < 150; i++) { G.step(1 / 60); if (P.land && landT === null) { landT = i / 60; st = P.land.style; } }
    say(`第一章开场：${landT === null ? '没有落地动作' : `${landT.toFixed(2)} 秒着地，${st} ${G.LAND.names[st]}`}，2.5 秒后${P.land ? '还没站起来' : '已经站起来'}`);
    const jumpAfter = (h, wait) => {                                     // 从 h 米高落下（站着），着地 wait 秒后按一下跳：跳起来没有
      G.tp(X0); G.step(0.5); P.y = G.groundY(P.x) + h; P.vy = 0; P.grounded = false; P.land = null;
      let n = 0; while (!P.grounded && n++ < 400) G.step(1 / 120, 1 / 120);
      G.step(wait, 1 / 120); G.hold(['J'], 0.06); const up = !P.grounded; G.step(1.5); return up ? '跳起来了' : '跳不起来';
    };
    say(`原地跳的落差（1.2 米）着地马上再跳 —— ${jumpAfter(1.2, 0.02)}；2 米着地 0.1 秒按跳 —— ${jumpAfter(2, 0.1)}；3.3 米着地 0.15 秒按跳 —— ${jumpAfter(3.3, 0.15)}，1 秒时按跳 —— ${jumpAfter(3.3, 1)}`);
    label('自检结果在控制台里', 20, 38, { size: 18, color: '#c3cfce' });
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model), late = performance.now() - t0 > 90000;   // 主角的模型是另外加载的：等它到了再画，机器忙的时候要等好一会儿，最多等 90 秒
      if (hero && !modelIn && late) { console.warn('主角模型没有加载出来，画面里是顶替的机器人'); NOMODEL = true; }
      if (hero && (modelIn || late)) { G = w.__g.old; G.begin(); G.paused = true; G.step(0.3); done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'escape.html') + '?sheet=' + Date.now();
  });
}

(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.strip)(); if (NOMODEL) label('主角模型没有加载出来：画面里是顶替的机器人，这张不能用', 40, sheet.height - 20, { size: 22, weight: 600, color: '#ff5a4a' }); }
  catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
