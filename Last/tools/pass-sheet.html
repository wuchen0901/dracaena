<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>绕过箱子 · 对比图</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 游戏装在这个窗口里，摆在图的下方看不见的地方 */
  #game{position:fixed;left:0;top:1080px;width:960px;height:540px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 箱子、推车平时不挡路：人在地上走着碰到它，就往镜头这边让一步，从它前面走过去（Last/sidescroller/src/20-world.js 的 thru，50-player.js 的 stepSidestep）。
// 这一页把它在游戏里拍下来排在一起看：每一行是一样东西，从左往右是人从它左边走到右边的几个位置。画面全部来自游戏本身的渲染。
// 要通过本地服务器打开（和游戏同源才能读到它的画面）：http://127.0.0.1:8765/tools/pass-sheet.html
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png <宽> <高>（宽、高见控制台里报的图的大小）
// 看得清：游戏本来是剪影画风，近处的东西和人都压得很暗，软件渲染（无头 Chrome 没有显卡）时更是黑成一片。拍的时候
//   临时在场景里加一盏白的天光、一盏从镜头那边打过来的灯，关掉后期（暗角、调色），拍完一格就撤掉 —— 只为了看清人站在哪，不是游戏里的样子。
//   fill=0 不加灯、照游戏里的样子拍；fill=2 灯再亮一倍
// 网址参数：
//   ids=cart,crate3,... 拍哪几样（SOLIDS 里的 id；不写就是下面 IDS 那几样）
//   walk=1 按着 Shift 慢走过去（默认是跑）
//   d 镜头离多远，yo 对准离地多高，az 镜头绕到主角前面多少度（0 正侧面），el 镜头抬高多少度往下看
//   layout=check 不画图，在控制台里报每一样：走没走过去、让出去最远多少米、走过去以后回没回到路上
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'strip';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const IDS = (q.get('ids') || 'cart,crate3,e3box,e3hurdle2,e6k0,crate21').split(',');
const NAME = { cart: '第 9 章 · 推车', crate1: '第 9 章 · 木箱', crate3: '第 11 章 · 木箱', crate4: '第 12 章 · 铁箱', battery: '第 13 章 · 电池', coil: '第 14 章 · 线圈', lid: '第 14 章 · 水箱盖',
  branch: '第 15 章 · 树枝', bridge2: '第 16 章 · 导电桥', last: '第 16 章 · 最后的电池', crate21: '第 22 章 · 旧木箱', e3box: '第 2 章 · 铁箱', e3hurdle1: '第 2 章 · 小铁箱',
  e3hurdle2: '第 2 章 · 装衣服的推车', e6crate: '第 5 章 · 木箱', e6k0: '第 5 章 · 院子里的铁箱', e6k1: '第 5 章 · 一垛杂货', e6k2: '第 5 章 · 院子里的铁箱' };
// 拍哪几个位置：人身子的中线在箱子上的哪里（0 左边缘，1 右边缘；负的是还没走到，大于 1 是走过去了）
const AT = (q.get('at') || '-0.9,-0.25,0.15,0.5,0.85,1.3,2.2').split(',').map(Number);
const FILL = num('fill', 1);
let G = null, NOMODEL = false;

const solidOf = id => G.SOLIDS.find(o => o.id === id);
// 把人摆到箱子左边 2.4 米，按住 →（walk=1 再按 Shift）往右走；每走到 AT 里的一个位置就交给 shoot 拍一格
function run(id, shoot, solved = false) {
  const s = solidOf(id); if (!s) { console.warn('没有这样东西：' + id); return null; }
  const c = G.CHAPTERS.slice().reverse().find(c => c.x0 <= s.x1);
  for (const k of ['R', 'L', 'S', 'E', 'J']) G.keys.delete(k);
  G.ch(c.n); if (solved) G.zone(c.n)?.solve?.();                       // solved：章节当作已经通过（潜行的几章，剧情会把人接管过去：被发现、过场）
  G.tp(s.x1 - 2.4); G.P.facing = 1; G.step(3);              // 站一会儿：章节标题淡掉，布景搭好
  G.tp(s.x1 - 2.4); G.P.facing = 1;
  const r = { id, n: c.n, s, solved, maxZ: 0, passed: false, lost: false, y0: G.P.y, shots: [] };
  G.keys.add('R'); if (q.get('walk') === '1') G.keys.add('S');
  const w = s.x2 - s.x1, targets = AT.map(a => s.x1 + a * w);
  let i = 0;
  for (let n = 0; n < 900 && i < targets.length; n++) {
    G.step(1 / 60);
    r.maxZ = Math.max(r.maxZ, G.P.zo);
    if (!G.ctl() || G.state() !== 'play') { r.lost = true; break; }      // 章节自己把人接管了（被看守发现、过场）：这一行不算
    while (i < targets.length && G.P.x >= targets[i]) { shoot(i, r); r.shots.push(+G.P.zo.toFixed(2)); i++; }
  }
  for (const k of ['R', 'S']) G.keys.delete(k);
  r.passed = G.P.x - G.P.hw > s.x2;
  G.step(1.2); r.zoAfter = G.P.zo;
  return r;
}

// ---- 补光：只在拍的那一下加，拍完撤掉 ----
let lights = null;
function fillOn() {
  if (!FILL) return;
  const T = G.THREE;
  if (!lights) lights = [new T.HemisphereLight(0xffffff, 0x9a9a9a, 2.2 * FILL), new T.DirectionalLight(0xffffff, 2.4 * FILL)];
  for (const l of lights) G.scene.add(l);
  G._post = G.POST.on; G.POST.on = false;
}
function fillOff() { if (!FILL || !lights) return; for (const l of lights) G.scene.remove(l); G.POST.on = G._post; }

// ---- 抄一格：镜头从斜前上方对着人（高度跟着地面，不跟着人），看得出人往镜头这边让出去了多少 ----
function grab(dx, dy, dw, dh, r) {
  const cam = G.camera, c = G.renderer.domElement, P = G.P;
  const d = num('d', 6.5), yo = num('yo', 0.8), az = num('az', 28) * Math.PI / 180, el = num('el', 24) * Math.PI / 180;
  const x = (r.s.x1 + r.s.x2) / 2, gy = r.y0, tz = G.pathZ(x);   // 镜头对着箱子不动（路往前后弯的地方对着路中间），人从画面左边走到右边
  cam.position.set(x + d * Math.cos(el) * Math.sin(az), gy + yo + d * Math.sin(el), tz + d * Math.cos(el) * Math.cos(az)); cam.lookAt(x, gy + yo, tz);
  if (lights) { lights[1].position.copy(cam.position).add(new G.THREE.Vector3(-2, 4, 0)); lights[1].target.position.set(x, gy, 0); G.scene.add(lights[1].target); }
  const sh = c.height, sw = sh * dw / dh, sx = (c.width - sw) / 2;
  fillOn(); G.renderer.render(G.scene, cam); fillOff();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(c, sx, 0, sw, sh, dx, dy, dw, dh);
  label(`让出 ${P.zo.toFixed(2)} 米`, dx + 8, dy + dh - 10, { size: 13, color: P.zo > 0.05 ? '#ffd27a' : '#9fb0b0' });
}
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); console.log(`图的大小 ${w} × ${h}`); }

const LAYOUTS = {
  strip() {
    const cw = num('cw', 240), ch = num('ch', 230), LW = 170, HEAD = 104, TOP = 26;
    size(LW + AT.length * cw, HEAD + TOP + IDS.length * ch);
    label('箱子、推车 · 从前面绕过去', 40, 46, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
    label(`游戏里实拍：每一行是一样东西，人按着 →${q.get('walk') === '1' ? ' 和 Shift 慢走' : ' 跑'}过去；镜头从斜前上方往下看，人往镜头这边让出去的那一步看得出来。${FILL ? '拍的时候临时补了光、关了后期（游戏里没这么亮）。' : ''}`, 40, 76, { size: 14, weight: 400, color: '#8fa0a0', shadow: false });
    AT.forEach((a, j) => label(a < 0 ? '还没走到' : a > 1 ? '走过去了' : a < 0.3 ? '刚到跟前' : a < 0.7 ? '正在前面' : '快走过去', LW + j * cw + cw / 2, HEAD + 18, { align: 'center', size: 14, color: '#9fb0b0', shadow: false }));
    IDS.forEach((id, k) => {
      const y = HEAD + TOP + k * ch;
      const shoot = (j, r) => grab(LW + j * cw + 1, y + 1, cw - 2, ch - 2, r);
      let r = run(id, shoot);
      if (r && r.lost) { ctx.fillStyle = '#0b0f11'; ctx.fillRect(LW, y, AT.length * cw, ch); r = run(id, shoot, true); }   // 中途被章节接管了：把这一章当作已经通过，重拍
      label(NAME[id] || id, 24, y + ch / 2 - 6, { size: 17, weight: 600, color: '#f1f5f4', shadow: false });
      if (r) label(r.lost ? '中途被章节接管了' : r.passed ? `最多让出 ${r.maxZ.toFixed(2)} 米` : '没走过去', 24, y + ch / 2 + 18, { size: 13, weight: 400, color: r.passed && !r.lost ? '#8fa0a0' : '#ff7a6a', shadow: false });
      if (r && r.solved) label('（这一章当作已经通过）', 24, y + ch / 2 + 38, { size: 12, weight: 400, color: '#6f8080', shadow: false });
      console.log(`拍完 ${id}`);
    });
  },
  check() {
    size(600, 60);
    for (const id of IDS) {
      let r = run(id, () => {}); if (r && r.lost) r = run(id, () => {}, true); if (!r) continue;
      console.log(`检查 · ${id}（第 ${r.n} 章）：${r.lost ? '中途被章节接管了' : r.passed ? '走过去了' : '没走过去'}，最多让出 ${r.maxZ.toFixed(2)} 米，各个位置 ${r.shots.join(' / ')}，走过去 1.2 秒以后 ${r.zoAfter.toFixed(3)} 米${r.solved ? '（章节当作已经通过）' : ''}`);
    }
    label('检查结果在控制台里', 20, 38, { size: 18, color: '#c3cfce' });
  },
};

// ---- 装游戏：等主角的模型加载完再拍（没加载完时画面里是顶替的机器人）----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model), late = performance.now() - t0 > 90000;
      if (hero && !modelIn && late) { console.warn('主角模型没有加载出来，画面里是顶替的机器人'); NOMODEL = true; }
      if (hero && (modelIn || late)) { G = w.__g; G.begin(); G.paused = true; G.step(0.3); done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'escape.html') + '?link=0&sheet=' + Date.now();
  });
}

(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.strip)(); if (NOMODEL) label('主角模型没有加载出来：画面里是顶替的机器人，这张不能用', 40, sheet.height - 20, { size: 22, weight: 600, color: '#ff5a4a' }); }
  catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
