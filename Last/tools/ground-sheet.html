<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>地上的东西 · 选项图</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 地上的东西（石头、落叶、草、树枝、泥、水洼、小动物……）的选项图：同一屏游戏画面，一格只开一样，排在一起比较。ch=第几章（默认 2）。
// 画面全部来自游戏本身：这些东西已经摆在各章的代码里（61-ch2-sluice.js 的 groundDetails() 等），一样一组（v.gd.stones……）；这个页面只是一组一组地开关它们。
// 要通过本地服务器打开：http://127.0.0.1:8765/tools/ground-sheet.html?ch=2
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：layout ——
//   grid 各格排在一起（每格是主角脚下那一带的原始大小，没有缩小）/ full 一格的整幅画面（cell=第几格，从 0 数）/
//   zoom 把几处小东西放大了看（cell=第几格；pts=x,y,z;x,y,z 另给几处）/ scout 沿路的几屏（xs=186,196,205；cell=第几格）/
//   film 一小段连续的画面排成一张图（x 起点、n 格数、dt 每格隔多少秒、keys 按住的键、w 每格宽、zoom 放大几倍、ax/ay 截哪里），
//     再用 magick <图> -crop <w>x<h> +repage -set delay <dt×100> -loop 0 <动图.gif> 切成动图 /
//   check 把这一章地上会动的东西走一遍（只有写了 check 的章节有），结果打在控制台上
//   only=0,8 只排其中几格；fx=0 不加暗角、颗粒和上下黑边；x 主角站在哪里；on=stones,water 临时加一格组合；probe=1 报出镜头位置
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'grid';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let G = null, V = null;

// ---- 各章的设置：哪一屏、分几格、放大看哪几处 ----
// cells：每格 { name, note, on: 开哪几组 }；zoomPanel：选项图最后空出来的那一格放大哪里；spots：zoom 那张图放大哪几处
const CONF = {
  2: { title: '第二章林地', x: 190,
    sub: ['同一屏游戏画面，每格只开一样；截的是主角脚下那一带，按 1080p 屏幕上的原始大小（没有缩小）。',
      '水渠两边的林子里都已经铺上了；原来横在画面下方的那道黑色前景已经去掉。'],
    cells: [
      { name: '什么都不摆', note: '地面是一整片平的颜色', on: [] },
      { name: '石头', note: '几块半埋的石头，朝上的面长着青苔；路边散着小石子', on: ['stones'] },
      { name: '落叶', note: '树下积得厚，路上被踩散；镜头跟前有一片片立体的，偶尔飘下来一片', on: ['leaves'] },
      { name: '草和蕨', note: '路边的草矮而稀，林子深处是蕨和蘑菇；画面下沿是几丛虚焦的草', on: ['grass', 'fore'] },
      { name: '树枝和倒木', note: '一根长了青苔的倒木、一只树桩，四处掉着枯枝', on: ['sticks'] },
      { name: '泥', note: '踩出来的一条湿泥路，水洼周围和镜头跟前各一片泥地；湿泥上反着一点天光', on: ['mud'] },
      { name: '水洼', note: '水里映着后面的树和主角，镜头一动倒影跟着走；踩进去会起水圈', on: ['water'] },
      { name: '小动物', note: '水边的青蛙、石头上的蜥蜴、路边的一小群虫子，走近了会逃（连同它们待的石头和水洼）', on: ['stones', 'water', 'animals'] },
      { name: '全部合在一起', note: '2 到 8 都摆上', on: 'all' },
    ],
    zoomPanel: { x: 193.6, y: 0.1, z: 0.6, note: '上一格的一部分：水边的青蛙、石头上的蜥蜴、路边的虫子、水里的倒影' },
    spots: [{ p: [193.4, 0.12, 1.4], name: '水洼边的青蛙' }, { p: [191.95, 0.32, -1.45], name: '石头上的蜥蜴' }, { p: [195.75, 0.06, -0.78], name: '路边的一小群虫子' }] },
};
const CH = num('ch', 2), C = CONF[CH];
const SHOT = { x: num('x', C.x), settle: num('settle', 1.6) };
const CELLS = C.cells.slice();
if (q.get('on')) CELLS.push({ name: q.get('on'), note: '', on: q.get('on').split(',') });
const PICKED = q.get('only') ? q.get('only').split(',').map(i => CELLS[+i < 0 ? CELLS.length + +i : +i]) : CELLS;

function apply(c) {                                               // 这一格开哪几组
  for (const k in V.gd) V.gd[k].visible = c.on === 'all' || c.on.includes(k);
}

// ---- 抄画面：先在一张整幅大小的画布上备好，再截到图上 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
// 游戏页面上盖着的那几层：暗角、颗粒、上下黑边（它们是网页元素，抄画面时抄不到，在这里照样补上）
function overlays(vig = 1) {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render(c) {
  if (c) apply(c);
  G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH); if (FX) overlays(G.E.vig ?? 1);
}
const px = (x, y, z) => { const p = new G.THREE.Vector3(x, y, z).project(G.camera); return [(p.x * 0.5 + 0.5) * FW, (0.5 - p.y * 0.5) * FH]; };   // 世界里的一点落在画面的哪个像素上
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
const HEAD = 96;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 44, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 67 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
function rules(cols, rows, cw, ch) { ctx.fillStyle = '#0b0f11'; for (let c = 1; c < cols; c++) ctx.fillRect(c * cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, sheet.width, 2); }
function tag(i, c, x, y) {
  ctx.save(); ctx.font = `600 17px ${FONT}`; let w = ctx.measureText(c.name).width; ctx.font = `400 12.5px ${FONT}`; w = Math.max(w, ctx.measureText(c.note).width);
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 12, w + 62, 54, 9); ctx.fill(); ctx.restore();       // 垫一块半透明的底
  label(`${i}`, x + 26, y + 46, { size: 34, weight: 600, color: '#f1f5f4' });
  label(c.name, x + 58, y + 36, { size: 17, weight: 600, color: '#f1f5f4' });
  label(c.note, x + 58, y + 56, { size: 12.5, weight: 400, color: '#e2e9e8' });
}
const numOf = c => CELLS.indexOf(c) + 1;
function setShot(x = SHOT.x) { V.life.calm = true; V.life.reset(); G.tp(x); G.step(SHOT.settle); }

const LAYOUTS = {
  full() { size(FW, FH); const c = PICKED[num('cell', 0)]; render(c); ctx.drawImage(stage, 0, 0); if (q.get('tag') !== '0') tag(numOf(c), c, 40, 70); },
  // 每格是主角脚下那一带的原始大小：从树根到画面下沿，左右各几米
  grid() {
    const cols = 2, rows = Math.ceil(PICKED.length / cols), cw = FW / cols, ch = 540, [hx, hy] = px(G.P.x, G.P.y, 0);
    const sx = clamp(hx - cw * 0.3, 0, FW - cw), sy = clamp(Math.round(FH * 0.94) - ch, 0, FH - ch);
    size(FW, HEAD + rows * ch);
    header(`地上的东西 · ${C.title}`, C.sub);
    PICKED.forEach((c, i) => { const x = (i % cols) * cw, y = HEAD + Math.floor(i / cols) * ch; render(c); ctx.drawImage(stage, sx, sy, cw, ch, x, y, cw, ch); tag(numOf(c), c, x, y); });
    if (PICKED.length % cols) {                                     // 空出来的那一格：把最后一格放大两倍，看清小动物和水里的倒影
      const c = PICKED[PICKED.length - 1], x = (PICKED.length % cols) * cw, y = HEAD + Math.floor(PICKED.length / cols) * ch, Z = C.zoomPanel, [ax, ay] = px(num('zx', Z.x), Z.y, num('zz', Z.z));
      render(c); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(stage, clamp(ax - cw / 4, 0, FW - cw / 2), clamp(ay - ch / 4, 0, FH - ch / 2), cw / 2, ch / 2, x, y, cw, ch);
      tag(numOf(c), { name: '放大两倍', note: Z.note }, x, y);
    }
    rules(cols, rows, cw, ch);
  },
  // 把几处小东西放大了看：pts=x,y,z;x,y,z 给出世界里的点（不给就用小动物待的那几处），每处截一块、放大 k 倍
  zoom() {
    const c = PICKED[num('cell', 0)], k = num('k', 3), cw = 640, ch = 420;
    const spots = q.get('pts') ? q.get('pts').split(';').map(s => ({ p: s.split(',').map(Number), name: '' })) : C.spots;
    size(spots.length * cw, HEAD + ch);
    header(`地上的东西 · ${C.title} · 放大了看`, [`“${c.name}”那一格的画面，几处小东西各截一块、放大 ${k} 倍。小动物在 1080p 的画面上只有十几个像素大，要靠动起来才看得见 —— 见动图。`]);
    render(c);
    spots.forEach((s, i) => {
      const [cx, cy] = px(...s.p), w = cw / k, h = ch / k;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, clamp(cx - w / 2, 0, FW - w), clamp(cy - h * 0.55, 0, FH - h), w, h, i * cw, HEAD, cw, ch);
      label(s.name, i * cw + 24, HEAD + 36, { size: 17, weight: 600, color: '#f1f5f4' });
    });
    rules(spots.length, 1, cw, ch);
  },
  scout() {
    const xs = (q.get('xs') || C.xs || '180,188,196,205.6').split(',').map(Number), cols = 2, rows = Math.ceil(xs.length / cols), cw = FW / cols, ch = FH / cols, c = PICKED[num('cell', 0)];
    size(FW, HEAD + rows * ch);
    header(q.get('title') || `沿路的画面（${c.name}）`, ['主角依次站在这几个位置（数字是世界坐标 x），每格是整幅画面缩小一半。']);
    xs.forEach((x, i) => { setShot(x); render(c); const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, cx, cy, cw, ch); label(`x = ${x}`, cx + 26, cy + 68, { size: 17, weight: 600, color: '#f1f5f4' }); });
    rules(cols, rows, cw, ch);
  },
  // 一小段连续的画面：主角从 x 出发按住 keys，每隔 dt 秒截一格。小动物这时候会逃
  film() {
    const n = num('n', 60), cols = num('cols', 6), w = num('w', 640), h = Math.round(w * 9 / 16), dt = num('dt', 0.05), keys = (q.get('keys') ?? 'R').split(',').filter(Boolean), c = PICKED[num('cell', 0)];
    const zoom = num('zoom', 1), cw = w / zoom, ch = h / zoom, ax = num('ax', 0.3), ay = num('ay', 0.62), lead = num('lead', 0);   // zoom：每格是画面上 w/zoom 宽的一块放大出来的；ax、ay：主角的脚落在这一块的哪里
    size(cols * w, Math.ceil(n / cols) * h);
    V.life.calm = false; apply(c);
    if (lead) G.hold(keys, lead);
    for (let i = 0; i < n; i++) {
      if (keys.length) G.hold(keys, dt); else G.step(dt);
      render(null);
      const [hx, hy] = px(G.P.x, G.P.y, 0), sx = clamp(hx - cw * ax, 0, FW - cw), sy = clamp(hy - ch * ay, 0, FH - ch);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, sx, sy, cw, ch, (i % cols) * w, Math.floor(i / cols) * h, w, h);
    }
  },
};

// 第二章走一遍：一路跑过这一段，看有没有被什么挡住、小动物有没有都躲起来；走远了它们回不回来；扳闸杆以后渠边那只青蛙跳不跳得进涨起来的水里；
// 踩着木梁过了水渠，对岸那一段也一路跑过去。结果打在控制台上
CONF[2].check = () => {
  size(FW, FH);
  const log = t => console.log('[检查] ' + t), ok = (c, t) => log((c ? '✓ ' : '✗ 不对：') + t), P = G.P, Z = G.zone(2), L = V.life;
  const critters = L.items.filter(it => it.st !== undefined), homeX = it => it.home ? it.home[0] : it.bugs ? it.bugs[0].hx : it.x;
  const name = it => it.home ? '青蛙' : it.bugs ? '虫子' : '蜥蜴';
  // 一路跑过去，记下每一只是不是躲起来过（躲起来以后，主角走远了它们会回到原处，所以只看最后的样子不准）
  const run = (x0, x1, list, sec) => {
    const hid = new Set(); G.tp(x0); G.step(0.5); let t = 0;
    const look = () => list.forEach(it => { if (it.st === 'gone') hid.add(it); });
    while (P.x < x1 && t < sec) { G.hold(['R'], 0.1); t += 0.1; look(); }
    for (let i = 0; i < 30; i++) { G.step(0.1); look(); }
    return { t, hid };
  };
  apply({ on: 'all' }); L.calm = false;
  const near = critters.filter(it => homeX(it) < 210), far = critters.filter(it => homeX(it) > 213);
  let r = run(184, 206.2, near, 14);
  ok(P.x >= 206.2, `这一边从 x=184 一路跑到 206.2，没有被挡住（${r.t.toFixed(1)} 秒）`);
  ok(r.hid.size === near.length, `这一边的小动物都躲起来过：${r.hid.size} / ${near.length}（没躲的：${near.filter(it => !r.hid.has(it)).map(name).join('，') || '没有'}）`);
  G.tp(170); G.step(6); ok(critters.every(it => it.st !== 'gone'), `走远了以后都回到了原处：还躲着的 ${critters.filter(it => it.st === 'gone').length}`);
  G.tp(203.8); G.step(0.3); G.tap('E'); G.step(7.5); ok(Z.W.k >= 1, `扳了闸杆，水涨满了 W.k=${Z.W.k.toFixed(2)}`);
  // 水涨起来以后：先走远，让渠边那只青蛙回到岸上，再跑过去，它应该跳进涨起来的水里
  const frog = critters.find(it => it.home && it.home[0] > 205 && it.home[0] < 207);
  G.tp(170); G.step(6); ok(frog.st === 'sit', `渠边那只青蛙回到了岸上 x=${frog.x.toFixed(2)}`);
  G.tp(200.6); G.step(0.4); for (let i = 0; i < 12; i++) G.hold(['R'], 0.1); G.step(3);
  ok(frog.st === 'gone' && Math.abs(frog.y - Z.W.level) < 0.1, `它跳进了涨起来的水里（最后落在 y=${frog.y.toFixed(2)}，水面 ${Z.W.level.toFixed(2)}）`);
  // 对岸：从岸上一路跑到这一章的尽头
  r = run(214.6, 258, far, 20);
  ok(P.x >= 258, `对岸从 x=214.6 一路跑到 258，没有被挡住（${r.t.toFixed(1)} 秒）`);
  ok(r.hid.size === far.length, `对岸的小动物都躲起来过：${r.hid.size} / ${far.length}（没躲的：${far.filter(it => !r.hid.has(it)).map(name).join('，') || '没有'}）`);
  G.renderer.render(G.scene, G.camera); ctx.drawImage(G.renderer.domElement, 0, 0, FW, FH);
};
LAYOUTS.check = () => C.check ? C.check() : console.log('[检查] 这一章没有写检查');
function start() {
  G = frame.contentWindow.__g.old; G.begin(); G.paused = true; G.step(0.3);
  G.ch(CH); G.tp(SHOT.x); V = G.zone(CH).view();
  setShot();
  if (q.get('probe')) console.log('镜头 ' + JSON.stringify(G.camera.position.toArray().map(v => +v.toFixed(3))) + ' 视角 ' + G.camera.fov + ' 主角 x ' + G.P.x.toFixed(2) + ' 搭建每一步的毫秒数 ' + JSON.stringify(G.zone(CH).ms));
  (LAYOUTS[LAYOUT] || LAYOUTS.grid)();
  window.__sheetDone = true;
}
// 主角的模型（models/hero.glb）是另外加载的：等它到了再画，不然画进去的是加载期间顶替的机器人。最多等 20 秒
const T0 = performance.now();
frame.addEventListener('load', function wait() {
  const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
  const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);
  if (hero && !modelIn && performance.now() - T0 > 20000) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
  if (hero && (modelIn || performance.now() - T0 > 20000)) { try { start(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); window.__sheetDone = true; } }
  else setTimeout(wait, 100);
});
frame.src = '../escape.html?sheet=' + Date.now();
</script>
</body>
</html>
