// 把轮廓切细、按法线方向抖一抖，边缘才像石头
function rough(pts, step, amp) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[i + 1], L = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.round(L / step)), nx = -(by - ay) / L, ny = (bx - ax) / L;

      out.push([px + nx * j, py + ny * j]);
    }
  }
  out.push(pts[pts.length - 1]); return out;
}

// ============================================================

// ============================================================
let BOARDS = [];
function board(o, draw) {
  const W = (o.x2 - o.x1) * o.ppm, Hh = (o.y2 - o.y1) * o.ppm, k = Math.min(1, 4096 / W, 4096 / Hh), s = o.ppm * k;
  const c = DOC.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(Hh * k);

  const m = new T.Mesh(new T.PlaneGeometry(o.x2 - o.x1, o.y2 - o.y1), mat);
  if (o.kind === 'floor') { m.rotation.x = -Math.PI / 2; m.position.set(C + (o.x1 + o.x2) / 2, o.y, (o.y1 + o.y2) / 2); }
  else if (o.kind === 'ceil') { m.rotation.x = Math.PI / 2; m.position.set(C + (o.x1 + o.x2) / 2, o.y, (o.y1 + o.y2) / 2); }
  else m.position.set(C + (o.x1 + o.x2) / 2, (o.y1 + o.y2) / 2, o.z);
  m.renderOrder = o.order; m.frustumCulled = false; G.scene.add(m); BOARDS.push(m); return m;
}
function clearBoards() { for (const m of BOARDS) { m.parent.remove(m); m.geometry.dispose(); m.material.map.dispose(); m.material.dispose(); } BOARDS = []; }

// ---- 画笔 ----
const rgba = (c, a) => `rgba(${c},${a})`;
function blob(g, x, y, r, c, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(c, a)); gr.addColorStop(0.45, rgba(c, a * 0.45)); gr.addColorStop(1, rgba(c, 0)); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x, y)); g.closePath(); g.fill(); }
function withPx(g, fn) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); fn(); g.restore(); }
// 一张灰度的“石头纹理”（乘在光斑上）：大块的明暗、斜着的岩层、裂缝、小坑
const TEX = {};
function rockTex(key, w, h, ppm, o = {}) {
  if (TEX[key]) return TEX[key];
  seed = o.seed ?? 3;
  const c = DOC.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.fillStyle = `rgb(${o.base ?? 170},${o.base ?? 170},${o.base ?? 170})`; g.fillRect(0, 0, w, h);
  for (let i = 0, n = w * h / (ppm * ppm) * 0.9; i < n; i++) { const x = rr(0, w), y = rr(0, h), r = rr(0.5, 2.6) * ppm, v = rr(90, 245) | 0; blob(g, x, y, r, `${v},${v},${v}`, 0.42); }

  const fx = (z, order, near) => board({ x1: -4.5, x2: 16.5, y1: -6.2, y2: 4.2, z, ppm: 110, order, add: true }, g => {
    seed = near ? 101 : 111;
    if (L.shaft && !near) {
      const S = L.shaft; g.save(); g.filter = 'blur(6px)';
      const gr = g.createLinearGradient(0, S.top[1], 0, S.bot[1]); gr.addColorStop(0, rgba(S.c, S.a)); gr.addColorStop(1, rgba(S.c, S.a * 0.55)); g.fillStyle = gr;
      poly(g, [[S.top[0] - S.top[2] / 2, S.top[1]], [S.top[0] + S.top[2] / 2, S.top[1]], [S.bot[0] + S.bot[2] / 2, S.bot[1]], [S.bot[0] - S.bot[2] / 2, S.bot[1]]]);
      for (let i = 0; i < S.rays; i++) {                         // 水下：光一进水就散开，变成一根根淡淡的光线
        const f = (i + 0.5) / S.rays, x0 = lerp(S.bot[0] - S.bot[2] * 0.42, S.bot[0] + S.bot[2] * 0.42, f) + rr(-0.08, 0.08), x1 = lerp(S.spread[0], S.spread[1], f) + rr(-0.25, 0.25), w0 = rr(0.12, 0.32), w1 = rr(0.5, 1.1), a = S.ra * rr(0.6, 1.2);
        const r = g.createLinearGradient(0, SURF, 0, BOT); r.addColorStop(0, rgba(S.c, a)); r.addColorStop(1, rgba(S.c, 0)); g.fillStyle = r;
        poly(g, [[x0 - w0 / 2, SURF], [x0 + w0 / 2, SURF], [x1 + w1 / 2, BOT], [x1 - w1 / 2, BOT]]);
      }
      g.restore();
    }
    if (L.glowW && !near) for (const [x, y, r, c, a] of L.glowW) blob(g, x, y, r, c, a);
    if (L.lamps && near) { for (const [x, y] of [[-9.25, 1.8], [-5.75, 1.75], [-2.3, 1.7]]) blob(g, x, y, 0.9, '255,170,90', 0.28); blob(g, 1.7, 0.7, 1.3, '255,185,110', 0.42); blob(g, 1.7, 0.7, 0.25, '255,230,190', 0.8); }
    if (L.drowned && near) { const [x] = L.drowned; blob(g, x, BOT + 0.25, 1.6, '255,165,80', 0.4); blob(g, x, BOT + 0.2, 0.3, '255,225,170', 0.9); }
    // 水里悬着的颗粒：光里亮、暗处几乎看不见
    const lum = (x, y) => { let s = 0.12; for (const [lx, ly, r, , a] of L.lights) s += a * Math.exp(-((x - lx) ** 2 + (y - ly) ** 2) / (r * r * 0.35)); if (L.shaft) s += 1.5 * Math.exp(-((x - L.shaft.bot[0]) ** 2) / 3) * sstep(BOT - 1, SURF, y); return clamp(s, 0, 1.2); };
    const SP = L.specks, n = Math.round(SP.n * (near ? 0.3 : 0.36));
    for (let i = 0; i < n; i++) {
      const x = rr(-1.2, 12.8), y = rr(BOT, SURF - 0.05), k = lum(x, y), a = SP.a * (SP.glow ? rr(0.2, 1) : Math.pow(k, 1.6) * rr(0.3, 1));
      if (a < 0.03) continue; const r = rr(0.008, near ? 0.022 : 0.016);
      if (SP.glow && rnd() < 0.2) blob(g, x, y, r * 6, SP.c, a * 0.35);
      g.fillStyle = rgba(SP.c, a); g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
    }
    if (L.shaft && near) for (let i = 0; i < 110; i++) { const y = rr(SURF, L.shaft.top[1]), x = lerp(L.shaft.bot[0], L.shaft.top[0], (y - SURF) / (L.shaft.top[1] - SURF)) + rr(-0.8, 0.8) * lerp(1, 0.4, (y - SURF) / 3.7); g.fillStyle = rgba(L.shaft.c, rr(0.15, 0.55)); g.beginPath(); g.arc(x, y, rr(0.006, 0.016), 0, 6.283); g.fill(); }   // 光柱里的尘埃
    if (near) {                                                  // 主角嘴边冒出的一串气泡，一路浮到头顶的岩石底下，在那里聚成一小片亮的空气
      const hx = HERO.d + 0.55, hy = HERO.y + 0.12, top = ceilAt(hx + 0.2) - 0.03;
      for (const [t, r] of [[0.02, 0.034], [0.1, 0.022], [0.19, 0.03], [0.3, 0.017], [0.41, 0.026], [0.55, 0.015], [0.66, 0.022], [0.8, 0.013], [0.9, 0.018]]) {
        const y = lerp(hy, top - 0.06, t), x = hx + 0.22 * t + 0.07 * Math.sin(t * 8.5 + 1.2);
        blob(g, x, y, r * 2.4, L.bubbles, 0.22); g.fillStyle = rgba(L.bubbles, 0.85); g.beginPath(); g.arc(x, y, r * 0.8, 0, 6.283); g.fill();
      }
      g.fillStyle = rgba(L.bubbles, 0.55); g.beginPath(); g.ellipse(hx + 0.35, top - 0.02, 0.38, 0.035, 0, 0, 6.283); g.fill();
      g.fillStyle = rgba(L.bubbles, 0.25); g.beginPath(); g.ellipse(hx + 0.9, ceilAt(hx + 0.9) - 0.03, 0.2, 0.025, 0, 0, 6.283); g.fill();
    }
  });
  fx(Z.fxB, -400, false); fx(Z.fxF, 200, true);
  // 6 水面上方的一层雾气
  board({ x1: -16, x2: 28, y1: SURF - 0.05, y2: 3.6, z: Z.haze, ppm: 30, order: 300 }, g => {
    const [c, a] = L.haze, h = L.mist ? 1.6 : 0.9, gr = g.createLinearGradient(0, SURF, 0, SURF + h);
    gr.addColorStop(0, rgba(c, a)); gr.addColorStop(1, rgba(c, 0)); g.fillStyle = gr; g.fillRect(-16, SURF - 0.05, 44, h + 0.05);
    if (L.mist) { g.fillStyle = rgba(c, a * 0.35); g.fillRect(-16, SURF, 44, 4); }
  });
  // 7 主角前面那一层水，和水面那一道亮线
  board({ x1: -1.5, x2: 13.1, y1: -6.2, y2: SURF, z: Z.front, ppm: 40, order: 880 }, g => {
    const [s, d] = L.tint, k = L.frontK ?? 0.62, gr = g.createLinearGradient(0, SURF, 0, BOT);
    gr.addColorStop(0, `rgba(${s[0]},${s[1]},${s[2]},${s[3] * k})`); gr.addColorStop(1, `rgba(${d[0]},${d[1]},${d[2]},${d[3] * k})`);
    g.fillStyle = gr; g.fillRect(-1.5, -6.2, 14.6, 6.2 + SURF);
    if (L.murk) { const [c, a] = L.murk; const m = g.createLinearGradient(0, SURF, 0, SURF - 2.2); m.addColorStop(0, rgba(c, a)); m.addColorStop(1, rgba(c, 0)); g.fillStyle = m; g.fillRect(-1.5, SURF - 2.2, 14.6, 2.2); }
  });
  board({ x1: -1.5, x2: 13.1, y1: SURF - 0.6, y2: SURF + 0.12, z: Z.surf, ppm: 140, order: 890, add: true }, g => {
    seed = 121;
    for (let x = -1.5; x < 13.1; x += 0.025) {
      const k = L.surf(x) * (0.72 + 0.28 * Math.sin(x * 2.9 + 2 * Math.sin(x * 0.63))), y = SURF + 0.005 * Math.sin(x * 4.1 + 1.1) + 0.003 * Math.sin(x * 12.7);
      g.fillStyle = rgba(L.surfC, 0.8 * k); g.fillRect(x, y - 0.009, 0.027, 0.018);                         // 水面：一道细细的亮线
      if (rnd() < 0.1 * k) { g.fillStyle = rgba(L.surfC, 0.9); g.fillRect(x, y - 0.012, rr(0.03, 0.09), 0.024); }   // 光照到的地方闪一下
      const b = g.createLinearGradient(0, y - 0.01, 0, y - 0.26); b.addColorStop(0, rgba(L.surfC, 0.22 * k)); b.addColorStop(1, rgba(L.surfC, 0));   // 从下面看，水面像一面镜子，亮线下面有一窄条反光
      g.fillStyle = b; g.fillRect(x, y - 0.26, 0.027, 0.25);
    }
  });
  // 8 最前面：岩石的剖面，整块是黑的，只挖出洞里的空间
  board({ x1: -4.5, x2: 16.5, y1: -8, y2: 7, z: Z.cut, ppm: 170, order: 960, opaque: true }, g => {
    g.fillStyle = L.cut ?? '#030506'; g.fillRect(-4.5, -8, 21, 15);
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; poly(g, OUTLINE); g.globalCompositeOperation = 'source-over';
    seed = 131; g.fillStyle = L.cut ?? '#030506';
    for (let x = -4.4; x < 16.4; x += rr(0.5, 1.6)) {             // 剖面上的钟乳石和石笋
      if (x > 1.2 && x < 10.3) continue;
      const y = ceilAt(x) + 0.02, h = rr(0.15, 0.75), w = rr(0.12, 0.34); poly(g, [[x - w / 2, y + 0.1], [x + w / 2, y + 0.1], [x + w * 0.08, y - h], [x - w * 0.05, y - h * 0.92]]);
    }
    for (let x = -4.4; x < 16.4; x += rr(0.7, 2.2)) { if (x > -1.1 && x < 12.8) continue; const y = x > 12 ? 0.3 : 0, h = rr(0.06, 0.3), w = rr(0.2, 0.5); poly(g, [[x - w / 2, y - 0.05], [x + w / 2, y - 0.05], [x + w * 0.1, y + h], [x - w * 0.1, y + h]]); }
  });
}

// ============================================================
//  灯光和镜头：只照主角（布景板是自己发色的，不看灯光）
// ============================================================
function lights() {
  const h = { spots: [], points: [] };
  for (const o of G.scene.children) {
    if (o.isHemisphereLight) h.hemi = o;
    else if (o.isDirectionalLight) { if (o.castShadow) h.key = o; else h.rim = o; }
    else if (o.isSpotLight) { if (o.castShadow) h.beam = o; else h.spots.push(o); }
    else if (o.isPointLight) h.points.push(o);
    else if (o.isPoints) h.dust = o;
    else if (o.isMesh && o.material && o.material.isShaderMaterial && o.geometry.type === 'PlaneGeometry') h.sky = o;
  }
  return h;
}
function setLights(L) {
  const H = lights(), o = L.hero;
  H.hemi.color.setHex(o.hemi[0]); H.hemi.groundColor.setHex(o.hemi[1]); H.hemi.intensity = o.hemi[2];
  if (o.key) { H.key.color.setHex(o.key[0]); H.key.intensity = o.key[1]; H.key.position.set(C + HERO.d + o.key[2][0] * 30, HERO.y + o.key[2][1] * 30, o.key[2][2] * 30); H.key.target.position.set(C + HERO.d, HERO.y, 0); H.key.target.updateMatrixWorld(); }
  else H.key.intensity = 0;
  H.rim.intensity = 0; H.beam.intensity = 0;
  H.spots.forEach(s => { s.intensity = 0; });
  const pts = (o.pts || []).slice(0, 4); if (L.fill !== 0) pts.push([HERO.d, HERO.y + 0.9, 3.2, L.fill ?? 0x9fc4c4, 1.6, 7]);
  H.points.forEach((p, i) => { const P = pts[i]; if (!P) { p.intensity = 0; return; } p.position.set(C + P[0], P[1], P[2]); p.color.setHex(P[3]); p.intensity = P[4]; p.distance = P[5]; p.decay = 1.6; });
  if (H.dust) H.dust.visible = false; if (H.sky) H.sky.visible = false;
  G.scene.background = new T.Color(0x030506); G.scene.fog.color.setHex(0x05080a); G.scene.fog.density = 0.004;
}
function placeCamera() {
  G.camera.position.set(C + CAM.d, CAM.y + CAM.dist * 0.05, CAM.dist); G.camera.lookAt(C + CAM.d, CAM.y, 0); G.camera.updateMatrixWorld();
}

// ---- 主角：身子放平、脸朝前，一只手向前伸、一只手划到身侧，两腿上下打水 ----
const SWIM = { Spine: 0.1, neck: 0.3, Head: 0.85, LeftArm: 2.95, LeftForeArm: 0.12, RightArm: -0.25, RightForeArm: 0.45,
  LeftUpLeg: 0.22, LeftLeg: -0.5, LeftFoot: -1.05, RightUpLeg: -0.14, RightLeg: -0.12, RightFoot: -1.15 };
function poseHero(ang = SWIM) {
  const h = G.hero(), tr = h.B.traveler;
  h.root.position.set(C + HERO.d, HERO.y, 0);
  h.root.rotation.set(0, 0, HERO.pitch);
  if (tr.group) { tr.group.position.y = tr.baseY; tr.group.rotation.z = 0; }
  // 脚底是身体的原点：把身体的中点挪到 (HERO.d, HERO.y)
  const mid = 0.6 * h.H; h.root.position.x -= Math.sin(-HERO.pitch) * mid; h.root.position.y -= Math.cos(-HERO.pitch) * mid;
  h.root.updateMatrixWorld(true);
  if (!tr.model) return;
  const axisW = new T.Vector3(1, 0, 0).applyQuaternion(tr.model.getWorldQuaternion(new T.Quaternion()));
  for (const name of ['Spine', 'neck', 'Head', 'LeftUpLeg', 'LeftLeg', 'LeftFoot', 'LeftArm', 'LeftForeArm', 'RightUpLeg', 'RightLeg', 'RightFoot', 'RightArm', 'RightForeArm']) {
    const e = tr.bones.get(name); if (!e) continue;
    const pq = e.node.parent.getWorldQuaternion(new T.Quaternion()).invert(), axis = axisW.clone().applyQuaternion(pq).normalize();
    e.node.quaternion.copy(e.rest).premultiply(new T.Quaternion().setFromAxisAngle(axis, -(ang[name] ?? 0)));
    e.node.updateWorldMatrix(false, true);
  }
}

// ============================================================
//  出图
// ============================================================
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
function overlays(vig = 1) {                                            // 游戏页面上盖着的暗角、颗粒、上下黑边（网页元素，抄不到，照样补上）
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function shoot(L) {
  paint(L); G.step(1 / 60); setLights(L); placeCamera(); poseHero(); if (G.CAT.crit) G.CAT.crit.root.visible = false;
  G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH); if (FX) overlays(1);
}
function label(text, x, y, o = {}) {
  ctx.save(); ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
function tag(n, text, x, y) {
  ctx.save(); ctx.font = `600 16px ${FONT}`; const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 12, w + 56, 40, 9); ctx.fill(); ctx.restore();
  label(n, x + 26, y + 42, { size: 26, weight: 600, color: '#f1f5f4' }); label(text, x + 56, y + 38, { size: 16, weight: 600, color: '#f1f5f4' });
}
const HEAD = 104;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 46, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 70 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
const pickList = () => (q.get('only') ? q.get('only').split(',').map(n => +n - 1) : LOOKS.map((_, i) => i)).filter(i => LOOKS[i]);
function heroOnScreen() { const p = new T.Vector3(C + HERO.d, HERO.y, 0).project(G.camera); return [(p.x * 0.5 + 0.5) * FW, (0.5 - p.y * 0.5) * FH]; }

const LAYOUTS = {
  grid() {
    const list = pickList(), cols = 2, rows = Math.ceil(list.length / cols), cw = FW / cols, ch = cw * FH / FW;
    size(FW, HEAD + rows * ch);
    header('山洞水下 · 第一步：光和颜色', ['同一个粗模：左边的洞厅、潭水、中间压进水里的岩顶，主角正从岩石底下游过去，右边是浮上来、爬上岸的另一个洞厅。',
      '每格是 1080p 游戏画面缩小一半；主角是游戏里的模型，布景是画出来的平面（粗模，只看光和颜色，石头的细节、水的动态之后再做）。']);
    list.forEach((i, k) => {
      const L = LOOKS[i]; shoot(L);
      const cx = (k % cols) * cw, cy = HEAD + Math.floor(k / cols) * ch;
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, cx, cy, cw, ch);
      tag(String(i + 1), L.name, cx, cy + ch * 0.06);
      label(L.note, cx + 26, cy + ch * 0.94 - 14, { size: 14, color: '#c9d4d2' });
    });
    ctx.fillStyle = '#0b0f11'; ctx.fillRect(cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2);
  },
  full() { const i = num('look', 1) - 1; size(FW, FH); shoot(LOOKS[i]); ctx.drawImage(stage, 0, 0); },
  // 核对游泳的姿势：浅灰的底，镜头凑近，正侧面和斜一点各一张
  pose() {
    size(FW, FH); clearBoards(); G.step(1 / 60); setLights({ hero: { hemi: [0xffffff, 0x666666, 1.1], key: [0xffffff, 0.8, [0.3, 1, 0.6]] } }); poseHero();
    if (G.CAT.crit) G.CAT.crit.root.visible = false; G.scene.background = new T.Color(0xb8bcbc);
    [[0, 4.2], [0.5, 4.2]].forEach(([az, dist], k) => {
      G.camera.position.set(C + HERO.d + Math.sin(az) * dist, HERO.y + 0.1, Math.cos(az) * dist); G.camera.lookAt(C + HERO.d, HERO.y, 0); G.camera.updateMatrixWorld();
      G.renderer.render(G.scene, G.camera); ctx.drawImage(G.renderer.domElement, 480, 270, 960, 540, k * 960, 270, 960, 540);
    });
  },
  // 每一版主角附近的原始大小（不缩小）：看清楚人和水
  crops() {
    const list = pickList(), cols = 2, cw = 960, ch = 540, rows = Math.ceil(list.length / cols);
    size(FW, HEAD + rows * ch);
    header('山洞水下 · 主角附近的原始大小', ['每格是 1080p 游戏画面里主角周围 960×540 的一块，没有缩小。']);
    list.forEach((i, k) => {
      shoot(LOOKS[i]); const [hx, hy] = heroOnScreen(), sx = clamp(hx - cw * 0.45, 0, FW - cw), sy = clamp(hy - ch * 0.58, 0, FH - ch);
      const cx = (k % cols) * cw, cy = HEAD + Math.floor(k / cols) * ch;
      ctx.drawImage(stage, sx, sy, cw, ch, cx, cy, cw, ch); tag(String(i + 1), LOOKS[i].name, cx, cy);
    });
    ctx.fillStyle = '#0b0f11'; ctx.fillRect(cw - 1, HEAD, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, HEAD + r * ch - 1, FW, 2);
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    const t0 = performance.now();
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);                 // 主角的模型是另外加载的：等它到了再画，最多等 20 秒
      if (hero && !modelIn && performance.now() - t0 > 20000) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
      if (hero && (modelIn || performance.now() - t0 > 20000)) {
        G = w.__g.old; T = G.THREE; DOC = frame.contentDocument; G.begin(); G.paused = true; G.ch(8); G.step(0.2); G.tp(C + HERO.d); G.step(0.3); done();
      } else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'escape.html') + '?sheet=' + Date.now();
  });
}
(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.grid)(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
