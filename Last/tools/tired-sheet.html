<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>累了 · 动作片段</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// “累了”的动作（50-player.js 的 TIRED、42-character-anim.js 的 TIRED_GAIT）在游戏里实际跑一段拍下来：
//   climb 从第二章开头按住“跑”一路跑上那座小山，再从坡顶往下走；run 在第二章水渠对岸的林子里一直跑（当作已经连着跑了一阵）；
//   stop 跑上小山的一半就松手站着（看站着喘、撑膝盖和 53-breath.js 的弯腰怎么接）；plain 第四章开头跑一段，不会累（和别的版本逐像素比较用）
// 画面全部来自游戏本身的渲染（游戏自己的镜头，用 setViewOffset 放大，不挪镜头）。
// 要通过本地服务器打开（和原型同源才能读到它的画面）：http://127.0.0.1:8771/tools/tired-sheet.html?layout=log&scen=climb
// 导出：node Last/tools/shot.mjs "<网址>" out.png <宽> <高>
// 网址参数：
//   scen —— climb / run / stop / plain；seed 随机数种子（换一个数，小动作出现的时机就不一样）；game 换一个游戏文件（默认 escape.html）
//   layout —— log 每 0.5 秒在控制台报一行：位置、速度、疲劳、走法比重、喘得多凶（BR.ex）、两种弯腰各弯了多少（rk 累的撑膝盖 / bend 喘气的弯腰）、正在做的小动作 /
//             bones 每帧报出主角模型全部骨头位置的校验和（n 帧，一秒 30 帧）：拿两个版本（game=…）的输出一比，就知道动作是不是一模一样 /
//             film 连续画面排成一张图，拿去切成动图（fps=10，from 从第几格开始，n 拍几格，w / h 每格大小，cols 一行几格，z 放大几倍，hud=0 不画角上的说明）
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'log';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let G = null;

const SCEN = {
  climb: { title: '一路跑上第二章的小山', ch: 2, x: 107.5, keys: ['R'] },
  run: { title: '在平地上一直跑', ch: 2, x: 216, keys: ['R'], pre: () => { G.TIRED.runT = 31; } },
  stop: { title: '跑到半山腰站住', ch: 2, x: 107.5, keys: t => t < 8 ? ['R'] : [] },
  plain: { title: '第四章开头跑一段', ch: 4, keys: ['R'] },
};
const S = SCEN[q.get('scen') || 'climb'];
const keysAt = t => typeof S.keys === 'function' ? S.keys(t) : S.keys;   // 这一刻按着哪些键（t 是第几秒）
function setup() {
  const T = G.TIRED, A = G.hero().A;
  G.ch(S.ch); G.tp(S.x ?? G.CHAPTERS[G.OLD + S.ch - 1].start); G.P.facing = 1;
  if (T) { Object.assign(A, { tk: 0, rk: 0, stoop: 0 }); T.seed = num('seed', 20261113); T.mix = [1, 0, 0]; }   // 没有“累”的旧版本（game=…）就不管这些
  G.step(0.4);
  if (S.pre) S.pre();
}
const GAITS = ['弓背低头', '双手撑大腿', '拖着脚'];
function state() {
  const T = G.TIRED, g = T.mix.indexOf(Math.max(...T.mix));
  const ev = T.rest ? '站着喘气' : T.stbT >= 0 ? '绊了一下' : T.wipeT >= 0 ? '抹一下汗' : T.lookT >= 0 ? '抬头望一眼' : '';
  return { g: T.k > 0.3 ? GAITS[g] : '', ev };
}

// 游戏自己的镜头放大 z 倍：用 setViewOffset 只画主角周围的一块（分辨率不降），再以主角为中心裁 dw×dh
function grab(dx, dy, dw, dh, z) {
  const cam = G.camera, c = G.renderer.domElement, P = G.P, k = c.width / FW;
  cam.clearViewOffset(); cam.updateMatrixWorld();
  const p = new G.THREE.Vector3(P.x, P.y + 0.62, 0).project(cam), hx = (p.x * 0.5 + 0.5) * FW * z, hy = (0.5 - p.y * 0.5) * FH * z;
  const ox = clamp(hx - FW / 2, 0, FW * z - FW), oy = clamp(hy - FH / 2, 0, FH * z - FH);
  cam.setViewOffset(FW * z, FH * z, ox, oy, FW, FH);
  G.renderer.render(G.scene, cam);
  cam.clearViewOffset();
  const sx = clamp((hx - ox) - dw * 0.42, 0, FW - dw), sy = clamp((hy - oy) - dh * 0.58, 0, FH - dh);
  ctx.drawImage(c, sx * k, sy * k, dw * k, dh * k, dx, dy, dw, dh);
}
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6; }
  ctx.fillText(text, x, y); ctx.restore();
}
// 角上的说明：左上是这一段在拍什么、第几秒；左下是“累”的条（疲劳 F）、现在的走法和正在做的小动作
function hud(x, y, w, h, t) {
  const T = G.TIRED, st = state();
  ctx.save(); ctx.fillStyle = 'rgba(6,10,12,.5)';
  ctx.beginPath(); ctx.roundRect(x + 8, y + 8, 250, 30, 7); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x + 8, y + h - 40, w - 16, 32, 7); ctx.fill(); ctx.restore();
  label(`${S.title} · ${t.toFixed(1)} 秒`, x + 17, y + 29, { size: 14, weight: 600, color: '#eef3f1' });
  label('累', x + 18, y + h - 18, { size: 14, weight: 600, color: '#eef3f1' });
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 40, y + h - 29, 110, 10);
  ctx.fillStyle = T.F > 0.8 ? '#e0a46a' : T.F > 0.3 ? '#d8c79a' : '#a9bdb6'; ctx.fillRect(x + 40, y + h - 29, 110 * T.F, 10);
  label([st.g, st.ev].filter(Boolean).join(' · '), x + 162, y + h - 18, { size: 14, weight: 600, color: '#f1e6d2' });
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }

const LAYOUTS = {
  log() {
    size(400, 100); setup();
    const T = G.TIRED, out = [], sec = num('sec', 40);
    for (let i = 1; i <= sec * 2; i++) {
      G.hold(keysAt((i - 1) * 0.5), 0.5); const st = state(), A = G.hero().A;
      out.push(`${(i * 0.5).toFixed(1)}s x${G.P.x.toFixed(1)} v${Math.abs(G.P.vx).toFixed(2)} F${T.F.toFixed(2)} k${T.k.toFixed(2)} mix ${T.mix.map(v => v.toFixed(1)).join('/')} ex${G.BR.ex.toFixed(2)} rk${A.rk.toFixed(2)} bend${A.bend.toFixed(2)} ${st.g} ${st.ev}`);
    }
    console.log('\n' + out.join('\n'));
  },
  film() {
    const fps = num('fps', 10), from = num('from', 0), n = num('n', 80), w = num('w', 560), h = num('h', 350), cols = num('cols', 6), z = num('z', 2);
    size(cols * w, Math.ceil(n / cols) * h);
    setup();
    for (let i = 0; i < from + n; i++) {
      G.hold(keysAt(i / fps), 1 / fps);
      if (i < from) continue;
      const j = i - from, x = (j % cols) * w, y = Math.floor(j / cols) * h;
      grab(x, y, w, h, z);
      if (q.get('hud') !== '0') hud(x, y, w, h, (i + 1) / fps);
    }
  },
  bones() {
    size(400, 100); setup(); const out = [], v = new G.THREE.Vector3();
    for (let i = 0; i < num('n', 90); i++) {
      G.hold(keysAt(i / 30), 1 / 30);
      let sum = 0, j = 0; G.hero().B.traveler.bones.forEach(b => { b.node.getWorldPosition(v); j++; sum += j * (v.x + 2 * v.y + 3 * v.z); });
      out.push(`${i} x${G.P.x.toFixed(5)} ${sum.toFixed(9)}`);
    }
    console.log('\n' + out.join('\n'));
  },
  // 冒烟测试：九章各从开头按住“跑”（隔一会儿跳一下，翻过矮的东西）跑 sec 秒，看有没有报错、累到什么程度、在哪里累的
  smoke() {
    size(400, 100); const T = G.TIRED, out = [];
    for (const c of G.CHAPTERS.slice(G.OLD)) {                     // 旧原型的十三章（游戏里排在 OLD 章之后）
      try {
        G.ch(c.n - G.OLD); G.tp(c.start); G.step(0.3);
        let maxF = 0, firstX = null, modes = new Set();
        for (let i = 0; i < num('sec', 40) * 4; i++) {
          G.hold(i % 12 === 11 ? ['R', 'J'] : ['R'], 0.25); modes.add(G.P.mode);
          maxF = Math.max(maxF, T.F); if (firstX === null && T.k > 0.3) firstX = G.P.x;
        }
        out.push(`第${c.n}章 ${c.name}：跑到 x${G.P.x.toFixed(1)}，最累 F${maxF.toFixed(2)}${firstX === null ? '' : `，从 x${firstX.toFixed(1)} 开始显出累`}，动作 ${[...modes].join('/')}`);
      } catch (e) { out.push(`第${c.n}章 出错：${e && e.stack || e}`); }
    }
    console.log('\n' + out.join('\n'));
  },
};

// ---- 装游戏 ----
function load() {
  return new Promise(done => {
    let t0 = 0;
    frame.onload = function wait() {
      const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
      if (hero && !t0) t0 = performance.now();                            // 游戏起来了才开始计时（three.js 从网上下载，有时候要等很久）
      const modelIn = hero && hero.B.traveler?.model, late = performance.now() - t0 > 150000;   // 主角的模型是另外加载的：等它到了再画，机器忙的时候要等很久，最多再等 150 秒
      if (hero && !modelIn && late) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
      if (hero && (modelIn || late)) { G = w.__g.old; G.begin(); G.paused = true; G.step(0.3); done(); }
      else setTimeout(wait, 100);
    };
    frame.src = '../' + (q.get('game') || 'escape.html') + '?sheet=' + Date.now();
  });
}

(async () => {
  try { await load(); (LAYOUTS[LAYOUT] || LAYOUTS.log)(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); }
  window.__sheetDone = true;
})();
</script>
</body>
</html>
