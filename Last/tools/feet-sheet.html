<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>主角脚边 · 选项图</title>
<style>
  html,body{margin:0;background:#0b0f11;overflow:hidden}
  #sheet{display:block}
  /* 横版原型装在这个窗口里，摆在图的下方看不见的地方：大小就是 1080p 的游戏画面 */
  #game{position:fixed;left:0;top:1080px;width:1920px;height:1080px;border:0}
</style>
</head>
<body>
<canvas id="sheet" width="1920" height="1080"></canvas>
<iframe id="game"></iframe>
<script>
// 主角脚边的东西（脚下、身后、身前、会动的）：同一屏游戏画面，一格只开一组，排在一起比较。ch=第几章。
// 画面全部来自游戏本身：这些东西摆在 Last/sidescroller/src/73-feet-chapters.js 里，每章四组；这个页面只是一组一组地开关它们。
// 要通过本地服务器打开：http://127.0.0.1:8767/tools/feet-sheet.html?ch=1
// 导出：node Last/tools/shot.mjs "<网址>" generated_images/xxx.png 1920 <高>
// 网址参数：layout ——
//   grid 现在 / 脚下 / 身后 / 身前 / 会动的 / 全部 六格，每格是主角脚边那一块的原始大小（没有缩小）/
//   pair 整幅画面，现在和全部摆上并排（各缩小一半）/ route 各章的 pair 叠成一张（chs=1,4 只排其中几章）/
//   full 一格的整幅画面（cell=第几格，从 0 数）/ scout 沿路的几屏（xs=2,14,30；cell=第几格；不给 xs 就在这一章里均匀地取 n 处）/
//   feet 同样几处，每格截主角脚边那一块的原始大小 /
//   film 一小段连续的画面排成一张图（x 起点、n 格数、dt 每格隔多少秒、keys 按住的键、w 每格宽、zoom 放大几倍），再切成动图
//   fx=0 不加暗角、颗粒和上下黑边；x 主角站在哪里；probe=1 报出镜头位置
const q = new URLSearchParams(location.search), LAYOUT = q.get('layout') || 'grid';
const num = (k, d) => q.get(k) === null ? d : +q.get(k);
const sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d'), frame = document.getElementById('game');
const FONT = '-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
const FW = 1920, FH = 1080, FX = q.get('fx') !== '0';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let CH = num('ch', 1), G = null;

// ---- 各章：截哪一屏、主角在截出来的那一块里靠哪边（ax）、四组各是什么 ----
const CELLS = [
  { key: 'none', name: '现在', on: [] }, { key: 'floor', name: '脚下', on: ['floor'] }, { key: 'behind', name: '身后', on: ['behind'] },
  { key: 'front', name: '身前', on: ['front'] }, { key: 'alive', name: '会动的', on: ['alive'] }, { key: 'all', name: '全部', on: null },
];
const CONF = {
  1: { x: 2.6, ax: 0.55, notes: { none: '主角脚边是一整片空地面', floor: '踩塌的格栅碎在落脚处，电缆横穿过去，地沟箅子、油渍、螺母和短铁条、压扁的纸板',
    behind: '背后一两米：摞起来的托盘、倒着的油桶、工具推车、钢瓶、成箱的零件', front: '镜头这边一两米：贴地的管道和红色阀门、倒下的椅子、一摞钢管、水桶',
    alive: '老鼠（走近就窜进托盘底下）、地上几张纸（跑过去会被带起来）', all: '2 到 5 都摆上' } },
  4: { x: 399.6, ax: 0.5, notes: { none: '主角脚边是一整片空地面', floor: '地上画着一格格排队的位置（漆磨掉了一半）、包装纸、瓶盖、雨水箅子、井盖',
    behind: '背后一两米：垃圾袋和纸箱、摞着的空周转箱、小方凳、自行车、沙袋矮墙', front: '排队用的立柱和带子（主角从队伍的通道里走过，有一根被碰倒了）、街边隔离桩',
    alive: '纸片（跑过去会被带起来）、易拉罐（走过去会被踢开）', all: '2 到 5 都摆上' } },
  3: { x: 336, ax: 0.5, notes: { none: '主角脚边是一整片空地面', floor: '碎水泥块和石子、钢筋头、铁皮片、油渍、一道车辙；墙外的荒地上长着枯草',
    behind: '背后一两米：一摞摞旧轮胎、生锈的油桶、洗衣机、斜靠着的车门、带钢筋的水泥块', front: '竖着半埋的轮胎、翘着钢筋的水泥块、躺倒的油桶、弯管子',
    alive: '塑料袋和纸（跑过去会被带起来）、老鼠、枯草里的蚂蚱（走近会蹦开）', all: '2 到 5 都摆上' } },
  5: { x: 489, ax: 0.5, notes: { none: '主角脚边是一整片空地面', floor: '油渍、散落的螺丝和铁屑、服务站拖出来的电缆、雨水箅子、压扁的纸板',
    behind: '背后一两米：零件箱、带台钳的工作台、旧轮胎、钢瓶、纸箱、工具推车', front: '工具箱、油壶、水桶、平躺的轮胎、贴地的管子、倒下的方凳',
    alive: '老鼠（走近就钻进工作台底下）、地上的纸片', all: '2 到 5 都摆上' } },
  6: { x: 565.5, ax: 0.45, notes: { none: '主角脚边是一整片空地面', floor: '从水泵拖过来的水管、湿了一大片的地、雨水箅子、井盖、瓶盖；街尾长出了草',
    behind: '水泵边排着一溜等水的水壶、水桶和盆；旧椅子和几盆菜苗；接漏水的桶', front: '接水管的盆、一箱空瓶子、贴地的管子、油壶、倒着的水桶；街尾的草丛',
    alive: '纸片、易拉罐（走过去会被踢开）、街尾草里的蚂蚱', all: '2 到 5 都摆上' } },
  2: { x: 110.5, ax: 0.5, notes: { none: '主角脚边是一整片空地面', floor: '路两边一簇簇枯草、石头和碎石、掉下来的白瓷绝缘子、一根垂到地上的旧电线',
    behind: '背后一两米：歪歪斜斜的旧栅栏（有一跨断了）、木头电缆盘、歪着的旧牌子、一堆拔下来的栅栏桩', front: '高一点的枯草和蓟、石头、一卷生锈的铁丝',
    alive: '草里的蚂蚱（走近就蹦开）、跑过去带起来的枯叶', all: '2 到 5 都摆上' } },
  7: { x: 668.4, ax: 0.5, notes: { none: '主角脚边是一整片空草坪', floor: '一根黄色的水管穿过草坪、一排喷头、一溜踏脚石、草屑和花瓣',
    behind: '背后一两米：装着土的独轮车和耙子、一排一模一样的花盆和小苗（插着白标签）、肥料袋、喷壶', front: '修成方块的小灌木、倒着的喷壶、一盘水管',
    alive: '跑过去带起来的草屑和花瓣', all: '2 到 5 都摆上' } },
  8: { x: 794.2, ax: 0.42, notes: { none: '主角脚边是一整片空地面', floor: '沿着地面走向机柜的成束电缆、通风箅子、几张丢掉的打印纸；出了门是碎石和枯草',
    behind: '背后一两米：育苗小推车（补光灯照着一盘盘小苗，中枢里唯一的绿）、一排样品罐、方凳；门外是几根旧栅栏桩', front: '贴着地面的走线槽和接线盒、一盘电缆；门外是高一点的草',
    alive: '跑过去带起来的纸；门外草里的蟋蟀（走近就蹦开）', all: '2 到 5 都摆上（核心那一屋不摆）' } },
  9: { x: 1134, ax: 0.5, notes: { none: '主角脚边是一整片空地面', floor: '碎石和小石子、湿了的几片地、一截旧绳子',
    behind: '背后一两米：石头和石笋；别人留下的水桶、绳子、熄了的马灯；旧矿洞倒下的木支架', front: '剖面前面那一点地上的小石笋和石头',
    alive: '灰白色的洞穴蟋蟀（走近就蹦开）', all: '2 到 5 都摆上' } },
};
const C = () => CONF[CH] ?? { x: null, ax: 0.5, notes: {} };

function feetZone(n = CH) { return G.ZONES.find(z => z.feet && z.n === n + G.OLD); }      // n 是旧原型的章节号；游戏里排在 OLD 章之后
function apply(c) { const z = feetZone(); if (z) z.only(c.on); }
function calm(on) { const z = feetZone(); if (z && z.view().life) z.view().life.calm = on; }

// ---- 抄画面：先在一张整幅大小的画布上备好，再截到图上 ----
const stage = document.createElement('canvas'); stage.width = FW; stage.height = FH; const sctx = stage.getContext('2d');
let GRAIN = null;
// 游戏页面上盖着的那几层：暗角、颗粒、上下黑边（它们是网页元素，抄画面时抄不到，在这里照样补上）
function overlays(vig = 1) {
  const c = sctx;
  c.save(); c.translate(FW * 0.5, FH * 0.46); c.scale(FW * 0.5 * Math.SQRT2, FH * 0.54 * Math.SQRT2);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.44, 'rgba(0,0,0,0)'); g.addColorStop(0.78, `rgba(0,0,0,${0.3 * vig})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * vig})`);
  c.fillStyle = g; c.fillRect(-2, -2, 4, 4); c.restore();
  if (!GRAIN) {
    GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 256;
    const gg = GRAIN.getContext('2d'), im = gg.createImageData(256, 256); let s = 12345;
    for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const n = s / 2147483647 * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = n; im.data[i + 3] = 255; }
    gg.putImageData(im, 0, 0);
  }
  c.save(); c.globalAlpha = 0.075; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, FW, FH); c.restore();
  c.fillStyle = '#040607'; c.fillRect(0, 0, FW, FH * 0.06); c.fillRect(0, FH * 0.94, FW, FH * 0.06);
}
function render(c) { if (c) apply(c); G.renderer.render(G.scene, G.camera); sctx.drawImage(G.renderer.domElement, 0, 0, FW, FH); if (FX) overlays(G.E.vig ?? 1); }
const px = (x, y, z) => { const p = new G.THREE.Vector3(x, y, z).project(G.camera); return [(p.x * 0.5 + 0.5) * FW, (0.5 - p.y * 0.5) * FH]; };   // 世界里的一点落在画面的哪个像素上
function label(text, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight ?? 500} ${o.size ?? 15}px ${FONT}`; ctx.fillStyle = o.color ?? '#c3cfce'; ctx.textAlign = o.align ?? 'left'; ctx.textBaseline = 'alphabetic';
  if (o.shadow !== false) { ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8; }
  ctx.fillText(text, x, y); ctx.restore();
}
const HEAD = 96;
function header(title, lines) {
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, sheet.width, HEAD);
  label(title, 70, 44, { size: 27, weight: 600, color: '#eef3f1', shadow: false });
  lines.forEach((t, i) => label(t, 70, 67 + i * 19, { size: 13.5, weight: 400, color: '#8fa0a0', shadow: false }));
}
function size(w, h) { sheet.width = w; sheet.height = h; frame.style.top = h + 'px'; ctx.fillStyle = '#0b0f11'; ctx.fillRect(0, 0, w, h); }
function rules(cols, rows, cw, ch, top = HEAD) { ctx.fillStyle = '#0b0f11'; for (let c = 1; c < cols; c++) ctx.fillRect(c * cw - 1, top, 2, rows * ch); for (let r = 1; r < rows; r++) ctx.fillRect(0, top + r * ch - 1, sheet.width, 2); }
function tag(i, name, note, x, y) {
  ctx.save(); ctx.font = `600 17px ${FONT}`; let w = ctx.measureText(name).width; ctx.font = `400 12.5px ${FONT}`; w = Math.max(w, ctx.measureText(note).width);
  ctx.fillStyle = 'rgba(6,10,12,.55)'; ctx.beginPath(); ctx.roundRect(x + 14, y + 12, w + 62, 54, 9); ctx.fill(); ctx.restore();       // 垫一块半透明的底
  label(`${i}`, x + 26, y + 46, { size: 34, weight: 600, color: '#f1f5f4' });
  label(name, x + 58, y + 36, { size: 17, weight: 600, color: '#f1f5f4' });
  label(note, x + 58, y + 56, { size: 12.5, weight: 400, color: '#e2e9e8' });
}
// 这一章从哪里到哪里（下一章的起点为止）
function span(n) {
  const cs = G.CHAPTERS, c = cs.find(k => k.n === n + G.OLD), nx = cs.find(k => k.n === n + 1 + G.OLD);
  return [c.start, nx && nx.x0 > c.x0 ? nx.x0 - 3 : c.start + 120];
}
function positions() {
  if (q.get('xs')) return q.get('xs').split(',').map(Number);
  const [a, b] = span(CH), n = num('n', 6);
  return Array.from({ length: n }, (_, i) => +(a + (b - a) * (i + 0.5) / n).toFixed(1));
}
function setShot(x) { calm(true); const L = feetZone()?.view().life; if (L) L.reset(); G.tp(x); G.step(num('settle', 1.2)); }
const shotX = () => num('x', C().x ?? positions()[0]);
const cellOf = () => CELLS[num('cell', 5)];
function chName() { const c = G.CHAPTERS.find(k => k.n === CH + G.OLD); return `第${CH}章 ${c.name}`; }

const LAYOUTS = {
  // 六格：每格是主角脚边那一块的原始大小
  grid() {
    const cols = 2, rows = 3, cw = FW / cols, ch = 540, x = shotX();
    size(FW, HEAD + rows * ch);
    header(`主角脚边 · ${chName()}`, ['同一屏游戏画面，每格只开一组；截的是主角脚边那一块，按 1080p 屏幕上的原始大小（没有缩小）。',
      '脚下 = 贴着地面、主角从上面走过去的；身后 = 主角背后一两米、立着的；身前 = 主角和镜头之间一两米、矮矮的；会动的 = 走近了会跑开、被带起来、被踢开的。']);
    setShot(x); const [hx, hy] = px(G.P.x, G.P.y, 0), sx = clamp(hx - cw * C().ax, 0, FW - cw), sy = clamp(hy - ch * 0.62, 0, FH - ch);
    CELLS.forEach((c, i) => { const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch; render(c); ctx.drawImage(stage, sx, sy, cw, ch, cx, cy, cw, ch); tag(i + 1, c.name, C().notes[c.key] ?? '', cx, cy); });
    rules(cols, rows, cw, ch);
  },
  // 整幅画面：现在和全部摆上
  pair() {
    size(FW, HEAD + 540); header(`主角脚边 · ${chName()}`, ['左边是现在，右边是四组都摆上；整幅画面缩小一半。']);
    drawPair(HEAD, shotX());
  },
  route() {
    const chs = (q.get('chs') || Object.keys(CONF).join(',')).split(',').map(Number), h = 540 + 34;
    size(FW, HEAD + chs.length * h); header('主角脚边 · 各章前后对比', ['每一行：左边是现在，右边是四组都摆上（整幅画面缩小一半）。']);
    chs.forEach((n, i) => { CH = n; G.ch(n); const y = HEAD + i * h; label(chName(), 26, y + 25, { size: 17, weight: 600, color: '#eef3f1', shadow: false }); drawPair(y + 34, shotX()); });
  },
  full() { size(FW, FH); const c = cellOf(); setShot(shotX()); render(c); ctx.drawImage(stage, 0, 0); if (q.get('tag') !== '0') tag(CELLS.indexOf(c) + 1, c.name, C().notes[c.key] ?? '', 40, 70); },
  scout() {
    const xs = positions(), cols = 2, rows = Math.ceil(xs.length / cols), cw = FW / cols, ch = FH / cols, c = cellOf();
    size(FW, HEAD + rows * ch);
    header(q.get('title') || `${chName()} · 沿路的画面（${c.name}）`, ['主角依次站在这几个位置（数字是世界坐标 x），每格是整幅画面缩小一半。']);
    xs.forEach((x, i) => { setShot(x); render(c); const cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, 0, 0, FW, FH, cx, cy, cw, ch); label(`x = ${x}`, cx + 26, cy + 68, { size: 17, weight: 600, color: '#f1f5f4' }); });
    rules(cols, rows, cw, ch);
  },
  feet() {
    const xs = positions(), cols = 2, rows = Math.ceil(xs.length / cols), cw = FW / cols, ch = 540, c = cellOf();
    size(FW, HEAD + rows * ch);
    header(q.get('title') || `${chName()} · 主角脚边（${c.name}）`, ['同样几处，每格截主角脚边那一块，按 1080p 屏幕上的原始大小（没有缩小）。']);
    xs.forEach((x, i) => {
      setShot(x); render(c); const [hx, hy] = px(G.P.x, G.P.y, 0);
      const sx = clamp(hx - cw * 0.5, 0, FW - cw), sy = clamp(hy - ch * 0.62, 0, FH - ch), cx = (i % cols) * cw, cy = HEAD + Math.floor(i / cols) * ch;
      ctx.drawImage(stage, sx, sy, cw, ch, cx, cy, cw, ch); label(`x = ${x}`, cx + 26, cy + 40, { size: 17, weight: 600, color: '#f1f5f4' });
    });
    rules(cols, rows, cw, ch);
  },
  // 一小段连续的画面：主角从 x 出发按住 keys，每隔 dt 秒截一格（会动的东西这时候会动）
  film() {
    const n = num('n', 60), cols = num('cols', 6), w = num('w', 640), h = Math.round(w * 9 / 16), dt = num('dt', 0.05), keys = (q.get('keys') ?? 'R').split(',').filter(Boolean), c = cellOf();
    const zoom = num('zoom', 1), cw = w / zoom, ch = h / zoom, ax = num('ax', 0.3), ay = num('ay', 0.62), lead = num('lead', 0);
    size(cols * w, Math.ceil(n / cols) * h);
    setShot(shotX()); calm(false); apply(c);
    if (lead) G.hold(keys, lead);
    for (let i = 0; i < n; i++) {
      if (keys.length) G.hold(keys, dt); else G.step(dt);
      render(null);
      const [hx, hy] = px(G.P.x, G.P.y, 0), sx = clamp(hx - cw * ax, 0, FW - cw), sy = clamp(hy - ch * ay, 0, FH - ch);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(stage, sx, sy, cw, ch, (i % cols) * w, Math.floor(i / cols) * h, w, h);
    }
  },
};
// 走一遍：每一章沿路每隔 3 米跑一小段，看会动的那些有没有动起来（老鼠逃了、纸被带起来、罐子被踢开、蚂蚱蹦开），有没有出错；
// 再把这一章卸掉、重新搭一遍，看网格和贴图的数目回不回到原来（没有漏掉释放）。结果打在控制台上
LAYOUTS.check = () => {
  size(FW, 120); header('主角脚边 · 走一遍', ['结果在控制台里']);
  const log = t => console.log('[检查] ' + t), chs = (q.get('chs') ?? '1,2,3,4,5,6,7,8,9').split(',').filter(Boolean).map(Number);
  for (const n of chs) {
    CH = n; G.ch(n); const z = feetZone(n); if (!z) { log(`第${n}章：没有脚边的东西`); continue; }
    const L = z.view().life; L.calm = false; L.reset();
    const kinds = { rat: [], loose: [], can: [], hop: [] };
    for (const it of L.items) { if (it.home && it.sp) kinds.rat.push(it); else if (it.items && it.items[0]?.K) kinds.loose.push(...it.items); else if (it.items && it.items[0]?.body) kinds.can.push(...it.items); else if (it.items && it.items[0]?.hx !== undefined && it.items[0]?.vy !== undefined) kinds.hop.push(...it.items); }
    const fled = new Set(), moved = new Set(), [a, b] = span(n);
    const look = () => { for (const r of kinds.rat) if (r.st !== 'idle') fled.add(r); for (const it of [...kinds.loose, ...kinds.can, ...kinds.hop]) if (Math.abs(it.x - (it.hx ?? it.x)) > 0.05 || it.air) moved.add(it); };
    for (let x = a; x < b; x += 3) { G.tp(x); for (let i = 0; i < 9; i++) { G.hold(['R'], 0.1); look(); } }
    const cnt = arr => arr.filter(it => moved.has(it)).length;
    log(`第${n}章：老鼠逃了 ${fled.size}/${kinds.rat.length}，纸和叶子被带起来 ${cnt(kinds.loose)}/${kinds.loose.length}，罐子被踢开 ${cnt(kinds.can)}/${kinds.can.length}，蚂蚱蹦开 ${cnt(kinds.hop)}/${kinds.hop.length}`);
  }
  if (q.get('mem') === '0') return;
  // 卸掉再搭：数一数显存里的网格和贴图
  const info = () => ({ g: G.renderer.info.memory.geometries, t: G.renderer.info.memory.textures });
  const trip = () => { for (const n of [5, 9, 3, 1]) { G.ch(n); G.step(1.5); } };
  trip(); const m0 = info(); trip(); trip(); const m1 = info();
  log(`先跳一趟章节暖身，再跳两趟：网格 ${m0.g} → ${m1.g}，贴图 ${m0.t} → ${m1.t}（不变就是没有漏掉释放）`);
};
// 开销：每章那一屏，四组都关掉和都打开，各画 60 帧，比一比每帧多花多少时间、多几次绘制、多少三角形。结果打在控制台上
LAYOUTS.perf = () => {
  size(FW, 120); header('主角脚边 · 开销', ['结果在控制台里']);
  const gl = G.renderer.getContext(), px1 = new Uint8Array(4), log = t => console.log('[开销] ' + t);
  const time = () => { const t0 = performance.now(); for (let i = 0; i < 60; i++) { G.renderer.render(G.scene, G.camera); } gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px1); return (performance.now() - t0) / 60; };
  for (const n of (q.get('chs') ?? '1,2,3,4,5,6,7,8,9').split(',').filter(Boolean).map(Number)) {
    CH = n; G.ch(n); setShot(shotX()); const r = {};
    for (const c of [CELLS[0], CELLS[5], CELLS[0], CELLS[5]]) { apply(c); time(); const ms = time(); G.renderer.render(G.scene, G.camera); r[c.key] = { ms, calls: G.renderer.info.render.calls, tris: G.renderer.info.render.triangles }; }
    log(`第${n}章：每帧 ${r.none.ms.toFixed(2)} → ${r.all.ms.toFixed(2)} 毫秒，绘制 ${r.none.calls} → ${r.all.calls} 次，三角形 ${(r.none.tris / 1000).toFixed(0)}k → ${(r.all.tris / 1000).toFixed(0)}k`);
  }
};
function drawPair(y, x) {
  setShot(x);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  [CELLS[0], CELLS[5]].forEach((c, i) => { render(c); ctx.drawImage(stage, 0, 0, FW, FH, i * FW / 2, y, FW / 2, FH / 2); label(c.name, i * FW / 2 + 26, y + 60, { size: 17, weight: 600, color: '#f1f5f4' }); });
  ctx.fillStyle = '#0b0f11'; ctx.fillRect(FW / 2 - 1, y, 2, FH / 2);
}
function start() {
  G = frame.contentWindow.__g.old; G.begin(); G.paused = true; G.step(0.3);
  G.ch(CH);
  if (q.get('probe')) console.log('镜头 ' + JSON.stringify(G.camera.position.toArray().map(v => +v.toFixed(3))) + ' 视角 ' + G.camera.fov + ' 主角 x ' + G.P.x.toFixed(2));
  (LAYOUTS[LAYOUT] || LAYOUTS.grid)();
  window.__sheetDone = true;
}
// 主角的模型（models/hero.glb）是另外加载的：等它到了再画，不然画进去的是加载期间顶替的机器人。最多等 20 秒
const T0 = performance.now();
frame.addEventListener('load', function wait() {
  const w = frame.contentWindow, hero = w.__ready && w.__g && w.__g.hero();
  const modelIn = hero && (hero.kind !== 'R' || hero.B.traveler?.model);
  if (hero && !modelIn && performance.now() - T0 > 20000) console.warn('主角模型没有加载出来，画面里是顶替的机器人');
  if (hero && (modelIn || performance.now() - T0 > 20000)) { try { start(); } catch (e) { console.error('没画完：' + (e && e.stack || e)); window.__sheetDone = true; } }
  else setTimeout(wait, 100);
});
frame.src = '../escape.html?sheet=' + Date.now() + (q.get('feet') === '0' ? '&feet=0' : '');     // feet=0：游戏里脚边的东西都不摆（对比用）
</script>
</body>
</html>
