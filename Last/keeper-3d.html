<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================
//  场景 / 相机 / 灯光
// ============================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
{ // 摄影棚式的暖灰渐变背景（画进场景里，玻璃罐才能透出正确的背景色）
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), gr = g.createRadialGradient(256, 215, 0, 256, 215, 400);
  gr.addColorStop(0, '#9c8f88'); gr.addColorStop(0.55, '#85786f'); gr.addColorStop(1, '#6a5f58');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(28, 1, 0.5, 200);
// 初始视角与参考图一致：从机器人的右前方看过去
const HOME = { pos: new THREE.Vector3(-7.5, 5.7, 21), tgt: new THREE.Vector3(0, 4.0, 0) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.tgt);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 7; controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotate = false; controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xfff1e0, 0x6b5d55, 0.4));
const key = new THREE.DirectionalLight(0xfff0dc, 2.6);
key.position.set(-9, 16, 12); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 12, bottom: -4, near: 1, far: 50 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfd8ff, 0.5); fill.position.set(12, 6, 6); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe2c0, 0.9); rim.position.set(6, 9, -14); scene.add(rim);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 38 : 28;   // 竖屏时放宽视野，保证整个模型在画面内
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();


// ============================================================
//  程序化贴图：掉漆生锈的金属、粗布
// ============================================================
// Minimal robot direction, front is +Z.
let _seed = 1;
// Minimal neutral mannequin. Front faces +Z; separately named parts allow later animation.
function buildRobot() {
 const root = new THREE.Group(); root.name = 'SimpleRobotV5';
 const body = new THREE.MeshStandardMaterial({color: 0xd6d0bf, roughness: .72, metalness: .18});
 const joint = new THREE.MeshStandardMaterial({color: 0x393f43, roughness: .67, metalness: .35});
 const torsoPaint = new THREE.MeshStandardMaterial({color: 0x667f90, roughness: .82, metalness: .12});
 const repairPaint = new THREE.MeshStandardMaterial({color: 0x7e8874, roughness: .9, metalness: .12});
 const scratchMetal = new THREE.MeshStandardMaterial({color: 0x929185, roughness: .95, metalness: .15});
 function ellipsoid(name, x,y,z, sx,sy,sz, material=body) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1,32,24), material);
  mesh.name=name; mesh.position.set(x,y,z); mesh.scale.set(sx,sy,sz);
  mesh.castShadow=true; mesh.receiveShadow=true; root.add(mesh); return mesh;
 }
 function limb(name,a,b,r,material=body) {
  const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),dir=end.clone().sub(start);
  const mesh=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(.01,dir.length()-2*r),8,20),material);
  mesh.name=name;mesh.position.copy(start.add(end).multiplyScalar(.5));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  mesh.castShadow=true;mesh.receiveShadow=true;root.add(mesh);
 }
 function rounded(name,w,h,d,x,y,z,r,material=body) {
  const mesh=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,5,r),material);
  mesh.name=name;mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;root.add(mesh);return mesh;
 }
 // Exposed transverse axle held between two clevis cheeks; X is the hinge axis.
 const axleMetal=new THREE.MeshStandardMaterial({color:0x646c70,roughness:.55,metalness:.62});
 function hinge(name,x,y,z,r,width) {
  const group=new THREE.Group();group.name=name;group.position.set(x,y,z);root.add(group);
  function add(geo,material,px=0,py=0,pz=0) {
   const m=new THREE.Mesh(geo,material);m.position.set(px,py,pz);
   m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
  }
  const axle=add(new THREE.CylinderGeometry(r*.65,r*.65,width+.025,16),axleMetal);
  axle.rotation.z=Math.PI/2;
  for(const side of [-1,1]) {
   add(new RoundedBoxGeometry(.065,r*1.9,r*1.75,3,.025),joint,side*(width/2-.03));
   const cap=add(new THREE.CylinderGeometry(r*.76,r*.76,.025,16),axleMetal,side*(width/2+.012));
   cap.rotation.z=Math.PI/2;
   const bolt=add(new THREE.CylinderGeometry(r*.25,r*.25,.03,6),joint,side*(width/2+.032));
   bolt.rotation.z=Math.PI/2;
  }
  // A narrow central lug connects the axle to the limb shell below.
  add(new RoundedBoxGeometry(width*.42,r*.88,r*.75,3,.02),axleMetal,0,-r*.7,0);
  return group;
 }
 // Tapered rigid shells follow the existing joint positions.
 function shell(name,a,b,w,d,topWidth,bottomWidth) {
  const start=new THREE.Vector3(...a), end=new THREE.Vector3(...b);
  const direction=start.clone().sub(end), length=direction.length();
  const g=new RoundedBoxGeometry(w,length,d,4,.075);
  const positions=g.attributes.position;
  for(let i=0;i<positions.count;i++) {
   const t=THREE.MathUtils.clamp(positions.getY(i)/length+.5,0,1);
   positions.setX(i,positions.getX(i)*THREE.MathUtils.lerp(bottomWidth,topWidth,t));
   positions.setZ(i,positions.getZ(i)*(.94+.06*t));
  }
  const mesh=new THREE.Mesh(g,body); mesh.name=name;
  mesh.position.copy(start.add(end).multiplyScalar(.5));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
  mesh.castShadow=true; mesh.receiveShadow=true; root.add(mesh);
 }
 rounded('Head',2.72,1.46,1.65,0,6.92,0,.32);
 // A single tapered paint scratch on the flat front of the upper-left forehead.
 // Kept shallow and inside the rounded face boundary, rather than a floating decal.
 const scratchGeometry = new THREE.BufferGeometry();
 scratchGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
  -.95,7.19,.826, -.79,7.255,.826, -.81,7.275,.826,
  -.81,7.275,.826, -.79,7.255,.826, -.60,7.32,.826
 ],3));
 scratchGeometry.computeVertexNormals();
 const scratch = new THREE.Mesh(scratchGeometry,scratchMetal);
 scratch.name='ForeheadPaintScratch'; root.add(scratch);
 limb('Neck',[0,5.85,0],[0,6.23,0],.22,joint);
 const torso = rounded('Torso',1.35,1.55,.82,0,5.25,0,.2,torsoPaint);
 // Keep the rounded shell, widening the upper body and tapering toward the waist.
 const torsoVertices = torso.geometry.attributes.position;
 for(let i=0;i<torsoVertices.count;i++) {
  const heightRatio = THREE.MathUtils.clamp((torsoVertices.getY(i)+.775)/1.55,0,1);
  torsoVertices.setX(i,torsoVertices.getX(i)*(.84+.32*heightRatio));
 }
 torsoVertices.needsUpdate=true;
 torso.geometry.computeVertexNormals();
 torso.geometry.computeBoundingBox();
 torso.geometry.computeBoundingSphere();
 rounded('Pelvis',1.05,.48,.65,0,4.25,0,.15,torsoPaint);
 limb('Waist',[0,4.3,0],[0,4.7,0],.25,joint);
 for (const side of [-1,1]) {
  const name=side<0?'Left':'Right';
  hinge(name+'Shoulder',side*.77,5.72,0,.20,.35);
  if(side === -1) {
   rounded('ReplacementShoulderShell',.49,.27,.48,-.82,5.83,0,.10,repairPaint);
   ellipsoid('ShoulderFastener',-.82,5.83,.242,.038,.038,.012,joint);
  }
  shell(name+'UpperArm',[side*.81,5.53,0],[side*.99,4.80,0],.36,.36,1,.87);
  hinge(name+'Elbow',side*1.01,4.68,0,.17,.34);
  shell(name+'Forearm',[side*1.02,4.55,0],[side*1.11,3.88,0],.39,.37,1,.84);
  rounded(name+'Hand',.32,.43,.25,side*1.15,3.62,.025,.12);
  ellipsoid(name+'Thumb',side*.99,3.69,.09,.095,.15,.105).rotation.z=side*.28;
  hinge(name+'Hip',side*.36,4.02,0,.21,.37);
  shell(name+'Thigh',[side*.37,3.84,0],[side*.42,2.51,0],.46,.45,1,.88);
  hinge(name+'Knee',side*.43,2.33,0,.20,.40);
  shell(name+'Shin',[side*.43,2.15,0],[side*.46,.65,0],.45,.42,1,.83);
  hinge(name+'Ankle',side*.46,.5,0,.16,.32);
  const foot=rounded(name+'Foot',.72,.43,.99,side*.48,.29,.22,.12);
  const fp=foot.geometry.attributes.position;
  for(let i=0;i<fp.count;i++) {
   const front=THREE.MathUtils.clamp((fp.getZ(i)+.495)/.99,0,1);
   fp.setY(i,-.215+(fp.getY(i)+.215)*(1-.35*front));
  }
  rounded(name+'Sole',.74,.10,1.01,side*.48,.055,.22,.04,joint);
 }
 // Small, shallow lenses keep the face quiet and readable.
 const dormantLens = new THREE.MeshStandardMaterial({color:0x303638,roughness:.8,metalness:.08});
 const activeLens = new THREE.MeshStandardMaterial({color:0x8c7956,emissive:0xc58b42,emissiveIntensity:.12,roughness:.78,metalness:.05});
 ellipsoid('LeftEyeSocket',-.44,6.65,.825,.145,.145,.013,joint);
 ellipsoid('LeftEye',-.44,6.65,.839,.113,.113,.009,dormantLens);
 ellipsoid('RightEyeSocket',.44,6.65,.825,.15,.15,.013,joint);
 ellipsoid('RightEye',.44,6.65,.839,.118,.118,.009,activeLens);
 const light=new THREE.MeshStandardMaterial({color:0xa08c63,emissive:0xc58b42,emissiveIntensity:.1,roughness:.8});
 ellipsoid('ChestLightSocket',0,5.44,.414,.105,.105,.018,joint);
 ellipsoid('ChestLight',0,5.44,.432,.064,.064,.009,light);
 // Shallow manufactured panels: rounded outline, inset seam and visible fasteners.
 const seamMat=new THREE.MeshStandardMaterial({color:0x77786e,roughness:.9,metalness:.15});
 const faceMat=new THREE.MeshStandardMaterial({color:0xded8c7,roughness:.77,metalness:.12});
 const hatchMat=new THREE.MeshStandardMaterial({color:0x617886,roughness:.88,metalness:.12});
 const fastenerMat=new THREE.MeshStandardMaterial({color:0x747b7c,roughness:.43,metalness:.7});
 const headDetails=[], chestDetails=[];
 function panel(name,w,h,r,x,y,z,mat,list) {
  const shape=new THREE.Shape();
  shape.absarc(w/2-r,h/2-r,r,0,Math.PI/2,false);
  shape.absarc(-w/2+r,h/2-r,r,Math.PI/2,Math.PI,false);
  shape.absarc(-w/2+r,-h/2+r,r,Math.PI,Math.PI*1.5,false);
  shape.absarc(w/2-r,-h/2+r,r,Math.PI*1.5,Math.PI*2,false);
  shape.closePath();
  const g=new THREE.ExtrudeGeometry(shape,{depth:.012,bevelEnabled:false,curveSegments:8});
  const mesh=new THREE.Mesh(g,mat); mesh.name=name; mesh.position.set(x,y,z);
  mesh.castShadow=true; mesh.receiveShadow=true;root.add(mesh);list.push(name);return mesh;
 }
 panel('FaceSeam',2.34,1.14,.18,0,6.95,.824,seamMat,headDetails);
 panel('FacePanel',2.305,1.105,.165,0,6.95,.837,faceMat,headDetails);
 for(const n of ['LeftEyeSocket','LeftEye','RightEyeSocket','RightEye','ForeheadPaintScratch']) root.getObjectByName(n).position.z+=.031;
 const sideSeam=panel('SideHatchSeam',.63,.55,.09,1.35,7.06,-.12,seamMat,headDetails);sideSeam.rotation.y=Math.PI/2;
 const sideCover=panel('SideHatchCover',.595,.515,.075,1.364,7.06,-.12,body,headDetails);sideCover.rotation.y=Math.PI/2;
 for(const y of [6.89,7.23]) {
  const n='SideHatchBolt'+y;
  ellipsoid(n,1.387,y,-.12,.009,.026,.026,fastenerMat);headDetails.push(n);
 }
 panel('ChestHatchSeam',.91,.96,.09,0,5.23,.412,seamMat,chestDetails);
 panel('ChestHatch',.875,.925,.075,0,5.23,.425,hatchMat,chestDetails);
 for(const n of ['ChestLightSocket','ChestLight'])root.getObjectByName(n).position.z+=.027;
 for(const side of [-1,1]) {
  const n='ChestFastener'+side;
  ellipsoid(n,side*.34,5.59,.445,.025,.025,.008,fastenerMat);chestDetails.push(n);
 }
 // Narrow the complete head assembly, including the surface scratch.
 for(const name of ['Head','LeftEyeSocket','LeftEye','RightEyeSocket','RightEye','ForeheadPaintScratch',...headDetails]) {
  const part=root.getObjectByName(name);
  part.position.x *= .88; part.scale.x *= .88; part.position.y -= .10;
 }
 // Drop each shoulder and its whole arm together so wrists and elbows stay connected.
 for(const side of ['Left','Right']) {
  for(const part of ['Shoulder','UpperArm','Elbow','Forearm','Hand','Thumb']) root.getObjectByName(side+part).position.y -= .12;
 }
 for(const name of ['ReplacementShoulderShell','ShoulderFastener']) root.getObjectByName(name).position.y -= .12;
 // Compress the leg region as one continuous deformation so joints stay connected.
 root.updateMatrixWorld(true);
 const point=new THREE.Vector3();
 root.traverse(part => {
  if(!part.isMesh) return;
  const inverse=part.matrixWorld.clone().invert();
  const positions=part.geometry.attributes.position;
  for(let i=0;i<positions.count;i++) {
   point.fromBufferAttribute(positions,i).applyMatrix4(part.matrixWorld);
   point.y = point.y <= .5 ? point.y : point.y < 4.02 ? .5+(point.y-.5)*.84 : point.y-.5632;
   point.applyMatrix4(inverse); positions.setXYZ(i,point.x,point.y,point.z);
  }
  positions.needsUpdate=true;
  part.geometry.deleteAttribute('normal'); part.geometry.deleteAttribute('uv');
  part.geometry=mergeVertices(part.geometry,1e-5);
  part.geometry.computeVertexNormals();
  part.geometry.computeBoundingBox(); part.geometry.computeBoundingSphere();
 });
 // Pose whole assemblies around anatomical pivots after proportion adjustments.
 function assembly(name,names,pivot) {
  root.updateMatrixWorld(true);
  const group=new THREE.Group(); group.name=name; group.position.set(...pivot);
  root.add(group); group.updateMatrixWorld(true);
  for(const partName of names) {
   const part=root.getObjectByName(partName);
   if(!part) throw new Error('Missing pose part: '+partName);
   group.attach(part);
  }
  return group;
 }
 const head=assembly('HeadAssembly',
  ['Head','LeftEyeSocket','LeftEye','RightEyeSocket','RightEye','ForeheadPaintScratch',...headDetails],
  [0,5.59,0]);
 head.scale.z=.80;
 head.rotation.x=.045;
 // Slightly narrow the lower head outline without changing the forehead.
 const headShell=root.getObjectByName('Head');
 const hp=headShell.geometry.attributes.position;
 headShell.geometry.computeBoundingBox();
 const hb=headShell.geometry.boundingBox;
 for(let i=0;i<hp.count;i++) {
  const t=THREE.MathUtils.clamp((hp.getY(i)-hb.min.y)/(hb.max.y-hb.min.y),0,1);
  hp.setX(i,hp.getX(i)*(0.94+0.06*Math.min(t*2,1)));
 }
 hp.needsUpdate=true; headShell.geometry.computeVertexNormals();
 headShell.geometry.computeBoundingBox(); headShell.geometry.computeBoundingSphere();
 for(const side of [-1,1]) {
  const prefix=side<0?'Left':'Right';
  const forearm=assembly(prefix+'ForearmAssembly',
   ['Forearm','Hand','Thumb'].map(n=>prefix+n),[side*1.01,3.9968,0]);
  forearm.rotation.x=-.11;
  const names=[prefix+'Shoulder',prefix+'UpperArm',prefix+'Elbow',prefix+'ForearmAssembly'];
  if(side<0) names.push('ReplacementShoulderShell','ShoulderFastener');
  const shoulder=assembly(prefix+'ArmAssembly',names,[side*.77,5.0368,0]);
  shoulder.position.z+=.035;
  shoulder.position.y-=.025;
 }
 const upper=assembly('UpperBodyAssembly',
  ['HeadAssembly','Neck','Torso','ChestLightSocket','ChestLight','LeftArmAssembly','RightArmAssembly',...chestDetails],
  [0,3.77,0]);
 upper.rotation.x=.025;
 root.updateMatrixWorld(true);
 return root;
}

const robot = buildRobot();
scene.add(robot);
robot.position.y -= new THREE.Box3().setFromObject(robot).min.y;   // 脚底落在地面上

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ opacity: 0.33 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
{ // 脚下的柔和接触阴影
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 8, 128, 128, 128);
  gr.addColorStop(0, 'rgba(30,22,18,.5)'); gr.addColorStop(1, 'rgba(30,22,18,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(8, 8),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.set(0, 0.012, -0.5); scene.add(blob);
}

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  if (robot.userData.tick) robot.userData.tick(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const $ = id => document.getElementById(id);
function setAuto(on) { controls.autoRotate = on; $('bAuto').classList.toggle('on', on); }
$('bAuto').onclick = () => setAuto(!controls.autoRotate);
$('bReset').onclick = () => { camera.position.copy(HOME.pos); controls.target.copy(HOME.tgt); };
canvas.addEventListener('pointerdown', () => setAuto(false));   // 用户一上手就停止自动旋转

// 导出为 GLB（可在 Blender、Windows 3D 查看器、macOS 预览等软件里打开）
async function exportGLB() {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const hidden = [];
  robot.traverse(o => { if (o.isSprite && o.visible) { o.visible = false; hidden.push(o); } });   // 光晕贴片不属于模型
  try { return await new GLTFExporter().parseAsync(robot, { binary: true, onlyVisible: true }); }
  finally { hidden.forEach(o => { o.visible = true; }); }
}
$('bGlb').onclick = async e => {
  const b = e.currentTarget, old = b.textContent;
  b.disabled = true; b.textContent = '导出中…';
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([await exportGLB()], { type: 'model/gltf-binary' }));
    a.download = 'simple-robot-v5.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (err) { console.error(err); alert('导出失败：' + err.message); }
  b.textContent = old; b.disabled = false;
};
window.__glbSize = async () => (await exportGLB()).byteLength;   // 调试用：只测试导出，不保存文件

// 调试用：window.__view(方位角°, 俯仰角°, 距离, 目标高度)
window.__view = (az = -38, el = 3, dist = 28.5, ty = 5) => {
  setAuto(false);
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  controls.target.set(0, ty, -0.35);
  camera.position.set(Math.sin(a) * Math.cos(e) * dist, ty + Math.sin(e) * dist, Math.cos(a) * Math.cos(e) * dist);
  controls.update(); renderer.render(scene, camera);
};

window.__ready = true;
$('msg').remove();
frame();
</script>
