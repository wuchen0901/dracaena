<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>铁锈与微光 · 横版原型</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06090a;color:#e6ebea;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none}
  #c{display:block;width:100%;height:100%;outline:none}
  .fx{position:fixed;inset:0;pointer-events:none}
  #vig{background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 44%,rgba(0,0,0,.3) 78%,rgba(0,0,0,.7) 100%)}
  #grain{opacity:.075;mix-blend-mode:overlay;background-size:256px 256px}
  #bars::before,#bars::after{content:"";position:absolute;left:0;right:0;height:6vh;background:#040607}
  #bars::before{top:0}#bars::after{bottom:0}
  #fade{background:#040607;opacity:1;transition:opacity 1.4s ease}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    transition:opacity .9s ease;padding:0 24px}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font-size:clamp(26px,4.2vw,46px);font-weight:300;letter-spacing:.42em;margin:0 0 0 .42em;color:#eef3f1}
  .ov .sub{font-size:13px;letter-spacing:.3em;margin:14px 0 0 .3em;color:#8fa0a0}
  .ov .keys{font-size:13px;line-height:2.1;color:#b4c0bf;margin:34px 0 0}
  .ov .keys b{display:inline-block;min-width:1.5em;padding:0 .45em;margin:0 .15em;border:1px solid rgba(255,255,255,.28);border-radius:5px;
    font-weight:500;color:#e6ebea;line-height:1.55}
  .ov .go{font-size:13px;letter-spacing:.3em;margin:30px 0 0 .3em;color:#ffc56e;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  #hint{position:fixed;left:50%;bottom:11vh;transform:translateX(-50%);font-size:13.5px;letter-spacing:.14em;color:#dfe7e5;
    text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:0;transition:opacity .6s ease;white-space:nowrap;pointer-events:none}
  #hint b{display:inline-block;padding:0 .5em;margin:0 .3em;border:1px solid rgba(255,255,255,.4);border-radius:5px;font-weight:500;line-height:1.6}
  #skins{position:fixed;left:18px;bottom:calc(6vh + 14px);display:flex;gap:6px;opacity:.0;transition:opacity .8s ease}
  #skins.on{opacity:.78}
  #skins button{font:inherit;font-size:12px;color:#dfe7e5;background:rgba(10,14,15,.55);border:1px solid rgba(255,255,255,.2);
    border-radius:7px;padding:5px 9px;cursor:pointer}
  #skins button.on{background:#c98f3d;border-color:#e6ae5c;color:#20160a}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#b4c0bf;pointer-events:none}
  /* 章节卡：走进新的一章时在画面上方淡入几秒 */
  #chap{position:fixed;left:0;right:0;top:11vh;text-align:center;opacity:0;transition:opacity 1.2s ease;pointer-events:none;
    color:#e6ebea;text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 16px rgba(0,0,0,.75)}   /* 两层影子：亮的画面（第七章的蓝天白云）上也看得清 */
  #chap.on{opacity:1}
  #chap i{display:block;font-style:normal;font-size:12px;letter-spacing:.5em;margin-left:.5em;color:#a9b8b8}
  #chap b{display:block;font-weight:300;font-size:clamp(20px,2.6vw,30px);letter-spacing:.4em;margin:8px 0 0 .4em}
  #chap span{display:block;font-size:12.5px;letter-spacing:.3em;margin:8px 0 0 .3em;color:#ffc56e}
  /* 声音开关的提示：右上角的黑边里出现一会儿就淡掉 */
  #snd{position:fixed;right:22px;top:3vh;transform:translateY(-50%);font-size:12px;letter-spacing:.2em;color:#9aabab;
    opacity:0;transition:opacity .6s ease;pointer-events:none;white-space:nowrap}
  #snd.on{opacity:.85}
  #snd b{display:inline-block;padding:0 .45em;margin:0 .35em;border:1px solid rgba(255,255,255,.3);border-radius:4px;
    font-weight:500;color:#dfe7e5;line-height:1.5;letter-spacing:0}
  /* 章节菜单 */
  #menu{background:rgba(4,6,7,.84);transition:opacity .25s ease}
  #menu h1{font-size:clamp(20px,2.8vw,30px)}
  #menulist{margin-top:24px;text-align:left}
  #menulist .it{display:flex;align-items:baseline;gap:14px;padding:7px 18px;border-radius:8px;cursor:pointer;color:#aab7b6;font-size:14px;letter-spacing:.12em}
  #menulist .it i{font-style:normal;color:#6f7f80;width:1.2em}
  #menulist .it b{font-weight:500;color:#dfe7e5;min-width:5.5em}
  #menulist .it span{font-size:12.5px;color:#8fa0a0}
  #menulist .it.sel{background:rgba(201,143,61,.2);outline:1px solid rgba(230,174,92,.55)}
  #menulist .it.sel b{color:#ffd9a0}
  #end .keys{max-width:34em;line-height:2;margin-top:22px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="vig" class="fx"></div>
<div id="grain" class="fx"></div>
<div id="fade" class="fx"></div>
<div id="bars" class="fx"></div>
<div id="hint"></div>
<div id="chap"></div>
<div id="snd"></div>
<div id="skins">
</div>
<div id="title" class="ov hide">
  <h1>铁锈与微光</h1>
  <div class="sub">横版原型 · 八章</div>
  <div class="keys">
    <b>←</b><b>→</b> 或 <b>A</b><b>D</b> 移动　　<b>空格</b> 跳跃 / 攀爬　　按住 <b>E</b> 推拉　·　按 <b>E</b> 操作机关<br>
    <b>Esc</b> 选择章节　　<b>R</b> 回到存档点　　<b>Shift</b> 慢走　　<b>V</b> 近看主角　　<b>M</b> 打开声音　　<b>C</b> 换衣服颜色　　<b>X</b> 换腿脚
  </div>

</div>

  <div id="menulist"></div>
  <div class="keys"><b>↑</b><b>↓</b> 选择　　<b>回车</b> 从这一章的开头开始　　<b>Esc</b> 返回</div>
</div>
<div id="end" class="ov hide">
  <h1>铁锈与微光</h1>
  <div class="sub" id="endsub"></div>
  <div class="keys" id="endtxt"></div>
  <div class="go">按 R 回到最后的选择　·　Esc 选择章节</div>
</div>
<div id="msg">正在加载…</div>
<script>
  setTimeout(function () {
    if (!window.__ready) document.getElementById('msg').textContent = '加载失败：本页面需要联网，从 cdn.jsdelivr.net 加载 three.js';
  }, 12000);

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as cloneSkeleton } from 'three/addons/utils/SkeletonUtils.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// ============================================================
//  基础：渲染器 / 场景 / 相机 / 小工具 / 输入
// ============================================================
const $ = id => document.getElementById(id);
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;   // 不做色调映射：画出来的颜色就是看到的颜色
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1518);
scene.fog = new THREE.FogExp2(0x0e1518, 0.026);
const camera = new THREE.PerspectiveCamera(28, 1, 0.5, 900);

function resize() {
  const w = innerWidth || 1280, h = innerHeight || 720;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1.2 ? 40 : 28;      // 窄屏时放宽视野
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));   // 与帧率无关的平滑
const approach = (a, b, s) => a < b ? Math.min(b, a + s) : Math.max(b, a - s);   // 匀速靠近
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const hex3 = h => [(h >> 16 & 255) / 255, (h >> 8 & 255) / 255, (h & 255) / 255];   // 0xRRGGBB → [r, g, b]（不做色彩空间转换）
const css = h => '#' + h.toString(16).padStart(6, '0');

let _seed = 20261111;
function rnd() {   // 固定种子的随机数：每次打开画面都一样
  _seed = _seed + 0x6D2B79F5 | 0;
  let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function canvasTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.generateMipmaps = true;
  return t;
}
function add(parent, geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = shadow; parent.add(m); return m;
}
function grp(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
const lam = (color, o = {}) => new THREE.MeshLambertMaterial({ color, ...o });

// ---- 输入 ----
const keys = new Set(), pressed = new Set();
const MAP = { ArrowLeft: 'L', KeyA: 'L', ArrowRight: 'R', KeyD: 'R', Space: 'J', ArrowUp: 'J', KeyW: 'J',
  KeyE: 'E', KeyK: 'E', ShiftLeft: 'S', ShiftRight: 'S', KeyR: 'RESET', KeyM: 'MUTE', KeyV: 'VIEW',
  KeyC: 'TINT', KeyX: 'LEGS',
  Escape: 'MENU', KeyP: 'MENU', Enter: 'OK', ArrowDown: 'DOWN', KeyS: 'DOWN' };
const rawKeys = new Set();                        // 这一帧新按下的键（原始键码），菜单用
let anyKey = false;
addEventListener('keydown', e => {
  const k = MAP[e.code]; if (e.code !== 'Escape' && e.code !== 'KeyP') anyKey = true;
  if (!e.repeat) rawKeys.add(e.code);
  if (k) { if (!keys.has(k)) pressed.add(k); keys.add(k); e.preventDefault(); }
});
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) keys.delete(k); });
addEventListener('blur', () => keys.clear());
addEventListener('pointerdown', () => { anyKey = true; });

// ============================================================
//  世界数据与碰撞（单位：米；x 向右，y 向上，玩法平面 z = 0）
//  整段旅程是一条连续向右的路：八个章节各占一段 x，在各自的文件（60-ch*.js）里
//  往这里登记地形、方块、可推的东西、闸门、机关和存档点
// ============================================================
const X1 = 0, X2 = 104, X3 = 260, X4 = 392, X5 = 478, X6 = 542, X7 = 656, X8 = 772;      // 各章的原点（世界 x）
const CHAPTERS = [];                                 // { n, x0: 这一章从哪里算起, start: 出生点, name, sub }
function chapter(o) { CHAPTERS.push(o); return o; }
const chapterAt = x => { let c = CHAPTERS[0]; for (const k of CHAPTERS) if (x >= k.x0) c = k; return c; };

// 故事进度：跨章节要记住的事（存进 localStorage，下次打开接着走）
//   cat 救下了小猫 / fed 老人拿到了食物 / cleaner 1 = 电池给了清洁机器人，2 = 给了门 /
//   pump 水泵通了电 / water 给幸存者和猫留了水 / wild 野地得到了水 / ending 1 = 修复，2 = 旁路
const STORY0 = { ch: 1, done: 0, cat: false, fed: false, cleaner: 0, pump: false, water: false, wild: false, ending: 0 };
const STORY = { ...STORY0 };

// ---- 地形：一条折线，坡度都很缓；陡的台阶、坑壁用 SOLIDS 里的方块表示 ----
const TERRAIN = [];
function terrain(...pts) { for (const p of pts) TERRAIN.push(p); }
let _gi = 1;
function groundY(x) {
  const n = TERRAIN.length; let i = clamp(_gi, 1, n - 1);
  while (i > 1 && x < TERRAIN[i - 1][0]) i--;
  while (i < n - 1 && x > TERRAIN[i][0]) i++;
  _gi = i; const a = TERRAIN[i - 1], b = TERRAIN[i];
  return a[1] + (b[1] - a[1]) * clamp((x - a[0]) / (b[0] - a[0]), 0, 1);
}
const groundSlope = x => (groundY(x + 0.15) - groundY(x - 0.15)) / 0.3;
// 地面往远处铺到哪里：平时一直铺到看不见的地方；登记过的一段 [x1, x2] 只铺到 z 为止 —— 后面是低下去的谷地，由布景板来画
const GROUND_BACK = [];
function groundBack(x1, x2, z) { GROUND_BACK.push([x1, x2, z]); }
const GROUND = [];                                   // 地面颜色的关键点 [x, 颜色]，中间线性过渡
function ground(x, hex) { GROUND.push([x, new THREE.Color(hex)]); }
function groundColor(x, out) {
  for (let i = 1; i < GROUND.length; i++) if (x <= GROUND[i][0]) return out.lerpColors(GROUND[i - 1][1], GROUND[i][1], clamp((x - GROUND[i - 1][0]) / (GROUND[i][0] - GROUND[i - 1][0]), 0, 1));
  return out.copy(GROUND[GROUND.length - 1][1]);
}

// ---- 登记表 ----
const SOLIDS = [], PUSHABLES = [], GATES = [], USES = [], PITS = [], CPS = [], ZONES = [], HINTS = [], CAMKEYS = [];
// 实心方块（从 y1 到 y2）。玩家会被侧面挡住，可以站在顶上。plat: 悬空也能站（漂在水上的木梁）
function solid(o) { SOLIDS.push(o); return o; }
function syncBox(o) { o.x1 = o.x - o.w / 2; o.x2 = o.x + o.w / 2; }
// 可以按住 E 推拉的东西：{ id, x, w, h, min, max }。只能放在平地上；lo() / hi() 可以给出会变的活动范围
function pushable(o) { o.v = 0; o.x0 = o.x; o.y1 ??= groundY(o.x); o.y2 = o.y1 + o.h; syncBox(o); SOLIDS.push(o); PUSHABLES.push(o); return o; }
function placeBox(o, x) { o.x = x; o.v = 0; syncBox(o); }
// 向上升起的闸门：want = 1 打开，0 关上
function gate(o) {
  o.w ??= 0.9; o.h ??= 3.6; o.T ??= 2.8; o.y0 ??= groundY(o.x); o.open = 0; o.want = 0;
  o.x1 = o.x - o.w / 2; o.x2 = o.x + o.w / 2; o.y1 = o.y0; o.y2 = o.y0 + o.h; SOLIDS.push(o); GATES.push(o); return o;
}
function setGate(g, open) { g.open = g.want = open; g.y1 = g.y0 + g.open * (g.h + 0.15); }
// 按 E 操作的固定机关：{ x, r: 左右多远够得着, y0 / y1: 脚要站在多高（够不着的拉杆要先垫箱子）, can(), on() }
function usable(o) { USES.push(o); return o; }
// 掉下去就回到岸上的坑 / 水：{ x1, x2, y: 低于这个高度算掉下去, back(): 回到哪个 x }
function pit(o) { PITS.push(o); return o; }
function checkpoint(x, o = {}) { CPS.push({ x, ...o }); }
function cpAt(x) { let k = 0; for (let i = 0; i < CPS.length; i++) if (x >= CPS[i].x - 0.01) k = i; return k; }
// 镜头关键帧：[x, 距离, 目标高度偏移, 目标水平偏移, 抬高多少（不写就是 0）]
// 抬高：镜头在原来的位置上再升高这么多米，对着的还是同一点，于是从平视变成往下看（要看清地面以下的东西时用，比如水渠里面）
function camKeys(...k) { CAMKEYS.push(...k); }
function camKey(x) {
  for (let i = 1; i < CAMKEYS.length; i++) {
    const a = CAMKEYS[i - 1], b = CAMKEYS[i];
    if (x <= b[0]) { const t = sstep(a[0], b[0], x); return [lerp(a[1], b[1], t), lerp(a[2], b[2], t), lerp(a[3], b[3], t), lerp(a[4] ?? 0, b[4] ?? 0, t)]; }
  }
  const k = CAMKEYS[CAMKEYS.length - 1]; return [k[1], k[2], k[3], k[4] ?? 0];
}
function hint(cond, html) { HINTS.push([cond, html]); }
// 一个章节的画面和逻辑：{ n, vis: [x1, x2] 画面占的范围, build*(R) 搭建, update(dt) 每帧, reset() 回到初始, solve() 当作已经通过 }
function defZone(z) { z.root = null; z.gen = null; z.built = false; ZONES.push(z); return z; }

// ---- 玩家状态 ----
const P = { x: 2, y: 0, vx: 0, vy: 0, grounded: true, facing: 1, hw: 0.19, hh: 1.1, H: 1.24, coyote: 0, jumpBuf: 0,
  mode: 'normal', modeT: 0, grab: 0, grabObj: null, impact: 0, cp: 0, mantle: null, moved: false, jumped: false, pushed: false, used: false, speedK: 1 };
// 每一帧由各章节填写、交给主角动画的“表演指令”：hide 捂灯，alert 被灯照到，energy 灯还剩多少电，pose 额外姿势
const HX = { hide: 0, alert: 0, energy: 1, pose: null };

function sideHit(nx, y) {      // 位置 (nx, y) 是否撞进某个方块的侧面
  for (const s of SOLIDS) if (!s.off && nx + P.hw > s.x1 && nx - P.hw < s.x2 && y + 0.03 < s.y2 && y + P.hh > s.y1 + 0.03) return s;
  return null;
}
function floorY(x, y) {        // 脚下的支撑面高度（地形或方块顶面）
  let f = groundY(x);
  for (const s of SOLIDS) if (!s.off && x + 0.13 > s.x1 && x - 0.13 < s.x2 && s.y2 <= y + 0.28 && (s.plat || s.y1 <= f + 0.01)) f = Math.max(f, s.y2);
  return f;
}
const standingOn = s => P.grounded && P.x + 0.13 > s.x1 && P.x - 0.13 < s.x2 && Math.abs(P.y - s.y2) < 0.03;

// ============================================================
//  布景板：用 2D 画布“画”出剪影，贴在不同深度的平面上，镜头移动时自然产生视差
// ============================================================
let ROOT = scene;                                   // 布景板当前挂到哪个节点下（各章节搭建时会换成自己的）

// 世界范围 [x1,x2]×[y1,y2]，深度 z。draw(g) 里直接以“米”为单位、y 轴向上
// o: blur 虚焦 / additive 叠加发光 / fog 受不受雾影响 / order 绘制次序 / fadeL、fadeR 左右两端渐隐多少米 /
//    floor 平铺在地上，值是离地多高（这时 y1、y2 是 z 的范围，画的时候 y 就是 z，z 那个参数不用；要自己给 order）/
//    lit 受场景里的灯光和影子影响（地上的污渍、积水要跟着明暗走；默认的布景板是自己发色的，不看灯光）/
//    side 贴在一面朝 ±x 的竖墙上（比如水渠的内壁）：这时 x1、x2 是 z 的范围，z 那个参数是墙在哪个 x，画的时候横坐标就是 z；-1 朝 -x，+1 朝 +x（要自己给 order）/
//    blurOnce 先清清楚楚地画在另一张画布上，再整张虚化一次（默认是每一笔各自虚化 —— 笔画成千上万的时候，浏览器的绘图进程会撑不住，整个画面都丢掉）
function backdrop(x1, x2, y1, y2, z, ppm, draw, o = {}) {
  let W = (x2 - x1) * ppm, Hh = (y2 - y1) * ppm;
  const k = Math.min(1, 4096 / W, 4096 / Hh), s = ppm * k, flat = o.floor !== undefined, side = o.side ?? 0;
  const [c, g] = mkCanvas(Math.round(W * k), Math.round(Hh * k));

//  分区加载：每一章的布景只在走近时才搭建，走远了就释放

// ============================================================
function disposeTree(root) {
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.isInstancedMesh) o.dispose();                  // 实例的位置、颜色是另外几块缓冲区
    const m = o.material; if (m && m.userData && m.userData.own) { if (m.map) m.map.dispose(); m.dispose(); }
  });
  if (root.parent) root.parent.remove(root);
}
function zoneStep(z) {                                   // 搭建过程是一个生成器：每帧只推进一小步，走路时不会卡
  const s0 = _seed, t0 = performance.now(); _seed = z._seed; ROOT = z.root;
  let r; try { r = z.gen.next(); } finally { z._seed = _seed; _seed = s0; ROOT = scene; }
  z.ms.push(Math.round(performance.now() - t0));      // 每一步花了多久（调试用：__g.zone(n).ms）
  if (r.done) { z.gen = null; z.built = true; }
}
function streamZones(cx, sync = false) {
  let stepped = false;
  for (const z of ZONES) {
    const want = cx > z.vis[0] - 75 && cx < z.vis[1] + 75;
    if (want && !z.root) { z.root = new THREE.Group(); scene.add(z.root); z._seed = 1000 + z.n * 7919; z.ms = []; z.gen = z.build(z.root); }
    if (z.gen && (sync || !stepped)) { do zoneStep(z); while (sync && z.gen); stepped = true; }

}

// Tune this playable instance while preserving the imported asset and its skin weights.
function refineTravelerAppearance(model) {
  model.traverse(mesh => {
    if (!mesh.isMesh) return;
    mesh.geometry = mesh.geometry.clone();
    mesh.userData.travelerOwned = true;
    const geometry = mesh.geometry, positions = geometry.attributes.position;
    geometry.computeBoundingBox();
    const box = geometry.boundingBox, height = box.max.y - box.min.y;
    const footCenters = [-1, 1].map(side => {
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i), y = positions.getY(i);
        if (x * side <= 0 || y > box.min.y + height * .055) continue;
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minZ = Math.min(minZ, positions.getZ(i)); maxZ = Math.max(maxZ, positions.getZ(i));
      }
      return Number.isFinite(minX) ? [(minX + maxX) / 2, (minZ + maxZ) / 2] : [0, 0];

    const readability = new Float32Array(positions.count);
    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i), y = positions.getY(i), z = positions.getZ(i), h = (y - box.min.y) / height;
      const foot = 1 - sstep(.045, .085, h), center = footCenters[x < 0 ? 0 : 1];

  // 外壳带一点自发光：场景再暗，身体的明度也不会掉到看不清；照到强光时又不至于发白
  const paint = c => lam(c, { emissive: c, emissiveIntensity: npc ? .09 : .22 });
  // 只有三个明度：机床灰绿的外壳、深一号的检修盖和靴子、近乎黑的关节 / 手 / 面罩。没有任何别的颜色
  const M = { shell: paint(0x85988b), panel: paint(0x5c6c62), dark: lam(0x1b1f20), visor: lam(0x08090a), sole: lam(0x121415) };
  const U = pts => pts.map(([x, y, r]) => r === undefined ? [x * u, y * u] : [x * u, y * u, r * u]);        // 轮廓坐标都以身高为单位

  // 躯干：上宽下窄，胸口微鼓，背上隆起一块装电池的“驼背”—— 侧面看像个弓着背的小工人
  slab(spine, U([[-.05, .04], [.046, .04], [.07, .13], [.068, .225], [.042, .285], [-.05, .285], [-.108, .238, .04], [-.112, .16, .04], [-.066, .095, .03]]), .026 * u, .17 * u, M.shell);
  slab(spine, U([[-.1, .135], [-.052, .135], [-.052, .222], [-.1, .222]]), .012 * u, .176 * u, M.panel, .004 * u);   // 电池舱的检修盖（两侧各露出一块）
  slab(pelvis, U([[-.04, -.03], [.036, -.03], [.042, .046], [-.046, .046]]), .02 * u, .1 * u, M.dark);
  // 驼背顶上的吊环 —— 回收线就是钩着这只环把它们一台台吊走的
  const eye = add(spine, new THREE.TorusGeometry(.02 * u, .006 * u, 6, 16), M.dark, -.083 * u, .273 * u, 0); eye.rotation.z = .7;

  // 胸口的灯：一颗凸出来的琥珀色指示灯，从侧面也看得见。亮度 = 它还剩多少能量
  const lx = .069 * u, ly = .185 * u;
  add(spine, cy(.031 * u, .031 * u, .014 * u, 18), M.dark, lx - .002 * u, ly, 0).rotation.z = Math.PI / 2;             // 灯座
  const lens = add(spine, sph(.024 * u, 16, 12), new THREE.MeshBasicMaterial({ color: npc ? 0x2e1c10 : 0xffc67e, fog: !npc ? false : true }), lx + .004 * u, ly, 0, false);
  lens.scale.set(.75, 1, 1);
  let lamp = null;
  if (!npc) {
  const halo = glow(spine, 0xffa040, .27 * u, .85, lx + .02 * u, ly, 0);      // 近处的光晕：会被身体和手挡住
  const aura = glow(spine, 0xff9a3c, .62 * u, .16, lx + .02 * u, ly, 0);      // 一圈很淡的大光晕，转身时挪到朝镜头的一侧
  // 真正照亮东西的是两盏灯：一盏朝前下方的射灯（照亮身前的地面和手里的东西，不照自己的胸口），
  // 一盏很弱的点光（让帽檐底下和胸口沾一点暖色）
  const beam = new THREE.SpotLight(0xffab52, 2.4, 4.6, 1.0, 1, 2); beam.position.set(lx + .03 * u, ly, 0);
  beam.target.position.set(lx + .9 * u, ly - .5 * u, 0); spine.add(beam, beam.target);
  const fill = new THREE.PointLight(0xffab52, .1, 1.2, 2); fill.position.set(lx + .1 * u, ly, 0); spine.add(fill);
  lamp = { lens, halo, aura, beam, fill, x: lx + .02 * u, y: ly, I: 2.4, fillI: .1, haloSize: .27 * u, auraOp: .16, dim: new THREE.Color(0x6e3410), lit: new THREE.Color(0xffc67e) };
  }

  // 头：一只扣着安全帽的“桶”。帽檐只往前伸，帽檐下面是一整块深色面罩 —— 没有眼睛，也就没有表情
  add(head, cy(.023 * u, .023 * u, .06 * u, 10), M.dark, 0, .012 * u, 0);                                                 // 脖子
  add(head, cy(.104 * u, .094 * u, .1 * u, 28), M.shell, 0, .085 * u, 0);
  add(head, new THREE.SphereGeometry(.104 * u, 28, 12, 0, 6.2832, 0, Math.PI / 2), M.shell, 0, .135 * u, 0).scale.y = .86;
  const brim = add(head, new THREE.CylinderGeometry(.109 * u, .109 * u, .013 * u, 24, 1, false, 0, Math.PI), M.shell, 0, .134 * u, 0);   // 只有前半圈
  brim.scale.x = 1.56; brim.rotation.z = -.12;
  add(head, new THREE.CylinderGeometry(.1044 * u, .0969 * u, .075 * u, 20, 1, true, .175, 2.79), M.visor, 0, .0895 * u, 0);
  for (const side of [0, 1]) {                                                                                          // 两侧各喷一个编号
    const m = new THREE.MeshLambertMaterial({ map: stencil07(), transparent: true, depthWrite: false });
    add(head, new THREE.CylinderGeometry(.1032 * u, .0977 * u, .055 * u, 8, 1, true, side ? 3.281 : -.838, .698), m, 0, .0875 * u, 0, false);
  }

  // 四肢：细，关节只露出一道深色的缝；越往手脚越粗 —— 像戴着大一号的手套、穿着大一号的靴子
  // gap0 / gap1：这一节外壳的上端、下端各让出多少给关节
  const limb = (p, len, r1, r2, jr, gap0 = .55, gap1 = .45) => {
    add(p, sph(jr, 12, 8), M.dark);
    const y0 = -jr * gap0, y1 = -len + jr * gap1;

  };
  const arms = [0, 1].map(i => {
    const sh = grp(chest, 0, -.012 * u, (i ? -1 : 1) * D.shZ); limb(sh, D.uarm, .024 * u, .021 * u, .024 * u, .2);
    const el = grp(sh, 0, -D.uarm, 0); limb(el, D.farm, .02 * u, .03 * u, .02 * u, .6, 0);
    add(el, sph(.029 * u, 12, 8), M.dark, .003 * u, -D.farm - .022 * u, 0).scale.set(.8, 1.08, .64);                    // 连指手套一样的手
    add(el, sph(.012 * u, 8, 6), M.dark, .024 * u, -D.farm - .012 * u, 0);                                              // 拇指
    return { sh, el };
  });
  const legs = [0, 1].map(i => {
    const hip = grp(pelvis, 0, -.005 * u, (i ? -1 : 1) * D.hipZ); limb(hip, D.thigh, .034 * u, .028 * u, .03 * u, .35);
    const knee = grp(hip, 0, -D.thigh, 0); limb(knee, D.shin, .026 * u, .035 * u, .027 * u, .6, 0);
    const foot = grp(knee, 0, -D.shin, 0);
    slab(foot, U([[-.048, -.05], [.098, -.05], [.104, -.03], [.066, .002], [.032, .014], [-.044, .014]]), .014 * u, .08 * u, M.panel);
    slab(foot, U([[-.051, -.05], [.106, -.05], [.106, -.037], [-.051, -.037]]), .005 * u, .084 * u, M.sole, .008 * u);
    return { hip, knee, foot };
  });

  if (!npc) loadTravelerModel(source => {
    const model = cloneSkeleton(source);
    refineTravelerAppearance(model);
    model.updateMatrixWorld(true);
    model.traverse(node => { if (node.isSkinnedMesh) { node.skeleton.update(); node.frustumCulled = false; } });
    const bounds = new THREE.Box3().setFromObject(model, true), size = bounds.getSize(new THREE.Vector3()), center = bounds.getCenter(new THREE.Vector3());
    const scale = u / Math.max(size.y, 1e-4);
    model.scale.multiplyScalar(scale);
    model.rotation.y = Math.PI / 2;                           // GLB faces +Z; the side-scroller faces +X
    const rotatedCenter = center.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);
    model.position.set(-rotatedCenter.x * scale, -bounds.min.y * scale, -rotatedCenter.z * scale);

    traveler.model = model;
    model.traverse(node => {
      if (node.isBone) traveler.bones.set(node.name, { node, rest: node.quaternion.clone() });
      if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; node.userData.travelerShared = !node.userData.travelerOwned; }
    });

}

// ============================================================
//  小孩（K）：照 INSIDE 那一类角色的“做法”搭的人形 —— 造型是我们自己的，不是那个游戏里的男孩
//  做法只有四条：真实的儿童比例；没有脸；几块平涂的颜色；身体是一整张连续的表面
//  （手肘、膝盖弯起来没有球、没有缝：靠蒙皮 —— 每个顶点记着自己跟哪几根骨头走、各占几成）
//  骨架的节点和其他外形一模一样，所以走 / 跑 / 跳 / 推 / 爬的动画直接沿用
//  造型按定稿草图（generated_images/concept-inside-style-10.png）来：4 号“乱发”、6 号“连帽衫”、长裤靴子、手露在外面、
//  连帽衫是米白色、不带灯。之前试过的“短裤光腿”和另外三种颜色还留着，按 X / C 可以切换着看
// ============================================================

// 连帽衫的颜色定的是米白（按 C 还能轮换着看别的）；除此之外全身只有肤色、深色的头发、深色的裤子和靴子
const KID_TINTS = [[0x466a98, '工装蓝'], [0x6b8f58, '嫩芽绿'], [0xcfc8b8, '米白'], [0x2c3236, '深灰']];
const KID_LEGS = ['长裤靴子', '短裤光腿'];
let kidTint = 2, kidLegs = 0;                                              // 定稿：米白、长裤靴子
const KID_HEAD = 1.18;                                                     // 头比真实比例大一圈：定稿草图是四个头高，远看才认得出人

// 一张表面：往里加一片片网格，最后一次生成几何体。坐标都以身高为单位，scale 是身高
function kidSurf(scale) {
  const pos = [], col = [], bi = [], bw = [], tris = [];
  let skinned = false;
  const vert = (p, bones) => {
    pos.push(p[0] * scale, p[1] * scale, p[2] * scale); const s = p[3] ?? 1; col.push(s, s, s);
    let sum = 0; if (bones) { skinned = true; for (const b of bones) sum += b[1]; }
    for (let i = 0; i < 4; i++) { const b = bones && bones[i]; bi.push(b ? b[0] : 0); bw.push(b ? b[1] / sum : 0); }
    return pos.length / 3 - 1;
  };
  // 一片网格：rows 圈、每圈 n 个点，pt(i, k) 返回第 i 圈第 k 个点 [x, y, z, 明暗]；o.bones(i, k) 给出这个点跟哪些骨头走。
  // 面朝哪边由走向决定：圈从上往下排、每圈从 +x 转向 +z，面就朝外。o.top / o.bot 用一个点把两头封上
  function grid(rows, n, pt, o = {}) {
    const base = pos.length / 3, bones = (i, k) => typeof o.bones === 'function' ? o.bones(i, k) : o.bones;
    for (let i = 0; i < rows; i++) for (let k = 0; k < n; k++) vert(pt(i, k), bones(i, k));
    for (let i = 0; i < rows - 1; i++) for (let k = 0; k < n; k++) {
      const a = base + i * n + k, b = base + i * n + (k + 1) % n, c = a + n, d = b + n;
      tris.push(a, b, d, a, d, c);
    }
    if (o.top) { const t = vert(o.top, bones(0, 0)); for (let k = 0; k < n; k++) tris.push(t, base + (k + 1) % n, base + k); }
    if (o.bot) { const t = vert(o.bot, bones(rows - 1, 0)), r = base + (rows - 1) * n; for (let k = 0; k < n; k++) tris.push(t, r + k, r + (k + 1) % n); }
  }
  // 一只球（可以被 fn 捏成别的形状）：fn(从头顶往下的角度, 绕竖轴的角度) 返回 [x, y, z, 明暗]
  function ball(rows, n, fn, bones) {
    grid(rows, n, (i, k) => fn(Math.PI * (i + 1) / (rows + 1), 6.2832 * k / n), { top: fn(0, 0), bot: fn(Math.PI, 0), bones });
  }
  function geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    if (skinned) { g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(bi, 4)); g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(bw, 4)); }
    g.setIndex(tris); g.computeVertexNormals(); return g;
  }
  return { grid, ball, geometry };
}

// keys 每行 [s, 值, 值, …]（s 递增）；返回 s 处各列的平滑插值
function kidSpline(keys, s) {
  let i = 0; while (i < keys.length - 2 && s > keys[i + 1][0]) i++;
  const k0 = keys[Math.max(i - 1, 0)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(i + 2, keys.length - 1)];
  const h = k2[0] - k1[0], t = clamp((s - k1[0]) / h, 0, 1), t2 = t * t, t3 = t2 * t, out = [];
  for (let j = 1; j < k1.length; j++) {
    const m1 = (k2[j] - k0[j]) / (k2[0] - k0[0]) * h, m2 = (k3[j] - k1[j]) / (k3[0] - k1[0]) * h;
    out.push((2 * t3 - 3 * t2 + 1) * k1[j] + (t3 - 2 * t2 + t) * m1 + (3 * t2 - 2 * t3) * k2[j] + (t3 - t2) * m2);
  }
  return out;
}

// 竖着的一根管子（袖子、裤腿、躯干都是它）。keys 每行 [s, cx, f, b, w, 倾斜]：
//   s 从 o.y 往下量；cx 这一圈的中心前后偏多少；f / b 朝前、朝后的半径；w 左右的半宽；倾斜（可以不写）= 前面抬高多少、后面压低多少
// o: x y z 起点 / rows 加密成多少圈 / n 每圈几个点 / bones(s, 朝前的程度, 朝右的程度) 这个点跟哪些骨头走 / shade(s) 明暗
//    rim、hem: [缩进比例, 深度, 里圈的比例] —— 上口、下口向里翻一道边，看得出布料的厚度
function kidTube(S, keys, o) {
  const s0 = keys[0][0], s1 = keys[keys.length - 1][0], rows = o.rows ?? 24, n = o.n ?? 20, R = [];
  for (let i = 0; i < rows; i++) {
    const s = lerp(s0, s1, i / (rows - 1)), [cx, f, b, w, ty = 0] = kidSpline(keys, s);
    R.push({ s, cx, f: Math.max(f, 0), b: Math.max(b, 0), w: Math.max(w, 0), ty, sh: o.shade ? o.shade(s) : 1 });
  }
  const lip = (r, [k, d, k2 = k * 0.96], dir) => [{ ...r, f: r.f * k, b: r.b * k, w: r.w * k, sh: 0.5 }, { ...r, s: r.s + dir * d, f: r.f * k2, b: r.b * k2, w: r.w * k2, sh: 0.3 }];
  if (o.rim) R.unshift(...lip(R[0], o.rim, 1).reverse());                 // 上口：先在里面往上走，翻过口沿再往下
  if (o.hem) R.push(...lip(R[R.length - 1], o.hem, -1));                  // 下口：走到底以后翻进去往上
  S.grid(R.length, n, (i, k) => {
    const r = R[i], a = 6.2832 * k / n, ca = Math.cos(a), sa = Math.sin(a);
    return [(o.x ?? 0) + r.cx + (ca > 0 ? r.f : r.b) * ca, (o.y ?? 0) - r.s + r.ty * ca, (o.z ?? 0) + r.w * sa, r.sh];
  }, { bones: (i, k) => o.bones(R[i].s, Math.cos(6.2832 * k / n), Math.sin(6.2832 * k / n)) });
}

function buildKid() {
  const S = SKINS.K, u = S.H, shorts = kidLegs === 1;

  const D = { thigh: 0.218 * u, shin: 0.218 * u, uarm: 0.165 * u, farm: 0.15 * u, ankle: 0.05 * u, hipY: 0.494 * u, hipZ: 0.05 * u, shY: 0.263 * u, shZ: 0.098 * u };
  const root = new THREE.Group(), pelvis = grp(root, 0, D.hipY, 0), spine = grp(pelvis), chest = grp(spine, 0, D.shY, 0), head = grp(chest, 0.004 * u, 0.038 * u, 0);
  head.scale.setScalar(KID_HEAD);
  const arms = [0, 1].map(i => { const sh = grp(chest, 0, -0.012 * u, (i ? -1 : 1) * D.shZ), el = grp(sh, 0, -D.uarm, 0); return { sh, el }; });
  const legs = [0, 1].map(i => { const hip = grp(pelvis, 0, -0.005 * u, (i ? -1 : 1) * D.hipZ), knee = grp(hip, 0, -D.thigh, 0), foot = grp(knee, 0, -D.shin, 0); return { hip, knee, foot }; });

  // 各个关节在“绑定姿势”（站直、手臂垂着）里的高度，以身高为单位
  const PY = 0.494, HJ = PY - 0.005, AY = HJ - 0.436, CY = PY + 0.263, SY = CY - 0.012, NY = CY + 0.038;

  const hoodie = (s, ca, sa) => {

    return k > 0 ? [[SPINE, 1 - k], [HIP(0), k * r], [HIP(1), k * (1 - r)]] : mix(CHEST, SPINE, sstep(0.045, 0.195, s));
  };

  kidTube(top, [[0, -0.004, 0.036, 0.04, 0.04, -0.006], [0.012, -0.004, 0.044, 0.05, 0.066, -0.003], [0.029, -0.001, 0.058, 0.066, 0.116, 0], [0.049, 0, 0.064, 0.072, 0.118, 0],
    [0.089, 0.001, 0.067, 0.073, 0.104, 0], [0.155, 0.004, 0.068, 0.068, 0.098, 0], [0.225, 0.006, 0.07, 0.064, 0.098, 0], [0.295, 0.004, 0.071, 0.072, 0.102, 0],
    [0.327, 0.003, 0.071, 0.075, 0.104, 0], [0.341, 0.002, 0.066, 0.07, 0.098, 0]],
    { y: NY + 0.002, rows: 38, n: 28, rim: [0.84, 0.012], hem: [0.93, 0.004, 0.5], bones: hoodie });

  top.ball(8, 16, (th, ph) => {

  const bump = (a, th, amp, a0, th0, sth) => amp * Math.exp(-((a / a0) ** 2) - ((th - th0) / sth) ** 2);

  const TUFTS = [[0.1, 0.3, 0.04, 0.034], [0.5, 0.45, 0.04, 0.03], [0.48, -0.8, 0.038, 0.03], [0.55, 1.9, 0.044, 0.034], [0.52, -2.1, 0.046, 0.034], [0.6, 3.14, 0.05, 0.036],

    const FK = [[-0.05, -0.02, 0.01, 0.01, 0.012], [-0.044, -0.017, 0.026, 0.026, 0.025], [-0.024, -0.012, 0.042, 0.037, 0.034], [0, -0.01, 0.046, 0.0395, 0.036], [0.019, -0.016, 0.04, 0.0335, 0.037],
      [0.041, -0.024, 0.03, 0.0255, 0.039], [0.067, -0.03, 0.024, 0.0195, 0.04], [0.088, -0.033, 0.021, 0.0165, 0.037], [0.103, -0.036, 0.016, 0.0135, 0.028], [0.111, -0.039, 0.009, 0.0105, 0.014]];

// ---- 程序化动画：不用预先做好的动作，每帧根据速度、是否腾空等状态算出姿势 ----
// 两节肢体的反向运动学：从关节 (hx,hy) 伸向目标 (tx,ty)，返回 [上段角度, 下段相对角度]
function ik2(hx, hy, tx, ty, l1, l2, bendFwd) {
  const dx = tx - hx, dy = ty - hy, d = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 1e-3, l1 + l2 - 1e-3);
  const base = Math.atan2(dx, -dy);
  const a1 = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const c = Math.acos(clamp((l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2), -1, 1));
  return bendFwd ? [base + a1, -(Math.PI - c)] : [base - a1, Math.PI - c];    // 膝盖向前弯，手肘向后弯
}

const hash1 = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // 0..1 的固定“随机”数

const NOPOSE = {};
// o.npc：路上的其他角色（不带光源）；o.parent：挂到哪个节点下（章节卸载时一起清掉）
function makeCharacter(kind, prev, o = {}) {
  const B = buildBody(kind, o), { u, D, root, pelvis, spine, chest, head, tail, arms, legs } = B;
  // 动画的内部状态（换外形时沿用上一个角色的，避免跳变）
  const A = prev ? prev.A : { ph: 0, yaw: 0, run: 0, mv: 0, air: 0, lean: 0, sq: 0, sqv: 0, pvx: 0, acc: 0, grip: 0, tuck: 0, ta: -0.5, tv: 0, look: 0 };
  A.cover ??= 0; A.dip ??= 0;                                               // 07 专用：捂灯的程度、落地时灯被震暗的程度
  (o.parent ?? scene).add(root);

  function update(dt, s) {
    const dir = s.facing, sp = Math.abs(s.vx), fwd = s.vx * dir, t = s.t;
    const push = s.mode === 'push', mant = s.mode === 'mantle';
    // 额外的姿势（NPC 的表演，以及结局里的 07）：sit 坐下 / bow 弯腰 / limp 断电垂头 / arms 直接给手臂角度 / reach 伸手够某一点 / look 头转向
    const q = s.pose || NOPOSE, sit = q.sit || 0, limp = q.limp || 0;
    A.yaw = damp(A.yaw, dir > 0 ? 0 : -Math.PI, 13, dt); root.rotation.y = A.yaw;
    root.position.set(s.x, s.y, s.z ?? 0);
    A.run = damp(A.run, sstep(1.5, 3.0, sp), 8, dt);
    A.mv = damp(A.mv, sstep(0.04, 0.5, sp), 12, dt);
    A.air = damp(A.air, s.grounded || mant ? 0 : 1, s.grounded ? 24 : 12, dt);
    A.grip = damp(A.grip, push || (mant && s.modeT < 0.72) ? 1 : 0, 14, dt);
    A.tuck = damp(A.tuck, mant ? (s.modeT < 0.8 ? 1 : 0) : 0, 12, dt);
    A.cover = damp(A.cover, B.lamp ? clamp(s.hide || 0, 0, 1) * (1 - A.air) * (1 - A.grip) : 0, 6, dt);   // 躲藏：弓起身子，用手捂住胸口的灯
    A.acc = damp(A.acc, clamp((s.vx - A.pvx) / Math.max(dt, 1e-4) * dir, -30, 30), 10, dt); A.pvx = s.vx;

    // 步态：按“走过的距离”推进相位，所以脚踩在地上时不会打滑
    const duty = lerp(0.62, 0.37, A.run), stride = lerp(0.4, 0.5, A.run) * u;
    A.ph = ((A.ph + fwd * dt * duty / stride) % 1 + 1) % 1;
    const bobPh = Math.cos(4 * Math.PI * (A.ph - duty / 2));
    const bob = lerp(0.012, -0.03, A.run) * u * bobPh * A.mv * (1 - A.air);
    if (s.impact > 0) A.sqv -= s.impact * 0.28;                              // 落地：重心被压下去再弹回
    A.sqv += (-A.sq * 230 - A.sqv * 21) * dt; A.sq = clamp(A.sq + A.sqv * dt, -0.2 * u, 0.04 * u);
    let hipY = D.hipY - 0.006 * u - 0.026 * u * A.run * A.mv + bob + A.sq - (push ? 0.035 * u : 0) - 0.06 * u * A.tuck - 0.03 * u * A.cover;
    const hipStand = hipY;
    if (sit) hipY = lerp(hipY, (q.sitH ?? 0.3) * u, sit);
    const sitDrop = hipY - hipStand;                                          // 坐下时重心降了多少（主角的模型不挂在骨盆上，要自己跟着降）
    pelvis.position.set(0, hipY, 0);

    // 上身前倾：跑得越快、加速越猛就越前倾；推车时压低身体，拉车时后仰
    let leanT = (lerp(0.05, 0.2, A.run) * A.mv + clamp(A.acc * 0.011, -0.12, 0.16)) * (fwd < -0.05 ? -0.4 : 1);
    if (push) leanT = fwd > 0.1 ? 0.42 : fwd < -0.1 ? -0.2 : 0.16;
    if (mant) leanT = 0.3;
    leanT = lerp(leanT, 0.1 - clamp(s.vy * 0.02, -0.12, 0.12), A.air);
    if (B.S.robot && !push && !mant) leanT += 0.055 * (1 - A.air);
    if (B.S.slouch && !push && !mant) leanT += B.S.slouch * (1 - A.air) * (1 - A.run);
    leanT += 0.2 * A.cover + (q.bow || 0) + 0.22 * limp;
    A.lean = damp(A.lean, leanT, 9, dt);
    spine.rotation.z = -A.lean;
    spine.position.y = 0.004 * u * Math.sin(t * 1.7) * (1 - A.mv) * (1 - limp);   // 站着时的呼吸
    chest.rotation.y = 0.2 * A.mv * lerp(0.5, 1, A.run) * Math.sin(2 * Math.PI * A.ph) * (1 - A.grip);
    if (B.traveler?.group) {
      B.traveler.group.position.y = B.traveler.baseY + bob + sitDrop;
      B.traveler.group.rotation.z = -A.lean;
    }

    // 腿：先算出脚踝的目标位置，再用 IK 解出大腿和膝盖的角度
    const slope = clamp(s.slope * dir, -0.6, 0.6), rise = sstep(-2.5, 3.5, s.vy), lift = lerp(0.055, 0.2, A.run) * u;
    for (let i = 0; i < 2; i++) {
      const p = (A.ph + i * 0.5) % 1; let fx, fy, pitch;
      if (p < duty) {                                                        // 支撑期：脚相对身体匀速向后
        const k = p / duty, toe = sstep(0.68, 1, k) * (0.35 + 0.65 * A.run);

let hero = makeCharacter('K'), state = 'title', T = 0, ctl = true, autoDir = 0;
const sfx = {};                                   // 音效函数在后面的音频部分填进来
const fx = (name, ...a) => { if (sfx[name]) sfx[name](...a); };
function fitHero() { P.H = hero.H; P.hh = hero.H * 0.9; }
fitHero();
function setSkin(k) {
  if (hero.kind !== k) { const prev = hero; prev.dispose(); hero = makeCharacter(k, prev); fitHero(); }
  document.querySelectorAll('#skins button').forEach(b => b.classList.toggle('on', b.dataset.k === hero.kind));
}

function rebuildHero() { const prev = hero; prev.dispose(); hero = makeCharacter(prev.kind, prev); fitHero(); }   // 同一个外形重新搭一遍（换了腿脚之类）

function startMantle(s, side) {                   // 抓住方块 s 的边缘翻上去；side = 1 表示方块在右边
  const ex = side > 0 ? s.x1 : s.x2, h = s.y2 - P.y;
  P.mantle = { x0: P.x, y0: P.y, x1: ex + side * (P.hw + 0.12), top: s.y2, ex, s, T: 0.5 + 0.3 * clamp(h / 1.5, 0, 1) };
  P.mode = 'mantle'; P.modeT = 0; P.vx = P.vy = 0; P.facing = side; fx('grab');
}
function findUse() {                              // 脚边够得着、现在能用的机关
  let best = null, bd = 1e9;
  for (const u of USES) {
    const d = Math.abs(P.x - u.x);
    if (d < (u.r ?? 0.95) && d < bd && P.y >= (u.y0 ?? -1e9) && P.y <= (u.y1 ?? 1e9) && (!u.can || u.can())) { best = u; bd = d; }
  }
  return best;
}
function findGrab() {                             // 身前或身后紧挨着的、可以推拉的东西
  for (const o of PUSHABLES) {
    if (o.locked || o.off || Math.abs(P.y - o.y1) > 0.06) continue;
    const gr = o.x1 - (P.x + P.hw), gl = (P.x - P.hw) - o.x2;
    if (gr > -0.06 && gr < 0.45) return [o, 1];
    if (gl > -0.06 && gl < 0.45) return [o, -1];
  }
  return null;
}

function stepPlayer(dt) {
  const d = ctl ? (keys.has('R') ? 1 : 0) - (keys.has('L') ? 1 : 0) : autoDir;      // autoDir：过场时自动往前走
  P.impact = 0;
  if (ctl && pressed.has('J')) P.jumpBuf = 0.13;
  P.jumpBuf -= dt; P.coyote -= dt;

  if (P.mode === 'mantle') {                      // 攀爬是一段固定的动作：先向上，再翻过去
    const m = P.mantle; P.modeT += dt; const k = P.modeT / m.T, e = sstep(0, 1, Math.min(1, k / 0.8));
    m.top = m.s.y2;                               // 边缘自己在动（漂着的木梁）：跟着它
    P.y = lerp(m.y0, m.top, e); P.x = lerp(m.x0, m.x1, sstep(0.45, 1, k));
    if (k >= 1) { P.mode = 'normal'; P.grounded = true; P.y = m.top; P.vy = 0; P.coyote = 0; }
    return;
  }

  if (P.mode === 'push') {                        // 抓着东西：人和它一起慢慢移动
    const o = P.grabObj, side = P.grab, want = (side > 0 ? o.x1 : o.x2) - side * (P.hw + 0.2);
    if (!keys.has('E') || !ctl || !P.grounded || o.locked) { P.mode = 'normal'; o.v = 0; return; }
    o.v = damp(o.v, d * PUSH, 7, dt);
    let nx = clamp(o.x + o.v * dt, o.lo ? o.lo() : o.min, o.hi ? o.hi() : o.max), dx = nx - o.x;
    o.off = true; if (sideHit(P.x + dx, P.y)) dx = 0; o.off = false;         // 人被别的东西挡住，它也就拉不动了
    if (dx === 0) o.v = damp(o.v, 0, 20, dt);
    o.x += dx; syncBox(o);
    P.x = damp(P.x + dx, want + dx, 14, dt); P.vx = dx / dt; P.facing = side;
    if (Math.abs(dx) > 1e-5) P.pushed = true;
    return;
  }

  // ---- 普通状态 ----
  const speed = (keys.has('S') || !ctl ? WALK : RUN) * P.speedK;
  P.vx = damp(P.vx, d * speed, P.grounded ? (d ? 9 : 14) : 3.5, dt);
  if (d) { P.facing = d; P.moved = true; }
  if (Math.abs(P.vx) < 0.02 && !d) P.vx = 0;

  if (P.jumpBuf > 0 && (P.grounded || P.coyote > 0) && P.speedK > 0.5) {
    P.vy = JUMP_V; P.grounded = false; P.jumpBuf = 0; P.coyote = 0; P.jumped = true; fx('jump');
  }
  if (!P.grounded && P.vy > 0 && !(ctl && keys.has('J'))) P.vy -= GRAV * 1.3 * dt;   // 松开跳跃键就跳得矮一些

  // 水平移动，被方块侧面挡住
  let nx = P.x + P.vx * dt; const hit = sideHit(nx, P.y);
  if (hit) {
    const side = P.vx > 0 ? 1 : -1;
    nx = side > 0 ? hit.x1 - P.hw - 1e-3 : hit.x2 + P.hw + 1e-3;
    const h = hit.y2 - P.y;                      // 腾空时贴着墙、够得着边缘就攀上去
    if (!P.grounded && d === side && h > 0.25 && h < 1.2 * P.H && P.vy < 4.5 && hit.x2 - hit.x1 > 0.6 && !hit.noclimb) { P.x = nx; startMantle(hit, side); return; }
    P.vx = 0;
  }
  P.x = nx;

  // 垂直方向：贴地行走，或者受重力下落
  const f = floorY(P.x, P.y);
  if (P.grounded) {
    if (f < P.y - 0.3) { P.grounded = false; P.coyote = 0.1; P.gy = P.y; } else P.y = f;
  }
  if (!P.grounded) {
    P.vy -= GRAV * dt; const ny = P.y + P.vy * dt;
    if (P.vy <= 0 && ny <= f) { P.y = f; P.impact = -P.vy; P.vy = 0; P.grounded = true; fx('land', P.impact); }
    else P.y = ny;
  } else { P.vy = 0; P.gy = P.y; }

  // 抓住可以推拉的东西 / 操作机关
  if (ctl && P.grounded && keys.has('E')) {
    const g = findGrab();
    if (g) { P.mode = 'push'; P.grabObj = g[0]; P.grab = g[1]; P.facing = g[1]; g[0].v = 0; }
    else if (pressed.has('E')) { const u = findUse(); if (u) { P.used = true; u.on(u); } }
  }
  for (let i = CPS.length - 1; i > P.cp; i--) if (P.grounded && P.x >= CPS[i].x) { P.cp = i; break; }
}

// ---- 闸门：匀速开关；有人站在门洞里就先不落下来 ----
function stepGates(dt) {
  for (const g of GATES) {
    if (g.open === g.want) continue;
    if (g.want < g.open && P.x + P.hw > g.x1 - 0.05 && P.x - P.hw < g.x2 + 0.05 && P.y < g.y2) continue;
    const was = g.open; g.open = approach(g.open, g.want, dt / g.T); g.y1 = g.y0 + g.open * (g.h + 0.15);
    if (was !== g.open && (g.open === 1 || g.open === 0) && Math.abs(g.x - P.x) < 40) fx('doorStop');
  }
}

// ---- 回到最近的存档点：黑屏一下再亮起来。已经解开的机关都保留 ----
let fadeT = 0, fadeThen = null;
function fadeOut(then, hold = 1.1) { if (state === 'fade') return; state = 'fade'; fadeT = hold; fadeThen = then; ctl = false; $('fade').style.opacity = 1; }
function stepFade(dt) {
  if (state !== 'fade') return;
  fadeT -= dt; if (fadeT > 0) return;
  const f = fadeThen; fadeThen = null; state = 'play'; ctl = true; $('fade').style.opacity = 0; if (f) f();
}
function placePlayer(x, y) {
  Object.assign(P, { x, vx: 0, vy: 0, grounded: true, mode: 'normal', facing: 1, grabObj: null, mantle: null, speedK: 1 });
  P.y = y ?? floorY(x, 60); P.gy = P.y;
}
function respawn() {
  fadeOut(() => {
    const c = CPS[P.cp]; placePlayer(c.x, c.y);
    for (const z of ZONES) if (z.respawn) z.respawn(c);
    if (CAT.state === 'follow') catPlace(P.x - 0.8, floorY(P.x - 0.8, P.y + 0.1));
    snapCamera();
  });
}
function stepPits() {                              // 掉进水里或者坑里：回到岸上
  if (state !== 'play') return;
  for (const p of PITS) if (P.x > p.x1 && P.x < p.x2 && P.y < (typeof p.y === 'function' ? p.y() : p.y) && (!p.when || p.when())) {
    fx(p.sfx ?? 'fall'); if (p.on) p.on();
    const bx_ = p.back ? p.back() : null;
    fadeOut(() => { if (bx_ === null) { const c = CPS[P.cp]; placePlayer(c.x, c.y); } else placePlayer(bx_); for (const z of ZONES) if (z.respawn) z.respawn(CPS[P.cp]);
      if (CAT.state === 'follow') catPlace(P.x - 0.8, floorY(P.x - 0.8, P.y + 0.1)); snapCamera(); }, 0.9);
    return;
  }
}

// ============================================================
//  声音：全部用 WebAudio 现场合成，不加载任何音频文件
// ============================================================
let AC = null, master = null, noiseBuf = null, muted = true;   // 现阶段默认静音：每次打开游戏都是静音，玩家按 M 自己打开
const loops = {};
// 各章节每一帧往这里写“这个持续的声音现在该多响”（0..1），下面统一平滑地跟过去
const AUD = { hum: 0, humF: 52, belt: 0, water: 0, pump: 0, buzz: 0, sweep: 0 };
function initAudio() {
  if (muted) return;                                // 静音的时候不建立 WebAudio，第一次打开声音时再建
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const loopNoise = (type, freq, q) => {            // 一直循环的滤波噪声，音量由游戏状态控制
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = 0;
    src.connect(f).connect(g).connect(master); src.start(); return { f, g };
  };
  const loopOsc = (type, freq, lp) => {
    const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = 0;
    o.connect(f).connect(g).connect(master); o.start(); return { o, f, g };
  };
  loops.room = loopNoise('lowpass', 210, 0.4);      // 厂房里的低沉底噪
  loops.wind = loopNoise('bandpass', 420, 0.7);     // 室外的风
  loops.cart = loopNoise('bandpass', 95, 1.4);      // 推东西的滚动声
  loops.door = loopNoise('lowpass', 120, 1.0);      // 闸门升起的轰隆声
  loops.belt = loopNoise('bandpass', 170, 0.9);     // 输送带
  loops.water = loopNoise('bandpass', 1300, 0.5);   // 水流
  loops.sweep = loopNoise('bandpass', 2600, 1.2);   // 清洁机器人的刷子
  loops.hum = loopOsc('sawtooth', 52, 240);         // 探照灯 / 监控的嗡鸣
  loops.pump = loopOsc('triangle', 46, 180);        // 水泵
  loops.buzz = loopOsc('square', 100, 520);         // 通电的线路
  loops.drone = loopOsc('sine', 41, 400);
}
const setGain = (l, v, k = 0.08) => { if (AC && loops[l]) loops[l].g.gain.setTargetAtTime(v, AC.currentTime, k); };
function setMuted(m) {                              // M 键：打开 / 关掉声音；总音量淡入淡出一下，不会“咔”的一声
  muted = m; initAudio();
  if (master) master.gain.setTargetAtTime(m ? 0 : 0.6, AC.currentTime, 0.05);
}

function hit(freq, q, vol, dur, type = 'bandpass', delay = 0) { // 一下短促的噪声：脚步、落地、碰撞
  if (!AC || muted || vol <= 0) return;
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime + delay;
  src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  src.connect(f).connect(g).connect(master); src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.02);
}
function tone(f0, f1, vol, dur, type = 'sine', delay = 0) {
  if (!AC || muted || vol <= 0) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0008, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const R2 = (a, b) => a + (b - a) * Math.random();   // 声音用的随机数：不动关卡那一套固定种子
Object.assign(sfx, {
  step: (out, soft) => hit(out ? R2(900, 1500) : R2(520, 820), 1.1, soft ? 0.035 : 0.075, out ? 0.09 : 0.065),
  jump: () => hit(760, 0.9, 0.05, 0.07),
  grab: () => hit(420, 1.2, 0.09, 0.09),
  land: v => { hit(170, 0.7, clamp(v * 0.045, 0.08, 0.4), 0.2, 'lowpass'); tone(85, 48, clamp(v * 0.02, 0.03, 0.16), 0.16); },
  lever: () => { hit(1400, 2, 0.16, 0.05); tone(190, 70, 0.2, 0.22, 'square', 0.04); },
  doorStop: () => { hit(110, 0.6, 0.5, 0.5, 'lowpass'); tone(60, 34, 0.25, 0.5); },
  alarm: () => { for (let i = 0; i < 3; i++) tone(620, 330, 0.11, 0.26, 'sawtooth', i * 0.3); },
  alarmFar: v => { for (let i = 0; i < 3; i++) tone(620, 330, 0.05 * v, 0.26, 'sawtooth', i * 0.3); },      // 工厂的警报：固定的三声
  tick3: v => { for (let i = 0; i < 3; i++) tone(880, 860, 0.05 * v, 0.1, 'square', i * 0.5); },           // 压机下压前的三次灯号
  press: v => { hit(90, 0.6, 0.7 * v, 0.6, 'lowpass'); tone(70, 30, 0.3 * v, 0.5); hit(2000, 1, 0.1 * v, 0.1); },
  clunk: () => { hit(260, 1.2, 0.25, 0.12); tone(120, 80, 0.12, 0.1); },
  dock: () => { hit(300, 1.5, 0.3, 0.1); tone(140, 90, 0.2, 0.16, 'square'); tone(520, 780, 0.07, 0.3, 'sine', 0.12); },
  spark: () => { for (let i = 0; i < 6; i++) hit(R2(3000, 6000), 2, 0.12, 0.04, 'bandpass', i * R2(0.03, 0.07)); },
  splash: () => { hit(900, 0.6, 0.35, 0.5); hit(300, 0.7, 0.3, 0.6, 'lowpass'); },
  fall: () => { hit(200, 0.7, 0.3, 0.4, 'lowpass'); },
  bark: v => { for (const d of [0, 0.34]) { hit(700, 1.4, 0.3 * v, 0.13, 'bandpass', d); tone(430, 170, 0.22 * v, 0.14, 'sawtooth', d); } },
  meow: () => { tone(720, 1080, 0.07, 0.16, 'triangle'); tone(1080, 760, 0.07, 0.24, 'triangle', 0.15); },
  catHop: () => hit(1800, 1.5, 0.02, 0.05),
  deny: () => { for (const d of [0, 0.22]) tone(300, 290, 0.1, 0.16, 'square', d); },
  ok: () => { tone(660, 660, 0.08, 0.14); tone(990, 990, 0.08, 0.26, 'sine', 0.12); },
  servo: () => tone(480, 720, 0.03, 0.22, 'square'),
  powerDown: () => { tone(220, 38, 0.2, 1.3, 'sawtooth'); hit(140, 0.7, 0.3, 0.9, 'lowpass'); },
  powerUp: () => { tone(60, 250, 0.14, 0.9, 'sawtooth'); tone(520, 780, 0.06, 0.4, 'sine', 0.7); },
  valve: () => { for (const d of [0, 0.2, 0.42]) tone(R2(900, 1100), R2(1300, 1500), 0.04, 0.16, 'triangle', d); hit(320, 1, 0.15, 0.5); },
  grow: () => tone(300, 520, 0.035, 1.3),
  cloth: () => { hit(600, 0.5, 0.2, 0.5); hit(1800, 0.6, 0.08, 0.35); },
  snip: v => { hit(3200, 3, 0.1 * v, 0.05); hit(2400, 3, 0.08 * v, 0.05, 'bandpass', 0.09); },
  chirp: () => { const f = R2(2200, 3400); for (let i = 0, n = 2 + Math.floor(Math.random() * 3); i < n; i++) tone(f, f * R2(1.15, 1.4), 0.016, 0.07, 'sine', i * 0.1); },
  // 地上的小动物和水洼（46-ground.js）
  croak: v => { for (const d of [0, 0.19]) tone(R2(170, 190), 120, 0.035 * v, 0.13, 'square', d); },                  // 青蛙叫两声
  frogHop: () => hit(1500, 1.4, 0.014, 0.05),
  plop: v => { tone(520, 140, 0.11 * v, 0.14); hit(900, 0.7, 0.07 * v, 0.2, 'bandpass', 0.03); },                      // 扎进水里
  skitter: () => { for (let i = 0; i < 5; i++) hit(R2(3200, 4400), 2.5, 0.012, 0.025, 'bandpass', i * 0.045); },        // 蜥蜴窜走
  wade: () => { hit(R2(1000, 1400), 0.6, 0.06, 0.16); hit(380, 0.7, 0.04, 0.2, 'lowpass'); },                         // 一脚踩进水洼
});
function updateAudio(dt, stepNow) {
  if (!AC) return;
  const ext = E.ext;
  setGain('room', (1 - ext) * 0.2, 0.4); setGain('drone', lerp(0.05, 0.015, ext), 0.4); setGain('wind', ext * (0.085 + 0.03 * Math.sin(T * 0.6)), 0.5);
  setGain('cart', P.mode === 'push' && P.grabObj ? clamp(Math.abs(P.grabObj.v) * 0.45, 0, 0.5) : 0, 0.05);
  let dg = 0; for (const g of GATES) if (g.open !== g.want && Math.abs(g.x - P.x) < 30) dg = 0.5;
  setGain('door', dg, 0.12);
  setGain('hum', AUD.hum, 0.2); loops.hum.o.frequency.setTargetAtTime(AUD.humF, AC.currentTime, 0.1);
  setGain('belt', AUD.belt * 0.35, 0.2); setGain('water', AUD.water * 0.16, 0.3); setGain('pump', AUD.pump * 0.12, 0.2);
  setGain('buzz', AUD.buzz * 0.012, 0.15); setGain('sweep', AUD.sweep * 0.05, 0.1);
  if (stepNow) sfx.step(ext > 0.5, keys.has('S') || P.mode === 'push');
  if (E.birds > 0.01 && Math.random() < E.birds * dt * 0.45) sfx.chirp();
}

// ============================================================
//  第一章 · 工厂：关闭回收线
//  警报里，同型号的机器人沿着上层的通道往前跑；07 掉进了下层的维修通道。
//  推车上高台 → 躲过探照灯 → 发现上层的输送带把队伍送进了压机 →
//  把空箱沿着拖痕推到断电杆下面，站上去拉下断电杆：输送带和压机停下，安全闸门升起
// ============================================================
const CH1 = (() => {
  const C = chapter({ n: 1, x0: -60, start: 2, name: '工厂', sub: '关闭回收线' });
  C.intro = () => { P.y = 3.3; P.vy = 0; P.grounded = false; P.gy = 0.6; };       // 开场：从上层断开的格栅掉下来
  terrain([-60, 0], [47.9, 0], [48, 3], [49.2, 3], [57, 0], [104, 0]);
  ground(-60, 0x1c2529); ground(103.9, 0x1c2529);
  solid({ id: 'wallL', x1: -9, x2: -7, y1: 0, y2: 12 });
  solid({ id: 'beam', x1: 9.0, x2: 10.3, y1: 0, y2: 0.45 });
  solid({ id: 'slab', x1: 15, x2: 19, y1: 0, y2: 0.9 });
  solid({ id: 'terrace', x1: 38, x2: 48, y1: 0, y2: 3.0 });
  const cart = pushable({ id: 'cart', x: 25.4, w: 1.5, h: 0.95, min: 23.4, max: 37.15 });
  const crate = pushable({ id: 'crate1', x: 88.6, w: 1.15, h: 0.95, min: 86.3, max: 97.0 });      // 轮挡正好把它停在断电杆下面
  const door = gate({ id: 'door1', x: 104 });
  const LEVER = { x: 97.0, pulled: false, t: 0, reach: 0 };
  // 探照灯：机器在背景深处（z < 0），光束扫过场地；玩家躲在一处处铁柜前面的影子里

  function update(dt) {

    for (const b of v.crows) {

      else if (t < 7) {

  // 按水面翻到水下，从镜头看过去，视线穿过水面的地方就是倒影落的地方。四个角各算一次；镜头偏左，倒影也就偏左、比闸门窄

  function update(dt) {

    const reach = S.deny < 0 ? Math.sin(Math.PI * clamp(-S.deny / 1.3, 0, 1)) : 0, red = S.deny < -0.45 && S.deny > -1.2 ? 1 : 0.18;

    if (!near) return;

      else { if (t < 6.2) Wk.walkTo(ELDER + 1.9, 0.8, dt); else { Wk.vx = 0; Wk.facing = -1; } Wk.pose = { look: t > 6.6 && t < 9 ? 0.9 : 0, nod: t > 6.6 && t < 7.4 ? 0.2 * Math.sin((t - 6.6) * 8) : 0 }; pk = [ELDER + 0.55, 0.08, -0.3]; }

const CH5 = (() => {
  const X = X5, BOT0 = X + 17.0, L_END = X + 17.95, R_END = X + 33.2, DOOR = X + 35.2, ELDER = X + 15.0, STATION = X + 7;

  tap(k) { pressed.add(k); keys.add(k); sim(1 / 60); keys.delete(k); renderer.render(scene, camera); },

  zone: n => ZONES.find(z => z.n === n) };

let lastT = performance.now(), frameN = 0;
function frame(now) {
  const dt = clamp((now - lastT) / 1000, 0.001, 0.05); lastT = now;
  if (!DBG.paused) { sim(dt); renderer.render(scene, camera); } else if (DBG.redraw) { DBG.redraw = false; renderer.render(scene, camera); }
  if (++frameN % 2 === 0) $('grain').style.backgroundPosition = `${Math.random() * 256 | 0}px ${Math.random() * 256 | 0}px`;
  requestAnimationFrame(frame);
}

document.querySelectorAll('#skins button').forEach(b => b.addEventListener('click', () => { setSkin(b.dataset.k); b.blur(); canvas.focus(); }));
CAMKEYS.sort((a, b) => a[0] - b[0]); CPS.sort((a, b) => a.x - b.x);
buildGround();
CAT.crit = makeCritter('cat', scene); CAT.crit.root.visible = false;
setSkin('R'); loadGame();                               // 主角使用 models/hero.glb（3K 面的少年）
{ const n = +new URLSearchParams(location.search).get('ch'); if (n >= 1 && n <= CHAPTERS.length) STORY.ch = n; }   // 地址后面加 ?ch=5 直接从第五章开始
{ const c = CHAPTERS[STORY.ch - 1], intro = c.intro; c.intro = null; startChapter(STORY.ch, { quiet: true }); c.intro = intro; state = 'title'; }
$('go').textContent = STORY.ch > 1 ? `按任意键继续 · 第${CN[STORY.ch - 1]}章 ${CHAPTERS[STORY.ch - 1].name}` : '按任意键开始';
$('title').classList.remove('hide'); $('fade').style.opacity = 0.42; $('msg').remove();
window.__ready = true;
requestAnimationFrame(frame);
</script>
</body>
</html>
