<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>铁锈与微光 · 横版原型</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06090a;color:#e6ebea;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none}
  #c{display:block;width:100%;height:100%;outline:none}
  .fx{position:fixed;inset:0;pointer-events:none}
  #vig{background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 44%,rgba(0,0,0,.3) 78%,rgba(0,0,0,.7) 100%)}
  #grain{opacity:.075;mix-blend-mode:overlay;background-size:256px 256px}
  #bars::before,#bars::after{content:"";position:absolute;left:0;right:0;height:6vh;background:#040607}
  #bars::before{top:0}#bars::after{bottom:0}
  #fade{background:#040607;opacity:1;transition:opacity 1.4s ease}
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    transition:opacity .9s ease;padding:0 24px}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font-size:clamp(26px,4.2vw,46px);font-weight:300;letter-spacing:.42em;margin:0 0 0 .42em;color:#eef3f1}
  .ov .sub{font-size:13px;letter-spacing:.3em;margin:14px 0 0 .3em;color:#8fa0a0}
  .ov .keys{font-size:13px;line-height:2.1;color:#b4c0bf;margin:34px 0 0}
  .ov .keys b{display:inline-block;min-width:1.5em;padding:0 .45em;margin:0 .15em;border:1px solid rgba(255,255,255,.28);border-radius:5px;
    font-weight:500;color:#e6ebea;line-height:1.55}
  .ov .go{font-size:13px;letter-spacing:.3em;margin:30px 0 0 .3em;color:#ffc56e;animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  #hint{position:fixed;left:50%;bottom:11vh;transform:translateX(-50%);font-size:13.5px;letter-spacing:.14em;color:#dfe7e5;
    text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:0;transition:opacity .6s ease;white-space:nowrap;pointer-events:none}
  #hint b{display:inline-block;padding:0 .5em;margin:0 .3em;border:1px solid rgba(255,255,255,.4);border-radius:5px;font-weight:500;line-height:1.6}
  #skins{position:fixed;left:18px;bottom:calc(6vh + 14px);display:flex;gap:6px;opacity:.0;transition:opacity .8s ease}
  #skins.on{opacity:.78}
  #skins button{font:inherit;font-size:12px;color:#dfe7e5;background:rgba(10,14,15,.55);border:1px solid rgba(255,255,255,.2);
    border-radius:7px;padding:5px 9px;cursor:pointer}
  #skins button.on{background:#c98f3d;border-color:#e6ae5c;color:#20160a}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#b4c0bf;pointer-events:none}
  /* 章节卡：走进新的一章时在画面上方淡入几秒 */
  #chap{position:fixed;left:0;right:0;top:11vh;text-align:center;opacity:0;transition:opacity 1.2s ease;pointer-events:none;
    color:#e6ebea;text-shadow:0 1px 3px rgba(0,0,0,.65),0 0 16px rgba(0,0,0,.75)}   /* 两层影子：亮的画面（第七章的蓝天白云）上也看得清 */
  #chap.on{opacity:1}
  #chap i{display:block;font-style:normal;font-size:12px;letter-spacing:.5em;margin-left:.5em;color:#a9b8b8}
  #chap b{display:block;font-weight:300;font-size:clamp(20px,2.6vw,30px);letter-spacing:.4em;margin:8px 0 0 .4em}
  #chap span{display:block;font-size:12.5px;letter-spacing:.3em;margin:8px 0 0 .3em;color:#ffc56e}
  /* 声音开关的提示：右上角的黑边里出现一会儿就淡掉 */
  #snd{position:fixed;right:22px;top:3vh;transform:translateY(-50%);font-size:12px;letter-spacing:.2em;color:#9aabab;
    opacity:0;transition:opacity .6s ease;pointer-events:none;white-space:nowrap}
  #snd.on{opacity:.85}
  #snd b{display:inline-block;padding:0 .45em;margin:0 .35em;border:1px solid rgba(255,255,255,.3);border-radius:4px;
    font-weight:500;color:#dfe7e5;line-height:1.5;letter-spacing:0}
  /* 章节菜单 */
  #menu{background:rgba(4,6,7,.84);transition:opacity .25s ease}
  #menu h1{font-size:clamp(20px,2.8vw,30px)}
  #menulist{margin-top:24px;text-align:left}
  #menulist .it{display:flex;align-items:baseline;gap:14px;padding:7px 18px;border-radius:8px;cursor:pointer;color:#aab7b6;font-size:14px;letter-spacing:.12em}
  #menulist .it i{font-style:normal;color:#6f7f80;width:1.2em}
  #menulist .it b{font-weight:500;color:#dfe7e5;min-width:5.5em}
  #menulist .it span{font-size:12.5px;color:#8fa0a0}
  #menulist .it.sel{background:rgba(201,143,61,.2);outline:1px solid rgba(230,174,92,.55)}
  #menulist .it.sel b{color:#ffd9a0}
  #end .keys{max-width:34em;line-height:2;margin-top:22px}
  /* 手机触屏：不要滚动、缩放、长按弹菜单；黑边和右上角的图标改画在画布里 */
  html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  body.touch #bars{display:none}
  /* 竖着拿手机：盖一层“请把手机横过来”，游戏停住 */
  #rot{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;
    background:#06090a;color:#b4c0bf;font-size:14px;letter-spacing:.32em}
  #rot div{margin-left:.32em}
  body.portrait #rot{display:flex}
  #rot svg{width:56px;height:56px;animation:turn 3.2s ease-in-out infinite}
  @keyframes turn{0%,20%{transform:rotate(0)}45%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
  /* 矮屏（手机横着拿）：章节菜单排成两列才放得下九章 */
  @media (max-height:520px){
    #menulist{display:grid;grid-template-columns:auto auto;column-gap:8px;margin-top:14px}
    #menulist .it{padding:5px 14px}
    .ov .keys{margin-top:20px;line-height:1.95}
    .ov .go{margin-top:18px}
  }
</style>
</head>
<body>

<div id="grain" class="fx"></div>

<div id="hint"></div>
<div id="chap"></div>
<div id="snd"></div>
<div id="skins">
</div>

  <h1>铁锈与微光</h1>
  <div class="sub">横版原型 · 九章</div>
  <div class="keys">
    <b>←</b><b>→</b> 或 <b>A</b><b>D</b> 移动　　<b>空格</b> 跳跃 / 攀爬　　按住 <b>E</b> 推拉　·　按 <b>E</b> 操作机关　　在水里按 <b>↓</b> 潜下去<br>
    <b>Esc</b> 选择章节　　<b>R</b> 回到存档点　　<b>Shift</b> 慢走　　<b>V</b> 近看主角　　<b>M</b> 打开声音　　<b>C</b> 换衣服颜色　　<b>X</b> 换腿脚
  </div>
  <div class="go" id="go">按任意键开始</div>
</div>
<div id="menu" class="ov hide">
  <h1>选择章节</h1>
  <div id="menulist"></div>
  <div class="keys"><b>↑</b><b>↓</b> 选择　　<b>回车</b> 从这一章的开头开始　　<b>Esc</b> 返回</div>
</div>
<div id="end" class="ov hide">
  <h1>铁锈与微光</h1>
  <div class="sub" id="endsub"></div>
  <div class="keys" id="endtxt"></div>
  <div class="go">按 R 回到最后的选择　·　Esc 选择章节</div>
</div>
<div id="msg">正在加载…</div>
<div id="rot">
  <svg viewBox="0 0 48 48" fill="none" stroke="#a9b8b8" stroke-width="1.5" stroke-linecap="round"><rect x="15" y="5" width="18" height="38" rx="3.5"/><path d="M21.5 38.6h5"/></svg>
  <div>请把手机横过来</div>
</div>
<script>
  setTimeout(function () {
    if (!window.__ready) document.getElementById('msg').textContent = '加载失败：本页面需要联网，从 cdn.jsdelivr.net 加载 three.js';
  }, 12000);
</script>

function buildBody(kind, o = {}) {

  return { S, u, D, root, pelvis, spine, chest, head, tail, arms, legs };
}


// ============================================================
//  07：量产的旧劳动机器人（主角）。设计说明见 design/protagonist-07.md
//  三条规矩：先看侧面剪影；没有脸；全身只有胸口那盏灯是暖色
//  关节约定和其他外形完全一样，所以行走 / 推车 / 攀爬的动画直接沿用
// ============================================================
// 侧面轮廓 → 实体：在 x-y 平面（x 向前、y 向上）画一圈带圆角的轮廓，再沿身体的左右方向挤出厚度

function profileShape(pts, r) {

    const a = V3(p0[0] - p1[0], p0[1] - p1[1], 0), b = V3(p2[0] - p1[0], p2[1] - p1[1], 0);
    const k = Math.min(p1[2] ?? r, a.length() / 2, b.length() / 2); a.setLength(k); b.setLength(k);
    sh[i ? 'lineTo' : 'moveTo'](p1[0] + a.x, p1[1] + a.y);
    sh.quadraticCurveTo(p1[0], p1[1], p1[0] + b.x, p1[1] + b.y);

// 挤出来的模型每个三角面各有各的法线，看上去一棱一棱的。这里把夹角小的相邻面抹平，真正的棱角保留
function smoothNormals(geo, crease = 0.7) {

    keys.push(key); if (!byPos.has(key)) byPos.set(key, []); byPos.get(key).push(Math.floor(i / 3));

    const w = b.clone().sub(a).cross(c.clone().sub(a));                 // 长度是面积的两倍，正好用来加权
    fn.push({ w, d: w.clone().normalize() });

    for (const f of byPos.get(keys[i])) if (fn[f].d.dot(me) > crease) s.add(fn[f].w);
    s.normalize(); out[i * 3] = s.x; out[i * 3 + 1] = s.y; out[i * 3 + 2] = s.z;

let _stencil07 = null;
function stencil07() {                                  // 头盔侧面喷的出厂编号：玩的时候只是一小块深色，拉近了才看得清

  g.fillStyle = 'rgba(30,34,34,.82)'; g.textAlign = 'center'; g.textBaseline = 'middle';

function buildRobot07(o = {}) {

  const traveler = { group: null, baseY: 0, model: null, bones: new Map() };
  if (!npc) loadTravelerModel(source => {

    const rotatedCenter = center.applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI / 2);

// ============================================================
//  小孩（K）：照 INSIDE 那一类角色的“做法”搭的人形 —— 造型是我们自己的，不是那个游戏里的男孩
//  做法只有四条：真实的儿童比例；没有脸；几块平涂的颜色；身体是一整张连续的表面
//  （手肘、膝盖弯起来没有球、没有缝：靠蒙皮 —— 每个顶点记着自己跟哪几根骨头走、各占几成）
//  骨架的节点和其他外形一模一样，所以走 / 跑 / 跳 / 推 / 爬的动画直接沿用
//  造型按定稿草图（generated_images/concept-inside-style-10.png）来：4 号“乱发”、6 号“连帽衫”、长裤靴子、手露在外面、
//  连帽衫是米白色、不带灯。之前试过的“短裤光腿”和另外三种颜色还留着，按 X / C 可以切换着看
// ============================================================

// 连帽衫的颜色定的是米白（按 C 还能轮换着看别的）；除此之外全身只有肤色、深色的头发、深色的裤子和靴子
const KID_TINTS = [[0x466a98, '工装蓝'], [0x6b8f58, '嫩芽绿'], [0xcfc8b8, '米白'], [0x2c3236, '深灰']];
const KID_LEGS = ['长裤靴子', '短裤光腿'];
let kidTint = 2, kidLegs = 0;                                              // 定稿：米白、长裤靴子
const KID_HEAD = 1.18;                                                     // 头比真实比例大一圈：定稿草图是四个头高，远看才认得出人

// 一张表面：往里加一片片网格，最后一次生成几何体。坐标都以身高为单位，scale 是身高
function kidSurf(scale) {
  const pos = [], col = [], bi = [], bw = [], tris = [];
  let skinned = false;
  const vert = (p, bones) => {
    pos.push(p[0] * scale, p[1] * scale, p[2] * scale); const s = p[3] ?? 1; col.push(s, s, s);
    let sum = 0; if (bones) { skinned = true; for (const b of bones) sum += b[1]; }
    for (let i = 0; i < 4; i++) { const b = bones && bones[i]; bi.push(b ? b[0] : 0); bw.push(b ? b[1] / sum : 0); }
    return pos.length / 3 - 1;
  };
  // 一片网格：rows 圈、每圈 n 个点，pt(i, k) 返回第 i 圈第 k 个点 [x, y, z, 明暗]；o.bones(i, k) 给出这个点跟哪些骨头走。
  // 面朝哪边由走向决定：圈从上往下排、每圈从 +x 转向 +z，面就朝外。o.top / o.bot 用一个点把两头封上
  function grid(rows, n, pt, o = {}) {
    const base = pos.length / 3, bones = (i, k) => typeof o.bones === 'function' ? o.bones(i, k) : o.bones;
    for (let i = 0; i < rows; i++) for (let k = 0; k < n; k++) vert(pt(i, k), bones(i, k));
    for (let i = 0; i < rows - 1; i++) for (let k = 0; k < n; k++) {
      const a = base + i * n + k, b = base + i * n + (k + 1) % n, c = a + n, d = b + n;
      tris.push(a, b, d, a, d, c);
    }
    if (o.top) { const t = vert(o.top, bones(0, 0)); for (let k = 0; k < n; k++) tris.push(t, base + (k + 1) % n, base + k); }
    if (o.bot) { const t = vert(o.bot, bones(rows - 1, 0)), r = base + (rows - 1) * n; for (let k = 0; k < n; k++) tris.push(t, r + k, r + (k + 1) % n); }
  }
  // 一只球（可以被 fn 捏成别的形状）：fn(从头顶往下的角度, 绕竖轴的角度) 返回 [x, y, z, 明暗]
  function ball(rows, n, fn, bones) {
    grid(rows, n, (i, k) => fn(Math.PI * (i + 1) / (rows + 1), 6.2832 * k / n), { top: fn(0, 0), bot: fn(Math.PI, 0), bones });
  }
  function geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    if (skinned) { g.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(bi, 4)); g.setAttribute('skinWeight', new THREE.Float32BufferAttribute(bw, 4)); }
    g.setIndex(tris); g.computeVertexNormals(); return g;
  }
  return { grid, ball, geometry };
}

// keys 每行 [s, 值, 值, …]（s 递增）；返回 s 处各列的平滑插值
function kidSpline(keys, s) {
  let i = 0; while (i < keys.length - 2 && s > keys[i + 1][0]) i++;
  const k0 = keys[Math.max(i - 1, 0)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(i + 2, keys.length - 1)];
  const h = k2[0] - k1[0], t = clamp((s - k1[0]) / h, 0, 1), t2 = t * t, t3 = t2 * t, out = [];
  for (let j = 1; j < k1.length; j++) {
    const m1 = (k2[j] - k0[j]) / (k2[0] - k0[0]) * h, m2 = (k3[j] - k1[j]) / (k3[0] - k1[0]) * h;
    out.push((2 * t3 - 3 * t2 + 1) * k1[j] + (t3 - 2 * t2 + t) * m1 + (3 * t2 - 2 * t3) * k2[j] + (t3 - t2) * m2);
  }
  return out;
}

// 竖着的一根管子（袖子、裤腿、躯干都是它）。keys 每行 [s, cx, f, b, w, 倾斜]：
//   s 从 o.y 往下量；cx 这一圈的中心前后偏多少；f / b 朝前、朝后的半径；w 左右的半宽；倾斜（可以不写）= 前面抬高多少、后面压低多少
// o: x y z 起点 / rows 加密成多少圈 / n 每圈几个点 / bones(s, 朝前的程度, 朝右的程度) 这个点跟哪些骨头走 / shade(s) 明暗
//    rim、hem: [缩进比例, 深度, 里圈的比例] —— 上口、下口向里翻一道边，看得出布料的厚度
function kidTube(S, keys, o) {
  const s0 = keys[0][0], s1 = keys[keys.length - 1][0], rows = o.rows ?? 24, n = o.n ?? 20, R = [];
  for (let i = 0; i < rows; i++) {
    const s = lerp(s0, s1, i / (rows - 1)), [cx, f, b, w, ty = 0] = kidSpline(keys, s);
    R.push({ s, cx, f: Math.max(f, 0), b: Math.max(b, 0), w: Math.max(w, 0), ty, sh: o.shade ? o.shade(s) : 1 });
  }
  const lip = (r, [k, d, k2 = k * 0.96], dir) => [{ ...r, f: r.f * k, b: r.b * k, w: r.w * k, sh: 0.5 }, { ...r, s: r.s + dir * d, f: r.f * k2, b: r.b * k2, w: r.w * k2, sh: 0.3 }];
  if (o.rim) R.unshift(...lip(R[0], o.rim, 1).reverse());                 // 上口：先在里面往上走，翻过口沿再往下
  if (o.hem) R.push(...lip(R[R.length - 1], o.hem, -1));                  // 下口：走到底以后翻进去往上
  S.grid(R.length, n, (i, k) => {
    const r = R[i], a = 6.2832 * k / n, ca = Math.cos(a), sa = Math.sin(a);
    return [(o.x ?? 0) + r.cx + (ca > 0 ? r.f : r.b) * ca, (o.y ?? 0) - r.s + r.ty * ca, (o.z ?? 0) + r.w * sa, r.sh];
  }, { bones: (i, k) => o.bones(R[i].s, Math.cos(6.2832 * k / n), Math.sin(6.2832 * k / n)) });
}

function buildKid() {
  const S = SKINS.K, u = S.H, shorts = kidLegs === 1;

  const D = { thigh: 0.218 * u, shin: 0.218 * u, uarm: 0.165 * u, farm: 0.15 * u, ankle: 0.05 * u, hipY: 0.494 * u, hipZ: 0.05 * u, shY: 0.263 * u, shZ: 0.098 * u };

    { y: NY + 0.035, rows: 8, n: 16, bones: s => mix(HEAD, CHEST, sstep(0.012, 0.04, s)), shade: s => lerp(0.62, 0.84, sstep(0, 0.022, s)) * lerp(1, 0.6, sstep(0.034, 0.05, s)) });

  const HC = [0.02, 0.11];                                                  // 头的中心（相对脖子上的转轴）

// ---- 草、蕨、草籽、蘑菇、水草：画在一张各章共用的图集上，每一丛是一个小方片（同一个网格里的一个实例）----

// ---- 树枝、倒木、树桩 ----

// 一根倒木：两头是断面，带两截残枝；朝上的一面长着青苔，朝镜头的一侧生着几朵菌子

// ============================================================
//  玩家控制：移动 / 跳跃 / 攀爬 / 推拉 / 操作机关 / 回到存档点
// ============================================================
const GRAV = 23, JUMP_V = 7.5, RUN = 3.3, WALK = 1.25, PUSH = 1.25;
let hero = makeCharacter('K'), state = 'title', T = 0, ctl = true, autoDir = 0;
const sfx = {};                                   // 音效函数在后面的音频部分填进来
const fx = (name, ...a) => { if (sfx[name]) sfx[name](...a); };
function fitHero() { P.H = hero.H; P.hh = hero.H * 0.9; }
fitHero();
function setSkin(k) {
  if (hero.kind !== k) { const prev = hero; prev.dispose(); hero = makeCharacter(k, prev); fitHero(); }
  document.querySelectorAll('#skins button').forEach(b => b.classList.toggle('on', b.dataset.k === hero.kind));
}

function rebuildHero() { const prev = hero; prev.dispose(); hero = makeCharacter(prev.kind, prev); fitHero(); }   // 同一个外形重新搭一遍（换了腿脚之类）

function startMantle(s, side) {                   // 抓住方块 s 的边缘翻上去；side = 1 表示方块在右边
  const ex = side > 0 ? s.x1 : s.x2, h = s.y2 - P.y;

  P.mode = 'mantle'; P.modeT = 0; P.vx = P.vy = 0; P.facing = side; fx('grab');
}
function findUse() {                              // 脚边够得着、现在能用的机关
  let best = null, bd = 1e9;
  for (const u of USES) {
    const d = Math.abs(P.x - u.x);
    if (d < (u.r ?? 0.95) && d < bd && P.y >= (u.y0 ?? -1e9) && P.y <= (u.y1 ?? 1e9) && (!u.can || u.can())) { best = u; bd = d; }
  }

}
function findGrab() {                             // 身前或身后紧挨着的、可以推拉的东西
  for (const o of PUSHABLES) {
    if (o.locked || o.off || Math.abs(P.y - o.y1) > 0.06) continue;
    const gr = o.x1 - (P.x + P.hw), gl = (P.x - P.hw) - o.x2;
    if (gr > -0.06 && gr < 0.45) return [o, 1];
    if (gl > -0.06 && gl < 0.45) return [o, -1];
  }
  return null;
}

function stepPlayer(dt) {
  const d = ctl ? (keys.has('R') ? 1 : 0) - (keys.has('L') ? 1 : 0) : autoDir;      // autoDir：过场时自动往前走
  P.impact = 0;
  if (ctl && pressed.has('J')) P.jumpBuf = 0.13;
  P.jumpBuf -= dt; P.coyote -= dt;

  if (P.mode === 'mantle') {                      // 攀爬是一段固定的动作：先向上，再翻过去
    const m = P.mantle; P.modeT += dt; const k = P.modeT / m.T, e = sstep(0, 1, Math.min(1, k / 0.8));
    m.top = m.s.y2;                               // 边缘自己在动（漂着的木梁）：跟着它
    P.y = lerp(m.y0, m.top, e); P.x = lerp(m.x0, m.x1, sstep(0.45, 1, k));
    if (k >= 1) { P.mode = 'normal'; P.grounded = true; P.y = m.top; P.vy = 0; P.coyote = 0; }
    return;
  }

  if (P.mode === 'push') {                        // 抓着东西：人和它一起慢慢移动
    const o = P.grabObj, side = P.grab, want = (side > 0 ? o.x1 : o.x2) - side * (P.hw + 0.2);
    if (!keys.has('E') || !ctl || !P.grounded || o.locked) { P.mode = 'normal'; o.v = 0; return; }
    o.v = damp(o.v, d * PUSH, 7, dt);
    let nx = clamp(o.x + o.v * dt, o.lo ? o.lo() : o.min, o.hi ? o.hi() : o.max), dx = nx - o.x;
    o.off = true; if (sideHit(P.x + dx, P.y)) dx = 0; o.off = false;         // 人被别的东西挡住，它也就拉不动了
    if (dx === 0) o.v = damp(o.v, 0, 20, dt);
    o.x += dx; syncBox(o);
    P.x = damp(P.x + dx, want + dx, 14, dt); P.vx = dx / dt; P.facing = side;
    if (Math.abs(dx) > 1e-5) P.pushed = true;
    return;
  }

  if (P.mode === 'swim') { stepSwim(dt, d); return; }   // 在水里：见下面的“游泳”

  // ---- 普通状态 ----
  const speed = (keys.has('S') || !ctl ? WALK : RUN) * P.speedK;
  P.vx = damp(P.vx, d * speed, P.grounded ? (d ? 9 : 14) : 3.5, dt);
  if (d) { P.facing = d; P.moved = true; }
  if (Math.abs(P.vx) < 0.02 && !d) P.vx = 0;

  if (P.jumpBuf > 0 && (P.grounded || P.coyote > 0) && P.speedK > 0.5) {
    P.vy = JUMP_V; P.grounded = false; P.jumpBuf = 0; P.coyote = 0; P.jumped = true; fx('jump');
  }
  if (!P.grounded && P.vy > 0 && !(ctl && keys.has('J'))) P.vy -= GRAV * 1.3 * dt;   // 松开跳跃键就跳得矮一些

  // 水平移动，被方块侧面挡住
  let nx = P.x + P.vx * dt; const hit = sideHit(nx, P.y);
  if (hit) {
    const side = P.vx > 0 ? 1 : -1;
    nx = side > 0 ? hit.x1 - P.hw - 1e-3 : hit.x2 + P.hw + 1e-3;
    const h = hit.y2 - P.y;                      // 腾空时贴着墙、够得着边缘就攀上去
    if (!P.grounded && d === side && h > 0.25 && h < 1.2 * P.H && P.vy < 4.5 && hit.x2 - hit.x1 > 0.6 && !hit.noclimb) { P.x = nx; startMantle(hit, side); return; }
    P.vx = 0;
  }
  if (ceilY(nx) < P.y + P.hh && ceilY(nx) < ceilY(P.x)) { nx = P.x; P.vx = 0; }      // 洞顶压下来，挡在前面
  P.x = nx;

  // 垂直方向：贴地行走，或者受重力下落
  const f = floorY(P.x, P.y);
  if (P.grounded) {
    if (f < P.y - 0.3) { P.grounded = false; P.coyote = 0.1; P.gy = P.y; } else P.y = f;
  }
  if (!P.grounded) {
    P.vy -= GRAV * dt; const ny = P.y + P.vy * dt;
    if (P.vy <= 0 && ny <= f) { P.y = f; P.impact = -P.vy; P.vy = 0; P.grounded = true; fx('land', P.impact); }
    else P.y = ny;
  } else { P.vy = 0; P.gy = P.y; }
  const cTop = ceilY(P.x); if (P.y + P.hh > cTop) { P.y = Math.max(f, cTop - P.hh); if (P.vy > 0) P.vy = 0; }   // 头顶碰到洞顶
  const wt = waterAt(P.x); if (wt && P.y < wt.y - SWIM.enter) { enterSwim(wt); return; }     // 掉进能游泳的水里

  // 抓住可以推拉的东西 / 操作机关
  if (ctl && P.grounded && keys.has('E')) {
    const g = findGrab();
    if (g) { P.mode = 'push'; P.grabObj = g[0]; P.grab = g[1]; P.facing = g[1]; g[0].v = 0; }
    else if (pressed.has('E')) { const u = findUse(); if (u) { P.used = true; u.on(u); } }
  }
  for (let i = CPS.length - 1; i > P.cp; i--) if (P.grounded && P.x >= CPS[i].x) { P.cp = i; break; }
}

// ---- 闸门：匀速开关；有人站在门洞里就先不落下来 ----
function stepGates(dt) {
  for (const g of GATES) {
    if (g.open === g.want) continue;
    if (g.want < g.open && P.x + P.hw > g.x1 - 0.05 && P.x - P.hw < g.x2 + 0.05 && P.y < g.y2) continue;
    const was = g.open; g.open = approach(g.open, g.want, dt / g.T); g.y1 = g.y0 + g.open * (g.h + 0.15);
    if (was !== g.open && (g.open === 1 || g.open === 0) && Math.abs(g.x - P.x) < 40) fx('doorStop');
  }
}

// ---- 回到最近的存档点：黑屏一下再亮起来。已经解开的机关都保留 ----
let fadeT = 0, fadeThen = null;

function stepFade(dt) {
  if (state !== 'fade') return;
  fadeT -= dt; if (fadeT > 0) return;
  const f = fadeThen; fadeThen = null; state = 'play'; ctl = true; $('fade').style.opacity = 0; if (f) f();
}
function placePlayer(x, y) {
  Object.assign(P, { x, vx: 0, vy: 0, grounded: true, mode: 'normal', facing: 1, grabObj: null, mantle: null, speedK: 1, water: null, air: SWIM.breath });

//    给门 —— 门直接升起，老人把外套重新盖回机器人身上。

// ============================================================
const CH5 = (() => {
  const X = X5, BOT0 = X + 17.0, L_END = X + 17.95, R_END = X + 33.2, DOOR = X + 35.2, ELDER = X + 15.0, STATION = X + 7;

  ground(X + 4, 0x3f4446); ground(X6 - 6, 0x44494a);
  const batt = pushable({ id: 'battery', x: X + 25.5, w: 0.9, h: 0.8, min: L_END, max: R_END, grip: 0.7, snd: 'metal' });

// ---- 画这些点的着色器 ----
const AIR_VS = `
  attribute float aSize; attribute float aAlpha; attribute float aRot; attribute float aFlip; attribute float aTile; attribute vec3 aCol;
  uniform float uScale;
  varying float vA; varying float vF; varying float vT; varying vec3 vC; varying vec2 vR;
  #include <fog_pars_vertex>
  void main() {
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mvPosition;
    float px = aSize * uScale / max(-mvPosition.z, 0.1);
    gl_PointSize = clamp(px, 1.0, 300.0);
    vA = aAlpha * clamp(px * px, 0.0, 1.0);              // 比一个像素还小的：画成一个像素，但淡下去
    vF = aFlip; vT = aTile; vC = aCol; vR = vec2(cos(aRot), sin(aRot));
    #include <fog_vertex>
  }`;
const AIR_FS = `
  uniform sampler2D uTex;
  varying float vA; varying float vF; varying float vT; varying vec3 vC; varying vec2 vR;
  #include <fog_pars_fragment>
  void main() {
    vec2 p = gl_PointCoord - 0.5;
    p = vec2(vR.x * p.x + vR.y * p.y, -vR.y * p.x + vR.x * p.y);
    p.x /= (vF < 0.0 ? -1.0 : 1.0) * max(abs(vF), 0.06);
    if (abs(p.x) > 0.5 || abs(p.y) > 0.5) discard;
    vec2 cell = vec2(mod(vT, 4.0), floor(vT / 4.0));
    vec4 t = texture2D(uTex, vec2((cell.x + p.x + 0.5) / 4.0, 1.0 - (cell.y + p.y + 0.5) / 4.0));
    float a = t.a * vA; if (a < 0.003) discard;
    gl_FragColor = vec4(vC * t.rgb, a);
    #include <fog_fragment>
    #include <colorspace_fragment>
  }`;

// ---- 一团点：o.init(s) 出生时摆好，o.step(s, dt) 每帧动一下；o.pre(dt) 每帧先算一次大家共用的东西 ----
// s 上要填：x y z 位置，size 大小（米），a 透明度，rot 转角，flip 翻面，tile 贴图格，c 颜色（airCol 给的）
// o.add 叠加发光（尘埃、萤火虫；不受雾影响），否则是普通的半透明、受雾影响；o.order 绘制次序

//   cone 一束聚光（探照灯、监控、吊灯）{ at() 返回 [灯的位置 [x,y,z], 照向的点 [x,y,z], 亮度 0..1], ang 半张角 }

    pre() { for (const L of lights) L._f = false; },

// ---- 飘落的叶子（也用来画纸片、塑料袋、草籽的绒毛这些被风带着走的东西）----
// o: n 几片, xs: [[x1, x2], ...] 只在这几段 x 的上空落（树底下）, z: [z1, z2], cols 颜色, tiles 用哪几格贴图, size [小, 大]（米）,

// ---- 风沙：贴着地面被风吹着走的沙粒（一道道细长的痕），一跳一跳的；刮阵风的时候又多又快 ----

// 地上一片片被风推着流走的沙：一块贴着地面的面，上面是一道道很淡的沙纹，跟着风往一边流

// ---- 一团团蠓虫：围着一个点乱飞。在逆光里是一粒粒亮点（add），在暗处是小黑点 ----
// spots: [[x, y, z, 几只], ...]；o: lit(x, y, z) 那里有多亮（0..1）, c 颜色, a, size, on()
function airGnats(R, spots, o = {}) {
  const who = []; spots.forEach((sp, k) => { for (let i = 0; i < sp[3]; i++) who.push(k); });
  return airCloud(R, who.length, { add: o.add ?? true, order: 47, name: o.name ?? 'gnats',
    init(s) { s.k = who[s.i]; s.p = [ar(0, 6.28), ar(0, 6.28), ar(0, 6.28)]; s.f = [ar(1.5, 3.5), ar(1.2, 3), ar(1, 2.6)]; s.r = ar(0.15, 0.55); s.tile = 0; s.size = ar(0.022, 0.035) * (o.size ?? 1); s.c = airCol(o.c ?? 0xfff0c8); s.b = ar(0.5, 1); },

// ---- 飞蛾：绕着灯乱转，离灯越近越亮，时不时一头撞向灯罩。lamps: [[x, y, z, 几只], ...]；o.on(k) 第 k 盏灯亮不亮 ----

  return airCloud(R, who.length, { add: true, order: 48, name: 'moths',
    init(s) { s.k = who[s.i]; s.ph = ar(0, 6.28); s.w = ar(2.2, 4.5) * (Math.random() < 0.5 ? -1 : 1); s.r = ar(0.3, 0.85); s.tile = 13; s.size = ar(0.07, 0.1) * (o.size ?? 1); s.c = airCol(o.c ?? 0xffe2b0); s.j = [0, 0, 0]; },

// ---- 苍蝇：围着一样东西乱飞，一下一下地冲，有时候落下来停一会儿。box: [x, y, z, 半宽, 半高, 半深]，o.land 落下来停在多高 ----

}
// ---- 蜻蜓和蝴蝶：在一块地方上空飞。蜻蜓悬停一会儿、猛地一窜；蝴蝶一上一下地扑腾、慢慢挪 ----
// box: [x1, x2, 离地 y1, 离地 y2, z1, z2]（o.abs 时 y 就是高度，不是离地多高）；o.kind 'dragon' 蜻蜓 / 不写是蝴蝶；cols, size, on()

// 出了林子，风大起来：贴着地面一阵阵刮过去的沙，地上一片片流动的沙纹，刮阵风的时候更密更快；纸片和塑料袋顺着风翻滚。
// 残墙顶上停着两只乌鸦，翻上墙头就飞；墙外枯树上也有几只；废料场上空几只乌鸦在慢慢盘旋

  const wire = new THREE.CatmullRomCurve3([[POLE, 5.2, -1.6], [POLE + 4, 6.6, -1.7], [POLE + 9, 6.2, -1.7], [BARR + 0.3, 6.5, -1.2]].map(p => V3(...p)), false, 'catmullrom', 0.2);   // 和那一章的那根线一样

// ---- 第八章 · 生态中枢 ----
// 中枢里：挡在发光的墙和那盏大圆灯前面的灰，逆着光一粒粒发亮。
// 出了门：坡顶那棵落光了叶子的老树上停着几只乌鸦，最后几片叶子往下掉；一群乌鸦朝着余晖飞回去（天黑透以前）
airZone(8, [X8 - 6, X8 + 232], [X8 + 1, X8 + 240], function* (R, sys) {
  const D1 = X8 + 20, D2 = X8 + 44, D3 = X8 + 70, EX = X8 + 96, SUNX = X8 + 85.5, SUNR = 7.9, ROOMS = [[X8 - 2, D1, 0.3], [D1, D2, 0.42], [D2, D3, 0.56]];   // 和那一章一样
  const lum = (x, y) => {                                 // 后墙上这一点有多亮：核心是那盏圆灯（下半个圆在地面以下），前三间是一整面光墙
    if (y < -0.3) return 0;
    if (x > D3) { const d = Math.hypot(x - SUNX, y) / SUNR; return d < 0.97 ? 0 : 0.9 * (1 - sstep(0.97, 1.9, d)); }       // 灯面本身已经白透了，亮的灰只在它边上的那一圈
    for (const [a, b, k] of ROOMS) if (x > a && x < b) return k * 1.6 * lerp(1, 0.15, clamp(y / 20, 0, 1));
    return 0;
  };
  sys.push(litDust(R, 260, [{ k: 'back', z: -25.9, lum, box: [X8 + 1, EX - 0.8, 0.05, 6.5, -5, 3], c: 0xeefafd, a: 1, on: () => camera.position.x < EX + 1 }]));
  const disc = (x, y) => y > -0.3 && Math.hypot(x - SUNX, y) < SUNR * 0.97 ? 1 : 0;                                         // 挡在圆灯前面的灰：逆着白光是一粒粒暗点
  sys.push(litDust(R, 120, [{ k: 'back', z: -25.9, lum: disc, box: [D3 + 2, EX - 1, 0.05, 6.5, -5, 3], c: 0x22323a, a: 1.4, on: () => camera.position.x > D3 - 6 && camera.position.x < EX + 1 }], { add: false, size: 0.8 }));
  sys.push(airLeaves(R, { n: 5, xs: [[X8 + 129, X8 + 140]], cols: [0x5a4430, 0x6e5236, 0x3e3024], fall: [0.3, 0.55], z: [-3.8, -2.9], size: [0.07, 0.1], wind: () => -0.35 }));
  sys.push(airFlock(R, [{ x1: X8 + 70, x2: X8 + 230, y: 19, z: -85, v: -3, n: 9, gap: 20, s: 1.5, c: 0x1c1a24 }], { on: () => 1 - CH8.END.deep }));
  sys.push(airBirds(R, flat(8, -3.4, [X8 + 131.6, X8 + 133.2, X8 + 136.0, X8 + 137.8], { c: 0x0a0b0a, s: 1.15, flee: 3, dy: 12, yMax: 14, toZ: -3, near: 0.6, minY: 6 }).map(b => (b[4].back = 25, b))));
});

// ============================================================
//  水里的小东西：主角嘴边冒出的气泡、跳进水里溅起的水花和一团气泡、浮在水面上时身边一道道散开的波纹

    } else if (i === 1) {                            // 逆时针的圆箭头：回到存档点
      const rr = 0.8 * r, a0 = -0.35 * P2, px = x + rr * Math.cos(a0), py = y + rr * Math.sin(a0), vx = Math.sin(a0), vy = -Math.cos(a0);
      g.arc(x, y, rr, a0, 1.25 * P2); g.stroke(); g.beginPath();
      for (const s of [-0.62, 0.62]) { const cs = Math.cos(s), sn = Math.sin(s); g.moveTo(px, py); g.lineTo(px - (vx * cs - vy * sn) * 0.55 * r, py - (vx * sn + vy * cs) * 0.55 * r); }
      g.stroke();
    } else {                                         // 小喇叭：开着有两道声波，关着打个叉
      g.moveTo(x - 0.95 * r, y - 0.3 * r); g.lineTo(x - 0.5 * r, y - 0.3 * r); g.lineTo(x + 0.02 * r, y - 0.78 * r);
      g.lineTo(x + 0.02 * r, y + 0.78 * r); g.lineTo(x - 0.5 * r, y + 0.3 * r); g.lineTo(x - 0.95 * r, y + 0.3 * r); g.closePath(); g.fill();
      g.beginPath();
      if (muted) { g.moveTo(x + 0.4 * r, y - 0.32 * r); g.lineTo(x + 1.0 * r, y + 0.32 * r); g.moveTo(x + 1.0 * r, y - 0.32 * r); g.lineTo(x + 0.4 * r, y + 0.32 * r); }
      else { g.arc(x + 0.02 * r, y, 0.48 * r, -0.75, 0.75); g.moveTo(x + 0.02 * r + 0.9 * r * Math.cos(-0.8), y + 0.9 * r * Math.sin(-0.8)); g.arc(x + 0.02 * r, y, 0.9 * r, -0.8, 0.8); }
      g.stroke();
    }
  }
  HUD.tex.needsUpdate = true;
}
function hudIconAt(x, y) {                           // 手指落在哪个图标上（网页坐标，y 朝下）；点的范围比画出来的大，好点
  if (!touchMode || !HUD.c || y > Math.max(46, HUD.bh + 22)) return -1;
  let best = -1, bd = HUD.gap / 2 + 4;
  for (let i = 0; i < 3; i++) if (hudShown(i)) { const d = i === 2 && x > HUD.cx[2] ? 0 : Math.abs(x - HUD.cx[i]); if (d < bd) { bd = d; best = i; } }
  return best;
}
function hudPress(i) {
  HUD.flash[i] = 0.3;
  if (i === 0) rawKeys.add('Escape');                // 和 Esc 一样：下一帧打开 / 关上章节菜单
  else if (i === 1) pressed.add('RESET');            // 和 R 一样：回到存档点（结局画面上是回到最后的选择）
  else { setMuted(!muted); soundNote(); }            // 直接在手指抬起的这一下里开声音：iOS 只许在触摸事件里开始放声音
}
function hudRender(dt) {                             // 画完场景以后叠在上面
  if (!touchMode) return;
  let f = 0; for (let i = 0; i < 3; i++) { if (HUD.flash[i] > 0) HUD.flash[i] -= dt; f = f * 2 + (HUD.flash[i] > 0 ? 1 : 0); }
  const key = `${HUD.w}x${HUD.h} ${muted} ${state === 'title'} ${f}`;
  if (key !== HUD.key) { HUD.key = key; drawHudIcons(); }
  renderer.autoClear = false; renderer.render(HUD.scene, HUD.cam); renderer.autoClear = true;
}

// ---- 触屏 / 键盘两套说法：标题、章节菜单、结局、操作提示 ----
const KEY_TEXT = { title: $('title').querySelector('.keys').innerHTML, menu: $('menu').querySelector('.keys').innerHTML, end: $('end').querySelector('.go').innerHTML };
const TOUCH_TEXT = {
  title: '<b>按住屏幕 左右滑</b> 移动　　<b>往上一划</b> 跳跃 / 攀爬　　<b>长按</b> 抓住东西，再滑就推拉<br>' +
    '<b>点一下</b> 操作机关　　在水里 <b>往下滑住</b> 潜下去　　右上角：选择章节 · 回到存档点 · 声音',
  menu: '点一章，从这一章的开头开始　　点空白处返回',
  end: '点右上角的 ↺ 回到最后的选择　·　☰ 选择章节',
};
const TOUCH_HINT = {                                 // 换个说法读着更顺的几条；其余的按下面的规则替换
  '<b>←</b><b>→</b> 移动': '<b>按住屏幕 左右滑</b> 移动',
  '<b>空格</b> 跳跃': '<b>往上一划</b> 跳跃',
  '按住 <b>E</b> 抓住推车，再按方向键推或拉': '<b>长按</b> 抓住推车，再左右滑，推或拉',
  '跳下去，<b>← →</b> 游泳': '跳下去，<b>按住滑动</b> 游泳',
  '按住 <b>↓</b> 潜下去，从岩石底下游过去': '<b>往下滑住不放</b> 潜下去，从岩石底下游过去',
  '<b>空格</b> 往上，<b>↓</b> 往下；什么都不按，人会慢慢浮上去': '<b>往上滑</b> 往上，<b>往下滑</b> 往下；松开手，人会慢慢浮上去',
};
function touchText(h) {
  return TOUCH_HINT[h] ?? h.replace(/按住 <b>E<\/b>/g, '<b>长按</b>').replace(/按 <b>E<\/b>/g, '<b>点一下</b>').replace(/<b>空格<\/b>/g, '<b>往上一划</b>')
    .replace(/<b>↓<\/b>/g, '<b>往下滑</b>').replace(/<b>←<\/b><b>→<\/b>|<b>← →<\/b>/g, '<b>左右滑</b>').replace(/方向键/g, '左右滑');
}
function goText() {
  const k = touchMode ? '点一下' : '按任意键';
  return STORY.ch > 1 ? `${k}继续 · 第${CN[STORY.ch - 1]}章 ${CHAPTERS[STORY.ch - 1].name}` : `${k}开始`;
}
function applyInputTexts() {
  $('title').querySelector('.keys').innerHTML = touchMode ? TOUCH_TEXT.title : KEY_TEXT.title;
  $('menu').querySelector('.keys').innerHTML = touchMode ? TOUCH_TEXT.menu : KEY_TEXT.menu;
  $('end').querySelector('.go').innerHTML = touchMode ? TOUCH_TEXT.end : KEY_TEXT.end;
  $('go').textContent = goText();
}
function setTouchMode(on) {                          // 摸了屏幕就换成触屏，按了键盘就换回键盘
  if (on === touchMode) return;
  touchMode = on; if (!on) touchClear();
  document.body.classList.toggle('touch', on); applyInputTexts(); touchResize(); hintNow = null;   // 提示也换成对应的说法
}
function touchResize() {
  hudLayout();
  const b = touchMode && (innerHeight || 0) > (innerWidth || 0);
  if (b === rotBlock) return;
  rotBlock = b; document.body.classList.toggle('portrait', b); touchClear();
  if (master) master.gain.setTargetAtTime(b || muted ? 0 : 0.6, AC.currentTime, 0.05);   // 竖着停住的时候声音也停
}

// ---- 事件：手指；?touch=1 时鼠标也当手指 ----
const tOpt = { passive: false };
addEventListener('touchstart', e => {
  setTouchMode(true);
  if (menuOpen) return;                              // 章节菜单是网页元素，点击交给它自己
  for (const t of e.changedTouches) tStart(t.identifier, t.clientX, t.clientY, tNow());
  e.preventDefault();                                // 不要滚动、缩放、长按弹菜单，也不要再补发一次鼠标点击
}, tOpt);
addEventListener('touchmove', e => { for (const t of e.changedTouches) tMove(t.identifier, t.clientX, t.clientY, tNow()); if (!menuOpen) e.preventDefault(); }, tOpt);
addEventListener('touchend', e => { for (const t of e.changedTouches) tEnd(t.identifier, t.clientX, t.clientY, tNow()); if (!menuOpen) e.preventDefault(); }, tOpt);
addEventListener('touchcancel', e => { for (const t of e.changedTouches) TOUCHES.delete(t.identifier); }, tOpt);
if (TOUCH_Q === '1') {
  let md = false;
  addEventListener('mousedown', e => { if (e.button || menuOpen) return; md = true; tStart(-1, e.clientX, e.clientY, tNow()); });
  addEventListener('mousemove', e => { if (md) tMove(-1, e.clientX, e.clientY, tNow()); });
  addEventListener('mouseup', e => { if (md) { md = false; tEnd(-1, e.clientX, e.clientY, tNow()); } });
}
addEventListener('keydown', () => { if (TOUCH_Q !== '1') setTouchMode(false); });
addEventListener('blur', touchClear);
document.addEventListener('visibilitychange', () => { if (document.hidden) touchClear(); });
addEventListener('contextmenu', e => { if (touchMode) e.preventDefault(); });   // 安卓上长按会弹出菜单
addEventListener('gesturestart', e => e.preventDefault());                     // iOS 上两根手指捏一下会缩放网页
addEventListener('resize', touchResize);
addEventListener('orientationchange', () => setTimeout(touchResize, 150));
menuEl.addEventListener('click', e => { if (touchMode && menuOpen && !e.target.closest('.it')) toggleMenu(false); });   // 触屏：点空白处返回
document.body.classList.toggle('touch', touchMode); touchResize();
const TOUCH_DBG = {                                  // 调试：__g.touch.start(1, x, y) / move / end，模拟手指
  start: (id, x, y) => tStart(id, x, y, tNow()), move: (id, x, y) => tMove(id, x, y, tNow()), end: (id, x, y) => tEnd(id, x, y, tNow()),
  list: () => [...TOUCHES.values()], held: () => [...tHeld], icons: () => ({ cx: HUD.cx, y: HUD.bh / 2, gs: HUD.gs }),
  draw: () => { renderer.render(scene, camera); hudRender(0); } };   // 停住时连黑边和图标一起重画一帧

// ============================================================
//  镜头 / 主循环
// ============================================================
const cam = { x: 2, y: 1.3, d: 14.5, look: 0.8, az: 0, lift: 0 };     // lift：镜头比平常再抬高多少（往下看）
let closeUp = false;                               // 按 V：把镜头拉到主角跟前，慢慢左右绕着看
let camOvr = null;                                 // 过场时由章节临时接管镜头：{ d 距离, yo 高度偏移, xo 水平偏移 }
function placeCamera() {
  camera.position.set(cam.x + Math.sin(cam.az) * cam.d, cam.y + cam.d * 0.05 + cam.lift, Math.cos(cam.az) * cam.d); camera.lookAt(cam.x, cam.y, 0);
  key.target.position.set(cam.x, P.y, 0); key.position.copy(key.target.position).addScaledVector(keyDir, 55);   // 影子跟着主角走
  rim.target.position.set(cam.x, P.y, 0); rim.position.set(cam.x - 6, P.y + 5, -10);
}
function updateCamera(dt) {
  const [d, yo, xo, lift = 0] = closeUp ? [5.4, 0.66, 0] : camOvr ? [camOvr.d, camOvr.yo, camOvr.xo] : camKey(P.x);
  cam.look = damp(cam.look, closeUp ? 0 : P.facing * 0.8 + clamp(P.vx * 0.3, -1, 1), 1.5, dt);   // 镜头略微领先于前进方向
  cam.az = damp(cam.az, closeUp ? 0.62 * Math.sin(T * 0.4) : 0, 2.5, dt);
  const ty = (P.mode === 'swim' ? P.y + SWIM.c - 0.45 : P.grounded || P.mode === 'mantle' ? P.y : lerp(P.gy ?? P.y, P.y, 0.4)) + yo;   // 跳起来时镜头只跟一小半；游泳时整个跟着下去
  cam.x = damp(cam.x, P.x + xo + cam.look, 3, dt); cam.y = damp(cam.y, ty, 2.6, dt); cam.d = damp(cam.d, d, closeUp ? 3.2 : 1.6, dt); cam.lift = damp(cam.lift, lift, 1.6, dt);
  placeCamera();
}
function snapCamera() { const [d, yo, xo, lift] = camKey(P.x); closeUp = false; cam.az = 0; cam.x = P.x + xo + cam.look; cam.y = P.y + yo; cam.d = d; cam.lift = lift; placeCamera(); }

let prevPh = 0;
function sim(dt) {
  T += dt;
  touchInput(dt);                                  // 触屏：手指折算成按键
  if (rawKeys.has('Escape') || rawKeys.has('KeyP')) toggleMenu();
  if (menuOpen) { menuInput(); pressed.clear(); rawKeys.clear(); anyKey = false; return; }
  if (state === 'title' && anyKey) begin();
  if (pressed.has('TINT') && hero.B.tint) hero.B.tint();                 // 小孩：换一块连帽衫的颜色看看
  if (pressed.has('LEGS') && hero.kind === 'K') { kidLegs = (kidLegs + 1) % KID_LEGS.length; rebuildHero(); }   // 小孩：长裤靴子 / 短裤光腿
  if (pressed.has('VIEW') && state !== 'title') closeUp = !closeUp;
  if (pressed.has('MUTE')) { setMuted(!muted); soundNote(); }
  if (pressed.has('RESET')) { if (state === 'play' && ctl) respawn(); else if (state === 'end') retryEnding(); }

  // 这些每一帧都清零，由走到的那一章重新填写
  HX.hide = 0; HX.alert = 0; HX.pose = null; HX.energy = energyFor(STORY.ch); camOvr = null;
  for (const k in AUD) AUD[k] = 0; AUD.humF = 52; beam.intensity = 0;

  let impact = 0; const n = Math.max(1, Math.ceil(dt * 120));            // 物理按不超过 1/120 秒一小步来走
  if (state !== 'title') for (let i = 0; i < n; i++) { stepPlayer(dt / n); impact = Math.max(impact, P.impact); pressed.delete('J'); pressed.delete('E'); }
  stepGates(dt); stepBreath(); stepWaterFx(dt);
  for (const z of ZONES) if (P.x > z.vis[0] - 30 && P.x < z.vis[1] + 30) z.update(dt);
  stepPits(); stepFade(dt); stepChapterCard(dt);
  if (state === 'play') { const c = chapterAt(P.x); if (c.n > STORY.ch) { STORY.done = c.n - 1; STORY.ch = c.n; saveGame(); showChapter(c); } }

  GUST.v = GUST.force ?? gustAt(T); stepPant(dt, impact);                   // 阵风（force：工具页里硬给一阵风）/ 喘气（声音和动作都用）
  const onTerrain = P.grounded && P.y - groundY(P.x) < 0.02, o = P.grabObj;
  hero.update(dt, { x: P.x, y: P.y, vx: P.vx, vy: P.vy, grounded: P.grounded, facing: P.facing, mode: P.mode, t: T, impact, hide: HX.hide,
    modeT: P.mode === 'mantle' ? P.modeT / P.mantle.T : 0, slope: onTerrain ? groundSlope(P.x) : 0, alert: HX.alert, energy: HX.energy, pose: HX.pose, br: BR,
    hand: P.mode === 'mantle' ? { x: P.mantle.ex, y: P.mantle.top } : P.mode === 'push' ? { x: P.grab > 0 ? o.x1 : o.x2, y: o.y1 + (o.grip ?? 0.82) } : null,
    swim: P.mode === 'swim' ? { ph: P.stroke, vx: P.vx, vy: P.vy, c: SWIM.c, top: sstep(0.12, 0.02, P.water.y - SWIM.top - (P.y + SWIM.c)), panic: sstep(0.55, 1, 1 - P.air / SWIM.breath) } : null });
  const ph = hero.A.ph, stepNow = P.grounded && Math.abs(P.vx) > 0.4 && Math.floor(ph * 2) !== Math.floor(prevPh * 2); prevPh = ph;
  stepCat(dt);

  updateCamera(dt);
  applyEnv(camera.position.x); assignLights(cam.x); streamZones(cam.x); updateSky(T, cam.az, 0.05 + cam.lift / cam.d);
  updateDust(dt, T, cam.x, cam.y, E.wind); updateFlies(dt, T, cam.x, groundY(cam.x), E.flies);
  updateHint(); updateAudio(dt, stepNow);
  pressed.clear(); rawKeys.clear(); anyKey = false;
}

// 调试接口：在控制台里用 __g.ch(章) 跳章节、__g.tp(x) 传送、__g.step(秒) 手动推进、__g.hold(['R'], 秒) 模拟按住按键
const DBG = window.__g = { P, STORY, CAT, E, HX, AUD, BR, BREATH, SND, GUST, ZONES, SOLIDS, PUSHABLES, GATES, USES, CPS, CHAPTERS, LIGHTS, WATERS, SWIM, groundY, ceilY, cam, keys, pressed, paused: false, setSkin, begin, respawn,
  closeUp(on = !closeUp) { closeUp = on; }, legs(n) { kidLegs = n; if (hero.kind === 'K') rebuildHero(); }, hero: () => hero, state: () => state, ctl: () => ctl, scene, camera, renderer, THREE,
  ch(n) { if (state === 'title') { $('title').classList.add('hide'); $('skins').classList.add('on'); } startChapter(n); renderer.render(scene, camera); },
  view(d, yo = 0.6, xo = 0) { camera.position.set(P.x + xo, P.y + yo + d * 0.05, d); camera.lookAt(P.x + xo, P.y + yo, 0); renderer.render(scene, camera); },   // 近看主角
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) sim(dt); renderer.render(scene, camera); DBG.redraw = true; },
  hold(ks, sec, dt = 1 / 60) { ks = [].concat(ks); for (const k of ks) { if (!keys.has(k)) pressed.add(k); keys.add(k); } DBG.step(sec, dt); for (const k of ks) keys.delete(k); },
  tap(k) { pressed.add(k); keys.add(k); sim(1 / 60); keys.delete(k); renderer.render(scene, camera); },
  tp(x) { placePlayer(x); P.cp = cpAt(x); snapCamera(); applyEnv(camera.position.x); streamZones(cam.x, true); renderer.render(scene, camera); },
  zone: n => ZONES.find(z => z.n === n), touch: TOUCH_DBG, touchMode: on => setTouchMode(on),
  // 声音：sound(true) 打开；play('st:leaves:w') 放一组里的一个（名字见 52-audio.js 的 RECIPE）；breath('in', 0.4, 1) 现算一口气；audio() 看现在的状态
  sound(on = true) { if (muted === on) { setMuted(!on); soundNote(); } }, play: (name, o) => snd(name, o), breath: (dir, len, k, o) => breathSound(dir, len, k, o),
  audio: () => ({ AC, MX, master, loops, jobs: JOBS.length, banks: Object.keys(BANKS).length, surface: surfaceUnder() }),
  // 量一量声音（听不到的时候用）：meter(秒) → 总输出 out 和三路 amb / fol / sfx 各自的 RMS 和峰值（dBFS）。250 赫兹以下不算：小喇叭放不出来的低音不计
  meter(sec = 2) {
    if (!AC) return Promise.resolve(null);
    if (!DBG._an) { DBG._an = {}; for (const [k, n] of [['out', master], ['amb', MX.bus.amb], ['fol', MX.bus.fol], ['sfx', MX.bus.sfx]]) { const f = AC.createBiquadFilter(), a = AC.createAnalyser(); f.type = 'highpass'; f.frequency.value = 250; a.fftSize = 2048; n.connect(f).connect(a); DBG._an[k] = a; } }
    const acc = {}, buf = new Float32Array(2048), t0 = performance.now(); for (const k in DBG._an) acc[k] = [0, 0, 0];
    return new Promise(res => { const tick = () => {
      for (const k in DBG._an) { DBG._an[k].getFloatTimeDomainData(buf); const A = acc[k]; for (const v of buf) { A[0] += v * v; A[2] = Math.max(A[2], Math.abs(v)); } A[1] += buf.length; }
      if (performance.now() - t0 < sec * 1000) requestAnimationFrame(tick);
      else { const o = {}; for (const k in acc) { const [ss, n, pk] = acc[k]; o[k] = [+(10 * Math.log10(ss / n + 1e-18)).toFixed(1), +(20 * Math.log10(pk + 1e-9)).toFixed(1)]; } res(o); } };
      requestAnimationFrame(tick); });
  } };

let lastT = performance.now(), frameN = 0;
function frame(now) {
  const dt = clamp((now - lastT) / 1000, 0.001, 0.05); lastT = now;
  if (rotBlock) { /* 竖着拿手机：游戏停住，等横过来 */ }
  else if (!DBG.paused) { sim(dt); renderer.render(scene, camera); hudRender(dt); } else if (DBG.redraw) { DBG.redraw = false; renderer.render(scene, camera); hudRender(0); }
  if (++frameN % 2 === 0) $('grain').style.backgroundPosition = `${Math.random() * 256 | 0}px ${Math.random() * 256 | 0}px`;
  requestAnimationFrame(frame);
}

document.querySelectorAll('#skins button').forEach(b => b.addEventListener('click', () => { setSkin(b.dataset.k); b.blur(); canvas.focus(); }));
CAMKEYS.sort((a, b) => a[0] - b[0]); CPS.sort((a, b) => a.x - b.x);
buildGround();
CAT.crit = makeCritter('cat', scene); CAT.crit.root.visible = false;
setSkin('R'); loadGame();                               // 主角使用 models/hero.glb（3K 面的少年）
{ const n = +new URLSearchParams(location.search).get('ch'); if (n >= 1 && n <= CHAPTERS.length) STORY.ch = n; }   // 地址后面加 ?ch=5 直接从第五章开始
{ const c = CHAPTERS[STORY.ch - 1], intro = c.intro; c.intro = null; startChapter(STORY.ch, { quiet: true }); c.intro = intro; state = 'title'; }
applyInputTexts();                                      // 标题上的操作说明和“按任意键开始”：触屏和键盘各一套
$('title').classList.remove('hide'); $('fade').style.opacity = 0.42; $('msg').remove();
window.__ready = true;
requestAnimationFrame(frame);
</script>
