<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拾荒小机器人 · 3D 模型</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#9c8f88 0%,#85786f 55%,#6a5f58 100%);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#f4ece0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(40,33,29,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
  button{font:inherit;font-size:13px;color:#f4ece0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:7px 12px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.2)}
  button.on{background:#c98a3a;border-color:#e0a653;color:#2a1d10}
  #hint{position:fixed;left:18px;top:14px;font-size:12.5px;line-height:1.7;opacity:.88;text-shadow:0 1px 2px rgba(0,0,0,.35);pointer-events:none}
  #hint b{font-size:15px;letter-spacing:.04em}
  #msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;pointer-events:none;text-align:center;padding:0 24px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><b>拾荒小机器人</b><br>拖动旋转 · 滚轮 / 双指缩放 · 右键拖动平移</div>
<div id="bar">
  <button id="bAuto" class="on">自动旋转</button>
  <button id="bReset">重置视角</button>
  <button id="bGlb">导出 GLB</button>
</div>
<div id="msg">正在加载…</div>
<script>
  // 如果 three.js 没能从 CDN 加载成功，给出明确提示
  setTimeout(function () {
    if (!window.__ready) document.getElementById('msg').textContent = '加载失败：本页面需要联网，从 cdn.jsdelivr.net 加载 three.js';
  }, 10000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ============================================================
//  场景 / 相机 / 灯光
// ============================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
{ // 摄影棚式的暖灰渐变背景（画进场景里，玻璃罐才能透出正确的背景色）
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), gr = g.createRadialGradient(256, 215, 0, 256, 215, 400);
  gr.addColorStop(0, '#9c8f88'); gr.addColorStop(0.55, '#85786f'); gr.addColorStop(1, '#6a5f58');
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.4;

const camera = new THREE.PerspectiveCamera(28, 1, 0.5, 200);
// 初始视角与参考图一致：从机器人的右前方看过去
const HOME = { pos: new THREE.Vector3(-21.8, 6.6, 18.3), tgt: new THREE.Vector3(0, 5.0, -0.35) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.tgt);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 7; controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

scene.add(new THREE.HemisphereLight(0xfff1e0, 0x6b5d55, 0.4));
const key = new THREE.DirectionalLight(0xfff0dc, 2.6);
key.position.set(-9, 16, 12); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -9, right: 9, top: 12, bottom: -4, near: 1, far: 50 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 5;
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfd8ff, 0.5); fill.position.set(12, 6, 6); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe2c0, 0.9); rim.position.set(6, 9, -14); scene.add(rim);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 38 : 28;   // 竖屏时放宽视野，保证整个模型在画面内
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();


// ============================================================
//  程序化贴图：掉漆生锈的金属、粗布
// ============================================================
let _seed = 20261110;
function rnd() {   // 固定种子的随机数，保证每次打开模型都一样
  _seed = _seed + 0x6D2B79F5 | 0;
  let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function toTex(c, srgb = true, alpha = false) {
  const t = new THREE.CanvasTexture(c);
  if (!alpha) t.userData.mimeType = 'image/jpeg';   // 导出 GLB 时不带透明的贴图用 JPEG，文件小很多
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
function grain(g, w, h, amt) {
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) { const n = (rnd() - 0.5) * amt; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
  g.putImageData(d, 0, 0);
}
function blot(g, x, y, r, col, a) {   // 柔边色斑
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(col, a)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function chip(g, x, y, r, col) {      // 硬边的不规则掉漆块
  g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 7; i++) { const a = i / 7 * 6.283, q = r * rr(0.45, 1); g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * q, y + Math.sin(a) * q); }
  g.closePath(); g.fill();
}
function stitchX(g, x, y, s, col = '#5a3d2a') {   // 缝补用的 X 形针脚
  g.strokeStyle = col; g.lineWidth = Math.max(2, s * 0.16); g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - s, y - s * 0.8); g.lineTo(x + s, y + s * 0.8);
  g.moveTo(x + s, y - s * 0.8); g.lineTo(x - s, y + s * 0.8); g.stroke();
}

const RUST = ['#7a4524', '#96562a', '#5c3520', '#b06a30', '#6b4a36'];
function wornPaint(base, { wear = 1, size = 512, deco, edge = true, chipR = 1 } = {}) {
  const [c, g] = mkCanvas(size, size), [cb, b] = mkCanvas(size, size);
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  b.fillStyle = '#808080'; b.fillRect(0, 0, size, size);
  if (deco) deco(g, size);
  for (let i = 0; i < 26; i++) blot(g, rr(0, size), rr(0, size), rr(40, 150), rnd() < 0.5 ? [255, 244, 220] : [70, 52, 38], rr(0.05, 0.16));
  for (let i = 0; i < 70 * wear; i++) {            // 划痕
    const x = rr(0, size), y = rr(0, size), a = rr(0, 6.28), l = rr(8, 70);
    g.strokeStyle = rnd() < 0.5 ? 'rgba(60,44,32,.35)' : 'rgba(255,248,230,.3)'; g.lineWidth = rr(0.6, 1.6);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let s = 0; edge && s < 4; s++) {            // 边缘积垢（贴图边缘 = 方盒的棱边）
    const w = size * 0.1, gr = s < 2 ? g.createLinearGradient(s ? size : 0, 0, s ? size - w : w, 0) : g.createLinearGradient(0, s === 3 ? size : 0, 0, s === 3 ? size - w : w);
    gr.addColorStop(0, 'rgba(74,46,28,.42)'); gr.addColorStop(1, 'rgba(74,46,28,0)');
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
  }
  for (let s = 0; edge && s < 4; s++) for (let t = 0; t < size;) {   // 棱边掉漆：断断续续的锈线
    const l = rr(6, 44), wd = rr(1.5, 6.5) * chipR;
    if (rnd() < 0.6) {
      const R = s < 2 ? [s ? size - wd : 0, t, wd, l] : [t, s === 3 ? size - wd : 0, l, wd];
      g.fillStyle = pick(RUST); g.fillRect(...R); b.fillStyle = '#4c4c4c'; b.fillRect(...R);
    }
    t += l;
  }
  for (let i = 0; i < 95 * wear; i++) {            // 锈斑，集中在边缘
    let x = rr(0, size), y = rr(0, size);
    if (edge && rnd() < 0.8) {
      const e = Math.pow(rnd(), 2.2) * size * 0.16, s = Math.floor(rnd() * 4);
      if (s === 0) x = e; else if (s === 1) x = size - e; else if (s === 2) y = e; else y = size - e;
    }
    const r = (rnd() < 0.72 ? rr(1.5, 5) : rr(5, 14)) * (rnd() < 0.06 ? 2 : 1) * chipR;
    blot(g, x, y, r * 2.4, [120, 70, 35], 0.35);
    chip(g, x, y, r, pick(RUST)); chip(b, x, y, r, '#4c4c4c');
  }
  grain(g, size, size, 18); grain(b, size, size, 14);
  return { map: toTex(c), bumpMap: toTex(cb, false) };
}

function cloth(base, { w = 512, h = 512, deco, fray = 0, dirt = 1, pitch = 4 } = {}) {
  const [c, g] = mkCanvas(w, h), [cb, b] = mkCanvas(w, h);
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  b.fillStyle = '#808080'; b.fillRect(0, 0, w, h);
  for (let i = 0; i < 18 * dirt; i++) blot(g, rr(0, w), rr(0, h), rr(40, 160), rnd() < 0.45 ? [255, 246, 225] : [64, 48, 36], rr(0.05, 0.15));
  if (deco) deco(g, w, h);
  for (let y = 0; y < h; y += pitch) {             // 经纬线
    const a = rr(0.04, 0.16);
    g.fillStyle = `rgba(40,28,20,${a})`; g.fillRect(0, y, w, 1);
    b.fillStyle = `rgba(0,0,0,${a * 2.2})`; b.fillRect(0, y, w, 1.5);
  }
  for (let x = 0; x < w; x += pitch) {
    const a = rr(0.03, 0.13);
    g.fillStyle = `rgba(40,28,20,${a})`; g.fillRect(x, 0, 1, h);
    b.fillStyle = `rgba(0,0,0,${a * 2.2})`; b.fillRect(x, 0, 1.5, h);
  }
  grain(g, w, h, 22); grain(b, w, h, 30);
  if (fray) {                                      // 下摆撕成破烂的锯齿（用透明度裁掉）
    g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
    for (let x = 0; x < w;) {
      const tw = rr(5, 26), th = fray * h * rr(0.15, 1) * (rnd() < 0.15 ? 1.6 : 1);
      g.beginPath(); g.moveTo(x - 2, h); g.lineTo(x + tw * rr(0.3, 0.7), h - th); g.lineTo(x + tw + 2, h); g.fill();
      x += tw;
    }
    g.globalCompositeOperation = 'source-over';
  }
  return { map: toTex(c, true, fray > 0), bumpMap: toTex(cb, false) };
}

// ============================================================
//  材质
// ============================================================
const metal = (tex, o = {}) => new THREE.MeshStandardMaterial({ map: tex.map, bumpMap: tex.bumpMap, bumpScale: 1.5, roughness: 0.78, metalness: 0.12, ...o });
const fabric = (tex, o = {}) => new THREE.MeshStandardMaterial({ map: tex.map, bumpMap: tex.bumpMap, bumpScale: 1.2, roughness: 0.96, metalness: 0, side: THREE.DoubleSide, shadowSide: THREE.DoubleSide, ...o });
const stripes = (col, ys, th) => (g, w, h) => { g.fillStyle = col; ys.forEach(y => g.fillRect(0, y * h, w, th * h)); };

const C = { cream: '#c9b78f', green: '#667044', blue: '#6f8194', orange: '#a9622c', brown: '#6e4a33', dark: '#4b443e' };
const M = {
  cream: metal(wornPaint(C.cream)),
  shell: metal(wornPaint(C.cream, { wear: 0.24, edge: false, chipR: 0.6 })),
  green: metal(wornPaint(C.green)),
  blue: metal(wornPaint(C.blue, { wear: 1.2 })),
  orange: metal(wornPaint(C.orange, { wear: 0.8 }), { roughness: 0.85, metalness: 0.25 }),
  brown: metal(wornPaint(C.brown), { roughness: 0.85, metalness: 0.3 }),
  dark: metal(wornPaint(C.dark, { wear: 0.5 }), { roughness: 0.5, metalness: 0.75 }),
  leather: metal(cloth('#6b4731', { pitch: 9, dirt: 1.6 }), { roughness: 0.72, metalness: 0, bumpScale: 0.8 }),
  skirt: fabric(cloth('#72794c', { fray: 0.1, deco: (g, w, h) => { stitchX(g, w * 0.3, h * 0.72, 16); stitchX(g, w * 0.78, h * 0.4, 13); } }), { alphaTest: 0.5 }),
  scarf: fabric(cloth('#8f4d3d', { pitch: 5 }), { bumpScale: 2.2 }),
  scarfTail: fabric(cloth('#8f4d3d', { w: 256, h: 512, pitch: 5, fray: 0.07, deco: stripes('#d9c7a4', [0.7, 0.78], 0.035) }), { alphaTest: 0.5 }),
  bandage: fabric(cloth('#c2af88', { pitch: 5 })),
  pink: fabric(cloth('#b58270')),
  packCloth: fabric(cloth('#c2b391', { w: 256, h: 512, fray: 0.08, deco: stripes('#a3604e', [0.62, 0.71], 0.04) }), { alphaTest: 0.5 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xfff4e0, transmission: 1, roughness: 0.07, thickness: 0.12, ior: 1.3, metalness: 0, envMapIntensity: 1.8 }),
  soil: new THREE.MeshStandardMaterial({ color: 0x4a3323, roughness: 1 }),
  moss: new THREE.MeshStandardMaterial({ color: 0x5c6b2e, roughness: 1 }),
  vine: new THREE.MeshStandardMaterial({ color: 0x5a4a2c, roughness: 0.9 }),
  leaves: ['#6f8f2f', '#86a43a', '#56712b', '#9ab347'].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, side: THREE.DoubleSide, shadowSide: THREE.DoubleSide })),
  sprout: new THREE.MeshStandardMaterial({ color: 0xa8dc3c, emissive: 0x8fd020, emissiveIntensity: 0.75, roughness: 0.6, side: THREE.DoubleSide }),
  lamp: new THREE.MeshBasicMaterial({ color: 0xffe9b8, toneMapped: false }),
};

// 发光贴图：眼睛的镜片 + 叠加的光晕
function radialTex(stops) {
  const [c, g] = mkCanvas(256, 256), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  stops.forEach(([p, col]) => gr.addColorStop(p, col));
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
M.lens = new THREE.MeshBasicMaterial({ map: radialTex([[0, '#fff6c8'], [0.28, '#ffd257'], [0.62, '#ff9d1c'], [0.95, '#b5540c'], [1, '#6a3208']]), toneMapped: false });
const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,255,255,.45)'], [1, 'rgba(255,255,255,0)']]);
function glow(color, size, opacity = 0.6) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, opacity, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  s.scale.setScalar(size); return s;
}

// ============================================================
//  建模小工具
// ============================================================
const TICKS = [];   // 每帧调用的小动画
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function add(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function grp(parent, x = 0, y = 0, z = 0) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }

const boxG = (w, h, d, r = 0.04) => new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2, h / 2, d / 2) * 0.99);
const cylG = (rt, rb, h, seg = 24, open = false) => new THREE.CylinderGeometry(rt, rb, h, seg, 1, open);
const sphG = (r, ws = 24, hs = 16) => new THREE.SphereGeometry(r, ws, hs);

// 让方盒上下宽度不同（y = -h/2 处按 sxBot/szBot 缩放）
function taper(geo, h, sxBot, szBot = sxBot) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const k = p.getY(i) / h + 0.5;
    p.setX(i, p.getX(i) * (sxBot + (1 - sxBot) * k)); p.setZ(i, p.getZ(i) * (szBot + (1 - szBot) * k));
  }
  return geo;
}
// 改变贴图平铺次数（克隆材质，贴图图像共享）
function retile(mat, ru, rv) {
  const m = mat.clone();
  for (const k of ['map', 'bumpMap']) if (m[k]) { m[k] = m[k].clone(); m[k].repeat.set(ru, rv); m[k].needsUpdate = true; }
  return m;
}

const rivetG = new THREE.SphereGeometry(0.036, 10, 8);
function rivets(parent, pts, mat = M.dark, s = 1) { for (const [x, y, z] of pts) add(parent, rivetG, mat, x, y, z).scale.setScalar(s); }

function tubeG(pts, r, seg = 40, rad = 8, closed = false) {
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p => p.isVector3 ? p : V3(...p)), closed), seg, r, rad, closed);
}
// 侧面轮廓 [[z, y], ...] 沿 X 方向挤出，宽度居中
function profG(pts, width, bevel = 0.025) {
  const s = new THREE.Shape(pts.map(([z, y]) => new THREE.Vector2(z, y))), d = width - 2 * bevel;
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });
  g.translate(0, 0, -d / 2); g.rotateY(-Math.PI / 2); return g;
}
// 正面轮廓 [[x, y], ...] 沿 Z 方向挤出成薄板
function plateG(pts, depth, bevel = 0.02) {
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2 });
  g.translate(0, 0, -depth / 2); return g;
}
// 连接 a、b 两点的扁带子，宽面朝向 normal
function strap(parent, a, b, w, t, mat, normal = [0, 0, 1]) {
  const A = V3(...a), B = V3(...b), d = B.clone().sub(A), len = d.length();
  const m = add(parent, boxG(w, len, t, 0.015), mat);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  const y = d.normalize(), x = new THREE.Vector3().crossVectors(y, V3(...normal)).normalize(), z = new THREE.Vector3().crossVectors(x, y);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  return m;
}
// 垂下来的布条：fn(u, k) 返回 [dx, dy, dz]，u∈[-.5,.5] 横向，k∈[0,1] 从上到下
function clothStrip(w, h, fn, sx = 6, sy = 12) {
  const g = new THREE.PlaneGeometry(w, h, sx, sy), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), o = fn(x / w, 0.5 - y / h);
    p.setXYZ(i, x + (o[0] || 0), y + (o[1] || 0), o[2] || 0);
  }
  g.computeVertexNormals(); return g;
}
// 凹凸不平的小团（苔藓、布结）
function lumpG(r, amp = 0.18) {
  const g = new THREE.SphereGeometry(r, 16, 12), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.multiplyScalar(1 + amp * Math.sin(v.x * 9.1 / r + 1.3) * Math.sin(v.y * 7.7 / r + 4.1) * Math.sin(v.z * 8.3 / r + 2.2));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); return g;
}

// 头壳是一个“超椭球”（介于球和方盒之间的圆角形状）
const HEAD = { rx: 0.95, ry: 0.9, rz: 0.95, n: 3.2 };
function headR(dx, dy, dz) {   // 沿单位方向 (dx,dy,dz) 的半径
  const { rx, ry, rz, n } = HEAD;
  return Math.pow(Math.pow(Math.abs(dx / rx), n) + Math.pow(Math.abs(dy / ry), n) + Math.pow(Math.abs(dz / rz), n), -1 / n);
}
function headZ(x, y) {         // 脸部表面在 (x, y) 处的 z
  const { rx, ry, rz, n } = HEAD;
  return rz * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(x / rx), n) - Math.pow(Math.abs(y / ry), n)), 1 / n);
}

// ============================================================
//  头部：头壳、眼睛、耳朵、脖子、头巾
// ============================================================
M.black = new THREE.MeshStandardMaterial({ color: 0x1b1612, roughness: 1 });
M.hem = fabric(cloth('#b9a985'));

function buildHead(root) {
  const head = grp(root, 0, 8.7, 0.05);
  const { rx, ry, rz, n } = HEAD;

  // 头壳：把球面顶点推到超椭球面上，并写入解析法线
  const g = new THREE.SphereGeometry(1, 56, 40), p = g.attributes.position, nn = g.attributes.normal, N = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const R = headR(x, y, z); x *= R; y *= R; z *= R; p.setXYZ(i, x, y, z);
    N.set(Math.sign(x) * Math.pow(Math.abs(x / rx), n - 1) / rx,
          Math.sign(y) * Math.pow(Math.abs(y / ry), n - 1) / ry,
          Math.sign(z) * Math.pow(Math.abs(z / rz), n - 1) / rz).normalize();
    nn.setXYZ(i, N.x, N.y, N.z);
  }
  add(head, g, retile(M.shell, 2, 1));

  // 眼睛：深色金属圈 + 发光的橙色镜片
  const lensG = new THREE.CircleGeometry(0.155, 32), eyes = [];
  for (const s of [-1, 1]) {
    const ex = 0.37 * s, ey = 0.1, eye = grp(head, ex, ey, headZ(ex, ey) - 0.03);
    eye.rotation.y = s * 0.13;
    add(eye, cylG(0.27, 0.29, 0.1, 36), M.dark).rotation.x = Math.PI / 2;
    add(eye, new THREE.TorusGeometry(0.225, 0.024, 10, 36), M.brown, 0, 0, 0.05);
    add(eye, cylG(0.2, 0.2, 0.03, 32), M.black, 0, 0, 0.045).rotation.x = Math.PI / 2;
    add(eye, lensG, M.lens, 0, 0, 0.064).castShadow = false;
    const gl = glow(0xffa42a, 0.95, 0.42); gl.position.set(0, 0, 0.14); eye.add(gl); eyes.push(gl);
  }
  TICKS.push(t => { const o = 0.38 + 0.07 * Math.sin(t * 1.7); eyes.forEach(e => { e.material.opacity = o; }); });   // 眼睛微微呼吸

  // 嘴：一道小横缝；脸上的铆钉
  add(head, boxG(0.2, 0.036, 0.06, 0.01), M.black, 0, -0.43, headZ(0, -0.43) - 0.012);
  rivets(head, [[-0.72, 0.42], [0.72, 0.42], [-0.7, -0.52], [0.7, -0.52], [0, 0.6]].map(([x, y]) => [x, y, headZ(x, y) - 0.012]), M.brown, 0.9);

  // 耳朵：一圈套一圈的圆盘
  for (const s of [-1, 1]) {
    const ear = grp(head, s * 0.93, -0.36, 0.1); ear.rotation.z = Math.PI / 2;
    add(ear, cylG(0.33, 0.35, 0.16, 36), M.cream);
    add(ear, cylG(0.25, 0.25, 0.25, 36), M.dark);
    add(ear, cylG(0.17, 0.19, 0.31, 32), M.cream);
    add(ear, cylG(0.07, 0.07, 0.37, 16), M.dark);
  }

  // 脖子：几节金属环
  for (let i = 0; i < 4; i++) { const r = 0.21 - (i % 2) * 0.045; add(head, cylG(r, r, 0.13, 20), M.dark, 0, -0.93 - i * 0.13, -0.08); }
  add(head, cylG(0.32, 0.4, 0.12, 24), M.brown, 0, -1.43, -0.08);

  buildHood(head);
}

// 头巾：罩住头顶和后脑勺的布，正面留出脸，后面垂着一个松垮的尖兜
function buildHood(head) {
  const NA = 20, NH = 12, NU = NA + NH, NV = 72;
  const fHat = V3(0, 0.62, 0.78).normalize(), bHat = V3(0, 0.42, -0.9).normalize();
  const pos = [], uv = [], idx = [], rows = [], d = new THREE.Vector3();
  for (let i = 0; i <= NU; i++) {
    const up = i <= NA, th = up ? (i / NA) * Math.PI / 2 : Math.PI / 2, k = up ? 0 : (i - NA) / NH;
    // 脸部开口的半角：头顶闭合，往下迅速向两侧打开，到脖子处再收回来
    const open = up ? 1.75 * sstep(0.8, 1.3, th) : 1.75 + 0.2 * sstep(0, 0.4, k) - 0.75 * sstep(0.45, 1, k);
    const row = [];
    for (let j = 0; j <= NV; j++) {
      const ph = open + (j / NV) * (2 * Math.PI - 2 * open);
      d.set(Math.sin(ph) * Math.sin(th), Math.cos(th), Math.cos(ph) * Math.sin(th));
      const sag = Math.exp(-Math.pow(d.angleTo(bHat) / 0.62, 2)) * Math.pow(1 - k, 2.5);   // 后面的尖兜
      let R = headR(d.x, d.y, d.z) + 0.07 + 0.2 * sstep(0.55, 0.95, d.dot(fHat)) + 0.9 * sag
            + 0.025 * Math.sin(ph * 7 + th * 5) + 0.02 * Math.sin(th * 11 - ph * 3)
            + 0.07 * sag * Math.sin(ph * 6 + th * 4);                                       // 帽檐 + 褶皱
      R = R * (1 - 0.22 * k * k) + 0.05 * k * Math.sin(ph * 9);
      const v = d.clone().multiplyScalar(R); v.y -= 1.05 * k + 0.25 * sag * sag;
      row.push(v); pos.push(v.x, v.y, v.z); uv.push((v.z + 2.6) / 4, (v.y + 1.3) / 2.8);   // 贴图按侧视图平面投影
    }
    rows.push(row);
  }
  for (let i = 0; i < NU; i++) for (let j = 0; j < NV; j++) { const a = i * (NV + 1) + j, b = a + NV + 1; idx.push(a, b, a + 1, a + 1, b, b + 1); }
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g = mergeVertices(g, 1e-4); g.computeVertexNormals();

  // 贴图：米色粗布 + 斜着的绿色宽条 + 两处 X 形缝线
  const W = 1024, H = 716, px = z => (z + 2.6) / 4 * W, py = y => (1 - (y + 1.3) / 2.8) * H;
  const tex = cloth('#c6b793', { w: W, h: H, deco: c => {
    c.fillStyle = '#737c55'; c.beginPath();
    c.moveTo(px(0.12), py(1.5)); c.lineTo(px(0.72), py(1.5)); c.lineTo(px(-0.28), py(-1.3)); c.lineTo(px(-0.88), py(-1.3)); c.closePath(); c.fill();
    stitchX(c, px(-0.2), py(0.5), 40); stitchX(c, px(-0.47), py(-0.25), 40);
  } });
  add(head, g, fabric(tex));

  // 卷边
  const iF = rows.findIndex(r => r[0].distanceTo(r[NV]) > 1e-3) - 1, rim = [];
  for (let i = NU; i >= iF; i--) rim.push(rows[i][0]);
  for (let i = iF + 1; i <= NU; i++) rim.push(rows[i][NV]);
  add(head, tubeG(rim, 0.042, 140, 8), M.hem);
  add(head, tubeG(rows[NU], 0.038, 120, 8), M.hem);
}

// ============================================================
//  躯干：胸甲、背带、腰带、挎包、破布裙、围巾
// ============================================================
const CHEST = { y0: 5.395, h: 1.95, w: 1.7, d: 1.15, sx: 0.74, sz: 0.8 };
const chestK = y => (y - CHEST.y0) / CHEST.h;
const chestZ = y => CHEST.d / 2 * (CHEST.sz + (1 - CHEST.sz) * chestK(y));   // 胸甲正面在高度 y 处的 z
const chestX = y => CHEST.w / 2 * (CHEST.sx + (1 - CHEST.sx) * chestK(y));   // 胸甲侧面在高度 y 处的 x
M.leather2 = M.leather.clone(); M.leather2.color.set(0xb39c88);
M.brass = new THREE.MeshStandardMaterial({ color: 0x9a7b45, roughness: 0.45, metalness: 0.85 });

function buildTorso(root) {
  // 胸甲（上宽下窄），正面刷着两块绿色菱形
  const front = metal(wornPaint(C.cream, { deco: (g, s) => {
    const dia = (cx, cy, hw, hh) => { g.beginPath(); g.moveTo(cx, cy - hh); g.lineTo(cx + hw, cy); g.lineTo(cx, cy + hh); g.lineTo(cx - hw, cy); g.closePath(); g.fill(); };
    g.fillStyle = C.green; dia(s * 0.25, s * 0.22, s * 0.27, s * 0.3); dia(s * 0.75, s * 0.8, s * 0.27, s * 0.32);
  } }));
  const { y0, h, w, d, sx, sz } = CHEST, cy = y0 + h / 2;
  add(root, taper(boxG(w, h, d, 0.1), h, sx, sz), [M.cream, M.cream, M.cream, M.cream, front, M.cream], 0, cy, 0);
  add(root, boxG(w * sx + 0.06, 0.15, d * sz + 0.06, 0.03), M.brown, 0, y0 + 0.03, 0);       // 下沿的锈边
  add(root, cylG(0.42, 0.47, 0.1, 28), M.dark, 0, y0 + h + 0.03, -0.05);                      // 领口
  rivets(root, [[-0.68, 7.12], [0.68, 7.12], [-0.5, 5.66], [0.5, 5.66]].map(([x, y]) => [x, y, chestZ(y) + 0.005]));

  // 背包的两条肩带（皮革），右肩那条带个金属扣
  for (const s of [-1, 1]) {
    const x = s * 0.6, zt = chestZ(7.33) + 0.035;
    strap(root, [x, 7.34, zt], [x * 1.02, 5.95, chestZ(5.95) + 0.035], 0.2, 0.05, M.leather);
    strap(root, [x, 7.375, zt + 0.02], [x, 7.375, -0.62], 0.2, 0.05, M.leather, [0, 1, 0]);
    strap(root, [x, 7.36, -0.61], [x, 6.45, -0.79], 0.2, 0.05, M.leather, [0, 0, -1]);
  }
  add(root, boxG(0.3, 0.2, 0.05, 0.02), M.dark, -0.6, 6.85, chestZ(6.85) + 0.06);
  add(root, boxG(0.17, 0.08, 0.07, 0.02), M.leather2, -0.6, 6.85, chestZ(6.85) + 0.06);

  // 斜挎带：从左肩到右胯，下端挂着挎包
  strap(root, [0.42, 7.3, chestZ(7.3) + 0.075], [-0.66, 5.5, chestZ(5.5) + 0.075], 0.17, 0.045, M.leather2);
  add(root, new THREE.TorusGeometry(0.1, 0.024, 8, 20), M.dark, -0.6, 5.6, chestZ(5.6) + 0.11);

  // 腰带、骨盆
  add(root, cylG(1, 1, 0.24, 40), M.leather, 0, 5.3, 0).scale.set(0.68, 1, 0.52);
  add(root, boxG(0.22, 0.2, 0.06, 0.02), M.brass, 0.1, 5.3, 0.52);
  add(root, boxG(1.1, 0.6, 0.78, 0.16), M.cream, 0, 4.95, 0);

  // 挎包
  const pouch = grp(root, -0.52, 4.98, 0.56); pouch.rotation.set(0.1, -0.4, 0.05);
  add(pouch, boxG(0.52, 0.42, 0.24, 0.07), M.leather);
  add(pouch, boxG(0.56, 0.25, 0.28, 0.06), M.leather2, 0, 0.11, 0.005);
  add(pouch, sphG(0.035, 10, 8), M.brass, 0, 0.02, 0.15);
  for (const x of [-0.16, 0.16]) add(pouch, boxG(0.09, 0.26, 0.04, 0.01), M.leather2, x, 0.3, -0.07);

  // 破布裙：右前方长、左后方短，下摆撕得参差不齐
  const NS = 72, NR = 10, sp = [], su = [], si = [];
  for (let i = 0; i <= NR; i++) {
    const k = i / NR;
    for (let j = 0; j <= NS; j++) {
      const a = j / NS * Math.PI * 2;   // a = 0 在背后，π 在正前
      const len = 1.3 + 0.5 * Math.cos(a - 4.0) + 0.1 * Math.sin(a * 3 + 1);
      const fold = 1 + k * (0.06 * Math.sin(a * 11) + 0.04 * Math.sin(a * 5 + 2));
      sp.push(Math.sin(a) * (0.7 + 0.3 * k) * fold, 5.32 - len * k, -Math.cos(a) * (0.54 + 0.3 * k) * fold);
      su.push(j / NS * 3, 1 - k);
    }
  }
  for (let i = 0; i < NR; i++) for (let j = 0; j < NS; j++) { const a = i * (NS + 1) + j, b = a + NS + 1; si.push(a, a + 1, b, a + 1, b + 1, b); }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  sg.setAttribute('uv', new THREE.Float32BufferAttribute(su, 2));
  sg.setIndex(si); sg.computeVertexNormals();
  add(root, sg, M.skirt);

  // 围巾：绕脖子两圈 + 一个结 + 垂在左胸前的一截（带两道米色条纹和流苏）
  const scarfMat = retile(M.scarf, 7, 1);
  const ring = (rx, rz, y, r, ph) => {
    const SG = 96, RD = 16, pos = [], uv = [], idx = [];
    for (let i = 0; i <= SG; i++) {
      const a = i / SG * Math.PI * 2, ca = -Math.sin(a), sa = -Math.cos(a);   // 接缝放在背后
      const cx = ca * rx, cy = y + 0.05 * Math.sin(a * 2 + ph) - 0.1 * sa, cz = sa * rz - 0.04;
      for (let j = 0; j <= RD; j++) {
        const b = j / RD * Math.PI * 2;
        const q = r * (1 + 0.16 * Math.sin(a * 5 + ph) + 0.07 * Math.sin(a * 13 + b * 2 + ph) + 0.05 * Math.sin(b * 3 + a * 8));
        const ro = Math.cos(b) * q * 1.2;
        pos.push(cx + ca * ro, cy + Math.sin(b) * q * 0.9, cz + sa * ro); uv.push(i / SG, j / RD);
      }
    }
    for (let i = 0; i < SG; i++) for (let j = 0; j < RD; j++) { const p = i * (RD + 1) + j, q = p + RD + 1; idx.push(p, q, p + 1, p + 1, q, q + 1); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    add(root, g, scarfMat);
  };
  ring(0.6, 0.55, 7.6, 0.19, 1); ring(0.7, 0.63, 7.4, 0.2, 3);
  add(root, lumpG(0.21, 0.2), M.scarf, 0.4, 7.3, 0.6).scale.set(1, 0.85, 0.8);
  const tail = add(root, clothStrip(0.46, 1.25, (u, k) => {
    const y = 6.67 + (0.5 - k) * 1.25;
    return [0.07 * k, 0, chestZ(y) + 0.1 + 0.05 * k + 0.035 * Math.sin(k * 6 + u * 4)];
  }), M.scarfTail, 0.44, 6.67, 0);
  tail.rotation.z = -0.06;
}

// ============================================================
//  手臂与手（s = -1 右侧，+1 左侧；两边故意做得不对称）
// ============================================================
function buildHand(parent, s, plateMat) {
  const hand = grp(parent);
  add(hand, boxG(0.17, 0.4, 0.38, 0.05), plateMat, s * 0.03, -0.2, 0);   // 手背板
  add(hand, boxG(0.1, 0.34, 0.32, 0.03), M.dark, -s * 0.07, -0.2, 0);    // 手掌
  const seg = boxG(0.075, 0.2, 0.078, 0.02), tip = boxG(0.065, 0.17, 0.07, 0.02), kn = sphG(0.045, 10, 8);
  for (let i = 0; i < 4; i++) {                                          // 四根手指，各三节，自然微曲
    let p = grp(hand, -s * 0.02, -0.4, -0.135 + i * 0.09);
    const curl = -s * (0.18 + 0.05 * i);
    for (let j = 0; j < 3; j++) {
      const q = grp(p, 0, j ? -0.2 : 0, 0); q.rotation.z = curl * (j ? 1.3 : 0.6);
      add(q, kn, M.dark); add(q, j < 2 ? seg : tip, M.dark, 0, -0.1, 0); p = q;
    }
  }
  const th = grp(hand, -s * 0.05, -0.12, 0.2); th.rotation.set(-0.75, 0, -s * 0.35);   // 拇指
  add(th, kn, M.dark); add(th, seg, M.dark, 0, -0.1, 0);
  const t2 = grp(th, 0, -0.2, 0); t2.rotation.x = 0.4;
  add(t2, kn, M.dark); add(t2, tip, M.dark, 0, -0.09, 0);
  return hand;
}

function buildArms(root) {
  for (const s of [-1, 1]) {
    const right = s < 0, HP = Math.PI / 2;
    const sh = grp(root, s * 1.0, 7.0, 0); sh.rotation.set(right ? 0.17 : -0.2, 0, s * 0.1);   // 走路的姿势：右臂在后，左臂在前
    add(sh, sphG(0.25), M.dark);
    add(sh, cylG(0.2, 0.2, 0.16, 20), M.brown, s * 0.16, 0, 0).rotation.z = HP;

    if (right) {   // 右肩：五边形的米色护肩 + 米色上臂
      const pg = grp(sh, s * 0.36, 0.02, 0); pg.rotation.z = s * 0.22;
      add(pg, plateG([[-0.34, 0.32], [0.34, 0.32], [0.38, -0.08], [0, -0.5], [-0.38, -0.08]], 0.1, 0.025), M.cream).rotation.y = HP;
      rivets(pg, [[0.2, 0.22], [0.2, -0.22], [-0.33, 0]].map(([y, z]) => [s * 0.08, y, z]));
      add(sh, boxG(0.22, 0.95, 0.24, 0.05), M.cream, 0, -0.68, 0);
    } else {       // 左臂：裸露的锈铁骨架
      add(sh, cylG(0.09, 0.09, 1.0, 14), M.dark, 0, -0.68, 0);
      add(sh, cylG(0.04, 0.04, 0.9, 10), M.brown, 0, -0.68, 0.13);
      for (const y of [-0.35, -1.0]) add(sh, cylG(0.125, 0.125, 0.09, 16), M.orange, 0, y, 0);
    }

    const el = grp(sh, 0, -1.3, 0); el.rotation.x = right ? -0.14 : -0.1;   // 肘
    add(el, cylG(0.17, 0.17, 0.34, 20), M.dark).rotation.z = HP;
    add(el, cylG(0.09, 0.09, 0.4, 14), M.brown).rotation.z = HP;
    add(el, cylG(0.085, 0.085, 0.3, 12), M.dark, 0, -0.2, 0);

    if (right) {   // 右前臂：米色护臂，中间缠着布条
      add(el, taper(boxG(0.52, 1.0, 0.52, 0.07), 1.0, 0.86), M.cream, 0, -0.68, 0);
      for (let i = 0; i < 4; i++) add(el, boxG(0.555, 0.085, 0.555, 0.035), M.bandage, 0, -0.5 - i * 0.075, 0).rotation.set(rr(-0.07, 0.07), rr(-0.05, 0.05), rr(-0.08, 0.08));
      add(el, clothStrip(0.09, 0.3, (u, k) => [0.03 * k, 0, 0.03 * Math.sin(k * 5)], 2, 5), M.bandage, s * 0.3, -0.9, 0.1).rotation.y = s * HP;
    } else {       // 左前臂：绿色护臂
      add(el, boxG(0.56, 0.95, 0.56, 0.1), M.green, 0, -0.68, 0);
      add(el, boxG(0.6, 0.1, 0.6, 0.03), M.brown, 0, -1.12, 0);
      rivets(el, [[-0.2, -0.3], [0.2, -0.3], [-0.2, -0.98], [0.2, -0.98]].map(([z, y]) => [s * 0.285, y, z]));
    }
    add(el, cylG(0.11, 0.11, 0.16, 16), M.dark, 0, -1.25, 0);             // 手腕
    buildHand(el, s, right ? M.cream : M.dark).position.y = -1.3;
  }
}

// ============================================================
//  腿与脚
// ============================================================
function buildLegs(root) {
  for (const s of [-1, 1]) {
    const right = s < 0, HP = Math.PI / 2;
    // 迈步的姿势：右腿在后、左腿在前。两组角度算好了，让两只脚正好都踩在地面上
    const thighA = right ? 0.17 : -0.3, kneeA = right ? 0.09 : 0.188;
    const hip = grp(root, s * 0.5, 4.75, 0); hip.rotation.set(thighA, 0, s * 0.045);
    add(hip, sphG(0.23), M.cream);
    add(hip, cylG(0.14, 0.14, 0.5, 16), M.dark).rotation.z = HP;

    if (right) {   // 右大腿：深色金属杆 + 一根细活塞
      add(hip, cylG(0.095, 0.095, 1.6, 14), M.dark, 0, -0.95, 0);
      add(hip, cylG(0.04, 0.04, 1.3, 10), M.brown, 0, -0.95, -0.14);
      add(hip, cylG(0.13, 0.13, 0.1, 16), M.brown, 0, -0.45, 0);
    } else {       // 左大腿：橙锈色方杆 + 两道箍
      add(hip, boxG(0.22, 1.6, 0.24, 0.04), M.orange, 0, -0.95, 0);
      for (const y of [-0.5, -1.25]) add(hip, boxG(0.27, 0.11, 0.29, 0.02), M.brown, 0, y, 0);
    }

    const knee = grp(hip, 0, -1.85, 0); knee.rotation.x = kneeA;          // 膝盖：带齿的圆轴
    add(knee, cylG(0.21, 0.21, 0.36, 24), M.dark).rotation.z = HP;
    add(knee, cylG(0.12, 0.12, 0.46, 16), M.brown).rotation.z = HP;
    for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283; add(knee, boxG(0.37, 0.06, 0.06, 0.01), M.dark, 0, Math.cos(a) * 0.215, Math.sin(a) * 0.215).rotation.x = a; }

    if (right) {   // 右小腿：一大块米色胫甲，下方刷了个绿三角，脚踝系着粉色布条
      add(knee, cylG(0.085, 0.085, 1.9, 12), M.dark, 0, -1.0, -0.05);
      const fr = metal(wornPaint(C.cream, { deco: (g, z) => { g.fillStyle = C.green; g.beginPath(); g.moveTo(z * 0.12, z * 0.98); g.lineTo(z * 0.62, z * 0.98); g.lineTo(z * 0.3, z * 0.62); g.closePath(); g.fill(); } }));
      add(knee, taper(boxG(0.86, 2.0, 0.66, 0.08), 2.0, 0.7, 0.8), [M.cream, M.cream, M.cream, M.cream, fr, M.cream], 0, -1.02, 0.04);
      rivets(knee, [[-0.33, -0.15], [0.33, -0.15], [-0.24, -1.85], [0.24, -1.85]].map(([x, y]) => [x, y, 0.045 + 0.33 * (0.8 + 0.2 * (y + 2.02) / 2)]));
      const tie = retile(M.pink, 5, 1);
      for (const [y, ph] of [[-1.66, 0], [-1.79, 2]]) {
        const pts = [];
        for (let i = 0; i < 20; i++) {
          const a = i / 20 * 6.283, c = Math.cos(a), n = Math.sin(a);
          pts.push([0.36 * Math.sign(c) * Math.pow(Math.abs(c), 0.55), y + 0.025 * Math.sin(a * 3 + ph), 0.04 + 0.31 * Math.sign(n) * Math.pow(Math.abs(n), 0.55)]);
        }
        add(knee, tubeG(pts, 0.075, 60, 10, true), tie);
      }
      add(knee, lumpG(0.12, 0.25), M.pink, s * 0.42, -1.72, -0.12);
      for (const [dz, rz] of [[-0.2, 0.5], [-0.05, 0.9]])
        add(knee, clothStrip(0.15, 0.42, (u, k) => [0, 0, 0.04 * Math.sin(k * 5 + u * 3)], 2, 6), M.pink, s * 0.52, -1.9, -0.12 + dz).rotation.set(0, s * HP, s * rz * 0.6);
    } else {       // 左小腿：锈铁杆，外侧绑一块蓝灰铁片，脚踝是八边形的绿色护踝
      add(knee, boxG(0.19, 1.9, 0.22, 0.04), M.brown, 0, -1.0, 0);
      for (const y of [-0.42, -1.2]) add(knee, boxG(0.25, 0.12, 0.28, 0.02), M.orange, 0, y, 0);
      add(knee, boxG(0.08, 0.78, 0.44, 0.03), M.blue, s * 0.19, -0.62, 0.02).rotation.z = s * 0.05;
      for (const y of [-0.4, -0.85]) add(knee, boxG(0.34, 0.07, 0.3, 0.02), M.leather, s * 0.06, y, 0);
      const g8 = cylG(0.47, 0.4, 0.68, 8).toNonIndexed(); g8.computeVertexNormals();
      add(knee, g8, M.green, 0, -1.72, 0.02).rotation.y = Math.PI / 8;
      add(knee, cylG(0.42, 0.42, 0.08, 8), M.brown, 0, -2.06, 0.02).rotation.y = Math.PI / 8;
      rivets(knee, [[-0.17, -1.5], [0.17, -1.5]].map(([x, y]) => [x, y, 0.465]));
    }

    // 脚：侧面轮廓挤出的几块铁板（鞋底、鞋身、鞋头、后跟）
    const foot = grp(knee, 0, -2.05, 0), gy = -0.62;
    foot.quaternion.copy(hip.quaternion).multiply(knee.quaternion).invert();   // 抵消腿的倾斜，脚掌放平
    add(foot, sphG(0.17), M.dark);
    add(foot, profG([[-0.52, 0], [0.92, 0], [0.92, 0.1], [-0.52, 0.14]], 0.7), M.dark, 0, gy, 0);
    add(foot, profG([[-0.46, 0.12], [0.86, 0.1], [0.86, 0.26], [0.42, 0.5], [0.05, 0.6], [-0.4, 0.56], [-0.47, 0.3]], 0.58), M.brown, 0, gy, 0);
    add(foot, profG([[0.3, 0.1], [0.9, 0.1], [0.9, 0.3], [0.5, 0.53], [0.3, 0.56]], 0.64), right ? M.green : M.orange, 0, gy, 0);
    add(foot, profG([[-0.5, 0.14], [-0.12, 0.14], [-0.12, 0.6], [-0.44, 0.6], [-0.5, 0.4]], 0.63), right ? M.green : M.blue, 0, gy, 0);
    rivets(foot, [[0.42, 0.3], [0.78, 0.2], [-0.3, 0.42]].flatMap(([z, y]) => [[0.325, gy + y, z], [-0.325, gy + y, z]]));
  }
}

// ============================================================
//  背包：绿铁箱 + 玻璃罐里发光的小苗 + 藤蔓
// ============================================================
// 一片叶子：叶柄在原点，叶尖朝 +X，沿长度方向微微下弯
function leafG(len, wid, bend = 0.25) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.quadraticCurveTo(len * 0.35, wid, len, 0); s.quadraticCurveTo(len * 0.35, -wid, 0, 0);
  const g = new THREE.ShapeGeometry(s, 8), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); p.setXYZ(i, x, -bend * x * x / len + 0.5 * y * y / wid, y); }
  g.computeVertexNormals(); return g;
}

function buildBackpack(root) {
  const pk = grp(root, 0, 5.65, -1.63), W = 1.5, H = 1.8, D = 1.7;
  add(pk, boxG(0.95, 1.3, 0.4, 0.05), M.dark, 0, 0.1, D / 2 + 0.1);                 // 背架

  // 箱体：上半绿色，下半是颜色更深的一格，两道锈铁箍
  const dg = M.green.clone(); dg.color.set(0x9c8f76);
  add(pk, boxG(W, H, D, 0.08), M.green);
  add(pk, boxG(W + 0.05, 0.44, D + 0.05, 0.06), dg, 0, -0.7, 0);
  add(pk, boxG(W - 0.1, 0.08, D - 0.1, 0.03), M.brown, 0, H / 2 + 0.02, 0);
  for (const y of [0.76, -0.44]) {
    add(pk, boxG(W + 0.07, 0.15, D + 0.07, 0.03), M.brown, 0, y, 0);
    rivets(pk, [-0.45, 0, 0.45].flatMap(z => [[W / 2 + 0.04, y, z], [-W / 2 - 0.04, y, z]]));
    rivets(pk, [-0.6, -0.2, 0.2, 0.6].map(x => [x, y, -D / 2 - 0.04]));
  }
  for (const x of [-0.45, 0.45]) {                                                  // 背面的两条皮带
    strap(pk, [x, 0.92, -D / 2 - 0.06], [x, -0.92, -D / 2 - 0.06], 0.16, 0.04, M.leather, [0, 0, -1]);
    add(pk, boxG(0.22, 0.16, 0.05, 0.02), M.dark, x, 0.3, -D / 2 - 0.09);
  }
  // 搭在右侧的旧布（两道红条纹、破烂的下摆）和底下垂着的皮条
  add(pk, clothStrip(0.5, 1.45, (u, k) => [0, 0, 0.03 + 0.05 * k * Math.sin(k * 6 + u * 5)], 6, 14), M.packCloth, -W / 2 - 0.06, 0.12, -0.3).rotation.y = -Math.PI / 2;
  strap(pk, [-0.55, -0.9, -D / 2 - 0.03], [-0.58, -1.28, -D / 2 - 0.06], 0.1, 0.03, M.leather2, [0, 0, -1]);
  strap(pk, [-0.3, -0.9, -D / 2 - 0.03], [-0.27, -1.18, -D / 2 - 0.05], 0.08, 0.03, M.leather2, [0, 0, -1]);

  // 箱顶的苔藓
  for (let i = 0; i < 11; i++) {
    const a = i / 11 * 6.283 + rr(-0.2, 0.2);
    add(pk, lumpG(rr(0.14, 0.24), 0.3), M.moss, Math.cos(a) * rr(0.55, 0.66), H / 2 + 0.03, Math.sin(a) * rr(0.6, 0.74) - 0.05).scale.set(1.2, 0.45, 1.1);
  }

  // 玻璃罐：锈铁底座和盖子、提手、里面的土和小灯
  const jar = grp(pk, 0, H / 2, -0.15);
  add(jar, cylG(0.52, 0.56, 0.14, 32), M.brown, 0, 0.07, 0);
  add(jar, cylG(0.48, 0.48, 0.05, 32), M.dark, 0, 0.16, 0);
  add(jar, sphG(0.4, 20, 12), M.soil, 0, 0.2, 0).scale.y = 0.3;
  add(jar, cylG(0.45, 0.45, 1.0, 40, true), M.glass, 0, 0.68, 0).castShadow = false;
  add(jar, cylG(0.49, 0.49, 0.16, 32), M.brown, 0, 1.24, 0);
  add(jar, cylG(0.3, 0.36, 0.07, 24), M.dark, 0, 1.35, 0);
  add(jar, cylG(0.13, 0.13, 0.02, 20), M.lamp, 0, 1.155, 0).castShadow = false;
  const lamp = new THREE.PointLight(0xffd9a0, 1.8, 4, 2); lamp.position.set(0, 1.0, 0); jar.add(lamp);
  add(jar, tubeG([[-0.36, 1.3, 0], [-0.36, 1.55, 0], [-0.3, 1.68, 0], [-0.14, 1.73, 0], [0.14, 1.73, 0], [0.3, 1.68, 0], [0.36, 1.55, 0], [0.36, 1.3, 0]], 0.05, 48, 10), M.brown);
  for (const x of [-0.36, 0.36]) add(jar, cylG(0.075, 0.075, 0.09, 14), M.dark, x, 1.36, 0);

  // 小苗：一根茎、两大两小四片叶子，自己发着光，轻轻摇晃
  const sprout = grp(jar, 0, 0.27, 0); sprout.scale.setScalar(1.35);
  add(sprout, tubeG([[0, 0, 0], [0.03, 0.15, 0.01], [0, 0.32, 0]], 0.018, 12, 6), M.sprout);
  const big = leafG(0.3, 0.11, 0.3), small = leafG(0.18, 0.07, 0.2);
  for (const [geo, y, ry, tilt] of [[big, 0.32, 0.4, 0.5], [big, 0.32, 0.4 + Math.PI, 0.42], [small, 0.2, 2.0, 0.55], [small, 0.17, 2.0 + Math.PI, 0.6]]) {
    const h = grp(sprout, 0, y, 0); h.rotation.y = ry;
    const l = add(h, geo, M.sprout); l.rotation.z = tilt; l.castShadow = false;
  }
  TICKS.push(t => { sprout.rotation.z = 0.05 * Math.sin(t * 1.3); sprout.rotation.x = 0.035 * Math.sin(t * 0.9 + 1); });

  // 藤蔓：绕着罐子往上爬，顺着箱子的棱角垂下来
  const ivy = leafG(0.26, 0.12);
  const vine = (pts, n) => {
    const curve = new THREE.CatmullRomCurve3(pts.map(p => V3(...p)));
    add(pk, new THREE.TubeGeometry(curve, 48, 0.022, 6), M.vine);
    for (let i = 0; i < n; i++) {
      const h = new THREE.Group(); h.position.copy(curve.getPoint((i + rr(0.2, 0.8)) / n)); h.rotation.y = rr(0, 6.283); pk.add(h);
      const l = add(h, ivy, pick(M.leaves)); l.rotation.set(rr(-0.5, 0.5), 0, rr(-0.7, 0.35)); l.scale.setScalar(rr(0.7, 1.3));
    }
  };
  vine([[-0.7, 0.9, -0.8], [-0.6, 1.2, -0.62], [-0.52, 1.6, -0.5], [-0.3, 1.95, -0.6], [0.1, 2.15, -0.62], [0.45, 2.0, -0.45], [0.56, 1.6, -0.2], [0.5, 1.25, 0.15]], 15);
  vine([[-0.66, 0.95, -0.72], [-0.8, 0.6, -0.85], [-0.79, 0.1, -0.91], [-0.84, -0.4, -0.87], [-0.76, -0.95, -0.92], [-0.8, -1.3, -0.85]], 13);
  vine([[-0.3, 0.95, -0.8], [0.2, 1.0, -0.88], [0.66, 0.92, -0.85], [0.82, 0.5, -0.74], [0.79, 0, -0.78], [0.84, -0.45, -0.62]], 11);
  vine([[-0.75, 0.92, -0.4], [-0.81, 0.75, 0], [-0.8, 0.4, 0.25]], 5);
}

// ============================================================
//  把各部件装到一起
// ============================================================
function buildRobot() {
  const root = new THREE.Group(); root.name = 'ScavengerRobot';
  const parts = [
    typeof buildHead !== 'undefined' && buildHead,
    typeof buildTorso !== 'undefined' && buildTorso,
    typeof buildArms !== 'undefined' && buildArms,
    typeof buildLegs !== 'undefined' && buildLegs,
    typeof buildBackpack !== 'undefined' && buildBackpack,
  ];
  for (const f of parts) if (f) f(root);
  root.userData.tick = t => { for (const f of TICKS) f(t); };
  return root;
}

// ============================================================
//  组装 / 地面 / 动画 / 界面
// ============================================================
const robot = buildRobot();
scene.add(robot);
robot.position.y -= new THREE.Box3().setFromObject(robot).min.y;   // 脚底落在地面上

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ opacity: 0.33 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
{ // 脚下的柔和接触阴影
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 8, 128, 128, 128);
  gr.addColorStop(0, 'rgba(30,22,18,.5)'); gr.addColorStop(1, 'rgba(30,22,18,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(8, 8),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.set(0, 0.012, -0.5); scene.add(blob);
}

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  if (robot.userData.tick) robot.userData.tick(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

const $ = id => document.getElementById(id);
function setAuto(on) { controls.autoRotate = on; $('bAuto').classList.toggle('on', on); }
$('bAuto').onclick = () => setAuto(!controls.autoRotate);
$('bReset').onclick = () => { camera.position.copy(HOME.pos); controls.target.copy(HOME.tgt); };
canvas.addEventListener('pointerdown', () => setAuto(false));   // 用户一上手就停止自动旋转

// 导出为 GLB（可在 Blender、Windows 3D 查看器、macOS 预览等软件里打开）
async function exportGLB() {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const hidden = [];
  robot.traverse(o => { if (o.isSprite && o.visible) { o.visible = false; hidden.push(o); } });   // 光晕贴片不属于模型
  try { return await new GLTFExporter().parseAsync(robot, { binary: true, onlyVisible: true }); }
  finally { hidden.forEach(o => { o.visible = true; }); }
}
$('bGlb').onclick = async e => {
  const b = e.currentTarget, old = b.textContent;
  b.disabled = true; b.textContent = '导出中…';
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([await exportGLB()], { type: 'model/gltf-binary' }));
    a.download = 'robot.glb'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (err) { console.error(err); alert('导出失败：' + err.message); }
  b.textContent = old; b.disabled = false;
};
window.__glbSize = async () => (await exportGLB()).byteLength;   // 调试用：只测试导出，不保存文件

// 调试用：window.__view(方位角°, 俯仰角°, 距离, 目标高度)
window.__view = (az = -38, el = 3, dist = 28.5, ty = 5) => {
  setAuto(false);
  const a = az * Math.PI / 180, e = el * Math.PI / 180;
  controls.target.set(0, ty, -0.35);
  camera.position.set(Math.sin(a) * Math.cos(e) * dist, ty + Math.sin(e) * dist, Math.cos(a) * Math.cos(e) * dist);
  controls.update(); renderer.render(scene, camera);
};

window.__ready = true;
$('msg').remove();
frame();
</script>
