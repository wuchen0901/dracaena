<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071512">
  <title>The Last Light — a tiny playable story</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="The Last Light home"><span class="mark">✳</span> THE LAST LIGHT</a>
      <span class="chapter">A SMALL STORY · CHAPTER 01</span>
      <button class="reset" id="reset" type="button" title="Start over (R)">↺ <span>Restart</span></button>
    </header>
    <section class="stage-wrap" aria-label="Game scene">
      <canvas id="game" width="960" height="540" aria-label="Cinematic puzzle game. Use arrow keys to move, space to jump, and E to interact." tabindex="0"></canvas>
      <div class="letterbox top"></div><div class="letterbox bottom"></div>
      <div class="scene-title"><span>THE GREENHOUSE</span><i></i><span>01:17 AM</span></div>
      <div class="objective" id="objective"><span class="objective-dot"></span><span id="objective-text">Find the light</span></div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="win-screen" id="win-screen" aria-live="polite">
        <span class="eyebrow">CHAPTER COMPLETE</span>
        <h1>The light<br>found its way.</h1>
        <p>Somewhere beyond the glass, morning began.</p>
        <button id="again" type="button">Begin again <span>↗</span></button>
      </div>
    </section>
    <footer class="controls">
      <div class="instruction"><span class="keyset"><kbd>←</kbd><kbd>→</kbd></span><span>Move</span></div>
      <div class="instruction"><kbd class="wide">SPACE</kbd><span>Jump</span></div>
      <div class="instruction"><kbd class="wide">E</kbd><span>Interact</span></div>
      <div class="footnote"><span class="status-light"></span> A quiet little prototype</div>
    </footer>
    <div class="touch-controls" aria-label="Touch controls">
      <div><button data-key="ArrowLeft" aria-label="Move left">←</button><button data-key="ArrowRight" aria-label="Move right">→</button></div>
      <div><button data-key="Space" aria-label="Jump">↑</button><button data-key="KeyE" aria-label="Interact">E</button></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
