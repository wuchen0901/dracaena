const W=7, H=5, cell=(x,y)=>y*W+x, xOf=p=>p%W, yOf=p=>Math.floor(p/W);
const dist=(a,b)=>Math.abs(xOf(a)-xOf(b))+Math.abs(yOf(a)-yOf(b));
const moves={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const cycles={
  sweep:[0,1,1,0,0], wet:[1,1,0,0], track:[1,2,3,4,0], spin:[1,2,3,0],
  reach:[1,2,3,0,0,0], dash:[0,0,3,0], wind:[3,2,0,0,0],
  backwind:[0,0,0,2,3], fly:[0,1,3,3,0,0], brace:[0,1,0,1],
  mouth:[0,0,1,0], blink:[0,0,3,0,0], step:[0,0,2,0]
};
const lureModes=['bait','sound','leap'], gazeModes=['watch','still'];
const circuitModes=['flow','double'], echoModes=['mirror','echo'];
function geometry(r){
  const row=r.row, gate=cell(3,row), plate=cell(r.mode==='echo'?3:4,row);
  let lever=cell(5,row);
  if(['patrol','raft','mouth','brace','step'].includes(r.mode)) lever=cell(2,row);
  if(circuitModes.includes(r.mode)) lever=cell(2,1);
  if(echoModes.includes(r.mode)) lever=cell(2,row);
  return {gate,plate,lever,second:cell(4,3),exit:cell(6,2)};
}
function initial(r){
  return {p:cell(0,2),m:cell(5,r.row),t:0,armed:-1,charge:0,done:false,won:false,previous:cell(0,2),hits:0};
}
function blocked(r,p){
  if(xOf(p)===3 && yOf(p)!==r.row) return true;
  return (xOf(p)===1 && yOf(p)===(r.row===1?3:0)) || (xOf(p)===5 && yOf(p)===(r.row===3?1:4));
}
function patrol(r,t){return cell(4,[1,2,3,2][t%4])}
// Each moving obstacle has its own call, sweep and recovery beats.
const rhythms={
  towel:[1,0,0,0,1], chair:[1,1,0,0,0], laundry:[1,2,3,4,3,2,1,0],
  sack:[1,3,2,4,0], nightie:[0,1,2,3,0,4], qu1:[1,2,3,4,0,0],
  q4dust:[4,3,2,1,0,0], pj:[0,4,0,1,2], gr1:[1,2,3,4,3,2,0],
  wp2:[4,0,3,0,2,0,1], street:[4,3,2,1,0], zsh:[1,1,1,0,0,0],
  qu3:[0,0,1,0,1], mp1:[1,1,0,0], shdc:[0,1,1,0],
  qu4:[1,1,2,3,0,0,0], ta2:[0,3,0,2,0,0,0], hk1:[1,2,2,3,0,0,0],
  sg2:[0,0,0,3], ta1:[0,0,0,3,3,0], hk2:[3,0,0,0,0],
  nr1:[0,3,2,0,0], fw1:[2,3,3,0,0,0], mp2:[0,2,3,0,0],
  mp3:[0,2,3,0,0], tall:[3,0,0,0,3,0]
};
function rhythm(r){return rhythms[r.id]||cycles[r.mode]}
function danger(r,s){
  if(s.done)return [];
  if((r.mode==='shadow'||r.id==='bell') && s.t%4===3)return [s.previous,s.p];
  if(lureModes.includes(r.mode))return s.armed>=0?[s.armed]:[];
  const seq=rhythm(r); if(!seq)return [];
  const phase=seq[s.t%seq.length], row=r.row, pos=x=>cell(x,row);
  if(!phase)return [];
  if(r.mode==='track')return [pos(phase+1)];
  if(r.id==='towel'||r.id==='shdc')return [pos(3),cell(4,row),cell(4,r.id==='towel'?row+1:row-1)];
  if(r.mode==='spin')return [pos(2+phase),cell(4,(row+phase)%H)];
  if(r.mode==='reach')return Array.from({length:phase},(_,i)=>pos(4-i));
  if(r.mode==='fly' && phase===1)return [pos(5)];
  if(['sweep','wet','wind','backwind','blink','dash','fly'].includes(r.mode))return phase===2?[pos(3),pos(4)]:[pos(3),pos(4),pos(5)];

}
function approachCell(r,m,p){
  const queue=[m],first=new Map([[m,m]]);
  for(let i=0;i<queue.length;i++){
    const from=queue[i];if(from===p)return first.get(from);
    for(const [dx,dy] of Object.values(moves)){
      const x=xOf(from)+dx,y=yOf(from)+dy,n=cell(x,y);
      if(x<0||x>=W||y<0||y>=H||blocked(r,n)||first.has(n))continue;
      first.set(n,from===m?n:first.get(from));queue.push(n);
    }
  }
  return m;
}
function instructions(r){
  const g=r.gear;
  if(r.mode==='shadow')return '它每四拍从脚下和刚走过的阴影探出。离开斜纹，到✧打开岸灯。';
  if(lureModes.includes(r.mode))return r.mode==='leap'?'站上◇让它锁定落点，下一拍走开，让它砸中机关。':'在◇上按「引诱」，下一拍走开，让怪物冲进机关。';
  if(gazeModes.includes(r.mode))return (r.mode==='watch'?'按「背身」':'原地等一拍')+'会让它向你走一步。把它引到◇，在它站上去时按操作。';
  if(echoModes.includes(r.mode))return r.mode==='mirror'?'它沿房间中线反向移动。站到✧，让它在对面的◇同时扳开关。':'它重演你上一拍的位置。先踩◇，走到相邻的✧，马上按操作。';
  if(circuitModes.includes(r.mode))return r.mode==='double'?'先在✧启动大灯，再到◇转检修镜，用两束光封住阴影。':'到✧放出第一股光，再到◇操作，让它退到尽头。';
  if(r.mode==='guide')return '靠近衣服按「递灯」，带它走到◇。每走一步，它跟一步。';
  if(r.mode==='patrol'||r.mode==='raft')return '走到✧，等'+(r.mode==='raft'?'渡板':'怪物')+'到◇的那一拍，按「'+g+'」。';
  if(r.mode==='mouth')return '在✧等它露出破绽，出现「现在动手」时操作'+g+'。';
  if(r.mode==='brace')return '到✧连续操作两拍，让光一直照着它。';
  if(r.mode==='step')return '在✧照倒柜子，再站上倒下的柜子✧，扳高处的信号杆。';
  return '避开下一拍的斜纹，走到✧操作'+g+'，再到右侧出口。';
}
function step(r,old,key){

  const use=key==='use', at=s.p===g.lever;
  if(!s.done){
    if(lureModes.includes(mode)){
      if(s.armed>=0){s.m=s.armed;if(s.p!==s.armed && s.armed===g.plate)s.done=true;s.armed=-1}
      else if((mode==='leap'&&dist(s.m,s.p)<=2)||(use&&mode!=='leap')){s.armed=s.p;s.note='它锁定了这里，快离开！'}
    }else if(gazeModes.includes(mode)){
      if(use && s.m===g.plate)s.done=true;
      else if(mode==='watch'?use:was===s.p)s.m=approachCell(r,s.m,s.p);
    }else if(echoModes.includes(mode)){
      if(use && at && s.m===g.plate)s.done=true;
      s.m=mode==='mirror'?cell(6-xOf(s.p),yOf(s.p)):was;
    }else if(circuitModes.includes(mode)){
      if(use&&at&&!s.charge){s.charge=1;s.m=g.plate;s.note='第一束已就位，去◇。'}
      else if(use&&s.charge&&s.p===g.second)s.done=true;
    }else if(mode==='guide'){
      if(use&&dist(s.p,s.m)<=1)s.charge=1;
      if(s.charge){s.m=approachCell(r,s.m,was);if(s.m===g.plate)s.done=true}
    }else if(mode==='patrol'||mode==='raft'){
      if(use&&at&&patrol(r,s.t)===g.plate)s.done=true;
      s.m=patrol(r,s.t+1);
    }else if(mode==='step'){
      if(use&&at&&!s.charge){s.charge=1;s.m=g.plate;s.note='矮柜露出柜面了。'}
      else if(use&&s.charge&&s.p===g.plate)s.done=true;
    }else if(mode==='brace'){
      s.charge=use&&at?s.charge+1:0;if(s.charge===2)s.done=true;
    }else if(use&&at && (mode!=='mouth'||s.t%4===2))s.done=true;
    if(!s.done && (danger(r,old).includes(s.p)||gazeModes.includes(mode)&&s.m===s.p)){
      return {...initial(r),hits:s.hits+1,note:'被截住了，回到门口。再看一遍预兆。'};
    }
    if(!s.done && use && !s.note)s.note=at?'机关还没响应。':'观察地上的标记。';
    if(s.done)s.note='机关接通。';
  }
  s.previous=was;s.t++;s.won=s.done&&s.p===g.exit;
  return s;
}
const $=id=>document.getElementById(id);
const rooms=$('rooms'), board=$('board');
let completed;
try{completed=new Set(JSON.parse(localStorage.getItem('house.trials.v1')||'[]'))}catch{completed=new Set()}
let r,s,idx;
function selectRoom(index){
  idx=index;r=levels[index];s=initial(r);
  if(['patrol','raft'].includes(r.mode))s.m=patrol(r,0);
  rooms.value=index;
  history.replaceState(null,'','#'+r.id);
  $('chapter').textContent='第 '+r.level+' 关 · 怪物试炼';
  $('room').textContent=r.place;$('name').textContent=r.name;$('trait').textContent=r.trait;
  const art=portraits[r.art];$('portrait').hidden=!art;board.style.setProperty('--scene',art?'url('+art+')':'none');if(art)$('portrait').src=art;else $('portrait').removeAttribute('src');
  $('goal').textContent=instructions(r);
  render();
}
function render(){
  const g=geometry(r), hazard=danger(r,s),mode=r.mode;
  const mark=circuitModes.includes(mode)?g.second:g.plate;
  const showPlate=lureModes.includes(mode)||gazeModes.includes(mode)||echoModes.includes(mode)||circuitModes.includes(mode)||['guide','patrol','raft'].includes(mode);
  const lever=mode==='step'&&s.charge?g.plate:g.lever;
  const hasLever=!lureModes.includes(mode)&&!gazeModes.includes(mode)&&mode!=='guide';
  let monster=s.m;
  if(['track','spin','wind','backwind','sweep','fly','dash','reach','wet','blink'].includes(mode) && hazard.length)monster=hazard[hazard.length-1];
  if(['patrol','raft'].includes(mode))monster=patrol(r,s.t);
  if(mode==='shadow'&&s.t)monster=s.previous;
  board.replaceChildren();
  for(let p=0;p<W*H;p++){
    const el=document.createElement('div');el.className='tile';
    if(blocked(r,p))el.classList.add('wall');
    if(hazard.includes(p))el.classList.add('warn');
    const glyph=p===g.exit?(s.done?'⇥':'▥'):s.done?'':hasLever&&p===lever?'✧':showPlate&&p===mark?'◇':'';
    if(glyph){const label=document.createElement('span');label.className='mark';label.textContent=glyph;el.append(label)}
    if(!s.done && p===monster){
      const token=document.createElement('span');token.className='piece foe';
      if(p===s.p)token.classList.add('together');
      const art=portraits[r.art];if(art)token.style.backgroundImage='url('+art+')';else token.textContent='影';
      token.title=r.name;el.append(token);
    }
    if(p===s.p){const hero=document.createElement('span');hero.className='piece hero';hero.textContent='人';el.append(hero)}
    board.append(el);
  }
  $('turn').textContent='第 '+(s.t+1)+' 拍';
  const cue=mode==='mouth'&&s.t%4===2?'现在动手，破绽露出来了。':mode==='brace'&&s.charge?'继续照住它，再一拍。':s.armed>=0?'它正瞄准斜纹格。':hazard.length?'斜纹格下一拍会被扫到。':'';
  $('status').textContent=s.won?'已通过 · '+(idx===levels.length-1?'可以从遭遇列表重玩。':'可以前往下一间。'):[s.note,s.done?'出口已经打开。':cue].filter(Boolean).join(' ');
  $('use').textContent=gazeModes.includes(mode)?(s.m===g.plate?'点灯':mode==='watch'?'背身':'点灯'):lureModes.includes(mode)?(mode==='leap'?'等起跳':'引诱'):mode==='guide'?'递灯':mode==='step'&&s.charge?'扳信号杆':r.gear;
  $('next').hidden=!s.won||idx===levels.length-1;
  $('progress').textContent=completed.size+' / '+levels.length+' 间';
}
function act(key){
  s=step(r,s,key);
  if(s.won){
    completed.add(r.id);rooms.options[idx].textContent='✓ '+r.level+' · '+r.name;
    try{localStorage.setItem('house.trials.v1',JSON.stringify([...completed]))}catch{}
  }
  render();
}
for(const [i,level] of levels.entries()){
  rooms.add(new Option((completed.has(level.id)?'✓ ':'')+level.level+' · '+level.name,i));
}
rooms.onchange=()=>selectRoom(Number(rooms.value));
$('reset').onclick=()=>selectRoom(idx);$('next').onclick=()=>selectRoom(idx+1);
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>act(b.dataset.key));
document.addEventListener('keydown',e=>{
  if(e.target===rooms||e.altKey||e.ctrlKey||e.metaKey)return;
  const key={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',' ':'use','.':'wait'}[e.key];
  if(key && !(e.key===' '&&e.target.tagName==='BUTTON')){e.preventDefault();if(!e.repeat)act(key)}
});
selectRoom(Math.max(0,levels.findIndex(l=>l.id===location.hash.slice(1))));
</script></html>
