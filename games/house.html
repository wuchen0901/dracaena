<title>夜里的房子</title>
<style>
html,body{margin:0;height:100%;background:#06080e;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

<body>
<canvas id="c"></canvas>

<!-- 规则：“东西在哪儿、点了什么会怎样、哪个影子敢过去”都在这一段，不碰页面。tools/check.mjs 直接拿这一段去搜：解得开、没有死路 -->
<script id="core">
// 一栋夜里的房子：楼上卧室 → 浴室 → 楼梯 → 门厅（楼下停电）→ 客厅 → 厨房 → 地下室（来电）→ 回到门厅出门。
// （2026-11-18 起，“影子”是灌了墨的空衣服；衣服会追人在页面里，不在规则里）
// （萤火虫：几只困在厨房窗玻璃上，够不着。2026-11-19 主人说用罐子装着有点多此一举，改成：拿着冰箱里的蜂蜜（揭开布、插着蜂蜜棒）去引，
//   它们飞下来围着蜂蜜罐，跟着孩子走，lit 就是“萤火虫跟着蜂蜜”。以前是把蜂蜜放到窗下台面上、拿玻璃罐（candle）一扣）
// 规则只管“东西在哪儿、灯开没开、哪个影子敢过去”；孩子走到哪儿不算在里面：隔着影子的地方走不到，别的都走得到。
const ITEMS = ['slipper', 'log', 'fuse', 'honey', 'bulb', 'crank', 'key'];
const START = {
  plug: 0, slipper: 'bed',                                  // 卧室：床头灯的插头插没插上；拖鞋在床边 / 身上 / 卡在浴室门底下（door）
  hamper: 0, bath: 0,                                       // 浴室：脏衣篓推到灯绳底下没有；灯开没开
  log: 'basket', damper: 0, side: 0, fuse: 'side',          // 客厅：柴在筐里 / 身上 / 壁炉里（fire）；风门开没开；抽屉开没开；保险丝在抽屉里 / 身上 / 保险丝盒里（box）
  chair: 0, fridge: 0, lit: 0, hatch: 0,                    // 厨房：椅子顶没顶住冰箱门；冰箱门开没开；萤火虫跟着蜂蜜没有；地窖口开没开
  honey: 'fridge',                                          // 蜂蜜在冰箱里 / 身上（拿在手里）/ 放在保险丝盒旁边的小搁板上（box）
  drawer: 0, bulb: 'drawer', clock: 0, crank: 'clock', lamp: 0, key: 'stand', door: 0, out: 0,   // 门厅：和一屏的门厅一样
};
const has = (s, it) => s[it] === 'inv';
const power = s => s.fuse === 'box';                        // 楼下来电了
const fireOn = s => s.log === 'fire' && s.damper === 1;     // 壁炉的火稳住了（有柴、风门开着）
const hallLit = s => s.bulb === 'lamp' && power(s);         // 门厅的吊灯亮着
const candleLight = s => s.lit === 1 && s.honey === 'inv'; // 手里拿着蜂蜜，萤火虫围着它飞（名字还叫 candle：以前是蜡烛、罐子）
// 萤火虫恋着厨房的窗：拿着蜂蜜走得离窗太远（页面里量，差不多到门厅门口），它们就丢下蜂蜜，一路飞回窗上（2026-11-19 主人说拿着罐子等于无敌了），
// 要回窗下再拿蜂蜜引一次。要用萤火虫的几处（客厅、厨房、地下室一直到保险丝盒）都在这个范围里。这不是点出来的，求解器不搜
const fliesLeave = s => s.lit === 1 && s.honey === 'inv' ? { s: { ...s, lit: 0 }, ev: ['fliesHome'] } : null;
// 影子：照到了才敢过去。地窖口也算一道：底下一点光都没有，不举着蜡烛（或者没来电）不敢下去
const GATES = {
  gown: s => s.plug === 1,                                  // 卧室门边：睡袍
  towel: s => s.bath === 1,                                 // 浴室：浴巾
  laundry: s => s.bath === 1 && s.slipper === 'door',       // 楼梯口：一堆脏衣服（浴室的光从卡住的门里漏出来）
  stand: s => hallLit(s) && s.lamp === 1,                   // 门厅：衣帽架（吊灯亮着、升上去了）
  chair: s => fireOn(s) || candleLight(s) || power(s),     // 客厅：扶手椅上的毯子（火稳住了；手里的蜡烛、来电以后的灯也照得到它）
  sack: s => (s.chair === 1 && s.fridge === 1) || candleLight(s) || power(s),   // 厨房：桌子底下的一袋土豆（冰箱门被椅子顶着开着）
  cellar: s => s.hatch === 1 && (candleLight(s) || power(s)),
  boiler: s => candleLight(s) || power(s),                  // 地下室：锅炉
};
// 房子分成几块，块和块之间隔着一道“门”（GATES 里的一个）。[这一块, 那一块, 隔着什么]，两个方向都一样
const LINKS = [['bed', 'bath', 'gown'], ['bath', 'landing', 'towel'], ['landing', 'hall', 'laundry'], ['hall', 'exit', 'stand'], ['hall', 'parlour', null],
  ['parlour', 'back', 'chair'], ['back', 'pantry', 'sack'], ['pantry', 'cellar', 'cellar'], ['cellar', 'fusebox', 'boiler']];
function reach(s) {
  const r = new Set(['bed']); let grew = true;
  while (grew) { grew = false; for (const [a, b, g] of LINKS) if ((!g || GATES[g](s)) && r.has(a) !== r.has(b)) { r.add(a); r.add(b); grew = true; } }
  return r;
}
// 能点的东西在哪一块
const SPOT_ZONE = {
  plug: 'bed', slipper: 'bed', bedlamp: 'bed',
  hamper: 'bath', cord: 'bath', bathdoor: 'landing',
  hdrawer: 'hall', hbulb: 'hall', hclock: 'hall', hcrank: 'hall', hlamp: 'hall', winch: 'hall', stand: 'exit', door: 'exit',
  basket: 'parlour', fire: 'parlour', damper: 'parlour',
  side: 'back', fuse: 'back', chair: 'back', fridge: 'back', honey: 'back',
  flies: 'pantry', hatch: 'pantry',
  fusebox: 'fusebox',
};
const SPOTS = Object.keys(SPOT_ZONE);
// 点一下 spot（手里拿着 held，没拿是 null）。成了返回 { s, ev }，不成返回 { fail }：
//   far 走不到（隔着影子），no 这样用不行，look 只是看看，其余的 fail 是告诉玩家差什么
function act(s, spot, held, R = reach(s)) {
  const no = fail => ({ fail });
  if (s.out) return no('done');
  if (held && !has(s, held)) return no('no');
  if (!R.has(SPOT_ZONE[spot])) return no('far');
  const n = { ...s }, ok = (...ev) => ({ s: n, ev });
  switch (spot) {
    // 卧室
    case 'plug': if (held) return no('no'); if (s.plug) return no('look'); n.plug = 1; return ok('plugIn');
    case 'bedlamp': if (held) return no('no'); return no(s.plug ? 'look' : 'unplugged');
    case 'slipper': if (held || s.slipper !== 'bed') return no('no'); n.slipper = 'inv'; return ok('take:slipper');
    // 浴室
    case 'hamper': if (held) return no('no'); n.hamper = 1 - s.hamper; return ok(n.hamper ? 'pushIn' : 'pushOut');
    case 'cord': if (held) return no('no'); if (!s.hamper) return no('tooHigh'); n.bath = 1 - s.bath; return ok('pull', n.bath ? 'bathOn' : 'bathOff');
    case 'bathdoor':
      if (held === 'slipper') { n.slipper = 'door'; return ok('wedge'); }
      if (held) return no('no');
      if (s.slipper === 'door') { n.slipper = 'inv'; return ok('take:slipper', 'unwedge'); }
      return no('swingsShut');
    // 门厅
    // 抽屉、钟门、柜子、冰箱开了就开着，再点不会关上（2026-11-18 主人说常常想拿里面的东西，结果把它又关上了；关上也没有用）
    case 'hdrawer': if (held) return no('no'); if (s.drawer) return no('look'); n.drawer = 1; return ok('drawerOpen');
    case 'hbulb': if (held || !s.drawer || s.bulb !== 'drawer') return no('no'); n.bulb = 'inv'; return ok('take:bulb');
    case 'hclock': if (held) return no('no'); if (s.clock) return no('look'); n.clock = 1; return ok('clockOpen');
    case 'hcrank': if (held || !s.clock || s.crank !== 'clock') return no('no'); n.crank = 'inv'; return ok('take:crank');
    case 'hlamp':
      if (held === 'bulb') { if (s.lamp) return no('high'); n.bulb = 'lamp'; return ok(power(s) ? 'bulbIn' : 'bulbInDark'); }
      if (held) return no('no');
      return no(s.bulb !== 'lamp' ? 'nobulb' : power(s) ? 'look' : 'nopower');
    case 'winch':
      if (held === 'crank') { n.crank = 'winch'; n.lamp = 1 - s.lamp; return ok('crankOn', n.lamp ? 'raise' : 'lower'); }
      if (held) return no('no');
      if (s.crank !== 'winch') return no('nocrank');
      n.lamp = 1 - s.lamp; return ok(n.lamp ? 'raise' : 'lower');
    case 'stand': if (held) return no('no'); if (s.key !== 'stand') return no('look'); n.key = 'inv'; return ok('take:key');
    case 'door':
      if (held === 'key') { n.key = 'used'; n.door = 1; n.out = 1; return ok('unlock', 'exit'); }
      if (held) return no('no');
      return no('locked');
    // 客厅
    case 'basket': if (held || s.log !== 'basket') return no('no'); n.log = 'inv'; return ok('take:log');
    case 'fire':
      if (held === 'log') { n.log = 'fire'; return ok('logIn'); }
      if (held) return no('no');
      return no(s.log !== 'fire' ? 'needLog' : s.damper ? 'look' : 'smoky');
    case 'damper': if (held) return no('no'); n.damper = 1 - s.damper; return ok(n.damper ? 'damperOpen' : 'damperShut');
    case 'side': if (held) return no('no'); if (s.side) return no('look'); n.side = 1; return ok('sideOpen');
    case 'fuse': if (held || !s.side || s.fuse !== 'side') return no('no'); n.fuse = 'inv'; return ok('take:fuse');
    // 厨房
    case 'chair': if (held) return no('no'); n.chair = 1 - s.chair; if (!n.chair) n.fridge = 0; return ok(n.chair ? 'chairIn' : 'chairOut');
    case 'fridge': if (held) return no('no'); if (!s.chair) return no('fridgeShuts'); if (s.fridge) return no('look'); n.fridge = 1; return ok('fridgeOpen');   // 椅子顶着的门关不上；椅子拉开了门才关
    case 'honey': if (held || !s.fridge || s.honey !== 'fridge') return no('no'); n.honey = 'inv'; return ok('take:honey');
    // 窗玻璃上的萤火虫：够不着，空着手伸过去就飞散；举着蜂蜜过去，它们飞下来围着蜂蜜罐，从此跟着走
    case 'flies':
      if (s.lit) return no('look');
      if (held === 'honey') { n.lit = 1; return ok('lure'); }
      if (held) return no('no');
      return no('flee');
    case 'hatch': if (held) return no('no'); n.hatch = 1 - s.hatch; return ok(n.hatch ? 'hatchOpen' : 'hatchShut');
    // 地下室：换保险丝要两只手，蜂蜜先放在旁边的小搁板上（萤火虫跟着它）
    case 'fusebox':
      if (held === 'fuse') { n.fuse = 'box'; if (s.honey === 'inv') n.honey = 'box'; return ok('fuseIn', 'powerOn'); }
      if (held) return no('no');
      return no(power(s) ? 'look' : 'blown');
  }
  return no('no');
}
const KEYS = Object.keys(START);
// 每一项能是哪几个值（没写的都是 0 / 1）。搜的时候一个局面编成一个数（每一项三选一，按三进制拼起来），比拼字符串快得多
const VALUES = { slipper: ['bed', 'inv', 'door'], log: ['basket', 'inv', 'fire'], fuse: ['side', 'inv', 'box'], honey: ['fridge', 'inv', 'box'], bulb: ['drawer', 'inv', 'lamp'], crank: ['clock', 'inv', 'winch'], key: ['stand', 'inv', 'used'] };
const VIDX = KEYS.map(k => new Map((VALUES[k] || [0, 1]).map((v, i) => [v, i])));
const skey = s => { let n = 0; for (let i = 0; i < KEYS.length; i++) n = n * 3 + VIDX[i].get(s[KEYS[i]]); return n; };
function moves(s) {
  const out = [], R = reach(s), hand = [null, ...ITEMS.filter(it => has(s, it))];
  for (const spot of SPOTS) { if (!R.has(SPOT_ZONE[spot])) continue; for (const held of hand) { const r = act(s, spot, held, R); if (r.s) out.push({ spot, held, s: r.s }); } }
  return out;
}
// 从 from 开始一层一层往外搜：最短的点法、搜到几个局面；full 的时候搜完整个局面、再数几个死路（从它出发再也走不出去）
function solve(from = START, allow = () => true, full = false) {
  const k0 = skey(from), prev = new Map([[k0, null]]), q = [from], qk = [k0];   // prev：从哪个局面、点了什么过来的
  let goal = null;
  for (let h = 0; h < q.length; h++) {
    const s = q[h], ks = qk[h];
    if (s.out) { if (goal == null) goal = ks; if (!full) break; continue; }
    for (const m of moves(s)) {
      if (!allow(m)) continue;
      const k = skey(m.s); if (prev.has(k)) continue;
      prev.set(k, [ks, m.spot, m.held]); q.push(m.s); qk.push(k);
    }
  }
  const path = [];
  for (let k = goal; k != null && prev.get(k); k = prev.get(k)[0]) { const [, spot, held] = prev.get(k); path.unshift({ spot, held }); }
  if (!full) return { path: goal != null ? path : null, states: prev.size, dead: -1 };
  const canWin = new Set(); let grew = true;
  const succ = new Map(); q.forEach((s, i) => { if (s.out) canWin.add(qk[i]); succ.set(qk[i], s.out ? [] : moves(s).filter(allow).map(m => skey(m.s))); });
  while (grew) { grew = false; for (const k of qk) { if (canWin.has(k)) continue; if (succ.get(k).some(x => canWin.has(x))) { canWin.add(k); grew = true; } } }
  return { path: goal != null ? path : null, states: prev.size, dead: prev.size - canWin.size };
}

// ---------- 一关一段 ----------
// 2026-11-20 起有第 2 关。规矩是“每关的东西在这一关里拿、这一关里用完，规则一关一段，求解器一关一关地搜”（docs/night-rules.md）：
// 每关自己的一组 START / ITEMS / VALUES / GATES / LINKS / SPOT_ZONE / act，包成一个 L；下面这几个函数和上面的 reach / moves / solve
// 一模一样，只是多一个 L。第 1 关上面那一套一个字没动（页面、存档、check.mjs 的那一行都靠它），L1 只是把它包起来。
// 页面上只有一个并起来的局面 S = { ...START, ...START2, ...START3, ...START4 }：每关求解只编自己那几项，所以名字（项、点、东西、门、事件）全游戏不能重。
// ENTRY 是这一关进门的那一块；GOAL 是这一关走出去了的那一项；TIMED 是不是点出来、到时候自己变的（萤火虫飞走、车轮停下），
// 求解器不搜它，check.mjs 另外查：变过去以后也走得出去
function mkLevel(L) {
  L.KEYS = Object.keys(L.START); L.SPOTS = Object.keys(L.SPOT_ZONE);
  L.VIDX = L.KEYS.map(k => new Map((L.VALUES[k] || [0, 1]).map((v, i) => [v, i])));
  L.skey = s => { let n = 0; for (let i = 0; i < L.KEYS.length; i++) n = n * 3 + L.VIDX[i].get(s[L.KEYS[i]]); return n; };
  return L;
}
function reachL(L, s, extra = []) {   // extra：孩子现在站着的那几块（提示用：他已经过了会自己关上的门，不用再回头去开）
  const r = new Set([L.ENTRY, ...extra]); let grew = true;
  while (grew) { grew = false; for (const [a, b, g] of L.LINKS) if ((!g || L.GATES[g](s)) && r.has(a) !== r.has(b)) { r.add(a); r.add(b); grew = true; } }
  return r;
}
function movesL(L, s, extra) {
  const out = [], R = reachL(L, s, extra), hand = [null, ...L.ITEMS.filter(it => has(s, it))];
  for (const spot of L.SPOTS) { if (!R.has(L.SPOT_ZONE[spot])) continue; for (const held of hand) { const r = L.act(s, spot, held, R); if (r.s) out.push({ spot, held, s: r.s }); } }
  return out;
}
function solveL(L, from = L.START, allow = () => true, full = false, extra) {
  const done = s => s[L.GOAL] === 1;
  const k0 = L.skey(from), prev = new Map([[k0, null]]), q = [from], qk = [k0];
  let goal = null;
  for (let h = 0; h < q.length; h++) {
    const s = q[h], ks = qk[h];
    if (done(s)) { if (goal == null) goal = ks; if (!full) break; continue; }
    for (const m of movesL(L, s, extra)) {
      if (!allow(m)) continue;
      const k = L.skey(m.s); if (prev.has(k)) continue;
      prev.set(k, [ks, m.spot, m.held]); q.push(m.s); qk.push(k);
    }
  }
  const path = [];
  for (let k = goal; k != null && prev.get(k); k = prev.get(k)[0]) { const [, spot, held] = prev.get(k); path.unshift({ spot, held }); }
  if (!full) return { path: goal != null ? path : null, states: prev.size, dead: -1 };
  const canWin = new Set(); let grew = true;
  const succ = new Map(); q.forEach((s, i) => { if (done(s)) canWin.add(qk[i]); succ.set(qk[i], done(s) ? [] : movesL(L, s).filter(allow).map(m => L.skey(m.s))); });
  while (grew) { grew = false; for (const k of qk) { if (canWin.has(k)) continue; if (succ.get(k).some(x => canWin.has(x))) { canWin.add(k); grew = true; } } }
  return { path: goal != null ? path : null, states: prev.size, dead: prev.size - canWin.size, all: q, ends: q.filter(done), canWin };
}
const L1 = mkLevel({ n: 1, name: '家', START, ITEMS, VALUES, GATES, LINKS, ENTRY: 'bed', SPOT_ZONE, act, GOAL: 'out', TIMED: [fliesLeave] });

// ---------- 第 2 关：院子 ----------
// 前门出来：门廊（顶上一盏感应灯）→ 前院（狗窝）→ 车库（家里的车、卷帘门）→ 车道（一辆支着的旧自行车）→ 院门。
// 故事还在转折以前（docs/night-story-c.md），规则和第 1 关是同一条：光照到衣服的头，它就塌下去。
// 这一关三样新的光：感应灯（底下有东西动就亮，过几秒自己灭）、车灯（一长条）、自行车灯（轮子转着才亮，越转越慢）；
// 一种新的衣服：狗的毛衣，跑得比孩子快。
const ITEMS2 = ['yRake'];
const START2 = {
  yDog: 0,                    // 前院：狗的毛衣被困在门廊的感应灯底下没有。它在暗处追人，孩子把它引到灯底下：它一动灯就亮，塌在那儿
  yCar: 0, yBeam: 0,          // 车库：车门开没开；车灯开没开（开了就开着）
  yRake: 'wall', yRoll: 0,    // 耙子靠在车库墙上 / 身上 / 撑着卷帘门（roll）；卷帘门撑住没有（弹簧坏了，推上去自己落下来）
  yWheel: 0,                  // 车道：自行车的后轮还在转没有（脚蹬子一转，轮子带着车灯亮；过一会儿自己停，见 wheelStops）
  yGate: 0, yOut: 0,          // 院门开没开；走出院门没有
};
const VALUES2 = { yRake: ['wall', 'inv', 'roll'] };
const GATES2 = {
  dog: s => s.yDog === 1,     // 前院：狗的毛衣（不是“不敢过去”，是过不去：它跑得比孩子快，页面里没有 GATEPOS）
  rain: s => s.yBeam === 1,   // 车库：卷帘门边钩子上的雨衣（车灯照着）
  roll: s => s.yRoll === 1,   // 卷帘门（不是衣服，是一道门：撑住了才出得去）
  scare: s => s.yWheel === 1, // 院门前菜地里的稻草人（自行车灯照着的那一会儿）
};
const LINKS2 = [['porch', 'garage', 'dog'], ['garage', 'rollside', 'rain'], ['rollside', 'drive', 'roll'], ['drive', 'gateway', 'scare']];
const SPOT_ZONE2 = { yLure: 'porch', yCarDoor: 'garage', yDash: 'garage', yRake: 'garage', yRoll: 'rollside', yWheel: 'drive', yGate: 'gateway' };
function act2(s, spot, held, R = reachL(L2, s)) {
  const no = fail => ({ fail });
  // 院门开了以后院子里的东西照样能用（和第 1 关不一样，这儿没有 done）：孩子没走出去又折回来，自行车灯自己会灭，得能再摇
  if (held && !has(s, held)) return no('no');
